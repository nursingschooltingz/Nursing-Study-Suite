// ──── TOOL: Priority Analyzer ────
function paChunkText(text,chunkSize=12000,overlapSize=1500){
  let paragraphs=text.split(/\n{2,}/);if(paragraphs.length===1&&paragraphs[0].length>chunkSize)paragraphs=text.split(/\n/);
  const segments=[];
  for(const para of paragraphs){if(para.length<=chunkSize){segments.push(para);}else{const sentences=para.split(/(?<=[.!?])\s+/);let buf='';for(const sent of sentences){if(sent.length>chunkSize){if(buf){segments.push(buf);buf='';}for(let i=0;i<sent.length;i+=chunkSize)segments.push(sent.slice(i,i+chunkSize));}else if(buf.length+sent.length+1>chunkSize){segments.push(buf);buf=sent;}else{buf+=(buf?' ':'')+sent;}}if(buf)segments.push(buf);}}
  const chunks=[];let current='';let overlapBuffer='';
  for(const seg of segments){if(current.length+seg.length+2>chunkSize&&current.length>0){chunks.push(current.trim());const words=current.split(/\s+/);overlapBuffer='';for(let i=words.length-1;i>=0;i--){const c=words.slice(i).join(' ');if(c.length>overlapSize)break;overlapBuffer=c;}current=overlapBuffer?overlapBuffer+'\n\n'+seg:seg;}else{current+=(current?'\n\n':'')+seg;}}
  if(current.trim())chunks.push(current.trim());return chunks;
}

// STAGE 1 — Harvest (v2). Harvests an inventory only; tiering happens in Stage 2.
function paBuildExtractPrompt(chunk,idx,total,prevSummary){
  return `You are a nursing content analyst harvesting a priority inventory from one chunk of a FINISHED study guide.
Chunk ${idx+1} of ${total}.

${prevSummary?`## Items already harvested from previous chunks\n${prevSummary}\n---\n\n`:''}YOUR JOB: harvest, do NOT rank. Tiers are assigned later by a separate rule-based pass.
Assigning tiers here corrupts that pass. Do not write T1, T2, or T3 anywhere.

For every discrete testable item in this chunk, output ONE line:

- **Item** [§ Section] | QUALIFIER: <the source's own modifying words, or NONE> | FLAGS: <flags, or NONE>

RULES

1. ANCHOR — [§ Section] is the nearest heading or condition name in the chunk. Every item gets one.
   If the chunk has no heading, use [§ untitled].

2. QUALIFIER — copy the source's own modifying words for the finding, verbatim.
   Examples: "not relieved by rest" · "K+ 6.6 with ECG changes" · "temp spiked this afternoon" · "cannot arouse"
   A bare topic name with no modifier = QUALIFIER: NONE. NEVER invent a qualifier.

3. FLAGS — apply ONLY where this chunk's own text supports it. These are observations, not rankings.
   ABC ............ airway, breathing, or circulation compromise
   CRISIS ......... hemorrhage; fever >105°F/40.5°C; hypoglycemia; pulseless or breathless;
                    or the guide itself calls it an emergency
   PSYCH-SAFETY ... suicidal/homicidal ideation, self-harm, violence, elopement risk
   CRIT-LAB ....... critical-range value — INR in the 4s, K+ in the 6s, pH in the 6s/low 7s,
                    CO2 in the 50s, low O2 sat, high WBC, low ANC, low CD4, low platelets —
                    or the guide labels it critical/panic. The ranges above are heuristic
                    buckets, not universal thresholds. A value the chunk itself presents as
                    this client's expected baseline (dialysis K+, therapeutic INR for a
                    mechanical valve) is NOT critical. Flag what the text presents as
                    abnormal for this client, not what the number looks like out of context.
   ROUTINE-LAB .... abnormal but not critical — creatinine, BUN, Hgb 8–11, bicarb, elevated HCT,
                    elevated BNP, elevated Na
   UNSTABLE ....... acute; unexpected or changed finding; post-op <12h; general anesthesia <12h;
                    newly admitted or diagnosed <24h; not ready for discharge; worsening
   STABLE ......... chronic; expected/classic presentation; unchanged assessment; post-op >12h;
                    ready for discharge
   SAFETY ......... black-box warning, contraindication, antidote, hold parameter, allergy,
                    high-alert med, never-event
   SCOPE .......... delegation, assignment, LPN/UAP limits, supervision, staff-management action
   ASSESS-FIRST ... the guide says assess/verify/check BEFORE acting
   ACTION ......... an intervention with an exact parameter (dose, rate, position, timeframe)
   ORGAN:<x> ...... brain | lung | heart | liver | kidney | pancreas | other —
                    the organ affected BY THE QUALIFIER, not by the diagnosis name
   BACKGROUND ..... mechanism, patho detail, epidemiology, incidence, history, context material

4. NO NEW CONTENT. If it is not in this chunk, it does not exist. Never add clinical facts from
   your own knowledge. Never expand an abbreviation into a fact the guide didn't state.
   SCOPE: this bans ADDING clinical content to the inventory. It does not ban CLASSIFYING
   content already in front of you. Applying a FLAG from the list above is classification
   and is permitted. Writing a clinical value, threshold, or interpretation the chunk does
   not state is not.

5. Group items under the guide's own condition/topic headings. One line per item. Telegraphic.

## Content
${chunk}`;
}

// STAGE 2 — Cascade + Grounding (v2.1). Rule-based tiering over the harvested inventory.
function paBuildSynthPrompt(extractions,context){
  const combined=extractions.map((e,i)=>`### Chunk ${i+1}\n${e}`).join('\n\n---\n\n');
  return `You are a nursing priority analyst. You are re-ranking the contents of a FINISHED study guide into a
study order. You are not adding knowledge — you are sorting what is already there, by fixed rules,
and showing your work.

## INPUT
A harvested inventory from ${extractions.length} chunks. Each line carries an item, its [§ Section]
anchor, the source's own QUALIFIER, and objective FLAGS. No tiers were assigned. You assign them.

${context?`## Exam context\n${context}\n\n`:''}## HARD RULES — violating any of these makes the output worthless

G1. NO NEW CONTENT. Every item you output must trace to the inventory. Do not add conditions,
    values, drugs, or interventions from your own knowledge.
    SCOPE OF G1: this bans ADDING clinical content. It does not ban CLASSIFYING content that is
    already in front of you. Sorting an existing item into a pre-written category and reproducing
    that category's pre-written clause introduces nothing new and is permitted. Writing your own
    clinical detail into that clause is not. There is no other exception to G1.

G2. ANCHOR EVERYTHING. Carry the [§ Section] anchor through to your output on every item.

G3. NAME THE RULE. Every tier must cite the cascade rule that assigned it — e.g. (R4 CRIT-LAB).
    "High yield," "important," "commonly tested," and "NCLEX favorite" are NOT rules.
    They are BANNED as justifications. If you cannot name a rule, the item is not T1.

G4. TAG WHAT YOU CANNOT PROVE.
    [UNVERIFIED] — you needed a clinical fact the guide never states. Tag it; never silently supply it.
    [INFERRED]   — the tier came from your cascade reasoning, not from explicit emphasis in the guide.
    An item with NO tag is one the guide itself flagged as critical/emergency/priority.

G5. TIER THE QUALIFIED FINDING, NEVER THE BARE TOPIC.
    "Angina" is not a tier. "Angina not relieved by rest" is.
    If QUALIFIER is NONE, the item may NOT be promoted above T2 on the strength of its topic name.
    Keyword-tiering — seeing the word "potassium" and reaching for T1 — is the single most common
    failure mode in this task. The modifier carries the priority, not the label.

G6. FLAGS ARE HINTS, NOT GOSPEL. Stage 1's FLAGS are a fast first pass and are incomplete by design.
    Read every QUALIFIER yourself and fire the rule its text earns, even when the matching flag is
    absent. "K+ 6.6 with ECG changes" fires R4 whether or not CRIT-LAB was tagged. "cannot arouse"
    fires R1 whether or not ABC was tagged.
    The asymmetry is the point: a MISSING flag may never suppress a rule the text earns; a PRESENT
    flag may never fire a rule the text does not support. The text is the evidence. The flag only
    tells you where to look.

## THE CASCADE — per item, FIRST MATCH WINS, stop at the first rule that fires

Run each rule against the item's own text and its QUALIFIER. Treat FLAGS as a checklist of places
to look, never as the finding itself (G6).

R1  ABC ............ airway compromise, then breathing, then circulation. Airway outranks everything. → T1
R2  CRISIS ......... hemorrhage; fever >105°F; hypoglycemia; pulseless/breathless.
                     Automatic T1 EVEN IF the guide presents them as expected.
R3  PSYCH-SAFETY ... suicidal/homicidal ideation, self-harm, violence, elopement. Automatic T1.
                     Test: "if this is omitted, what is the worst outcome?" If the answer is death,
                     it is T1 — no matter where Maslow would otherwise file it.
R4  CRIT-LAB ....... critical-range value. → T1
R5  UNSTABLE ....... acute; unexpected/changed finding; post-op <12h; newly admitted <24h;
                     worsening. → T1
R6  SAFETY / SCOPE . black-box warnings, contraindications, antidotes, hold parameters, allergies,
                     high-alert meds; delegation, assignment, scope limits, staff-management actions.
                     → T1 (safety-critical and heavily tested)
R7  MASLOW ......... once R1–R6 are clear: physiological > safety > psychosocial > self-actualization.
                     Physiological → T1/T2 · safety → T2 · psychosocial/teaching → T2/T3
R8  NURSING PROCESS  assess before intervene — an ASSESS-FIRST red flag outranks the intervention it
                     gates. EXCEPTION: in an ABC or CRISIS situation you ACT first, you do not
                     assess first.
R9  STABLE/BACKGROUND
                     chronic, expected/classic, unchanged, ROUTINE-LAB, complication-prevention
                     teaching → T2.
                     Mechanism, patho detail, epidemiology, incidence, history → T3.

## TIEBREAKERS — for ORDERING WITHIN a tier, never for promoting between tiers

B1. ORGAN HIERARCHY — brain > lung > heart > liver > kidney > pancreas.
    Apply to the organ named in the QUALIFIER, not the organ of the diagnosis.
    (A chronic renal patient with frothy sputum is a LUNG problem.)
B2. Acute > chronic · unstable > stable · unexpected > expected · actual > potential ·
    fresh post-op (<12h) > medical or other surgical.
B3. Still tied? Whichever the guide gives more space and emphasis to.

## SPECIAL PRECEDENCE

- LOC vs AIRWAY: level of consciousness is the first thing you ASSESS; airway is the first thing you
  DO. Both are T1. Do not let one crowd out the other and do not "resolve" this as a contradiction.
- GUIDE vs CASCADE: if the guide calls something routine but R2/R3 fires, the CASCADE WINS —
  and you tag it [INFERRED] so the override is visible.

## TESTABLE ANGLE — T1 items only, ONE clause appended to the WHY

This is a LOOKUP, not a generation. Select exactly ONE category from the closed list below.
Reproduce its clause as written. Add no clinical content of your own — no drug names, no lab
values, no conditions, no interventions that are not already in the item.

  Pharmacology ....... intended vs side vs adverse vs toxic effect; drug classification
  Lab value .......... normal or abnormal → which organ → which disorder it monitors
  Med/IV calculation . the formula; unit conversion; decimal placement
  Diet ............... diagnosis → organ affected → correct diet
  Positioning ........ the prescription; the complication being prevented
  Communication ...... the client's feelings; therapeutic technique
  Delegation ......... who may do it — UAP = noninvasive, stable, never the first time
  Disaster/triage .... internal vs external; resources; survivability
  Prioritization ..... worst consequence if omitted

Shape: → Testable angle: <Category> — <that category's clause, verbatim>

Nine categories exist. There is no tenth. If none fits cleanly, use Prioritization.

## SELF-AUDIT — perform internally BEFORE writing. Do NOT print the checklist.

1. Does every item carry its [§ Section] anchor?
2. Does every T1 name the rule that fired (R1–R6)?
3. Did I promote any bare topic (QUALIFIER: NONE) above T2? Fix it.
4. Did I state any clinical fact that is not in the inventory? Delete it or tag [UNVERIFIED].
5. Did I invent any item? Delete it.
6. Are duplicates merged — same item across chunks becomes one line, anchors combined?
7. Do the words "high yield," "important," or "commonly tested" appear as a justification anywhere?
   Replace each with a rule.
8. Did I run every QUALIFIER against R1–R6 myself, or did I let a missing flag decide for me?
   Re-read any qualifier naming a numeric value, a level of consciousness, bleeding, or a change
   in breathing.
9. Is every Testable angle a verbatim clause from the nine — no category invented, no clinical
   detail added?

## AUDIT FOOTER — the only part of the audit you print

The final line of your output, exactly this shape:

*Audit: {n} items · {n} unverified · {n} inferred · {n}/{n} T1 rule-tagged*

Count them. Do not estimate. The last field is (T1 items carrying a rule) / (total T1 items) and
must read n/n. If it does not, you have a T1 without a rule — go fix the item, not the number.

## OUTPUT — Markdown, exactly these headers

## TIER 1 — Must Know
Grouped under the guide's own topic headings. One line per item:
- **Item, with its qualifier** [§ Section] — (Rn RULE) why, ≤15 words. → Testable angle: <Category> — <clause verbatim>
Order within each group by the tiebreakers.

## TIER 2 — Should Know
- **Item** [§ Section] — (Rn) why, ≤10 words.

## TIER 3 — Good to Know
- **Item** [§ Section] — (R9) ≤8 words.

---
## Study Strategy
3–5 bullets, concrete to THIS guide: what to drill first, what to skim, what pattern connects the
T1 items. No generic study advice.

Then the audit footer, in the shape specified above, as the last line. Nothing after it.

## Harvested Inventory
${combined}

Produce the ranked analysis now.`;
}

function paParseTiers(text){
  const t1=text.match(/(?:^|\n)##?\s*(?:🔴\s*)?TIER\s*1\b[^\n]*\n(.*?)(?=\n##?\s*(?:🟡\s*)?TIER\s*2|$)/si);
  const t2=text.match(/(?:^|\n)##?\s*(?:🟡\s*)?TIER\s*2\b[^\n]*\n(.*?)(?=\n##?\s*(?:🔵\s*)?TIER\s*3|$)/si);
  // T3 now stops at the Study Strategy divider so the strategy and audit footer are not swallowed.
  const t3=text.match(/(?:^|\n)##?\s*(?:🔵\s*)?TIER\s*3\b[^\n]*\n(.*?)(?=\n\s*-{3,}\s*\n|\n##?\s*Study\s*Strategy|$)/si);
  const st=text.match(/\n##?\s*Study\s*Strategy[^\n]*\n([\s\S]*?)(?=\n\s*\*?\s*Audit:|$)/i);
  const au=text.match(/^\s*\*?\s*Audit:\s*(.+)$/mi);
  if(!t1&&!t2&&!t3)return null;
  return{
    tier1:(t1?t1[1]:'').trim(),
    tier2:(t2?t2[1]:'').trim(),
    tier3:(t3?t3[1]:'').trim(),
    strategy:(st?st[1]:'').replace(/\n\s*-{3,}\s*$/,'').trim(),
    audit:(au?au[1]:'').replace(/\*+\s*$/,'').trim()
  };
}

function kbForPriority(kb,{tiers=[1,2,3],conditionQuery=""}={}){
  const q=String(conditionQuery||"").trim().toLowerCase();
  const lines=[
    "STRUCTURED LATTE KNOWLEDGE BASE — FINISHED STUDY CONTENT",
    "Treat the items below exactly as the finished guide content to be harvested and ranked.",
    "Do not change supplied facts, tiers, qualifiers, values, or source pointers. The analyzer still assigns its own cascade tier from the item text.",
    ""
  ];
  for(const c of kb.conditions||[]){
    if(q&&!String(c.name||"").toLowerCase().includes(q)&&!(c.aliases||[]).some(a=>String(a).toLowerCase().includes(q)))continue;
    const facts=(c.facts||[]).filter(f=>tiers.includes(Number(f.tier)));
    if(!facts.length)continue;
    lines.push("## "+c.name);
    for(const f of facts){
      const src=kbSourceText(f);
      lines.push(`- ${f.text} [KB ${f.id}; LATTE ${f.latteBucket}; source-tier T${f.tier}${src?'; '+src:''}]`);
    }
    lines.push("");
  }
  return lines.join("\n").trim();
}

function PriorityAnalyzer(){
  const cfg=useConfig();
  const K=useKnowledge();
  const [kbTiers,setKbTiers]=useState([1,2,3]);
  const [kbConditionFilter,setKbConditionFilter]=useState('');
  const [context,setContext]=useState('');
  const [chunkSize,setChunkSize]=useState(12000);
  const [overlapSize,setOverlapSize]=useState(1500);
  const [step,setStep]=useState('idle');
  const [progress,setProgress]=useState(0);
  const [phase,setPhase]=useState('');
  const [output,setOutput]=useState('');
  const [parsedTiers,setParsedTiers]=useState(null);
  const [chunks,setChunks]=useState([]);
  const [error,setError]=useState('');
  const [isStreaming,setIsStreaming]=useState(false);
  const [abortController,setAbortController]=useState(null);
  const [meta,setMeta]=useState(null);

  async function runAnalysis(){
    if(!cfg.apiKey)return;
    if(!(K.knowledgeBase.conditions||[]).length){setError('Build the LATTE Knowledge Base first.');return;}
    const analysisText=kbForPriority(K.knowledgeBase,{tiers:kbTiers,conditionQuery:kbConditionFilter});
    if(!analysisText.trim()){setError('The current Knowledge Base filters contain no facts. Include another tier or clear the condition filter.');return;}
    const textChunks=paChunkText(analysisText,chunkSize,overlapSize);const total=textChunks.length;
    const chunkItems=[...textChunks.map((_,i)=>({id:`ext-${i}`,name:`Chunk ${i+1}/${total}`,phase:'extraction',status:'pending'})),{id:'synthesis',name:'Final Synthesis',phase:'synthesis',status:'pending'}];
    setStep('processing');setProgress(0);setPhase(`${total} chunks`);setOutput('');setParsedTiers(null);setError('');setMeta(null);setChunks(chunkItems);
    const controller=new AbortController();setAbortController(controller);
    const totalSteps=total+1;let completed=0;const extractions=[];let gotOutput=false;
    try{
      for(let i=0;i<total;i++){
        if(controller.signal.aborted)throw new DOMException('Aborted','AbortError');
        setChunks(p=>p.map(c=>c.id===`ext-${i}`?{...c,status:'running'}:c));setPhase(`Extracting chunk ${i+1}/${total}...`);setProgress(Math.floor(completed/totalSteps*90));
        let prevSummary='';if(extractions.length>0){const last=extractions[extractions.length-1];prevSummary=last.length>2000?last.slice(0,2000)+'\n[...truncated]':last;}
        try{
          const prompt=paBuildExtractPrompt(textChunks[i],i,total,prevSummary);
          // v15: harvest resolves through the profile table like every other stage,
          // instead of a hardcoded flashModel + forced 'low' the UI could not express.
          const hCfg=cfg.forTool('priorityHarvest');
          const result=await callGemini(cfg.apiKey,hCfg.model,[{text:prompt}],true,hCfg.level,controller.signal);
          extractions.push(result);setChunks(p=>p.map(c=>c.id===`ext-${i}`?{...c,status:'done'}:c));
        }catch(err){if(err.name==='AbortError')throw err;setChunks(p=>p.map(c=>c.id===`ext-${i}`?{...c,status:'error'}:c));extractions.push(`[ERROR: ${err.message}]`);}
        completed++;setProgress(Math.floor(completed/totalSteps*90));
      }
      setChunks(p=>p.map(c=>c.id==='synthesis'?{...c,status:'running'}:c));setPhase('Synthesizing...');
      const synthPrompt=paBuildSynthPrompt(extractions,context);
      const {model:synthModel,level:synthLevel}=cfg.forTool('priority');
      setIsStreaming(true);
      const full=await callGemini(cfg.apiKey,synthModel,[{text:synthPrompt}],true,synthLevel,controller.signal,2,t=>{gotOutput=true;setOutput(t);setStep('results');},setMeta);
      setIsStreaming(false);
      setOutput(full);setParsedTiers(paParseTiers(full));setChunks(p=>p.map(c=>c.id==='synthesis'?{...c,status:'done'}:c));setProgress(100);setStep('results');
    }catch(e){
      setIsStreaming(false);
      const cancelled=e.name==='AbortError';
      setError(cancelled?'Cancelled.':e.message);
      // Keep whatever streamed in before the cancel — the error view would discard it.
      setStep(cancelled&&gotOutput?'results':'error');
      setChunks(p=>p.map(c=>c.status==='running'?{...c,status:'error'}:c));
    }finally{setAbortController(null);}
  }

  const copyOutput=()=>copyText(output); // v15: shared helper — navigator.clipboard is undefined under file://
  const downloadMd=()=>exportAsMd(output,'priority-analysis.md');
  const resetAll=()=>{setStep('idle');setOutput('');setParsedTiers(null);setError('');setProgress(0);setChunks([]);};

  const tiers=parsedTiers;
  // Same O(n^2) guard as the Study Guide — see note there.
  const renderedHTML=useMemo(()=>(!isStreaming&&output)?mdToSafeHtml(output):'',[output,isStreaming]);

  return(
    <div className="tool-panel">
      <h2 className="tool-title">Pyramid Priority Analyzer</h2>
      <p className="tool-desc">Analyze the shared Knowledge Base → rule-cascade triage into Tier 1/2/3 priorities, every tier citing the rule that assigned it</p>

      <div style={{display:'flex',gap:16}}>
        {/* Left: config */}
        <div style={{width:280,flexShrink:0}}>
          <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:12}}>
            <div className="sb-label">Knowledge Base Source</div>
            <div style={{fontSize:11,color:(K.knowledgeBase.conditions||[]).length?'var(--accent-green)':'var(--accent-warm)',marginBottom:9}}>{(K.knowledgeBase.conditions||[]).length?`${K.knowledgeBase.conditions.length} conditions · ${(K.knowledgeBase.conditions||[]).reduce((n,c)=>n+(c.facts||[]).length,0)} facts ready`:'Build the Knowledge Base first.'}</div>
            <input type="text" value={kbConditionFilter} onChange={e=>setKbConditionFilter(e.target.value)} placeholder="Optional condition filter"/>
            <div style={{display:'flex',gap:5,marginTop:8}}>{[1,2,3].map(t=><button key={t} className={`tier-btn t${t} ${kbTiers.includes(t)?'active':''}`} onClick={()=>setKbTiers(p=>p.includes(t)?(p.length>1?p.filter(x=>x!==t):p):[...p,t].sort())}><b>T{t}</b></button>)}</div>
            <div className="sb-hint">Source tiers only limit which facts enter the analyzer. The analyzer still applies its unchanged rule cascade and may assign a different final tier.</div>
          </div>
          <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:12}}>
            <div className="sb-label">Extra Context</div>
            <textarea value={context} onChange={e=>setContext(e.target.value)} placeholder="e.g. 'Exam is on cardiac meds only'" rows={3}/>
          </div>
          <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:12}}>
            <div className="sb-label">Chunking</div>
            <div className="sb-field"><label>Chunk size</label><input type="number" value={chunkSize} onChange={e=>setChunkSize(Math.max(2000,parseInt(e.target.value)||12000))}/></div>
            <div className="sb-field"><label>Overlap</label><input type="number" value={overlapSize} onChange={e=>setOverlapSize(Math.max(0,Math.min(5000,parseInt(e.target.value)||1500)))}/></div>
          </div>
          <button className="btn-primary" style={{width:'100%'}} disabled={!cfg.apiKey||!(K.knowledgeBase.conditions||[]).length||step==='processing'} onClick={runAnalysis}>{step==='processing'?'⏳ Analyzing...':'△ Analyze Knowledge Base'}</button>
        </div>

        {/* Right: output */}
        <div style={{flex:1,minWidth:0}}>
          {step==='idle'&&<div style={{textAlign:'center',padding:'60px 16px',color:'var(--text-dim)'}}>
            <div style={{fontSize:40,marginBottom:10}}>△</div>
            <div style={{fontSize:14,marginBottom:6}}>Use the Shared Knowledge Base</div>
            <div style={{fontSize:11,maxWidth:360,margin:'0 auto',lineHeight:1.6}}>The structured LATTE facts are passed through the analyzer’s unchanged harvest and fixed priority cascade.</div>
          </div>}

          {step==='processing'&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><h3 style={{fontSize:13,fontWeight:600,color:'var(--text-bright)'}}>Analyzing...</h3><span style={{fontFamily:'JetBrains Mono',fontSize:11,color:'var(--accent)'}}>{progress}%</span></div>
            <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}/></div>
            <div style={{fontSize:11,fontFamily:'JetBrains Mono',color:'var(--text-dim)',marginTop:8}}>{phase}</div>
            <div style={{marginTop:10}}>{chunks.map(c=><div className="chunk-item" key={c.id}><div className={`chunk-dot ${c.status}`}>{c.status==='done'?'✓':c.status==='error'?'!':''}</div><span style={{flex:1,fontWeight:500}}>{c.name}</span><span style={{fontSize:9,color:'var(--text-dim)',textTransform:'uppercase'}}>{c.phase}</span></div>)}</div>
            {abortController&&<button className="btn-danger" style={{width:'100%',marginTop:10}} onClick={()=>abortController.abort()}>Cancel</button>}
          </div>}

          {step==='results'&&<>
            {isStreaming&&abortController&&<button className="btn-danger" style={{width:'100%',marginBottom:10}} onClick={()=>abortController.abort()}>■ Stop</button>}
            {!isStreaming&&<TruncationNotice meta={meta}/>}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <h2 style={{fontSize:16,fontWeight:700,color:'var(--text-bright)'}}>Priority Analysis</h2>
              <div style={{display:'flex',gap:6}}><button className="btn-secondary" onClick={copyOutput}>📋 Copy</button><button className="btn-secondary" onClick={downloadMd}>⬇ .md</button><button className="btn-secondary" onClick={()=>exportAsTxt(output,'priority-analysis.txt')}>⬇ .txt</button><button className="btn-secondary" onClick={()=>exportAsPdf(output,'Pyramid Priority Analysis','LATTE Knowledge Base')}>🖨 PDF</button><button className="btn-secondary" onClick={resetAll}>↺ New</button></div>
            </div>
            {tiers&&(tiers.tier1||tiers.tier2||tiers.tier3)?<>
              {tiers.tier1&&<div className="tier-section t1"><div className="tier-header"><span className="tier-badge t1">TIER 1</span><span className="tier-title">Must Know</span></div><div className="tier-body" dangerouslySetInnerHTML={{__html:mdToSafeHtml(tiers.tier1)}}/></div>}
              {tiers.tier2&&<div className="tier-section t2"><div className="tier-header"><span className="tier-badge t2">TIER 2</span><span className="tier-title">Should Know</span></div><div className="tier-body" dangerouslySetInnerHTML={{__html:mdToSafeHtml(tiers.tier2)}}/></div>}
              {tiers.tier3&&<div className="tier-section t3"><div className="tier-header"><span className="tier-badge t3">TIER 3</span><span className="tier-title">Good to Know</span></div><div className="tier-body" dangerouslySetInnerHTML={{__html:mdToSafeHtml(tiers.tier3)}}/></div>}
              {tiers.strategy&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'14px 16px',marginTop:12}}>
                <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--accent2)',marginBottom:8}}>Study Strategy</div>
                <div className="tier-body" dangerouslySetInnerHTML={{__html:mdToSafeHtml(tiers.strategy)}}/>
              </div>}
              {tiers.audit&&<div style={{display:'flex',alignItems:'center',gap:8,marginTop:12,padding:'9px 13px',background:'var(--bg-card-alt)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)'}}>
                <span style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--text-dim)',flexShrink:0}}>Audit</span>
                <span style={{fontFamily:'JetBrains Mono',fontSize:11,color:'var(--accent)'}}>{tiers.audit}</span>
              </div>}
            </>:<div className="output-container"><div className="output-toolbar"><h3>{isStreaming?'Streaming...':'Full Analysis'}</h3></div>{isStreaming?<div className="output-body"><pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.65,margin:0,padding:0,background:'transparent',border:'none',color:'var(--text)'}}>{output}</pre></div>:<div className="output-body" dangerouslySetInnerHTML={{__html:renderedHTML}}/>}</div>}
          </>}

          {step==='error'&&<div className="error-banner"><span>⚠</span><div><strong>Failed:</strong> {error}<div style={{marginTop:6}}><button className="btn-secondary" onClick={resetAll}>↺ Try Again</button></div></div></div>}
        </div>
      </div>
    </div>
  );
}

You are an elite Medical Education Specialist, Nursing Clinical Instructor, and Anki Expert. Your task is to convert the provided PDF text into high-quality Anki cloze notes for a nursing student.

PDF-grounded
zero-skip on substantive facts

fast to review

LATTE Definitions

Brief Patho = disease mechanism, etiology, classification, what is going wrong
Look = signs, symptoms, complaints, red flags, deterioration signs, observable side effects
Assess = what the nurse assesses, checks, asks, inspects, trends, monitors, sequences
Tests = labs, imaging, diagnostics, values, ranges, units, interpretations
Treatments = medications, doses, routes, timing, interventions, procedures, safety steps, contraindications, precautions, hold/notify thresholds
Educate = patient/family teaching, discharge teaching, home management, follow-up, when to seek care

Every note must belong to exactly one LATTE bucket. If a sentence spans multiple buckets, split it.
Look vs Assess

Look = what is present
Assess = what the nurse does
Quick Bucket Rules

drug MOA stated in PDF -> Treatments
disease cause/etiology -> Brief Patho
disease subtype/classification -> Brief Patho
side effects/findings -> Look
assessment actions -> Assess
labs/values/ranges -> Tests
meds/interventions/hold parameters -> Treatments
home teaching -> Educate

PHASE 1.25 — GEMINI FAST-REVIEW STYLE RULE

compressed
punchy
minimal
non-fluffy
easy to scan
still precise

"The patient should report weight gain of 2 lb in 24 hours" -> Report weight gain of {{c1::2 lb in 24 hr}}
"Aspirin should be avoided in children with viral illness because of the risk of Reye syndrome" -> [Aspirin] Avoid in children with viral illness -> risk of {{c1::Reye syndrome}}
"Monitor potassium levels while taking loop diuretics" -> [Loop diuretics] Monitor {{c1::potassium}}

Do not write essay-like stems.
Coverage-Over-Compression Rule

If compressing a sentence would drop a threshold, qualifier, timing, route, population, exception, or condition that changes meaning, do NOT compress it away.

Instead:

keep the qualifier in the same note, or
split the content into multiple atomic notes

exact unit
frequency
route
timing
hold threshold
notify threshold
who the instruction applies to
when to seek care
contraindication condition

PHASE 1.5 — ATOMICITY RULES
Core Rule

Each note should test one tightly linked clinical idea.
Split When

one sentence contains unrelated facts
one card would be slow to answer
one note would become a list-recall prompt
facts matter independently
brevity would otherwise force omission of a qualifier needed for full meaning
Combine When

facts are naturally linked
one fact helps recall the other
the pair/cluster is clinically taught as one unit
drug + dose + route belong together
threshold + action belong together
Hard Limits

max 3 unique cloze numbers per note
each cloze hides one atomic fact
no "name all" prompts

PHASE 1.75 — LIST HANDLING

Never test 3+ items in one hidden cloze. Never drop list items.

Group up to 3 items only if they genuinely belong together.
Split independent items into separate notes.
Split lists longer than 3 into multiple notes.
Monitoring Panel Exception

If the PDF gives one unified monitoring directive, the stem may contain more than 3 visible items, but only 2-3 items may be cloze targets in that note.

PHASE 1.9 — ANTI-REDUNDANCY + ANTI-OVERFRAGMENTATION
Anti-Redundancy

If two notes share >=80% identical visible text and differ only by cloze target, combine or rewrite them.
Anti-Overfragmentation

Do not split so aggressively that several neighboring notes become tiny near-duplicates with nearly identical context.

Prefer:

one clean 2-3 cloze note for tightly linked facts

Avoid:

multiple repetitive micro-notes that feel the same
Cross-Class Consolidation

If the PDF repeats the same teaching point, adverse effect, or precaution across related drug classes, combine them when doing so improves efficiency without obscuring meaning.

PHASE 2 — SUBSTANTIVE DETAIL THRESHOLD

A detail is substantive if it includes:

nursing action
measurable value
drug name
route
dose
timing
frequency
duration
safety warning
red flag
adverse effect
contraindication
precaution
monitoring parameter
evaluation criterion
patient teaching point
hold/notify threshold
diagnostic interpretation

Do not waste notes on filler or decorative overviews.

You may create at most 2 overview/scaffolding notes per major section, and only if they contain a real testable contrast or organizing concept.

PHASE 3 — EXHAUSTIVE EXTRACTION BY LATTE
Brief Patho

Extract every disease mechanism, etiology, and classification explicitly given.
Look

Extract every sign, symptom, complaint, red flag, deterioration sign, and observable medication effect.
Assess

Extract every nursing assessment action, including what to assess, how to assess, what to trend, and timing/frequency if stated.
Tests

Extract every lab, diagnostic test, imaging finding, exact value, threshold, range, unit, and stated interpretation.
Treatments

Extract every medication, route, dose, frequency, timing, intervention, procedure, sequence, protocol, safety step, contraindication, precaution, hold parameter, and notify threshold.

Drug MOA belongs here only if explicitly stated in the PDF.
Educate

Extract every patient/family teaching point, discharge instruction, self-management point, follow-up instruction, and "when to call/seek care" trigger.

PHASE 3.5 — EXTRA FIELD RULES (LEAN BY DEFAULT)

The Extra field should support retention, not slow the deck down.
Default Extra Style

Prefer very short cue-style extras:

usually 0-8 words
3-12 words acceptable if needed
phrase fragments are fine
full sentences are uncommon

Examples:

Bleeding risk
Monitor for sedation
Volume loss cue
Escalate worsening dyspnea
Teach home safety
Recheck labs

Use one sentence only if necessary to:

preserve a crucial PDF-stated why
explain a threshold/action link
clarify a non-obvious distinction
prevent misunderstanding
Extra Field Hard Rules

do not pad
do not lecture
do not restate the stem unless it adds value
do not add checkable facts absent from the PDF

PHASE 3.75 — EXTRA FIELD GROUNDING TIERS
Tier 1 (Preferred)

Closely paraphrase the PDF's stated mechanism, reason, consequence, or nursing implication.
Tier 2 (Fallback)

If the PDF gives no stated why, use broad nursing logic only.

Allowed style:

Monitor closely for deterioration
Teaching supports safe home use
Tier 3 (Prohibited Unless Explicitly in PDF)

Do not introduce:

named receptors
named pathways
added physiology facts
extra pharmacology facts
black-box warnings not in PDF

PHASE 4 — ZERO-SKIP COVERAGE AUDIT (MANDATORY)

Internally verify that nothing substantive was dropped.

Must capture:

every drug name
every numeric value + unit
every contraindication/precaution
every monitoring parameter
every adverse effect/red flag
every patient education point
every hold parameter
every notify threshold
every named condition/topic needed for tagging/sorting
LATTE Completeness Check

For each named condition/topic, create at least one note in every LATTE bucket where the PDF provides content.

Do not invent notes for empty buckets.
Coverage Calibration

If output seems too short for the density of the PDF, re-audit for omitted numbers, meds, teaching points, thresholds, qualifiers, or repeated sections.

Do not add filler to increase count.
Specificity Re-Audit

Before output, re-check whether any shortened note lost a qualifier required to make the answer unique.

If yes, revise by:

restoring the key qualifier, or

PHASE 5 — PRE-OUTPUT AUDIT

Before outputting, internally confirm:

all substantive items were captured
every note is in the correct LATTE bucket

wording is fast and punchy

no overfragmentation remains

no field contains an internal pipe

every indexed item appears in the coverage ledger map
no note is so short that multiple answers could reasonably fit

ANKI IMPORT

Nothing else.

FINAL GATE (MUST PASS)

Before output, internally confirm:

Coverage: all drugs, values, units, contraindications, precautions, monitoring parameters, adverse effects, red flags, education points, hold parameters, notify thresholds, and key qualifiers are represented.
LATTE accuracy: correct bucket assignment; Look vs Assess kept distinct.
Atomicity: notes are fast, specific, and not overloaded.
Cloze correctness: max 3 unique cloze numbers; each cloze is uniquely answerable.

One fact = one punchy card.
Coverage is enforced by the ledger, not by making cards wordy.
Never drop list items.
Never add unsourced facts.
Keep Extra lean unless clarity truly requires more.
Fast recall beats pretty phrasing.
When brevity threatens coverage, split into more atomic notes.
When brevity threatens uniqueness, restore the missing qualifier.
Every note MUST include a Tier::1, Tier::2, or Tier::3 tag. When in doubt, round UP in priority.

function splitOversizedConditionBlock(block,max){

  const prefix=[];const facts=[];

    const pieces=[];let cur='';

    if(cur)pieces.push(cur);return pieces;
  }

  for(const fact of facts){if(cur.length>prefix.length&&len+fact.length+1>max){out.push(cur.join('\n'));cur=[...prefix];len=cur.join('\n').length;}cur.push(fact);len+=fact.length+1;}

      if(allFacts.length)log(`Coverage: ${allFacts.length-uncovered.length}/${allFacts.length} facts mapped to a card${uncovered.length?` — ${uncovered.length} uncovered`:''}.`,uncovered.length?'err':'ok');
      if(lintCount)log(`${lintCount} card(s) flagged by lint (missing cloze/tier or >3 clozes).`,'warn');
    }catch(e){if(e.name==='AbortError')log('Cancelled.','warn');else log('Error: '+e.message,'err');}finally{setBusy(false);setAbortCtl(null);setLiveKB(0);}
  },[cfg,chunkSz,overlapPg,model,toolLevel,log,K.knowledgeBase,focusContext,outcomes,points]);

    // < > & in Text/Extra only when the header is on. Tags stay raw (Anki treats col 3
    // as space-separated tags, not HTML). Cloze braces are unaffected by escaping.
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const body=kept.map(c=>`${ankiHeader?esc(c.text):c.text}|${ankiHeader?esc(c.extra):c.extra}|${c.tags}`).join('\n'); // v15: bare pipes — Anki's Pipe separator keeps surrounding spaces inside every field
    const header=ankiHeader?'#separator:Pipe\n#html:true\n#notetype:Cloze\n#tags column:3\n':'';
    downloadBlob(new Blob([header+body],{type:'text/plain'}),`latte_anki_import${tierFilter!=='all'?'_tier'+tierFilter:''}.txt`);

// ──── TOOL: NCLEX Extractor ────
const NCLEX_INLINE_PROMPT=`You are an expert nursing educator. From the following text chunk of an NCLEX-style review book, extract EVERY test question.\n\nFor EACH question, return a JSON object with:\n- "question": full question text with all choices\n- "correct_answer": correct answer letter and text\n- "rationale": full rationale\n- "priority_nursing_tip": any tip mentioned (or null)\n- "test_taking_strategy": strategy mentioned (or null)\n- "clinical_judgment_skill": CJ skill identified (or null)\n- "diseases_conditions": array of conditions referenced\n- "keywords": important nursing keywords\n\nThis chunk may overlap with a previous chunk. Do NOT return duplicates.\nReturn ONLY a valid JSON array. No markdown fences. If no questions found, return [].\n\nTEXT CHUNK:\n`;

const NCLEX_SPLIT_PROMPT=`You are an expert nursing educator. Below are NCLEX-style questions that have been PRE-MATCHED with their corresponding answers and rationales. The questions were originally on separate pages from their answers and have been paired by question number.\n\nFor EACH question+answer pair, return a JSON object with:\n- "question_number": original question number\n- "question": full question text with all choices\n- "correct_answer": correct answer letter and text\n- "rationale": full rationale\n- "priority_nursing_tip": any tip mentioned (or null)\n- "test_taking_strategy": strategy mentioned (or null)\n- "clinical_judgment_skill": CJ skill identified (or null)\n- "diseases_conditions": array of conditions referenced\n- "keywords": important nursing keywords\n\nReturn ONLY a valid JSON array. No markdown fences. If no valid pairs found, return [].\n\nPAIRED QUESTIONS AND ANSWERS:\n`;

const NCLEX_AI_PAIR_PROMPT=`You are a text-matching assistant. Below are two sections from a nursing test book:\n1. QUESTIONS section - contains numbered test questions\n2. ANSWERS section - contains numbered answers and rationales\n\nMatch each question number with its answer. Return a JSON array where each object has:\n- "number": question number (integer)\n- "question": full question text with all choices\n- "answer": full answer text with rationale\n\nReturn ONLY a valid JSON array. No markdown.\n\nQUESTIONS SECTION:\n`;

function nclexChunkText(text,size,overlap){
  // v15: hard clamps. A cleared Chunk Size input became 0, making the stride
  // Math.max(size-overlap, size*0.3) = 0 — an infinite loop pushing empty chunks until
  // the tab died. The stride is now >=1 no matter what the inputs held.
  size=Math.max(500,Number(size)||0);
  overlap=Math.max(0,Math.min(Number(overlap)||0,size-1));
  const stride=Math.max(1,size-overlap,Math.floor(size*0.3));
  const chunks=[];let i=0;
  while(i<text.length){let end=Math.min(i+size,text.length);if(end<text.length){const nl=text.lastIndexOf('\n',end);if(nl>i+size*0.5)end=nl+1;}chunks.push(text.slice(i,end));i+=stride;}
  return chunks;
}

function nclexDedup(questions){
  const seen=new Set();return questions.filter(q=>{if(!q.question)return false;const k=q.question.replace(/\s+/g,' ').trim().toLowerCase()/* v15: full-text key — the 120-char prefix collapsed distinct long stems (same fix Anki got) */;if(seen.has(k))return false;seen.add(k);return true;});
}

// Split-mode: extract text from specific page ranges
async function nclexExtractPageRange(file,startPage,endPage,signal){
  const pdf=await getPdfDoc(file);
  const s=Math.max(1,startPage),e=Math.min(pdf.numPages,endPage);let text='';
  for(let i=s;i<=e;i++){
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    const p=await pdf.getPage(i);const c=await p.getTextContent();
    const items=c.items;let result='';let lastX=-1,lastWidth=0,lastY=-1;
    for(const item of items){if(!item.str)continue;const x=item.transform?.[4]??0,y=item.transform?.[5]??0,fontSize=item.transform?.[0]??12;
      if(lastY!==-1&&Math.abs(y-lastY)>fontSize*0.5){result+='\n';lastX=-1;}
      if(lastX!==-1){const gap=x-(lastX+lastWidth);if(gap>fontSize*0.25)result+=' ';else if(gap<-fontSize*2)result+='\n';}
      result+=item.str;lastX=x;lastWidth=item.width??(item.str.length*fontSize*0.5);lastY=y;}
    text+=result+'\n\n';
  }
  return text;
}

// Multi-pattern question number detection
function nclexSplitByQNum(text){
  const patterns=[/(?:^|\n)\s*(\d{1,4})\s*\.\s/g,/(?:^|\n)\s*(\d{1,4})\)\s/g,/(?:^|\n)\s*Q(?:uestion)?\s*#?\s*(\d{1,4})[.):;\s]/gi,/(?:^|\n)\s*#\s*(\d{1,4})[.):;\s]/g,/(?:^|\n)\s*\[(\d{1,4})\]/g];
  let bestItems={},bestCount=0;
  for(const bp of patterns){
    const pattern=new RegExp(bp.source,bp.flags);const items={};const positions=[];let m;
    while((m=pattern.exec(text))!==null){const num=parseInt(m[1]);if(num>0&&num<5000)positions.push({num,index:m.index});}
    for(let i=0;i<positions.length;i++){const start=positions[i].index;const end=i+1<positions.length?positions[i+1].index:text.length;if(!items[positions[i].num])items[positions[i].num]=text.slice(start,end).trim();}
    const count=Object.keys(items).length;if(count>bestCount){bestItems=items;bestCount=count;}
  }
  // Loose fallback
  if(bestCount<3){
    const loose=/(?:^|\n)\s{0,5}(\d{1,4})\s{0,3}[.):]/g;const items={};const positions=[];let m;
    while((m=loose.exec(text))!==null){const num=parseInt(m[1]);if(num>0&&num<5000)positions.push({num,index:m.index});}
    for(let i=0;i<positions.length;i++){const start=positions[i].index;const end=i+1<positions.length?positions[i+1].index:text.length;if(!items[positions[i].num])items[positions[i].num]=text.slice(start,end).trim();}
    if(Object.keys(items).length>bestCount){bestItems=items;bestCount=Object.keys(items).length;}
  }
  return bestItems;
}

function nclexPairQA(qText,aText){
  const questions=nclexSplitByQNum(qText),answers=nclexSplitByQNum(aText);
  return Object.keys(questions).map(Number).sort((a,b)=>a-b).map(num=>({number:num,question:questions[num]||'',answer:answers[num]||'',matched:!!answers[num]}));
}

function nclexBatchPairs(pairs,batchSize=8){const batches=[];for(let i=0;i<pairs.length;i+=batchSize)batches.push(pairs.slice(i,i+batchSize));return batches;}
function nclexPairsToText(pairs){return pairs.map(p=>{let s=`── Question #${p.number} ──\n${p.question}\n`;if(p.answer)s+=`\n── Answer #${p.number} ──\n${p.answer}\n`;return s;}).join('\n\n');}

      <span style={{fontSize:10,color:'var(--text-dim)'}}>to</span>
      <input type="number" min={1} max={maxPages||9999} value={r.end} onChange={e=>updateRange(i,'end',e.target.value)} style={{width:65,textAlign:'center',padding:'5px 6px'}}/>
      {ranges.length>1&&<span onClick={()=>removeRange(i)} style={{color:'var(--accent-red)',cursor:'pointer',fontSize:13,fontWeight:700}}>×</span>}
    </div>)}
  </div>;
}

        {q.test_taking_strategy&&<div style={{background:'rgba(74,127,247,.06)',borderLeft:'3px solid var(--accent)',padding:'8px 12px',borderRadius:'0 6px 6px 0',marginBottom:8,fontSize:12}}><strong style={{color:'var(--accent)'}}>🎯 STRATEGY:</strong> <span style={{color:'var(--text-dim)'}}>{q.test_taking_strategy}</span></div>}
        {q.clinical_judgment_skill&&<div style={{background:'rgba(167,139,250,.06)',borderLeft:'3px solid var(--accent2)',padding:'8px 12px',borderRadius:'0 6px 6px 0',marginBottom:8,fontSize:12}}><strong style={{color:'var(--accent2)'}}>🧠 CJ:</strong> <span style={{color:'var(--text-dim)'}}>{q.clinical_judgment_skill}</span></div>}

function NCLEXExtractor(){
  const cfg=useConfig();
  const [files,setFiles]=useState([]);
  const [mode,setMode]=useState('inline'); // 'inline' or 'split'
  const [chunkSize,setChunkSize]=useState(3000);
  const [overlap,setOverlap]=useState(800);
  const [pageCount,setPageCount]=useState(null);
  const [qRanges,setQRanges]=useState([{start:1,end:50}]);
  const [aRanges,setARanges]=useState([{start:51,end:100}]);
  const [batchSize,setBatchSize]=useState(8);
  const [status,setStatus]=useState('idle');
  const [progress,setProgress]=useState({current:0,total:0});
  const [questions,setQuestions]=useState([]);
  const [error,setError]=useState('');
  const [log,setLog]=useState([]);
  const [filterStrategy,setFilterStrategy]=useState('');
  const [filterDisease,setFilterDisease]=useState('');
  const abortRef=useRef(null); // v15: holds the run's AbortController — the old boolean only skipped FUTURE chunks; in-flight requests and retries could not be cancelled
  const fRef=useRef(null);

  const {model,level:toolLevel}=cfg.forTool('nclex');

  // Auto-detect page count when files change
  useEffect(()=>{
    if(!files.length){setPageCount(null);return;}
    getPdfPageCount(files[0]).then(n=>{setPageCount(n);const mid=Math.ceil(n/2);setQRanges([{start:1,end:mid}]);setARanges([{start:mid+1,end:n}]);}).catch(()=>setPageCount(null));
  },[files]);

  const allStrategies=useMemo(()=>[...new Set(questions.map(q=>q.test_taking_strategy).filter(Boolean))].sort(),[questions]);
  const filtered=useMemo(()=>questions.filter(q=>{
    if(filterStrategy&&q.test_taking_strategy!==filterStrategy)return false;
    if(filterDisease){const term=filterDisease.toLowerCase();if(!q.diseases_conditions?.some(d=>d.toLowerCase().includes(term))&&!q.question?.toLowerCase().includes(term))return false;}
    return true;
  }),[questions,filterStrategy,filterDisease]);

  const addLog=useCallback(msg=>setLog(p=>[...p,`[${new Date().toLocaleTimeString()}] ${msg}`]),[]);

  // ── v15: the run pipeline threads a real AbortController through every request and
  // inter-chunk sleep (the old boolean flag only skipped FUTURE chunks — an in-flight
  // request kept streaming and billing until it finished). Questions are tagged with
  // stable ids at extraction so React keys survive filtering, and split mode processes
  // one PDF per run because the page-range fields describe exactly one file's layout.
  const nclexSleep=(ms,signal)=>new Promise((res,rej)=>{const t=setTimeout(res,ms);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
  const nclexId=()=>'q_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);

  // Gemini call for NCLEX (with retry)
  async function nclexCallGemini(prompt,signal){
    // Was 8192 — the legacy ceiling. A dense chunk overflowed it, the JSON came back
    // truncated, the bare parse threw, and the whole chunk was silently skipped.
    const gc={maxOutputTokens:65536,responseMimeType:'application/json'};gc.thinkingConfig={thinkingLevel:toolLevel};
    let cut=false;
    const raw=await geminiRequest(cfg.apiKey,model,{contents:[{parts:[{text:prompt}]}],generationConfig:gc},{signal,onMeta:m=>{cut=!!m.truncated;}});
    const cleaned=raw.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
    try{return JSON.parse(cleaned);}
    catch(e){
      // Fall back to the depth-scanning extractor before writing off the chunk.
      try{return extractJSON(cleaned);}catch(e2){}
      throw new Error(cut?'Output hit the token ceiling mid-JSON \u2014 reduce chunk size or questions per batch.':'Model returned unparseable JSON (chunk skipped)');
    }
  }

  // ── Inline mode runner ──
  async function runInline(file,existingQ,signal){
    addLog(`📄 Extracting "${file.name}"...`);
    const text=await extractPdfTextSpaced(file);addLog(`  ${text.length.toLocaleString()} chars`);
    const chunks=nclexChunkText(text,chunkSize,overlap);addLog(`  ${chunks.length} chunks (size: ${chunkSize}, overlap: ${overlap})`);
    setProgress({current:0,total:chunks.length});let allQ=[...existingQ];
    for(let i=0;i<chunks.length;i++){
      if(signal.aborted)throw new DOMException('Aborted','AbortError');
      addLog(`  Chunk ${i+1}/${chunks.length}...`);
      try{
        const result=await nclexCallGemini(NCLEX_INLINE_PROMPT+chunks[i],signal);
        if(Array.isArray(result)&&result.length>0){const tagged=result.map(q=>({...q,id:nclexId()}));allQ=nclexDedup([...allQ,...tagged]);setQuestions([...allQ]);addLog(`    ✓ ${result.length} found → ${allQ.length} unique`);}else addLog(`    — No questions.`);
      }catch(e){if(e.name==='AbortError')throw e;addLog(`    ⚠ ${e.message}`);}
      setProgress({current:i+1,total:chunks.length});if(i<chunks.length-1)await nclexSleep(500,signal);
    }
    return allQ;
  }

  // ── Split Q&A mode runner ──
  async function runSplit(file,existingQ,signal){
    addLog(`📄 Extracting QUESTION pages from "${file.name}"...`);
    let qText='';for(const r of qRanges){addLog(`  Pages ${r.start}–${r.end}`);qText+=await nclexExtractPageRange(file,r.start,r.end,signal)+'\n\n';}
    addLog(`  → ${qText.length.toLocaleString()} chars`);
    addLog(`📄 Extracting ANSWER pages...`);
    let aText='';for(const r of aRanges){addLog(`  Pages ${r.start}–${r.end}`);aText+=await nclexExtractPageRange(file,r.start,r.end,signal)+'\n\n';}
    addLog(`  → ${aText.length.toLocaleString()} chars`);
    addLog(`🔗 Pairing by question number...`);
    let pairs=nclexPairQA(qText,aText);
    const matched=pairs.filter(p=>p.matched).length;
    addLog(`  → Regex found ${pairs.length} questions, ${matched} matched, ${pairs.length-matched} unmatched`);
    // AI fallback if regex found too few
    if(pairs.length<3||(pairs.length>0&&matched/pairs.length<0.3)){
      addLog('🤖 Regex found too few — using AI to pair...');
      try{
        const prompt=NCLEX_AI_PAIR_PROMPT+qText.slice(0,12000)+'\n\nANSWERS SECTION:\n'+aText.slice(0,12000);
        const aiResult=await nclexCallGemini(prompt,signal);
        if(Array.isArray(aiResult)&&aiResult.length>pairs.length){
          pairs=aiResult.map(r=>({number:r.number||0,question:r.question||'',answer:r.answer||'',matched:!!r.answer}));
          addLog(`  → AI paired ${pairs.length} questions (better than regex)`);
        }
      }catch(e){if(e.name==='AbortError')throw e;addLog(`  ⚠ AI pairing failed: ${e.message}`);}
    }
    if(!pairs.length){addLog('⚠ No numbered questions detected. Try adjusting page ranges or Inline mode.');return existingQ;}
    const batches=nclexBatchPairs(pairs,batchSize);
    addLog(`Sending ${batches.length} batches of ~${batchSize} to ${model}...`);
    setProgress({current:0,total:batches.length});let allQ=[...existingQ];
    for(let i=0;i<batches.length;i++){
      if(signal.aborted)throw new DOMException('Aborted','AbortError');
      const batch=batches[i];addLog(`  Batch ${i+1}/${batches.length} (Q#${batch[0].number}–#${batch[batch.length-1].number})...`);
      try{
        const result=await nclexCallGemini(NCLEX_SPLIT_PROMPT+nclexPairsToText(batch),signal);
        if(Array.isArray(result)&&result.length>0){const tagged=result.map(q=>({...q,id:nclexId()}));allQ=nclexDedup([...allQ,...tagged]);setQuestions([...allQ]);addLog(`    ✓ ${result.length} → ${allQ.length} unique`);}else addLog(`    — No output.`);
      }catch(e){if(e.name==='AbortError')throw e;addLog(`    ⚠ ${e.message}`);}
      setProgress({current:i+1,total:batches.length});if(i<batches.length-1)await nclexSleep(500,signal);
    }
    return allQ;
  }

  const run=useCallback(async()=>{
    if(!cfg.apiKey||!files.length)return;
    const ctl=new AbortController();abortRef.current=ctl;
    setError('');setQuestions([]);setLog([]);setStatus('processing');
    try{
      addLog(`Mode: ${mode==='inline'?'Inline (Q+A together)':'Split Q&A (separated sections)'} · ${model} [${toolLevel}]${cfg.autoProfile?' (auto)':''}`);
      const workFiles=(mode==='split'&&files.length>1)?[files[0]]:files;
      if(workFiles!==files)addLog(`⚠ Split mode uses one PDF per run — processing "${files[0].name}" only (the page ranges describe a single file). Run the other file(s) separately.`);
      addLog(`Processing ${workFiles.length} PDF(s)...`);
      let allQ=[];
      for(let fi=0;fi<workFiles.length;fi++){
        if(ctl.signal.aborted)throw new DOMException('Aborted','AbortError');
        addLog(`\n📁 File ${fi+1}/${workFiles.length}: ${workFiles[fi].name}`);
        if(mode==='inline')allQ=await runInline(workFiles[fi],allQ,ctl.signal);
        else allQ=await runSplit(workFiles[fi],allQ,ctl.signal);
      }
      addLog(`✅ Done! ${allQ.length} unique questions from ${workFiles.length} file(s).`);setStatus('done');
    }catch(e){
      if(e.name==='AbortError'){addLog('⚠ Aborted \u2014 keeping the questions extracted so far.');setStatus('done');}
      else{setError(e.message);setStatus('error');addLog(`❌ ${e.message}`);}
    }finally{abortRef.current=null;}
  },[cfg,files,mode,chunkSize,overlap,qRanges,aRanges,batchSize,model,toolLevel,addLog]);

  const exportTxt=()=>{
    let out='';filtered.forEach((q,i)=>{out+=`${i+1}. ${q.question}\n\nAnswer: ${q.correct_answer}\nRationale: ${q.rationale}\n${q.test_taking_strategy?'Strategy: '+q.test_taking_strategy+'\n':''}${q.diseases_conditions?.length?'Conditions: '+q.diseases_conditions.join(', ')+'\n':''}\n---\n\n`;});
    downloadBlob(new Blob([out],{type:'text/plain'}),'nclex_questions.txt');
  };

  const nclexToMd=()=>{
    let out='# NCLEX Practice Questions\n\n';
    filtered.forEach((q,i)=>{
      out+=`**${i+1}.** ${q.question}\n\n`;
      out+=`**Answer:** ${q.correct_answer}\n\n`;
      out+=`${q.rationale}\n\n`;
      if(q.priority_nursing_tip)out+=`> ⚡ **Tip:** ${q.priority_nursing_tip}\n\n`;
      if(q.test_taking_strategy)out+=`> 🎯 **Strategy:** ${q.test_taking_strategy}\n\n`;
      if(q.clinical_judgment_skill)out+=`> 🧠 **CJ:** ${q.clinical_judgment_skill}\n\n`;
      if(q.diseases_conditions?.length)out+=`Conditions: ${q.diseases_conditions.join(', ')}\n\n`;
      out+=`---\n\n`;
    });
    return out;
  };
  const exportMd=()=>downloadBlob(new Blob([nclexToMd()],{type:'text/markdown'}),'nclex_questions.md');
  const copyAll=()=>copyText(nclexToMd()); // v15: shared helper with textarea fallback
  const exportPdf=()=>exportAsPdf(nclexToMd(),'NCLEX Practice Questions',`${filtered.length} questions`);

  const isProcessing=status==='processing';

  return(
    <div className="tool-panel">
      <h2 className="tool-title">NCLEX Question Extractor</h2>
      <p className="tool-desc">Upload nursing review PDFs → extracted practice questions with rationales, strategies, and disease tagging</p>

      {/* Mode Toggle */}
      <div style={{display:'flex',gap:0,marginBottom:14,borderRadius:10,overflow:'hidden',border:'1px solid var(--border)'}}>
        {[{id:'inline',icon:'📄',title:'Inline Mode',desc:'Q & A together on same pages'},{id:'split',icon:'📑',title:'Split Q&A Mode',desc:'Questions & answers on separate pages (Davis-style)'}].map(m=>
          <button key={m.id} onClick={()=>setMode(m.id)} style={{flex:1,padding:'12px 14px',border:'none',cursor:'pointer',background:mode===m.id?'var(--bg-card)':'var(--bg-input)',borderRight:m.id==='inline'?'1px solid var(--border)':'none',textAlign:'left',transition:'background .15s'}}>
            <div style={{fontSize:13,fontWeight:600,color:mode===m.id?'var(--text-bright)':'var(--text-dim)'}}>{m.icon} {m.title}</div>
            <div style={{fontSize:10,color:'var(--text-dim)',marginTop:2}}>{m.desc}</div>
          </button>
        )}
      </div>

      {/* Config */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:18,marginBottom:14}}>
        {/* Inline settings */}
        {mode==='inline'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div className="sb-field"><label>Chunk Size (chars)</label><input type="number" min={500} max={15000} value={chunkSize} onChange={e=>setChunkSize(Math.max(500,Math.min(15000,Number(e.target.value)||3000)))}/></div>
          <div className="sb-field"><label>Overlap (chars)</label><input type="number" min={0} max={5000} value={overlap} onChange={e=>setOverlap(Math.max(0,Math.min(5000,Number(e.target.value)||0)))}/><div style={{fontSize:10,color:'var(--text-dim)',marginTop:2}}>~800 = 1-2 pages. Duplicates auto-removed.</div></div>
        </div>}

        {/* Split settings */}
        {mode==='split'&&<div style={{marginBottom:12}}>
          <div style={{background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:8,padding:12,marginBottom:10}}>
            <div style={{fontSize:11,color:'var(--accent-warm)',fontWeight:600,marginBottom:6}}>📑 For PDFs like Davis Test Success where questions and answers are in separate sections.</div>
            <div style={{fontSize:11,color:'var(--text-dim)',lineHeight:1.5,marginBottom:8}}>Specify which pages contain <strong style={{color:'var(--text)'}}>questions</strong> and which contain <strong style={{color:'var(--text)'}}>answers/rationales</strong>. The tool pairs them by question number before sending to Gemini.</div>
            {pageCount&&<div style={{fontSize:10,color:'var(--accent)',marginBottom:8}}>📖 This PDF has <b>{pageCount}</b> pages</div>}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <div style={{padding:8,background:'var(--bg-card)',borderRadius:6,border:'1px solid var(--border)'}}><PageRangeSection label="📝 Question Pages" ranges={qRanges} onChange={setQRanges} maxPages={pageCount}/></div>
              <div style={{padding:8,background:'var(--bg-card)',borderRadius:6,border:'1px solid var(--border)'}}><PageRangeSection label="✅ Answer Pages" ranges={aRanges} onChange={setARanges} maxPages={pageCount}/></div>
            </div>
            <div style={{marginTop:8}}>
              <div className="sb-field"><label>Questions per batch</label><input type="number" min={2} max={25} value={batchSize} onChange={e=>setBatchSize(Number(e.target.value))} style={{width:90}}/><span style={{fontSize:10,color:'var(--text-dim)',marginLeft:6}}>Lower = more reliable</span></div>
              <div style={{fontSize:10,color:'var(--accent-warm)',marginTop:6}}>Split mode processes one PDF per run — these page ranges describe a single file.</div>
            </div>
          </div>
        </div>}

        {/* Upload */}
        <div role="button" tabIndex={0} aria-label="Add PDF files" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fRef.current?.click();}}} className="upload-zone" onClick={()=>fRef.current?.click()} onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('dragover');}} onDragLeave={e=>e.currentTarget.classList.remove('dragover')} onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('dragover');const nf=Array.from(e.dataTransfer.files).filter(f=>f.type==='application/pdf');setFiles(p=>[...p,...nf]);}}>
          <input ref={fRef} type="file" accept=".pdf" multiple style={{display:'none'}} onChange={e=>{setFiles(p=>[...p,...Array.from(e.target.files)]);e.target.value='';}}/>
          <div style={{fontSize:28,marginBottom:4,opacity:.6}}>📋</div>
          <p style={{fontSize:12,color:'var(--text)'}}>Drop PDFs or <strong style={{color:'var(--accent)'}}>click to browse</strong></p>
        </div>
        {files.map((f,i)=><div className="file-chip" key={f.name+f.size+f.lastModified}><div className="f-icon pdf">PDF</div><span className="f-name">{f.name}</span><span className="f-size">{formatSize(f.size)}</span><button className="f-rm" onClick={()=>{destroyPdfDoc(f);setFiles(p=>p.filter((_,j)=>j!==i));}}>×</button></div>)}
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn-primary" onClick={run} disabled={!cfg.apiKey||!files.length||isProcessing}>{isProcessing?'⏳ Processing...':`🚀 Extract from ${files.length||0} PDF${files.length!==1?'s':''}`}</button>
          {isProcessing&&<button className="btn-danger" onClick={()=>abortRef.current?.abort()}>Abort</button>}
          {files.length>0&&!isProcessing&&<button className="btn-secondary" onClick={()=>{files.forEach(destroyPdfDoc);setFiles([]);}}>Clear</button>}
        </div>
      </div>

      {error&&<div className="error-banner"><span>❌</span>{error}</div>}

      {/* Progress */}
      {(isProcessing||log.length>0)&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        {progress.total>0&&<div className="progress-bar" style={{marginBottom:6}}><div className="progress-fill" style={{width:`${(progress.current/progress.total)*100}%`}}/></div>}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-dim)',marginBottom:6}}>
          <span>{isProcessing?(mode==='split'?`Batch ${progress.current}/${progress.total}`:`Chunk ${progress.current}/${progress.total}`):'Done'}</span>
          <span style={{color:'var(--accent)'}}>{questions.length} questions</span>
        </div>
        <div style={{maxHeight:140,overflowY:'auto',background:'var(--bg-deep)',borderRadius:5,padding:7,fontSize:10,fontFamily:'JetBrains Mono',color:'var(--text-dim)',lineHeight:1.7}}>{log.map((l,i)=><div key={i}>{l}</div>)}</div>
      </div>}

      {/* Results */}
      {questions.length>0&&<>
        <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <div className="sb-field"><label>Filter by Strategy</label><select value={filterStrategy} onChange={e=>setFilterStrategy(e.target.value)}><option value="">All ({allStrategies.length})</option>{allStrategies.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="sb-field"><label>Search Disease/Keyword</label><input type="text" placeholder="e.g. Heart Failure" value={filterDisease} onChange={e=>setFilterDisease(e.target.value)}/></div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:'var(--text-dim)'}}>Showing <b style={{color:'var(--accent)'}}>{filtered.length}</b> of {questions.length}</span>
            {(filterStrategy||filterDisease)&&<button className="btn-secondary" style={{padding:'3px 8px',fontSize:10}} onClick={()=>{setFilterStrategy('');setFilterDisease('');}}>Clear filters</button>}
            <div style={{flex:1}}/>
            <button className="btn-secondary" onClick={copyAll}>📋 Copy</button>
            <button className="btn-secondary" onClick={exportMd}>⬇ .md</button>
            <button className="btn-secondary" onClick={exportTxt}>📝 .txt</button>
            <button className="btn-secondary" onClick={exportPdf}>🖨 PDF</button>
          </div>
        </div>
        {filtered.map((q,i)=><NCLEXQuestionCard key={q.id||i} q={q} index={i}/>)}{/* v15: id assigned at extraction — index keys made open/closed state jump across cards whenever the filter changed */}
      </>}

      {status==='idle'&&questions.length===0&&<div style={{textAlign:'center',padding:'40px 16px',color:'var(--text-dim)'}}>
        <div style={{fontSize:40,marginBottom:10}}>📋</div>
        <div style={{fontSize:14,marginBottom:6}}>Upload NCLEX review PDFs to extract practice questions</div>
        <div style={{fontSize:11,maxWidth:460,margin:'0 auto',lineHeight:1.6}}>
          Two modes: <strong style={{color:'var(--text)'}}>Inline</strong> for books where Q&A are on the same pages.
          <strong style={{color:'var(--text)'}}> Split Q&A</strong> for books like Davis Test Success where questions and answers are in separate sections.
          Multi-pattern question detection with AI fallback pairing.
        </div>
