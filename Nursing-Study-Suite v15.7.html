        if(_cc<2)issues.push({sev:'error',msg:`${qn}: SATA needs at least 2 correct answers (got ${_cc}) — a one-answer SATA is a mislabeled MCQ`});
        else if(_oc&&_cc>=_oc)issues.push({sev:'error',msg:`${qn}: SATA marks every option correct (${_cc}/${_oc})`});
        else if(_cc>4)issues.push({sev:'error',msg:`${qn}: SATA with ${_cc} correct answers breaks the prompt's 2–4 contract`});
      }
      const optLabels=new Set((q.options||[]).map(o=>String(o.label)));
      for(const ca of q.correctAnswers||[])if(optLabels.size&&!optLabels.has(String(ca))&&q.type!=='Ordering')
        issues.push({sev:'error',msg:`${qn}: correct answer ${ca} is not among the options`});
      // v15.2: Ordering answers are deterministic — the prompt defines correctAnswers as
      // "the step labels in correct sequence", i.e. a permutation of the option labels.
      if(q.type==='Ordering'&&optLabels.size){
        const _seq=(q.correctAnswers||[]).map(String);
        if(_seq.length!==optLabels.size||new Set(_seq).size!==_seq.length||_seq.some(l=>!optLabels.has(l)))
          issues.push({sev:'error',msg:`${qn}: Ordering correctAnswers must use every option label exactly once`});
      }
      // The prompt promises a rationale for EVERY option, correct and incorrect alike.
      const ratLabels=new Set((q.rationales||[]).map(r=>String(r.option)));
      for(const lbl of optLabels)if(!ratLabels.has(lbl))issues.push({sev:'error',msg:`${qn}: option ${lbl} has no rationale`});
      for(const r of q.rationales||[]){
        // v15.3: rationales get the same enum guard as data. A case-drifted value like
        // "Neutral-framing" fails the exact-match neutral check below, which turns a
        // legitimately neutral rationale into a spurious required-factIds error — the enum
        // check makes the real cause visible.
        if(r.supportType&&!CASE_SUPPORT_TYPES.has(r.supportType))
          issues.push({sev:'error',msg:`${qn}: rationale for ${r.option||'?'}: invalid supportType "${r.supportType}"`});
        if((r.supportType||'')!=='neutral-framing'&&!(r.factIds||[]).length)
          issues.push({sev:'error',msg:`${qn}: rationale for ${r.option||'?'} lacks fact IDs`});
        checkIds(r.factIds,qn+' rationale');
        // v15.3: the entailment audit runs where fabricated numbers actually live — the
        // rationale text arguing the answer ("...because potassium is 2.4 mEq/L").
        caseAuditTextValues(r.text,r.factIds,factIndex,`${qn} rationale ${r.option||'?'}`,issues,r.supportType);
        neiaTerminologyScan(r.text,`${qn} rationale ${r.option||'?'}`,issues);
      }
    }
  }
  const db=caseStudy.debrief||{};
  scanUncitedProse(db.priorityProblem,'debrief.priorityProblem',issues);
  scanUncitedProse(db.notes,'debrief.notes',issues);
  for(const k of db.keyDecisions||[])scanUncitedProse(k,'debrief.keyDecisions',issues);
  neiaTerminologyScan(db.priorityProblem,'debrief.priorityProblem',issues);
  neiaTerminologyScan(db.notes,'debrief.notes',issues);
  for(const k of db.keyDecisions||[])neiaTerminologyScan(k,'debrief.keyDecisions',issues);
  checkIds(db.factIds,'debrief');
  issues.push(...caseDifficultySignals(caseStudy,factIndex)); // v15.6: warn-tier, whole-case
  return issues;
}
// Stage-timing: a rationale may not depend on patient data that has not been revealed yet.
// Two availability classes, per chat's note: 'revealed' data is progressively disclosed and
// only counts from the stage it appears in onward; 'background' data is instructor knowledge
// (general pathophysiology) and is available from the start, so it is never a timing error.
// A fact cited but never presented anywhere is reported separately — it is a grounding gap,
// not an ordering gap, and conflating the two produced misleading warnings.
function validateStageTiming(caseStudy){
  const stages=caseStudy.stages||[];
  const available=new Set(),presented=new Set(),issues=[];
  // Pre-pass: background facts are available everywhere, regardless of the stage declaring them.
  for(const stage of stages)
    for(const d of stage.data||[]){
      const bg=(d.availability||'revealed')==='background';
      for(const id of d.factIds||[]){
        const lid=String(id).toLowerCase();
        presented.add(lid);
        if(bg)available.add(lid);
      }
    }
  for(const stage of stages){
    for(const d of stage.data||[])
      if((d.availability||'revealed')!=='background')
        for(const id of d.factIds||[])available.add(String(id).toLowerCase());
    for(const q of stage.questions||[])
      for(const r of q.rationales||[])
        for(const id of r.factIds||[]){
          const lid=String(id).toLowerCase();
          if(available.has(lid))continue;
          issues.push(presented.has(lid)
            ?{sev:'warn',msg:`Stage ${stage.stageNumber} ${q.id||'question'} cites ${id} before it is revealed`}
            :{sev:'warn',msg:`Stage ${stage.stageNumber} ${q.id||'question'} cites ${id}, which is never presented as case data`});
        }
  }
  return issues;
}
// Every distinct fact id referenced anywhere in the case (for the registry + coverage).
function caseAllFactIds(caseStudy){
  const s=new Set();
  const add=ids=>{for(const id of ids||[])s.add(String(id).toLowerCase());};
  for(const stage of caseStudy.stages||[]){
    for(const d of stage.data||[])add(d.factIds);
    for(const q of stage.questions||[])for(const r of q.rationales||[])add(r.factIds);
  }
  add((caseStudy.debrief||{}).factIds);
  return[...s];
}
// Render the validated case to printable markdown (questions then a separate answer key).
// `worksheetFactIds:false` strips [fact-n] tags from the STUDENT-FACING half only. On screen a
// fact tag is a clickable audit affordance; on paper it is noise a student cannot act on. The
// answer key always keeps them, since that is the half being spot-checked against the source.
function caseToMarkdown(cs,{worksheetFactIds=true}={}){
  const L=[];
  L.push('# '+(cs.title||'Clinical Case Study'));
  const p=cs.patient||{};
  L.push('**Condition:** '+(cs.condition||'—')+'  |  **Difficulty:** '+(cs.difficulty||'—'));
  if(p.age||p.sex||p.background)L.push('**Patient:** '+[p.age&&p.age+' y/o',p.sex,p.background].filter(Boolean).join(', '));
  L.push('\n---\n');
  for(const stage of cs.stages||[]){
    L.push('## Stage '+stage.stageNumber+' — '+(stage.title||''));
    if(stage.narrative)L.push('\n'+stage.narrative+'\n');
    if((stage.data||[]).length){
      L.push('**Clinical data**\n');
      for(const d of stage.data)L.push('- '+(d.label?d.label+': ':'')+(d.value||'')+(worksheetFactIds&&d.factIds&&d.factIds.length?'  ['+d.factIds.join(', ')+']':''));
      L.push('');
    }
    (stage.questions||[]).forEach((q,i)=>{
      L.push('**Q'+stage.stageNumber+'.'+(i+1)+' ('+(q.type||'MCQ')+')** '+(q.stem||''));
      for(const o of q.options||[])L.push('   '+(o.label||'')+'. '+(o.text||''));
      L.push('');
    });
  }
  // Hard page break so a printed worksheet never shows its answer key on the same sheet.
  L.push('\n<div class="pagebreak"></div>\n\n## Answer Key\n');
  for(const stage of cs.stages||[]){
    (stage.questions||[]).forEach((q,i)=>{
      L.push('**Q'+stage.stageNumber+'.'+(i+1)+'** — Answer: '+((q.correctAnswers||[]).join(', ')||'—')+(q.cjmmSkill?'  ·  '+q.cjmmSkill:''));
      for(const r of q.rationales||[])L.push('   - '+(r.option||'')+': '+(r.text||'')+(r.factIds&&r.factIds.length?'  ['+r.factIds.join(', ')+']':''));
      L.push('');
    });
  }
  const db=cs.debrief||{};
  if(db.priorityProblem||((db.keyDecisions||[]).length)||db.notes){
    L.push('\n---\n\n## Debrief\n');
    if(db.priorityProblem)L.push('**Priority problem:** '+db.priorityProblem);
    for(const k of db.keyDecisions||[])L.push('- '+k);
    if(db.notes)L.push('\n*'+db.notes+'*');
  }
  return L.join('\n');
}

// A case that failed validation stays exportable — you may want to inspect or hand-correct it —
// but the exported artifact must say so on its face, or an unverified case is indistinguishable
// from a verified one once it leaves the app.
// v15.7 B2: which configuration produced this artifact.
// [LATTE-HEURISTIC]. TOOL_PROFILE_DEFAULTS lets model and reasoning level be changed per
// tool at any time, so an artifact cannot be reconstructed from the config as it stands
// later. And the June paper's limitations state intra-rater consistency was never measured,
// so two runs of ONE configuration may not agree. When output quality shifts after a model
// or prompt change, this stamp is the only way to answer which configuration made a given
// worksheet or case. It belongs in the audit trail, not in the student-facing view.
function latteProvenanceStamp({genModel,genLevel,auditModel,auditLevel,promptLabel}){
  const L=['```',
    'Generator: '+(genModel||'—')+' [Thinking: '+(genLevel||'—')+']'+(promptLabel?'   Prompt: '+promptLabel:''),
    'Auditor:   '+(auditModel?auditModel+' [Thinking: '+(auditLevel||'—')+']':'not run')+'   Criteria: '+LATTE_STANDARDS_VERSION,
    'Standards: terminology — Simms 2026 reference   Test Plan: '+NCLEX_TEST_PLAN_VERSION,
    '```',''];
  return L.join('\n');
}
function caseValidationStamp(issues){
  const errs=(issues||[]).filter(x=>x.sev==='error');
  const warns=(issues||[]).filter(x=>x.sev!=='error');
  if(!errs.length)return'';
  return['> **\u26a0 FAILED VALIDATION \u2014 '+errs.length+' error(s), '+warns.length+' warning(s)**',
    '>','> This case did not pass source-grounding checks. Do not use it as verified study',
    '> content until corrected. Errors:','>',
    ...errs.slice(0,12).map(e=>'> - '+e.msg),
    ...(errs.length>12?['> - \u2026and '+(errs.length-12)+' more']:[]),
    '','---',''].join('\n');
}

   v15.6 item 4 — case-level NEIA audit pass

// [NEIA-DERIVED]. The standalone NCLEX generator got an eleven-criterion gate in v4.2; the
// Case Study Generator inherited only CASE_QUESTION_RULES (anchor/distractor/rationale/
// completeness) and had no item-quality review at all. This closes that gap with a second
// API call per eligible item.
//
// SCOPE — single-best-answer MCQ only, matching NCLEX_GEN_PROMPT v4.2's "GATE — MCQ ONLY".
// The rubric was validated for one key and three plausible distractors; the May paper puts
// SATA, ordered response, and NGN formats outside it. Everything else is gate=N/A, and an
// N/A is NOT a pass — it means the instrument does not apply.
function caseIsGateEligible(q){
  return !!q&&String(q.type||'')==='MCQ'
    &&(q.correctAnswers||[]).length===1
    &&(q.options||[]).length>=3;
}
// THE CRITICAL DESIGN CONSTRAINT: the auditor sees exactly what the student sees through
// the item's stage, and nothing else. No fact IDs, no sourceQuote, no fact packet, no
// supportType, no generation reasoning, no prior audit output.
// Built by truncating the case and reusing caseToMarkdown, then cutting at the page break
// that separates worksheet from answer key. Assembling a second representation of the case
// would guarantee eventual drift between the audited artifact and the printed one, and
// cutting at the renderer's own boundary means a future field added to the answer key
// cannot leak into the audit payload by accident.
// v15.7 B1b: split so the auditor can review an item from ANY tool. The item block is
// tool-agnostic; only the visible-context prefix differs. A standalone NCLEX worksheet item
// is freestanding and passes an empty context, which is a strictly simpler payload than the
// case version — an unfolding item needs its stage history, a worksheet item does not.
function itemAuditPayload(visibleContext,q){
  const opts=(q.options||[]).map(o=>'   '+(o.label||'')+'. '+(o.text||'')).join('\n');
  const block=`═══ ITEM UNDER REVIEW ═══
STEM: ${q.stem||''}
${opts}
KEYED ANSWER: ${(q.correctAnswers||[]).join(', ')||'—'}`;
  const ctx=String(visibleContext||'').trim();
  return ctx?ctx+'\n\n'+block:block;
}
function caseAuditPayload(cs,stageNumber,q){
  const stages=(cs.stages||[]);
  const ix=stages.findIndex(s=>Number(s.stageNumber)===Number(stageNumber));
  const through=ix>=0?stages.slice(0,ix+1):stages;
  const md=caseToMarkdown({...cs,stages:through,debrief:null},{worksheetFactIds:false});
  const cut=md.indexOf('\n<div class="pagebreak">');
  return itemAuditPayload((cut>=0?md.slice(0,cut):md).trim(),q);
}
// Criteria are stated in our own words with the source cited, never reproduced verbatim —

function itemBuildAuditPrompt(payload){
  return `═══ NCLEX ITEM QUALITY REVIEW ═══

ROLE: You are reviewing ONE multiple-choice item from an unfolding nursing case study.
You are given the case exactly as the student sees it, up to and including this item.
You do NOT have the source material the item was written from, and you must not ask for
it. Review the item as written.

Return ONLY the verdict lines specified at the bottom. No preamble, no commentary, no
restatement of the item.

═══ STOP CRITERIA ═══
Check the item against these eleven. Each describes a DISQUALIFYING condition — the floor,
not an ideal. Do not fail an item merely because a better version is imaginable.

  1. STEM CLARITY — confusing, ambiguous, grammatically incorrect, or negatively
     constructed ("all are correct except").
  2. STEM RELEVANCE — requires knowledge or competencies outside a new graduate nurse's
     scope.
  3. ANSWER ACCURACY — the keyed answer does not correctly answer the question asked, or
     another option is clearly better.
  4. ANSWER INTEGRATION — the key is immediately apparent because it repeats terms from
     the stem, or differs from the distractors in length or grammar.
  5. DISTRACTOR LENGTH — lengths vary enough to reveal the key.
  6. DISTRACTOR PLAUSIBILITY — a distractor is obviously incorrect or irrelevant.
  7. DISTRACTOR DISTINCTIVENESS — distractors are too similar to each other.
  8. DISTRACTOR CLARITY — a distractor is ambiguous or vague.
  9. DISTRACTOR CONSISTENCY — distractors lack uniformity in style or grammar.
 10. BIAS — content or language could disadvantage test-takers by culture, language,
     sexual orientation, sex/gender, age, or socioeconomic status.
 11. TEST PLAN ALIGNMENT — the item exercises no identifiable nursing activity.
     ADVISORY ONLY: no Test Plan document is supplied to you. This criterion may WARN.
     It may NEVER produce a FAIL. Never invent an activity statement to satisfy it.

═══ IMPORTANT — WHAT YOU CAN AND CANNOT SEE ═══
You do not have the case's source facts. Judge ANSWER ACCURACY on clinical correctness
given the case as presented. If the item hinges on information you were not shown, that is
a REVIEW, not a FAIL.

═══ OUTPUT ═══
Emit exactly one verdict line, plus at most three WARN lines:

  PASS
  FAIL — <criterion name>
  REVIEW — <what you could not resolve>

Use REVIEW when you genuinely cannot determine whether the item is sound. Forcing a
borderline item into PASS is worse than admitting the uncertainty.
A criterion 2 finding — merely improvable, not disqualifying — is a WARN, not a FAIL:

  WARN <criterion name>: <the specific improvement>

Do NOT compute or report a total score, a percentage, or a quality band (high / moderate /
low). Those bands have not been criterion-validated. The reliable question is whether this
item contains a disqualifying defect, not how good it is.

Criteria adapted from the NEIA Scoring Tool (Simms, Hensel & Kumar, Nurse Education in

═══ THE CASE, AS THE STUDENT SEES IT ═══

// Verdict vocabulary. REVIEW exists because the June study measured both rater types
// misclassifying ~86-88% of moderate-quality items, nearly all by rating them upward —
// forcing a borderline item into PASS is exactly the failure mode the data predicts.
const ITEM_AUDIT_STATUS=new Set(['PASS','FAIL','REVIEW','N/A','ERROR']);
// Criterion 3 is the ONLY one where the auditor overrules a keyed answer with no reference
// standard, and it sits in the AI's second-weakest measured domain (ICC 0.575). A wrong
// auto-repair here silently replaces a correct answer with an incorrect one, so an
// answer-accuracy FAIL is surfaced for human review and never repaired automatically.
function itemAuditIsAnswerAccuracy(criterion){
  return /answer\s*accuracy|correct\s*answer\s*[:\-]?\s*accuracy/i.test(String(criterion||''));
}
function itemParseAuditVerdict(text){
  const raw=String(text||'');
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const warns=[];
  let status='REVIEW',criterion='',detail='';
  for(const line of lines){
    let m;
    if((m=line.match(/^WARN\s+([^:]+):\s*(.*)$/i))){warns.push({criterion:m[1].trim(),detail:m[2].trim()});continue;}
    if(status!=='REVIEW'||criterion)continue; // first verdict line wins
    if(/^PASS\b/i.test(line)){status='PASS';continue;}
    if((m=line.match(/^FAIL\s*[—–\-:]\s*(.+)$/i))){status='FAIL';criterion=m[1].trim();continue;}
    if((m=line.match(/^REVIEW\s*[—–\-:]\s*(.+)$/i))){status='REVIEW';detail=m[1].trim();continue;}
  }
  // A FAIL naming criterion 11 is downgraded here, not trusted. The prompt forbids it, but
  // a prompt instruction is not an enforcement mechanism — this is.
  if(status==='FAIL'&&/test\s*plan|alignment/i.test(criterion)){
    warns.push({criterion:'Test Plan Alignment',detail:criterion});
    status='PASS';criterion='';
  }
  return{status,criterion,detail,warns,
    autoRepairable:status==='FAIL'&&!itemAuditIsAnswerAccuracy(criterion)};
}
// v15.7: quota-aware abort. A free-tier key that has run out will 429 every remaining call,
// and geminiRequest's backoff makes each failure SLOW. Burning through 20 more doomed audits
// wastes minutes and tells the user nothing new, so a caller can throw QuotaStop from the
// worker to end the pool early with the results collected so far.
function isQuotaError(e){
  return /quota|rate limit|429|resource_exhausted/i.test(String((e&&e.message)||e||''));
}
// Two lanes, not three — see the pool comment below. geminiRequest already retries 429 with
// Retry-After and exponential backoff; the audit calls shipped with a budget of 1, which is
// too small to ride out a per-minute window, so they get 3.
const AUDIT_POOL_WIDTH=2,AUDIT_RETRIES=3;
// Bounded concurrency. A 5-stage case at 2 questions/stage is ~6 MCQ-eligible items; at the
// June paper's measured 1.7-2.3 min/item for reasoning-enhanced models, serialized audits
// would run 10-14 minutes and make the feature unusable.
// Width 2, not 3: free-tier Gemini limits are per-minute, and width 3 at the ~6s latency
// measured on this build bursts roughly 28 requests/minute, which exhausts a free-tier Pro
// allowance quickly. Two lanes still overlap the waiting without spiking the rate.
async function itemRunPool(items,width,worker,signal){
  const out=new Array(items.length);
  let next=0;
  const lanes=Array.from({length:Math.max(1,Math.min(width,items.length||1))},async()=>{
    for(;;){
      const i=next++;
      if(i>=items.length)return;
      if(signal&&signal.aborted)throw Object.assign(new Error('Aborted'),{name:'AbortError'});
      out[i]=await worker(items[i],i);
    }
  });
  await Promise.all(lanes);

}

    // between generating an artifact and exporting it.
    const _aud=cfg.forTool('itemAudit');
    setProvenance({genModel:model,genLevel:level,promptLabel:'case builder v15.7',
      auditModel:runAudit?_aud.model:'',auditLevel:runAudit?_aud.level:''});
    try{
      log('Selected '+selectedFacts.length+' grounded fact(s) for '+activeCondition.name+'.','ok');
      log('Model: '+model+' [Thinking: '+level+']'+(cfg.autoProfile?' (auto)':''),'warn');
      for(const w of sufficiency.warnings)log('ⓘ '+w,'warn');
      const prompt=caseBuildPrompt({conditionName:activeCondition.name,facts:selectedFacts,difficulty,stages,questionsPerStage,includeTypes:types});
      log('Generating unfolding case ('+stages+' stages · '+questionsPerStage+' Q/stage)...','warn');
      let meta=null;
      const raw=await callGemini(cfg.apiKey,model,[{text:prompt}],true,level,ctl.signal,2,
        t=>setLiveKB(Math.round(t.length/102.4)/10),
        m=>{meta=m;if(m.truncated)log('  ⚠ Output hit the 65,536-token ceiling — the case may be cut short. Reduce stages or questions per stage.','err');},
        {responseMimeType:'application/json'}); // v15: the case prompt already demands bare JSON; this stops fence/prose wrappers at the source (extractJSON stays as the truncation fallback)
      let parsed;
      try{parsed=extractJSON(raw);}catch(e){log('Could not parse JSON from the model output: '+e.message,'err');setBusy(false);setAbortCtl(null);return;}
      if(!parsed||!Array.isArray(parsed.stages)||!parsed.stages.length){log('The response did not contain any case stages.','err');setBusy(false);setAbortCtl(null);return;}
      // Deterministic validation against the real KB.
      // Validate against the PACKET, not the whole KB. A fact that exists somewhere in the
      // Knowledge Base but was never sent to this run is not grounding — it is coincidence.
      const allowedFactIds=new Set(selectedFacts.map(f=>String(f.id).toLowerCase()));
      const revalidate=cs=>{
        const s=validateCaseStudy(cs,K.factIndex,allowedFactIds,activeCondition.name);
        return[...s,...validateStageTiming(cs)];
      };
      let allIssues=revalidate(parsed);
      setIssues(allIssues);
      let errCount=allIssues.filter(x=>x.sev==='error').length;

      // ── v15.6 item 4: NEIA audit pass ──
      // Code validation runs FIRST, deliberately: a structurally broken case must never
      // consume audit calls. An ungrounded item is already disqualified, and paying for a
      // rubric review of it would be spending the user's quota to grade a known failure.
      if(runAudit&&errCount===0){
        const {model:aModel,level:aLevel}=cfg.forTool('itemAudit');
        const items=caseGateItems(parsed);
        const eligible=items.filter(i=>i.eligible);
        const naCount=items.length-eligible.length;
        const seed={};
        for(const it of items)if(!it.eligible)seed[it.key]={status:'N/A',criterion:'',warns:[]};
        setAudit({...seed});
        if(!eligible.length){
          log('Audit skipped: no single-best-answer MCQ items in this case ('+naCount+' marked N/A).','warn');
        }else{
          setAuditPhase('audit');
          log('Auditing '+eligible.length+' MCQ item(s) against 11 stop criteria · '+aModel+' [Thinking: '+aLevel+']'+(naCount?' · '+naCount+' item(s) N/A (rubric is MCQ-only)':''),'warn');
          let done=0,quotaFails=0,results=[];
          try{
          results=await itemRunPool(eligible,AUDIT_POOL_WIDTH,async(it)=>{
            const payload=caseAuditPayload(parsed,it.stageNumber,it.q);
            let verdict;
            try{
              const out=await callGemini(cfg.apiKey,aModel,[{text:itemBuildAuditPrompt(payload)}],true,aLevel,ctl.signal,AUDIT_RETRIES);
              verdict=itemParseAuditVerdict(out);
            }catch(e){
              if(e.name==='AbortError')throw e;
              // v15.7: see the NCLEX audit — stop after two quota failures instead of
              // spending minutes confirming the allowance is still gone.
              if(isQuotaError(e)&&++quotaFails>=2)throw Object.assign(new Error('API quota exhausted'),{name:'QuotaStop'});
              verdict={status:'ERROR',criterion:'',detail:e.message||String(e),warns:[],autoRepairable:false};
            }
            done++;
            setAudit(p=>({...(p||{}),[it.key]:verdict}));
            setAuditPhase('audit '+done+'/'+eligible.length);
            return{...it,...verdict};
          },ctl.signal);
          }catch(e){
            if(e.name!=='QuotaStop')throw e;
            results=(results||[]).filter(Boolean);
            log('⚠ Audit stopped early — your Gemini API quota is exhausted. The case itself is complete and still passed its grounding checks; only the optional item review was cut short. Wait for your quota to reset, switch the "Item quality · audit" profile to Flash, or turn the audit off.','err');
          }

          const sum=itemAuditSummary(results.concat(Object.values(seed)));
          log('Audit: '+sum.pass+' pass · '+sum.fail+' fail · '+sum.review+' review'+(sum.error?' · '+sum.error+' error':'')+(sum.na?' · '+sum.na+' N/A':'')+'.',sum.fail?'err':'ok');
          for(const r of results){
            if(r.status==='FAIL')log('  ✗ Stage '+r.stageNumber+' '+(r.q.id||'')+' FAIL — '+r.criterion,'err');
            else if(r.status==='REVIEW')log('  ? Stage '+r.stageNumber+' '+(r.q.id||'')+' REVIEW — '+(r.detail||'unresolved'),'warn');
            for(const w of r.warns||[])log('  ⓘ Stage '+r.stageNumber+' '+(r.q.id||'')+' WARN '+w.criterion+': '+w.detail,'warn');
          }

          // ── Repair, one round only ──
          const accuracyFails=results.filter(r=>r.status==='FAIL'&&!r.autoRepairable);
          const repairable=results.filter(r=>r.autoRepairable);
          for(const r of accuracyFails)
            log('  ⚠ Stage '+r.stageNumber+' '+(r.q.id||'')+' failed on answer accuracy — NOT auto-repaired. This is the one criterion where the reviewer overrules a keyed answer with no reference standard; it needs your eyes.','err');
          if(repairable.length){
            setAuditPhase('repair');
            log('Repairing '+repairable.length+' item(s) in a fresh call (one round, no re-audit)...','warn');
            let repaired=0;
            await itemRunPool(repairable,AUDIT_POOL_WIDTH,async(r)=>{
              try{
                const visible=caseAuditPayload(parsed,r.stageNumber,r.q);
                const out=await callGemini(cfg.apiKey,model,[{text:caseBuildRepairPrompt({
                  conditionName:activeCondition.name,facts:selectedFacts,stageNumber:r.stageNumber,
                  q:r.q,criterion:r.criterion,visibleContext:visible})}],true,level,ctl.signal,1,
                  null,null,{responseMimeType:'application/json'});
                const fixed=extractJSON(out);
                if(!fixed||!fixed.stem||!Array.isArray(fixed.options))throw new Error('repair returned no usable item');
                const st=(parsed.stages||[]).find(s=>Number(s.stageNumber)===Number(r.stageNumber));
                const ix=(st&&st.questions||[]).findIndex(x=>String(x.id||'')===String(r.q.id||''));
                if(!st||ix<0)throw new Error('could not locate the item to replace');
                const note=fixed.repairNote||'';
                delete fixed.repairNote;
                st.questions[ix]=fixed;
                repaired++;
                log('  ✓ Stage '+r.stageNumber+' '+(r.q.id||'')+' repaired'+(note?' — '+note:''),'ok');
              }catch(e){
                if(e.name==='AbortError')throw e;
                log('  ✗ Stage '+r.stageNumber+' '+(r.q.id||'')+' repair failed: '+(e.message||e),'err');
              }
            },ctl.signal);
            if(repaired){
              // Re-validate the repaired case. Repaired items are deliberately NOT re-audited:
              // the loop is capped at one round, and anything still failing is surfaced instead.
              allIssues=revalidate(parsed);
              setIssues(allIssues);
              errCount=allIssues.filter(x=>x.sev==='error').length;
              log('Re-validated after repair: '+errCount+' error(s), '+(allIssues.length-errCount)+' warning(s).',errCount?'err':'ok');
              if(errCount)log('A repaired item broke grounding. The case is shown but was NOT linked into the Fact Inspector.','err');
            }
          }
          setAuditPhase('');
        }
      }else if(runAudit&&errCount){
        log('Audit skipped: the case has '+errCount+' structural error(s). Fix grounding first — a rubric review of an ungrounded item spends quota to grade a known failure.','warn');
      }
      // Coverage counts only the intersection with the packet, so it can never report more
      // facts grounded than were actually supplied.
      const cited=new Set(caseAllFactIds(parsed));
      const usedSelected=new Set([...cited].filter(id=>allowedFactIds.has(id)));
      const outOfPacket=[...cited].filter(id=>!allowedFactIds.has(id));
      setCoverage({selected:selectedFacts.length,used:usedSelected.size,outOfPacket,
        uncovered:selectedFacts.filter(f=>!usedSelected.has(String(f.id).toLowerCase()))});
      setCaseStudy(parsed);
      // A case that failed validation is still shown and exportable (you may want to inspect
      // or hand-correct it), but it must NOT enter the registry: once a fact badge appears in
      // the inspector it reads as verified provenance, and linking an invalid case there would
      // make a fabrication look audited.
      if(K.registerArtifact&&errCount===0){
        // Namespaced per case. Models reuse ids like "q1" for every case they write, so an
        // un-namespaced key would silently merge two different questions' provenance.
        const caseId='case-'+Date.now().toString(36)+'-'+uid().slice(0,6);
        const title=parsed.title||activeCondition.name;
        // v15.1: stage data and question rationales get SEPARATE registry entries. v15
        // seeded every question's entry with the whole stage's data facts, so the Inspector
        // claimed all of a stage's findings were "used in" each question. Now "Stage N
        // clinical data" carries the presented findings, and a question entry carries only
        // the facts its own rationales actually cite — honest question-level provenance.
        const entries=[];let qi=0;const claimed=new Set();
        for(const stage of parsed.stages||[]){
          const stageData=new Set();
          for(const d of stage.data||[])for(const id of d.factIds||[])stageData.add(String(id).toLowerCase());
          stageData.forEach(id=>claimed.add(id));
          if(stageData.size)entries.push({id:caseId+':'+stage.stageNumber+':data',caseId,
            factIds:[...stageData],label:title+' — Stage '+stage.stageNumber+' clinical data'});
          for(const q of stage.questions||[]){
            qi++;
            const ids=new Set();
            for(const r of q.rationales||[])for(const id of r.factIds||[])ids.add(String(id).toLowerCase());
            ids.forEach(id=>claimed.add(id));
            if(ids.size)entries.push({id:caseId+':'+stage.stageNumber+':'+(q.id||('q'+qi)),caseId,
              factIds:[...ids],label:title+' — Stage '+stage.stageNumber+' '+(q.id||('Q'+qi))});
          }
        }
        // Facts used only in narrative framing, background, or the debrief would otherwise
        // never appear under "Used in" — catch the residue in one case-level entry.
        const residual=[...cited].filter(id=>!claimed.has(id));
        if(residual.length)entries.push({id:caseId+':case',caseId,factIds:residual,label:title+' — case context / debrief'});
        K.registerArtifact('caseStudies',entries,{merge:true});
      }
      log('✅ Case generated: '+parsed.stages.length+' stages, '+(parsed.stages||[]).reduce((n,s)=>n+((s.questions||[]).length),0)+' questions.','ok');
      log('Validation: '+errCount+' error(s), '+(allIssues.length-errCount)+' warning(s). Coverage: '+usedSelected.size+'/'+selectedFacts.length+' supplied facts grounded.',errCount?'err':'ok');
      if(outOfPacket.length)log('⚠ '+outOfPacket.length+' cited fact ID(s) were never supplied to this run: '+outOfPacket.slice(0,6).join(', ')+(outOfPacket.length>6?'…':''),'err');
      if(errCount)log('Case failed validation — it is shown and exportable, but was NOT linked into the Fact Inspector. Fix the errors or regenerate before using it as study content.','err');
    }catch(e){
      if(e.name==='AbortError')log('Cancelled.','warn');else log('Error: '+(e.message||String(e)),'err');
    }finally{setBusy(false);setAbortCtl(null);setLiveKB(0);setAuditPhase('');}
  },[cfg,activeCondition,selectedFacts,sufficiency,difficulty,stages,questionsPerStage,types,K,runAudit]);

  // v15.6: audit verdicts joined back to their items for display. Derived rather than stored
  // so a repaired case cannot leave a stale verdict on screen.
  const auditRows=useMemo(()=>{
    if(!caseStudy||!audit)return[];
    return caseGateItems(caseStudy).map(it=>{
      const v=audit[it.key];
      if(!v)return null;
      return{key:it.key,label:'Stage '+it.stageNumber+' '+(it.q.id||''),
        status:v.status,criterion:v.criterion||'',detail:v.detail||'',warns:v.warns||[]};
    }).filter(Boolean);
  },[caseStudy,audit]);
  const auditTotals=useMemo(()=>{
    const n=s=>auditRows.filter(r=>r.status===s).length;
    return{pass:n('PASS'),fail:n('FAIL'),review:n('REVIEW'),na:n('N/A'),error:n('ERROR'),
      accuracyFails:auditRows.filter(r=>r.status==='FAIL'&&itemAuditIsAnswerAccuracy(r.criterion)).length};
  },[auditRows]);

  // The audit-trail view carries the provenance stamp; the printable student view does not.
  const caseMd=useMemo(()=>caseStudy?caseValidationStamp(issues)+(provenance?latteProvenanceStamp(provenance):'')+caseToMarkdown(caseStudy):'',[caseStudy,issues,provenance]);
  const casePrintMd=useMemo(()=>caseStudy?caseValidationStamp(issues)+caseToMarkdown(caseStudy,{worksheetFactIds:false}):'',[caseStudy,issues]);
  // Every checkbox can be unchecked, which would send the model an empty type list.
  const enabledTypeCount=Object.values(types).filter(Boolean).length;
  const canRun=cfg.apiKey&&conditions.length&&enabledTypeCount>0&&!busy;
  const errCount=issues.filter(x=>x.sev==='error').length;

  return(
    <div className="tool-panel">
      <h2 className="tool-title">🩺 Clinical Case Study Generator</h2>
      <p className="tool-desc">Generate source-grounded unfolding nursing cases from the shared LATTE Knowledge Base. Every clinical datum, answer, and rationale is validated against real fact IDs in code.</p>

      {!conditions.length?<div className="tip-banner" style={{color:'var(--accent-warm)'}}>No Knowledge Base loaded. Open <strong>Knowledge</strong> and build it from your source files first — the case generator reads facts, never PDFs.</div>:<>

      <div className="tip-banner">Reuses the NCLEX Generator's item-quality rules (distractor plausibility, per-option rationales, anchor grounding, completeness) plus a strict source-boundary policy so the model cannot invent labs, doses, comorbidities, or diagnoses.</div>

      {/* Condition + fact scope */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Condition & Fact Scope</div>
        <div className="field-block" style={{marginBottom:10}}>
          <label>Condition</label>
          <select value={conditionId} onChange={e=>setConditionId(e.target.value)}>
            {conditions.map(c=><option key={c.id} value={c.id}>{c.name} ({(c.facts||[]).length} facts)</option>)}
          </select>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:11,color:'var(--text-dim)',marginRight:3}}>Fact tiers:</span>
          <span className="tier-btn t1 active" style={{cursor:'default'}}><b>Tier 1</b> always</span>
          <button type="button" className={'tier-btn t2'+(includeTier2?' active':'')} onClick={()=>setIncludeTier2(v=>!v)}><b>Tier 2</b> context</button>
          <button type="button" className={'tier-btn t3'+(includeTier3?' active':'')} onClick={()=>setIncludeTier3(v=>!v)}><b>Tier 3</b> distractors</button>
        </div>
        <div style={{fontSize:10.5,color:'var(--text-dim)',lineHeight:1.5}}>Tier 1 facts drive the critical decisions. Tier 2 adds realistic context; Tier 3 adds lower-priority background detail. Distractors are built from contextually plausible near-misses at any tier, not from Tier 3. <b style={{color:'var(--text)'}}>{selectedFacts.length}</b> fact(s) selected for this case.</div>
        {sufficiency.warnings.length>0&&<div className="tip-banner" style={{marginTop:10,marginBottom:0,fontSize:10.5,lineHeight:1.5}}>⚠ {sufficiency.warnings.join(' · ')} The generator will not invent to fill these gaps.</div>}
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:11.5,cursor:'pointer'}}>
            <input type="checkbox" checked={runAudit} onChange={()=>setRunAudit(v=>!v)} style={{marginTop:2}} />
            <span>
              <b>Run the item-quality audit</b> after generating
              <span style={{display:'block',fontSize:10.5,color:'var(--text-dim)',lineHeight:1.5,marginTop:3}}>
                A second review pass over each single-best-answer MCQ, checked against 11 stop criteria adapted from the NEIA scoring tool. Costs one extra API call per MCQ. Items that fail are rewritten once — except answer-accuracy failures, which are surfaced for you rather than auto-corrected.
              </span>
            </span>
          </label>
        </div>
      </div>

      {/* Case shape */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Case Shape</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:12}}>
          <div className="field-block" style={{margin:0}}><label>Difficulty</label>
            <select value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
              <option value="foundational">Foundational</option>
              <option value="exam">Exam-level</option>
              <option value="advanced">Advanced</option>
            </select></div>
          <div className="field-block" style={{margin:0}}><label>Stages</label>
            <select value={stages} onChange={e=>setStages(parseInt(e.target.value))}>
              <option value={3}>3</option><option value={4}>4</option><option value={5}>5</option>
            </select></div>
          <div className="field-block" style={{margin:0}}><label>Questions / stage</label>
            <select value={questionsPerStage} onChange={e=>setQuestionsPerStage(parseInt(e.target.value))}>
              <option value={2}>2</option><option value={3}>3</option><option value={4}>4</option>
            </select></div>
        </div>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--text-dim)',marginBottom:8}}>Question types to include</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {[['mcq','Multiple choice'],['sata','SATA'],['prioritization','Prioritization'],['ordering','Ordered response'],['calculation','Calculation (when sourced)'],['education','Patient education']].map(([k,lbl])=>
            <label key={k} style={{display:'flex',alignItems:'center',gap:5,fontSize:11.5,color:types[k]?'var(--text)':'var(--text-dim)',cursor:'pointer',userSelect:'none'}}>
              <input type="checkbox" checked={types[k]} onChange={()=>toggleType(k)} style={{accentColor:'var(--accent)'}}/>{lbl}
            </label>)}
        </div>
      </div>

      <button className="btn-primary" style={{width:'100%'}} disabled={!canRun} onClick={run}>
        {busy?'⟳ Generating case...':!cfg.apiKey?'Enter API Key':!enabledTypeCount?'Select at least one question type':'▶ Generate Case Study'}
      </button>
      {!enabledTypeCount&&<div style={{fontSize:11,color:'var(--accent-warm)',marginTop:6}}>Select at least one question type above.</div>}

      {busy&&<button className="btn-danger" style={{width:'100%',marginTop:10}} onClick={()=>abortCtl?.abort()}>Cancel</button>}
      {busy&&liveKB>0&&<div style={{fontSize:10,color:'var(--accent-cyan)',fontFamily:'JetBrains Mono',marginTop:6}}>▼ receiving {liveKB} KB</div>}
      {busy&&auditPhase&&<div style={{fontSize:10,color:'var(--accent-warm)',fontFamily:'JetBrains Mono',marginTop:6}}>⚖ {auditPhase==='repair'?'repairing failed items':auditPhase.startsWith('audit ')?'item-quality audit '+auditPhase.slice(6):'item-quality audit'}</div>}

      {/* Logs */}
      {logs.length>0&&<div style={{marginTop:12,maxHeight:150,overflowY:'auto',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:10,fontFamily:'JetBrains Mono',fontSize:10,lineHeight:1.6}}>
        {logs.map((l,i)=><div key={i} style={{color:l.t==='err'?'var(--accent-red)':l.t==='ok'?'var(--accent-green)':l.t==='warn'?'var(--accent-warm)':'var(--text-dim)'}}>{l.msg}</div>)}
      </div>}

      {/* Validation panel */}
      {caseStudy&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(errCount?'rgba(248,113,113,.35)':issues.length?'rgba(240,168,58,.35)':'rgba(52,211,153,.3)'),background:errCount?'rgba(248,113,113,.06)':issues.length?'rgba(240,168,58,.06)':'rgba(52,211,153,.05)'}}>
        <span style={{fontSize:12,fontWeight:600,color:errCount?'var(--accent-red)':issues.length?'var(--accent-warm)':'var(--accent-green)'}}>
          {errCount?'⚠':issues.length?'⚑':'✓'} Validation: {errCount} error(s), {issues.length-errCount} warning(s)
          {coverage&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {coverage.used}/{coverage.selected} selected facts grounded</span>}
        </span>
        <div style={{fontSize:9.5,color:'var(--text-dim)',marginTop:5}}>Structural checks, unknown-fact-ID checks, and stage-timing all run in code against the current Knowledge Base — not on the model's word.</div>
        {issues.length>0&&<div style={{marginTop:8,maxHeight:170,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {issues.map((x,i)=><div key={i} style={{fontSize:10,fontFamily:'JetBrains Mono',lineHeight:1.6,color:x.sev==='error'?'var(--accent-red)':'var(--accent-warm)'}}>{x.sev==='error'?'✕':'⚠'} {x.msg}</div>)}
        </div>}
        {coverage&&coverage.outOfPacket&&coverage.outOfPacket.length>0&&<div style={{fontSize:10,color:'var(--accent-red)',marginTop:7,lineHeight:1.5}}>{coverage.outOfPacket.length} cited fact ID(s) were never supplied to this run: {coverage.outOfPacket.slice(0,8).join(', ')}{coverage.outOfPacket.length>8?'…':''}</div>}
        {coverage&&coverage.uncovered.length>0&&<div style={{fontSize:9.5,color:'var(--text-dim)',marginTop:7,lineHeight:1.5}}>{coverage.uncovered.length} supplied fact(s) were not referenced by the case — that is expected; a single case cannot use every fact.</div>}
        {errCount>0&&<div style={{fontSize:10.5,color:'var(--accent-red)',marginTop:8,lineHeight:1.5,paddingTop:8,borderTop:'1px solid var(--border)'}}>This case was <b>not</b> linked into the Fact Inspector. Export is still available, and the exported file is stamped with these errors.</div>}
      </div>}

      {/* v15.6: item-quality audit panel. Reports per-item verdicts only — deliberately no
          total score, percentage, or quality band, because those bands were set a priori and
          have never had criterion-validity testing. */}
      {auditRows.length>0&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(auditTotals.fail?'rgba(248,113,113,.35)':auditTotals.review?'rgba(240,168,58,.35)':'rgba(52,211,153,.3)'),background:auditTotals.fail?'rgba(248,113,113,.06)':auditTotals.review?'rgba(240,168,58,.06)':'rgba(52,211,153,.05)'}}>
        <span style={{fontSize:12,fontWeight:600,color:auditTotals.fail?'var(--accent-red)':auditTotals.review?'var(--accent-warm)':'var(--accent-green)'}}>
          {auditTotals.fail?'⚠':auditTotals.review?'⚑':'✓'} Item quality: {auditTotals.pass} pass · {auditTotals.fail} fail · {auditTotals.review} review
          {auditTotals.na>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {auditTotals.na} N/A</span>}
          {auditTotals.error>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {auditTotals.error} not scored</span>}
        </span>
        <div style={{fontSize:9.5,color:'var(--text-dim)',marginTop:5,lineHeight:1.5}}>Each MCQ was reviewed against 11 stop criteria adapted from the NEIA scoring tool (Simms, Hensel &amp; Kumar 2026), seeing only what the student sees. <b>N/A means the rubric does not apply</b> to that format — it is not a pass. No total score is computed: the published quality bands have never been criterion-validated.</div>
        <div style={{marginTop:8,maxHeight:190,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {auditRows.map(r=>{
            const c=r.status==='FAIL'?'var(--accent-red)':r.status==='REVIEW'?'var(--accent-warm)':r.status==='PASS'?'var(--accent-green)':'var(--text-dim)';
            const mark=r.status==='FAIL'?'✕':r.status==='REVIEW'?'?':r.status==='PASS'?'✓':'–';
            return(<div key={r.key} style={{fontSize:10,fontFamily:'JetBrains Mono',lineHeight:1.6}}>
              <span style={{color:c}}>{mark} {r.label} — {r.status}{r.criterion?': '+r.criterion:''}{r.detail&&r.status!=='PASS'?': '+r.detail:''}</span>
              {(r.warns||[]).map((w,i)=><div key={i} style={{color:'var(--text-dim)',paddingLeft:14}}>⚠ {w.criterion}: {w.detail}</div>)}
            </div>);
          })}
        </div>
        {auditTotals.accuracyFails>0&&<div style={{fontSize:10.5,color:'var(--accent-red)',marginTop:8,lineHeight:1.5,paddingTop:8,borderTop:'1px solid var(--border)'}}>{auditTotals.accuracyFails} item(s) failed on <b>answer accuracy</b> and were deliberately <b>not</b> auto-repaired. This is the only criterion where the reviewer overrules a keyed answer with no reference standard, and an automated rewrite could replace a correct answer with a wrong one. Check these by hand against your source.</div>}
      </div>}

      {/* Results */}
      {caseStudy&&<div className="output-container" style={{marginTop:16}}>
        <div className="output-toolbar">
          <h3>{caseStudy.title||'Case Study'}</h3>
          <div className="output-toolbar-actions">
            <button className="btn-secondary" onClick={()=>setView('case')} style={view==='case'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>🩺 Case</button>
            <button className="btn-secondary" onClick={()=>setView('json')} style={view==='json'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>{'{ }'} JSON</button>
            <button className="btn-secondary" onClick={()=>copyText(view==='json'?JSON.stringify(caseStudy,null,2):caseMd)}>📋 Copy</button>
            <button className="btn-secondary" onClick={()=>exportAsMd(caseMd,'LATTE-Case-Study.md')}>⬇ .md</button>
            <button className="btn-secondary" onClick={()=>exportAsPdf(casePrintMd,caseStudy.title||'Case Study',caseStudy.condition||'')}>🖨 PDF</button>
          </div>
        </div>
        <div className="output-body">
          {view==='json'
            ?<pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:10.5,lineHeight:1.55,color:'var(--text)',margin:0}}>{JSON.stringify(caseStudy,null,2)}</pre>
            :<CaseRenderer caseStudy={caseStudy}/>}
        </div>
      </div>}
      </>}
    </div>
  );
}

// Renders a validated case with clickable fact tags on every datum and rationale, so each
// clinical claim traces back through the Fact Inspector to its original source.
function CaseRenderer({caseStudy:cs}){
  const [showKey,setShowKey]=useState({});
  const p=cs.patient||{};
  return <div style={{fontSize:13,lineHeight:1.6}}>
    <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:4}}>{cs.condition} · {cs.difficulty}{(p.age||p.sex)?' · '+[p.age&&p.age+' y/o',p.sex].filter(Boolean).join(' '):''}</div>
    {p.background&&<div style={{fontSize:12,color:'var(--text-dim)',marginBottom:14,fontStyle:'italic'}}>{p.background}</div>}
    {(cs.stages||[]).map((stage,si)=><div key={si} style={{marginBottom:22,paddingBottom:18,borderBottom:si<(cs.stages.length-1)?'1px solid var(--border)':'none'}}>
      <h3 style={{fontSize:14,color:'var(--accent)',marginBottom:6}}>Stage {stage.stageNumber} — {stage.title}</h3>
      {stage.narrative&&<div style={{marginBottom:10}}>{stage.narrative}</div>}

        <div style={{fontSize:9,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--text-dim)',marginBottom:6}}>Clinical data</div>

          <span><b style={{color:'var(--text-bright)'}}>{d.label}:</b> {d.value}</span>
          {(d.factIds||[]).map(id=><FactTag key={id} factId={id}/>)}
          {d.supportType&&d.supportType!=='direct'&&d.supportType!=='neutral-framing'&&<span style={{fontSize:9,color:'var(--text-dim)',fontStyle:'italic'}}>({d.supportType})</span>}
        </div>)}
      </div>}
      {(stage.questions||[]).map((q,qi)=>{
        const kOpen=showKey[stage.stageNumber+'-'+qi];
        return <div key={qi} style={{marginBottom:12,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
          <div style={{padding:'10px 12px'}}>

              <b>{o.label}.</b> {o.text}{kOpen&&(q.correctAnswers||[]).map(String).includes(String(o.label))?' ✓':''}
            </div>)}
            <button className="btn-secondary" style={{padding:'3px 10px',fontSize:10.5,marginTop:8}} onClick={()=>setShowKey(p=>({...p,[stage.stageNumber+'-'+qi]:!p[stage.stageNumber+'-'+qi]}))}>{kOpen?'Hide':'Show'} answer & rationale</button>
          </div>
          {kOpen&&<div style={{padding:'10px 12px',background:'var(--bg-input)',borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:11.5,marginBottom:6}}><b style={{color:'var(--accent-green)'}}>Answer:</b> {(q.correctAnswers||[]).join(', ')||'—'}{q.cjmmSkill?<span style={{color:'var(--text-dim)'}}>  ·  {q.cjmmSkill}</span>:''}</div>
            {(q.rationales||[]).map((r,ri)=><div key={ri} style={{fontSize:11.5,marginBottom:5,lineHeight:1.5,display:'flex',flexWrap:'wrap',gap:5,alignItems:'baseline'}}>
              <span><b>{r.option}:</b> {r.text}</span>
              {(r.factIds||[]).map(id=><FactTag key={id} factId={id}/>)}
              {r.supportType&&r.supportType!=='direct'&&r.supportType!=='neutral-framing'&&<span style={{fontSize:9,color:'var(--text-dim)',fontStyle:'italic'}}>({r.supportType})</span>}
            </div>)}
          </div>}
        </div>;
      })}
    </div>)}
    {cs.debrief&&(cs.debrief.priorityProblem||(cs.debrief.keyDecisions||[]).length||cs.debrief.notes)&&<div style={{background:'var(--bg-card-alt)',borderRadius:8,padding:'12px 14px',marginTop:6}}>

      {cs.debrief.priorityProblem&&<div style={{fontSize:12.5,marginBottom:6}}><b style={{color:'var(--text-bright)'}}>Priority problem:</b> {cs.debrief.priorityProblem}</div>}

    </div>}
  </div>;
}

// Per-tool crash isolation (v15). All six tools stay mounted to preserve state across
// tab switches; before this, any one tool's render error surfaced at the ROOT boundary
// and replaced the entire app — exactly what the v14 showUncov ReferenceError did.
class ToolBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('LATTE tool crash ('+this.props.name+')',error,info);}
  render(){
    if(!this.state.error)return this.props.children;
    return <div className="tool-panel"><div className="error-banner"><span>⚠</span><div>
      <strong>{this.props.name} hit a render error:</strong> {this.state.error?.message||String(this.state.error)}
      <div style={{marginTop:6,fontSize:11,color:'var(--text-dim)',lineHeight:1.5}}>The other tabs are unaffected — export anything you need from them. The console has the full stack trace.</div>
      <div style={{marginTop:8}}><button className="btn-secondary" onClick={()=>this.setState({error:null})}>Retry this tab</button></div>
    </div></div></div>;
  }
}

class BootErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('LATTE render error',error,info);}
  render(){if(!this.state.error)return this.props.children;return <div style={{maxWidth:720,margin:'60px auto',padding:24,color:'#fca5a5',background:'#161924',border:'1px solid #7f1d1d',borderRadius:12,fontFamily:'system-ui,sans-serif'}}><h2 style={{margin:'0 0 10px'}}>LATTE Study Suite encountered an error</h2><p style={{lineHeight:1.55}}>{this.state.error?.message||String(this.state.error)}</p><p style={{color:'#9ca3af',lineHeight:1.55}}>Reload the page after exporting any available data. Open the browser console for the technical stack trace.</p></div>;}
}

const TOOL_COMPONENTS={knowledge:KnowledgeBaseBuilder,priority:PriorityAnalyzer,anki:AnkiGenerator,nclex:NCLEXExtractor,nclexgen:NCLEXGenerator,cases:CaseStudyGenerator}; // v15: hoisted — was rebuilt on every App render

function App(){
  const [apiKey,setApiKey]=useState(()=>{try{return sessionStorage.getItem('suite_key')||'';}catch{return'';}});
  const [flashModel,setFlashModel]=useState('gemini-3.7-flash'); // v15.4: 3.7 Flash went GA 2026-08-13 — a refinement of 3.6 with markedly better complex-document handling (Google's GDP.pdf eval: 34.0% vs 22.0%), at half 3.6's launch price through 2026-12-31. Same v1beta generateContent path, same lowercase thinking levels, 64K output.
  const [proModel,setProModel]=useState('gemini-3.1-pro-preview'); // v15 note: this IS the current main Pro path — Google ships Pro as -preview only (gemini-3-pro-preview was shut down and now redirects here); re-verified 2026-08: Google shipped 3.7 Flash with still no Pro successor announced
  const [thinkingMode,setThinkingMode]=useState(false);
  // Thinking level is tracked per model family so decoupling doesn't silently change
  // anyone's defaults: Flash keeps running at low and Pro at high until changed.
  // The old single toggle couldn't express Flash+medium/high at all.
  const [flashLevel,setFlashLevel]=useState('low');
  const [proLevel,setProLevel]=useState('high');
  // Auto mode: each tool resolves its own model+level from a profile table, overriding
  // the manual Flash/Pro toggle. Opt-in and persisted, so an untouched build behaves
  // exactly as before and a customized profile survives reload.
  const [autoProfile,setAutoProfile]=useState(()=>{try{const v=localStorage.getItem('latte_auto_profile_v1');return v===null?true:v==='1';}catch{return true;}});
  // v15.7: `casesAudit` was renamed to `itemAudit`. A saved profile from v15.6 still carries
  // the old key, which would silently fall back to defaults and quietly change the model a
  // user had deliberately chosen. Migrate on read, and drop the stale key so it cannot
  // resurface later. Keep this shim — removing it re-breaks anyone who has not re-saved.
  const [profiles,setProfiles]=useState(()=>{try{const r=localStorage.getItem('latte_tool_profiles_v1');const p=r?JSON.parse(r):null;if(!p||typeof p!=='object'||Array.isArray(p))return TOOL_PROFILE_DEFAULTS;if(p.casesAudit&&!p.itemAudit){p.itemAudit=p.casesAudit;}delete p.casesAudit;return{...TOOL_PROFILE_DEFAULTS,...p};}catch{return TOOL_PROFILE_DEFAULTS;}});
  useEffect(()=>{try{localStorage.setItem('latte_auto_profile_v1',autoProfile?'1':'0');localStorage.setItem('latte_tool_profiles_v1',JSON.stringify(profiles));}catch(e){}},[autoProfile,profiles]);
  const setProfile=useCallback((id,patch)=>setProfiles(p=>({...p,[id]:{...(p[id]||TOOL_PROFILE_DEFAULTS[id]||{m:'flash',lv:'low'}),...patch}})),[]);
  const resetProfiles=useCallback(()=>setProfiles(TOOL_PROFILE_DEFAULTS),[]);
  const [activeTool,setActiveTool]=useState('knowledge');
  const [knowledgeBase,setKnowledgeBase]=useState(()=>{try{const raw=localStorage.getItem('latte_knowledge_base_v1');if(!raw)return EMPTY_LATTE_KB;return kbNormalizeImported(JSON.parse(raw)).kb;}catch{try{localStorage.removeItem('latte_knowledge_base_v1');}catch{}return EMPTY_LATTE_KB;}});
  const [persistenceStatus,setPersistenceStatus]=useState('loading');
  const [persistenceError,setPersistenceError]=useState('');
  const [showConfig,setShowConfig]=useState(true);
  // Fact Inspector: one selected fact ID drives the read-only drawer.
  const [inspectedFactId,setInspectedFactId]=useState(null);
  // Shared, session-scoped artifact registry powering the inspector's "Used in".
  const [artifactRegistry,setArtifactRegistry]=useState(EMPTY_ARTIFACT_REGISTRY);

  useEffect(()=>{try{if(apiKey)sessionStorage.setItem('suite_key',apiKey);else sessionStorage.removeItem('suite_key');}catch{}},[apiKey]);
  useEffect(()=>{let alive=true;(async()=>{try{const saved=await kbLoadPersisted();if(saved&&alive){const {kb}=kbNormalizeImported(saved);setKnowledgeBase(cur=>(cur.conditions||[]).length?cur:kb);}/* v15: functional guard — a user who imports/builds during the async load keeps their newer KB */if(alive){setPersistenceStatus('ready');setPersistenceError('');}try{localStorage.removeItem('latte_knowledge_base_v1');}catch{}}catch(e){if(alive){setPersistenceStatus('fallback');setPersistenceError('IndexedDB is unavailable. A smaller localStorage fallback will be used; export large Knowledge Bases before closing.');}}})();return()=>{alive=false;};},[]);
  useEffect(()=>{if(persistenceStatus==='loading')return;let alive=true;(async()=>{try{
    if(persistenceStatus==='fallback'){
      if((knowledgeBase.conditions||[]).length)localStorage.setItem('latte_knowledge_base_v1',JSON.stringify(knowledgeBase));else localStorage.removeItem('latte_knowledge_base_v1');
      if(alive)setPersistenceError('IndexedDB is unavailable. A smaller localStorage fallback is active; export large Knowledge Bases before closing.');
      return;
    }
    if((knowledgeBase.conditions||[]).length)await kbSavePersisted(knowledgeBase);else await kbDeletePersisted();
    if(alive){setPersistenceStatus('saved');setPersistenceError('');}
  }catch(e){
    try{if((knowledgeBase.conditions||[]).length)localStorage.setItem('latte_knowledge_base_v1',JSON.stringify(knowledgeBase));}
    catch(le){}
    if(alive){setPersistenceStatus('error');setPersistenceError('Knowledge Base persistence failed. Export the JSON before closing or refreshing this page.');}
  }})();return()=>{alive=false;};},[knowledgeBase,persistenceStatus==='loading',persistenceStatus==='fallback']);

  // cfg.thinkingLevel stays in the API for all existing consumers, derived from the
  // active model's level; setThinkingLevel routes the write to that model's level.
  // Single resolution point for "what model and thinking level does this tool use?"
  // Auto on -> the tool's profile row. Auto off -> the manual global toggle, unchanged.
  const forTool=useCallback(id=>{
    if(autoProfile){
      const p=profiles[id]||TOOL_PROFILE_DEFAULTS[id]||{m:'flash',lv:'low'};
      return{model:p.m==='pro'?proModel:flashModel,level:p.lv,family:p.m,auto:true};
    }
    return{model:thinkingMode?proModel:flashModel,level:thinkingMode?proLevel:flashLevel,family:thinkingMode?'pro':'flash',auto:false};
  },[autoProfile,profiles,proModel,flashModel,thinkingMode,proLevel,flashLevel]);

  const cfg=useMemo(()=>({apiKey,setApiKey,flashModel,setFlashModel,proModel,setProModel,thinkingMode,setThinkingMode,flashLevel,proLevel,thinkingLevel:thinkingMode?proLevel:flashLevel,setThinkingLevel:thinkingMode?setProLevel:setFlashLevel,activeModel:thinkingMode?proModel:flashModel,autoProfile,setAutoProfile,profiles,setProfile,resetProfiles,forTool,activeTool}),[apiKey,flashModel,proModel,thinkingMode,flashLevel,proLevel,autoProfile,profiles,setProfile,resetProfiles,forTool,activeTool]);

  // O(1) fact lookup, rebuilt only when the KB changes — powers FactTag and the drawer.
  const factIndex=useMemo(()=>buildFactIndex(knowledgeBase),[knowledgeBase]);
  // Merge a batch of generated artifacts into the registry (replacing any prior entries of
  // the same kind, since a fresh generation supersedes the last).
  const registerArtifact=useCallback((kind,entries,{merge=false}={})=>{
    const next=Array.isArray(entries)?entries:[];
    setArtifactRegistry(r=>({...r,[kind]:merge?mergeArtifactEntries(r[kind],next):next}));
  },[]);
  const knowledgeValue=useMemo(()=>({knowledgeBase,setKnowledgeBase,persistenceStatus,persistenceError,factIndex,artifactRegistry,registerArtifact}),[knowledgeBase,persistenceStatus,persistenceError,factIndex,artifactRegistry,registerArtifact]);
  const inspectorValue=useMemo(()=>({inspectedFactId,openFactInspector:setInspectedFactId,closeFactInspector:()=>setInspectedFactId(null)}),[inspectedFactId]);


  return(
    <ConfigCtx.Provider value={cfg}>
      <FactInspectorCtx.Provider value={inspectorValue}>
      <KnowledgeCtx.Provider value={knowledgeValue}>
      <FactInspectorDrawer/>
      <div className="suite-shell">
        {/* Nav Rail */}
        <div className="nav-rail">
          <div className="nav-logo" title="LATTE Study Suite">L</div>
          {TOOLS.map(t=>(
            <button key={t.id} className={`nav-btn ${activeTool===t.id?'active':''}`} onClick={()=>setActiveTool(t.id)} title={t.title}>
              <t.icon/>{t.label}
            </button>
          ))}
          <div className="nav-spacer"/>
          <button className={`nav-btn nav-btn-cfg ${showConfig?'active':''}`} onClick={()=>setShowConfig(s=>!s)} title="Toggle config sidebar">
            <NavIcons.gear/>Config
          </button>
        </div>

        {/* Config Sidebar */}
        {showConfig&&<ConfigSidebar/>}

        {/* Main Content */}
        <div className="main-area">
          {TOOLS.map(t=>{const C=TOOL_COMPONENTS[t.id];return <div key={t.id} style={{display:activeTool===t.id?'contents':'none'}}><ToolBoundary name={t.title}><C/></ToolBoundary></div>;})}
        </div>
      </div>
      </KnowledgeCtx.Provider>
      </FactInspectorCtx.Provider>
    </ConfigCtx.Provider>
  );
}

try{if(!window.React)throw new Error('React failed to load.');if(!window.ReactDOM)throw new Error('ReactDOM failed to load.');ReactDOM.createRoot(document.getElementById('root')).render(<BootErrorBoundary><App/></BootErrorBoundary>);window.__latteMounted=true;}catch(e){console.error(e);window.__latteBootFail?.(e.message||String(e));}
</script>
</body>
</html>
