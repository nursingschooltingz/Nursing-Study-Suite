// ── JS-side fact allocation for NCLEX generation ──
// Previously every batch resent the whole KB packet plus a carry list of used concepts
// and stems that grew each round, and duplicate avoidance was the model's job. Here the
// application picks a disjoint slice of facts per batch, so repeats are structurally
// impossible rather than prompt-suppressed, and the payload stops growing.
function ngFactRow(f,condName){
  const anchor=String(f.sourceQuote||f.text||'').replace(/\s+/g,' ').trim().split(' ').slice(0,20).join(' ');
  return `KBFACT ${f.id} | CONDITION: ${condName} | LATTE: ${f.latteBucket}${f.subtype?' / '+f.subtype:''} | TIER: ${f.tier} | ANCHOR: "${anchor.replace(/"/g,"'")}" | FACT: ${f.text} | SOURCE: ${kbSourceText(f)||'pointer unavailable'}`;
}
// Pool grouped by condition — grouping is what makes both topical spread and
// same-condition neighbour context possible.
function ngBuildFactPool(kb,{tiers=[1,2,3],conditionQuery=''}={}){
  const q=String(conditionQuery||'').trim().toLowerCase();
  const groups=[];
  for(const c of kb.conditions||[]){
    if(q&&!String(c.name||'').toLowerCase().includes(q)&&!(c.aliases||[]).some(a=>String(a).toLowerCase().includes(q)))continue;
    const facts=(c.facts||[]).filter(f=>tiers.includes(Number(f.tier)));
    if(facts.length)groups.push({condition:c.name||'—',facts});
  }
  return groups;
}
function ngPoolSize(groups){return groups.reduce((n,g)=>n+g.facts.length,0);}
// Round-robin across conditions in slices, so one batch spans several conditions with
// a few facts each. The prompt caps any single topic at ~30% of a batch, so pulling all
// targets from one condition would fight that quota.
function ngAllocateBatch(groups,usedIds,{want,perCondition=4,neighborCap=2}={}){
  const targets=[],taken=new Set();
  let progressed=true;
  while(targets.length<want&&progressed){
    progressed=false;
    for(const g of groups){
      if(targets.length>=want)break;
      let n=0;
      for(const f of g.facts){
        if(n>=perCondition||targets.length>=want)break;
        if(usedIds.has(f.id)||taken.has(f.id))continue;
        taken.add(f.id);targets.push({...f,condition:g.condition});n++;progressed=true;
      }
    }
  }
  // Same-condition neighbours for clinical realism. A good SATA or prioritization item
  // integrates several facts; targets alone can starve the model of the material that
  // makes distractors plausible. Context facts are explicitly NOT question targets.
  const context=[],ctxSeen=new Set();
  const hitConds=[...new Set(targets.map(t=>t.condition))];
  for(const cond of hitConds){
    const g=groups.find(x=>x.condition===cond);if(!g)continue;
    let n=0;
    for(const f of g.facts){
      if(n>=neighborCap)break;
      if(taken.has(f.id)||ctxSeen.has(f.id))continue;
      ctxSeen.add(f.id);context.push({...f,condition:cond});n++;
    }
  }
  return{targets,context};
}
function ngRenderAllocation(targets,context){
  const L=[];
  L.push('═══ FACTS ALLOCATED TO THIS BATCH ═══');
  L.push('The application has assigned this batch a specific, non-overlapping set of facts.');
  L.push('');
  L.push(`TARGET FACTS (${targets.length}) — every question in this batch must test one or more of these:`);
  L.push(...targets.map(f=>ngFactRow(f,f.condition)));
  if(context.length){
    L.push('');
    L.push(`SUPPORTING CONTEXT (${context.length}) — same-condition facts for clinical realism.`);
    L.push('Use these to build plausible distractors and realistic scenarios. Do NOT write a');
    L.push('question whose correct answer tests only a context fact.');
    L.push(...context.map(f=>ngFactRow(f,f.condition)));
  }
  L.push('');
  L.push('ALLOCATION RULES:');
  L.push('- Facts used by earlier batches have been withheld from this list. Duplicate questions are therefore impossible by construction; do not spend effort avoiding previously tested content.');
  L.push('- Cover as many TARGET facts as the question count allows. A single question may integrate several.');
  L.push('- Every PART 1 concept must carry its supporting fact ID in brackets, e.g. "Digoxin hold parameter [fact-42]".');
  L.push('- If the allocated facts cannot support the full question count, produce fewer questions and say so in PART 2. Never pad with outside knowledge.');
  return L.join('\n');
}
// Every fact id mentioned anywhere in a batch response. Used to diff what the model
// actually grounded against what the application handed it.
function ngParseFactIds(text){
  const s=new Set();
  for(const m of String(text||'').matchAll(/fact-\d+/gi))s.add(m[0].toLowerCase());
  return s;
}

function ngSplitParts(raw){
  const grab=(a,b)=>{const m=raw.match(new RegExp('PART\\s*'+a+'\\b[^\\n]*\\n([\\s\\S]*?)(?=PART\\s*'+b+'\\b|$)','i'));return m?m[1].trim():'';};
  const p1=grab(1,2),p2=grab(2,3),p3=grab(3,4);
  const p4m=raw.match(/PART\s*4\b[^\n]*\n([\s\S]*?)(?=DISTRIBUTION:|$)/i);
  const dm=raw.match(/DISTRIBUTION:([^\n]*)/i);
  return{p1,p2,p3,p4:p4m?p4m[1].trim():'',dist:dm?dm[1].trim():''};
}
function ngParseConcepts(p1){
  const out=[];
  for(const line of p1.split('\n')){
    const m=line.match(/^\s*(C\d+)\s*\|\s*([^|]+?)\s*\|/i);
    if(m)out.push({id:m[1].toUpperCase(),name:m[2].trim()});
  }
  return out;
}
function ngParseCited(p2){
  const ids=new Set();const re=/cites?\s*\[([^\]]+)\]/gi;let m;
  while((m=re.exec(p2))){m[1].split(/[,\s]+/).forEach(s=>{const h=s.match(/C\d+/i);if(h)ids.add(h[0].toUpperCase());});}
  return[...ids];
}
function ngSplitNumbered(text){
  if(!text)return[];
  const blocks=[];let cur=null;
  for(const line of text.split('\n')){
    const m=line.match(/^\s{0,4}(?:Q)?(\d{1,2})[.)]\s+\S/);
    const n=m?parseInt(m[1]):0;
    if(m&&n>=1&&n<=25){if(cur)blocks.push(cur);cur={num:n,lines:[line]};}
    else if(cur)cur.lines.push(line);
  }
  if(cur)blocks.push(cur);
  return blocks.map(b=>({num:b.num,text:b.lines.join('\n').replace(/\s+$/,'')}));
}
/* ── v15.7 B1c: deterministic worksheet validation ──
 * THE PROBLEM THIS CLOSES. NCLEX_GEN_PROMPT's gate runs inside the authoring call and
 * reports itself on the DISTRIBUTION line. "Never report compliance you have not verified"
 * is an unfalsifiable instruction: the only witness to the check is the thing being checked.
 * The suite had three validators and none of them covered its primary item producer.
 * Everything here is deterministic, costs no API calls, and checks the model's own claims
 * against the artifact it actually produced.
 * The KB architecture already states the governing principle — fresh attention on the same
 * chunk beats a same-call self-audit, which models rubber-stamp. This is the code half of
 * that; the audit pass (B1d) is the fresh-attention half.
 */
// Parse ONE numbered Part 3 block into a structured item. Format is fixed by the prompt:
// a stem line, then "A. text" option lines. Ordering items use "___ step" and calculation
// items end with "Answer: ____".
function ngParseItem(block){
  const raw=String(block.text||'');
  const body=raw.replace(/^(\s{0,4})(?:Q)?\d{1,2}[.)]\s+/,'');
  const lines=body.split('\n');
  const options=[];
  let stem=[];
  for(const line of lines){
    const m=line.match(/^\s*([A-Z])[.)]\s+(.*\S)\s*$/);
    if(m&&m[1]>='A'&&m[1]<='H'){options.push({label:m[1],text:m[2].trim()});continue;}
    if(!options.length)stem.push(line);
  }
  const stemText=stem.join(' ').replace(/\s+/g,' ').trim();
  const isOrdering=/^\s*_{2,}\s+\S/m.test(body);
  const isCalc=/Answer:\s*_{2,}/i.test(body);
  const isSata=/select all that apply/i.test(stemText);
  const type=isOrdering?'Ordering':isCalc?'Calculation':isSata?'SATA':options.length>=3?'MCQ':'Unknown';
  return{num:block.num,type,stem:stemText,options,raw};
}
// Parse ONE numbered Part 4 block: the keyed answer, which options got a Why line, and the
// Tags line (tier + CJMM), which is what makes the DISTRIBUTION claims checkable.
function ngParseKeyItem(block){
  const raw=String(block.text||'');
  const am=raw.match(/ANSWER:\s*([^\n]+)/i);
  const why=new Set();
  for(const m of raw.matchAll(/^\s*Why\s+([A-Z])\s+is\s+(?:correct|wrong)/gim))why.add(m[1]);
  const tagm=raw.match(/Tags:\s*([^\n]+)/i);
  const tags=tagm?tagm[1]:'';
  const tierm=tags.match(/Tier\s*([123])/i);
  const cj=(tags.match(/\|\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)\s*$/)||[])[1]||'';
  return{num:block.num,answer:am?am[1].trim():'',whyLabels:why,
    tier:tierm?Number(tierm[1]):0,cjmm:cj.trim(),raw};
}
// Pull the model's self-reported Types counts off the DISTRIBUTION line.
function ngParseDistribution(dist){
  const out={types:{},tiers:{},present:!!String(dist||'').trim()};
  const t=String(dist||'').match(/Types\s*\[([^\]]*)\]/i);
  if(t)for(const m of t[1].matchAll(/([A-Za-z]+)\s*:\s*(\d+)/g))out.types[m[1].toLowerCase()]=Number(m[2]);
  const ti=String(dist||'').match(/Tier\s*\[([^\]]*)\]/i);
  if(ti)for(const m of ti[1].matchAll(/([123])\s*:\s*(\d+)/g))out.tiers[m[1]]=Number(m[2]);
  return out;
}
// `expectedCount` is the batch size the app actually asked for — buildBatchBlock overrides
// the prompt's default of 10, so the constant 10 is NOT the contract.
function validateNCLEXWorksheet(raw,expectedCount){
  const issues=[];
  const text=String(raw||'');
  if(!text.trim()){issues.push({sev:'error',msg:'Worksheet is empty'});return issues;}
  const parts=ngSplitParts(text);
  for(const[k,label]of[['p1','PART 1'],['p2','PART 2'],['p3','PART 3'],['p4','PART 4']])
    if(!parts[k])issues.push({sev:'error',msg:`${label} is missing or empty — the prompt requires all four parts`});
  const q3=ngSplitNumbered(parts.p3).map(ngParseItem);
  const q4=ngSplitNumbered(parts.p4).map(ngParseKeyItem);
  const n=Number(expectedCount)||0;

  if(n&&q3.length!==n)issues.push({sev:'error',msg:`PART 3 has ${q3.length} numbered question(s); this batch asked for ${n}`});
  if(n&&q4.length!==n)issues.push({sev:'error',msg:`PART 4 has ${q4.length} numbered entr(y/ies); this batch asked for ${n}`});
  if(q3.length&&q4.length&&q3.length!==q4.length)
    issues.push({sev:'error',msg:`PART 3 and PART 4 disagree: ${q3.length} questions vs ${q4.length} answer entries`});

  // Truncation. A worksheet cut mid-answer-key is unusable, and the prompt explicitly says
  // to shorten the batch rather than truncate — so a short last entry is a contract breach.
  const last4=q4[q4.length-1];
  if(last4&&!/Tags:/i.test(last4.raw))
    issues.push({sev:'error',msg:`PART 4 entry ${last4.num} has no Tags line — the answer key appears truncated mid-entry`});
  if(q3.length&&!parts.dist)
    issues.push({sev:'warn',msg:'No DISTRIBUTION line — the prompt requires one after PART 4'});

  const byNum=new Map(q4.map(k=>[k.num,k]));
  for(const item of q3){
    const where=`Q${item.num}`;
    const key=byNum.get(item.num);
    if(!key){issues.push({sev:'error',msg:`${where}: no matching PART 4 answer entry`});continue;}
    if(!key.answer)issues.push({sev:'error',msg:`${where}: PART 4 entry has no ANSWER line`});
    // The prompt promises a Why line for EVERY option, correct and incorrect alike.
    for(const o of item.options)
      if(!key.whyLabels.has(o.label))
        issues.push({sev:'error',msg:`${where}: option ${o.label} has no "Why ${o.label} is…" line in PART 4`});
    if(item.type==='MCQ'&&item.options.length!==4)
      issues.push({sev:'warn',msg:`${where}: MCQ has ${item.options.length} options; the prompt specifies 4`});
    if(item.type==='SATA'&&(item.options.length<5||item.options.length>6))
      issues.push({sev:'warn',msg:`${where}: SATA has ${item.options.length} options; the prompt specifies 5-6`});
    // Model-authored text only — never the anchor quotations in the Why lines.
    neiaTerminologyScan(item.stem,`${where} stem`,issues);
    for(const o of item.options)neiaTerminologyScan(o.text,`${where} option ${o.label}`,issues);
    // MCQ-only surface heuristics, same scope rule as everywhere else.
    if(item.type==='MCQ'){
      const keyLabels=(key.answer.match(/\b([A-Z])\b/)||[])[1];
      itemHeuristics({type:'MCQ',stem:item.stem,options:item.options,
        correctAnswers:keyLabels?[keyLabels]:[]},issues,where);
    }
  }

  // THE SELF-REPORT CHECK. A DISTRIBUTION line that disagrees with the worksheet's own
  // contents means the model reported compliance it did not verify — the exact failure the
  // in-call gate cannot detect, because it is the thing being checked.
  const d=ngParseDistribution(parts.dist);
  if(d.present&&q3.length){
    const actualTypes={};
    for(const it of q3)actualTypes[it.type.toLowerCase()]=(actualTypes[it.type.toLowerCase()]||0)+1;
    const alias=k=>k==='calc'?'calculation':k;
    for(const[k,v]of Object.entries(d.types)){
      const a=actualTypes[alias(k)]||0;
      if(a!==v)issues.push({sev:'error',msg:`DISTRIBUTION claims ${v} ${k.toUpperCase()} item(s) but PART 3 contains ${a} — the worksheet does not match its own reported distribution`});
    }
    const actualTiers={};
    for(const k of q4)if(k.tier)actualTiers[k.tier]=(actualTiers[k.tier]||0)+1;
    if(Object.keys(actualTiers).length)
      for(const[k,v]of Object.entries(d.tiers)){
        const a=actualTiers[k]||0;
        if(a!==v)issues.push({sev:'error',msg:`DISTRIBUTION claims ${v} Tier ${k} item(s) but PART 4 tags show ${a}`});
      }
  }
  return issues;
}
// v15.7 B1d: worksheet items are freestanding, so the gate list is a flat map over PART 3.
// Same MCQ-only scope as the case generator — the rubric is not validated for the others.
function nclexGateItems(items){
  return (items||[]).map(it=>({num:it.num,item:it,key:'q'+it.num,
    eligible:it.type==='MCQ'&&it.options.length>=3}));

// Render a repaired item back into worksheet text. STRATEGY and TAGS are carried over
// verbatim from the original PART 4 entry rather than regenerated: they encode tier, CJMM,
// and LATTE bucket, which the DISTRIBUTION line already counts. Letting a repair rewrite
// them would silently invalidate the distribution the worksheet just asserted.
function ngRenderQuestionBlock(num,item){
  const opts=(item.options||[]).map(o=>'     '+o.label+'. '+String(o.text||'').trim()).join('\n');
  return '  '+num+'. '+String(item.stem||'').trim()+'\n\n'+opts;

function ngRenderKeyBlock(num,item,carryStrategy,carryTags){
  const L=['  '+num+'. ANSWER: '+String(item.correctLabel||'').trim()];
  for(const r of item.rationales||[]){
    const lbl=String(r.label||'').trim();
    const kind=lbl===String(item.correctLabel||'').trim()?'correct':'wrong';
    L.push('     Why '+lbl+' is '+kind+': '+String(r.text||'').trim()+(r.source?' (Source: '+r.source+')':''));

// Replace one numbered block inside a PART section. Returns null if the block cannot be
// located unambiguously — the caller then leaves the worksheet untouched. Corrupting a
// worksheet to "fix" a style finding is strictly worse than shipping the finding.
function ngSpliceBlock(sectionText,num,replacement){
  const blocks=ngSplitNumbered(sectionText);
  const target=blocks.filter(b=>b.num===num);
  if(target.length!==1)return null;
  const idx=sectionText.indexOf(target[0].text);
  if(idx<0)return null;
  return sectionText.slice(0,idx)+replacement+sectionText.slice(idx+target[0].text.length);

═══ THE FAILING ITEM ═══

${(item.options||[]).map(o=>'  '+o.label+'. '+o.text).join('\n')}

function ngRenumber(text,n){return text.replace(/^(\s{0,4})(?:Q)?\d{1,2}[.)]\s+/,'$1'+n+'. ');}

      const kbPacket=allocMode?'':kbForNCLEX(K.knowledgeBase,{tiers:kbTiers,conditionQuery:kbConditionFilter});
      if(!allocMode)fileParts.push({text:`═══ STRUCTURED LATTE KNOWLEDGE BASE ═══
Each KBFACT row is source-grounded and has a stable fact ID, LATTE bucket, tier, short source anchor, concise fact, and source pointer.

GROUNDING ADAPTER — INPUT FORM ONLY:
- Preserve the unchanged NCLEX prompt's C1, C2, C3... concept numbering in PART 1.
- In each concept name, append the supporting stable ID in brackets, for example: "Digoxin hold parameter [fact-42]".
- Copy the row's ANCHOR text into the concept inventory anchor. Do not invent or expand the quote.
- Every correct answer and every distractor rationale must trace to one or more KBFACT rows.
- The concise FACT text may clarify the anchor, but it is not permission to add outside knowledge.
- SOURCE identifies the original filename and page or slide for auditability.
- If a row lacks a recoverable verbatim anchor, use its provided ANCHOR fallback exactly and keep the cited fact ID visible.

${kbPacket}`});
      const wantPerBatch=Math.max(1,Math.round(batchSize*factsPerQ));
      if(allocMode){
        log(`✓ Fact pool ready: ${poolSize} facts across ${pool.length} condition(s).`,'ok');
        log(`Allocating ~${wantPerBatch} target facts per batch (${factsPerQ}× batch size) plus same-condition context.`,'');
        const capacity=Math.ceil(poolSize/wantPerBatch);
        if(capacity<numBatches)log(`ⓘ The pool supports about ${capacity} full batch(es) at this rate. Later batches will be smaller or skipped.`,'warn');
      }else{
        const factCount=kbPacket.split('\n').filter(Boolean).length;
        log('✓ Knowledge base ready: '+factCount+' selected facts across '+K.knowledgeBase.conditions.length+' conditions.','ok');
      }
      const usedFactIds=new Set();const allocatedAll=new Set();const citedAll=new Set();

      let produced=0;
      for(let b=1;b<=numBatches;b++){
        if(ctl.signal.aborted)break;
        const size=Math.min(batchSize,targetCount-produced);
        if(size<=0)break;
        setTrackers(p=>p.map(t=>t.id===b?{...t,status:'active'}:t));
        setLiveKB(0);
        log('── Batch '+b+'/'+numBatches+' — requesting '+size+' questions ──','warn');

        let alloc=null;
        if(allocMode){
          alloc=ngAllocateBatch(pool,usedFactIds,{want:wantPerBatch,perCondition:4,neighborCap:2});
          if(!alloc.targets.length){
            log('  ⓘ No unused facts remain — stopping early rather than repeating content.','warn');
            setTrackers(p=>p.map(t=>t.id===b?{...t,status:'pending'}:t));
            break;
          }
          // Reserve before the call: a failed batch must not silently release its facts
          // back into the pool and let a later batch duplicate it.
          alloc.targets.forEach(f=>{usedFactIds.add(f.id);allocatedAll.add(f.id);});
          log(`  Allocated ${alloc.targets.length} target fact(s) across ${[...new Set(alloc.targets.map(t=>t.condition))].length} condition(s) + ${alloc.context.length} context fact(s).`);
        }
        const groundingAdapter=allocMode?`═══ STRUCTURED LATTE FACTS ═══
Each KBFACT row is source-grounded with a stable fact ID, LATTE bucket, tier, short source anchor, concise fact, and source pointer.

GROUNDING ADAPTER — INPUT FORM ONLY:
- Preserve the unchanged NCLEX prompt's C1, C2, C3... concept numbering in PART 1.
- In each concept name, append the supporting stable ID in brackets, for example: "Digoxin hold parameter [fact-42]".
- Copy the row's ANCHOR text into the concept inventory anchor. Do not invent or expand the quote.
- Every correct answer and every distractor rationale must trace to one or more KBFACT rows.
- The concise FACT text may clarify the anchor, but it is not permission to add outside knowledge.
- SOURCE identifies the original filename and page or slide for auditability.
- If a row lacks a recoverable verbatim anchor, use its provided ANCHOR fallback exactly and keep the cited fact ID visible.

`+ngRenderAllocation(alloc.targets,alloc.context):'';
        let prompt=NCLEX_GEN_PROMPT+buildBatchBlock(b,numBatches,size)+buildFocusBlock()+(allocMode?buildCarryLite(stems):buildCarry(logged,used,stems));
        const parts=allocMode?[{text:groundingAdapter},{text:prompt}]:[...fileParts,{text:prompt}];

        let raw;
        try{raw=await callGemini(cfg.apiKey,model,parts,true,toolLevel,ctl.signal,2,t=>setLiveKB(Math.round(t.length/102.4)/10),m=>{if(m.truncated){const th=m.usage?.thoughtsTokenCount||0;log('  \u26a0 Batch '+b+' hit the 65,536-token ceiling \u2014 the answer key is likely cut short.'+(th?' Thinking used '+th.toLocaleString()+' tok of that budget.':' Try a smaller batch size.'),'err');}});}
        catch(e){
          if(e.name==='AbortError')throw e;
          log('  ⚠ Batch '+b+' failed: '+e.message,'err');
          setTrackers(p=>p.map(t=>t.id===b?{...t,status:'error'}:t));
          setProg((b/numBatches)*100);continue;
        }

        const P=ngSplitParts(raw);
        const concepts=ngParseConcepts(P.p1);
        const citedIds=ngParseCited(P.p2);
        const qs=ngSplitNumbered(P.p3);

        if(!qs.length){
          log('  ⚠ Batch '+b+': could not parse any questions from output. Raw output kept.','err');
          setTrackers(p=>p.map(t=>t.id===b?{...t,status:'error'}:t));
          results.push({n:b,raw,...P,concepts,qCount:0});
          setBatches([...results]);setProg((b/numBatches)*100);continue;
        }

        // Which concepts got used? Prefer the grounding-audit citations; fall back to stems.
        let batchUsed=concepts.filter(c=>citedIds.includes(c.id)).map(c=>c.name);
        if(!batchUsed.length){
          batchUsed=qs.map(q=>ngStem(q.text));
          log('  ⓘ Could not parse PART 2 citations — falling back to stem-based dedup.','warn');
        }

        logged=[...new Set([...logged,...concepts.map(c=>c.name)])];
        used=[...new Set([...used,...batchUsed])];
        stems=[...stems,...qs.map(q=>ngStem(q.text))];
        let batchCited=0;
        if(allocMode&&alloc){
          // v15: count citations from Parts 3+4 only. The adapter REQUIRES every
          // allocated fact to be logged in PART 1, so scanning the whole response made
          // the coverage metric ~always 100% regardless of the actual questions.
          const mentioned=ngParseFactIds((P.p3||'')+'\n'+(P.p4||''));
          const allocIds=new Set(alloc.targets.map(f=>f.id));
          for(const id of mentioned)if(allocIds.has(id)){citedAll.add(id);batchCited++;}
          const missed=alloc.targets.length-batchCited;
          log(`  Coverage: ${batchCited}/${alloc.targets.length} allocated fact(s) cited${missed>0?` — ${missed} not referenced`:''}.`,missed>0?'warn':'ok');
        }

        // ── v15.7 B1c/B1d: deterministic validation, then an independent audit ──
        // The in-call gate on the DISTRIBUTION line is self-reported and unfalsifiable.
        // These two passes are the external witness: code first (free, catches the
        // self-report gap), then fresh attention on each MCQ (costs a call per item).
        let workRaw=raw;
        let wsIssues=validateNCLEXWorksheet(workRaw,size);
        let wsErr=wsIssues.filter(x=>x.sev==='error').length;
        log('  Worksheet check: '+wsErr+' error(s), '+(wsIssues.length-wsErr)+' warning(s).',wsErr?'err':'ok');
        for(const x of wsIssues.filter(x=>x.sev==='error').slice(0,6))log('    ✕ '+x.msg,'err');
        let auditRows=[];
        if(runAudit&&!wsErr){
          const {model:aModel,level:aLevel}=cfg.forTool('itemAudit');
          const parsedItems=ngSplitNumbered(ngSplitParts(workRaw).p3).map(ngParseItem);
          const keyItems=new Map(ngSplitNumbered(ngSplitParts(workRaw).p4).map(k=>[k.num,ngParseKeyItem(k)]));
          const gate=nclexGateItems(parsedItems);
          const eligible=gate.filter(g=>g.eligible);
          const naCount=gate.length-eligible.length;
          if(!eligible.length){
            log('  Audit skipped for this batch: no single-best-answer MCQ items ('+naCount+' N/A).','warn');
          }else{
            log('  Auditing '+eligible.length+' MCQ item(s) · '+aModel+' [Thinking: '+aLevel+']'+(naCount?' · '+naCount+' N/A (rubric is MCQ-only)':''),'warn');
            let adone=0,quotaFails=0;
            try{
            auditRows=await itemRunPool(eligible,AUDIT_POOL_WIDTH,async(g)=>{
              const k=keyItems.get(g.num);
              const q={type:'MCQ',stem:g.item.stem,options:g.item.options,
                correctAnswers:[(String(k&&k.answer||'').match(/\b([A-Z])\b/)||[])[1]||''].filter(Boolean)};
              let v;
              try{
                const out=await callGemini(cfg.apiKey,aModel,[{text:itemBuildAuditPrompt(itemAuditPayload('',q))}],true,aLevel,ctl.signal,AUDIT_RETRIES);
                v=itemParseAuditVerdict(out);
              }catch(e){
                if(e.name==='AbortError')throw e;
                // v15.7: stop after two quota failures rather than grinding through every
                // remaining item. geminiRequest already backed off and retried; a further
                // 429 means the allowance is gone and each attempt costs real time.
                if(isQuotaError(e)&&++quotaFails>=2)throw Object.assign(new Error('API quota exhausted'),{name:'QuotaStop'});
                v={status:'ERROR',criterion:'',detail:e.message||String(e),warns:[],autoRepairable:false};
              }
              adone++;
              log('    '+(v.status==='PASS'?'✓':v.status==='FAIL'?'✗':v.status==='REVIEW'?'?':'!')+' Q'+g.num+' '+v.status+(v.criterion?' — '+v.criterion:'')+'  ('+adone+'/'+eligible.length+')',
                v.status==='FAIL'?'err':v.status==='PASS'?'ok':'warn');
              for(const w of v.warns||[])log('      ⓘ Q'+g.num+' WARN '+w.criterion+': '+w.detail,'warn');
              return{...g,...v};
            },ctl.signal);
            }catch(e){
              if(e.name!=='QuotaStop')throw e;
              auditRows=(auditRows||[]).filter(Boolean);
              log('  ⚠ Audit stopped early — your Gemini API quota is exhausted. The worksheet itself is complete and still passed its structural checks; only the optional item review was cut short. Wait for your quota to reset, switch the "Item quality · audit" profile to Flash, or turn the audit off.','err');
            }

            const fails=auditRows.filter(r=>r.status==='FAIL');
            const accuracy=fails.filter(r=>!r.autoRepairable);
            for(const r of accuracy)
              log('    ⚠ Q'+r.num+' failed on answer accuracy — NOT auto-repaired. The key here is the model\'s own and there is no reference standard; check it yourself.','err');
            const repairable=fails.filter(r=>r.autoRepairable);
            if(repairable.length){
              log('  Repairing '+repairable.length+' item(s), one round, no re-audit...','warn');
              const {model:gModel,level:gLevel}=cfg.forTool('nclexgen');
              await itemRunPool(repairable,AUDIT_POOL_WIDTH,async(r)=>{
                try{
                  const k=keyItems.get(r.num);
                  const keyRaw=k?k.raw:'';
                  const out=await callGemini(cfg.apiKey,gModel,[{text:ngBuildRepairPrompt({item:r.item,criterion:r.criterion,keyBlock:keyRaw})}],true,gLevel,ctl.signal,1,null,null,{responseMimeType:'application/json'});
                  const fixed=extractJSON(out);
                  if(!fixed||!fixed.stem||!Array.isArray(fixed.options)||!fixed.options.length)throw new Error('repair returned no usable item');
                  const strat=(keyRaw.match(/^\s*Strategy:[^\n]*$/m)||[])[0]||'';
                  const tags=(keyRaw.match(/^\s*Tags:[^\n]*$/m)||[])[0]||'';
                  const parts=ngSplitParts(workRaw);
                  const newP3=ngSpliceBlock(parts.p3,r.num,ngRenderQuestionBlock(r.num,fixed));
                  const newP4=ngSpliceBlock(parts.p4,r.num,ngRenderKeyBlock(r.num,fixed,strat,tags));
                  if(newP3===null||newP4===null)throw new Error('could not locate the item unambiguously — worksheet left untouched');
                  workRaw=workRaw.replace(parts.p3,newP3).replace(parts.p4,newP4);
                  log('    ✓ Q'+r.num+' repaired'+(fixed.repairNote?' — '+fixed.repairNote:''),'ok');
                }catch(e){
                  if(e.name==='AbortError')throw e;
                  log('    ✗ Q'+r.num+' repair failed: '+(e.message||e)+' (original kept)','err');
                }
              },ctl.signal);
              // Re-run the deterministic pass over the spliced worksheet. Repaired items are
              // deliberately NOT re-audited: one round, and anything still failing surfaces.
              wsIssues=validateNCLEXWorksheet(workRaw,size);
              wsErr=wsIssues.filter(x=>x.sev==='error').length;
              log('  Re-checked after repair: '+wsErr+' error(s), '+(wsIssues.length-wsErr)+' warning(s).',wsErr?'err':'ok');
            }
          }
        }else if(runAudit&&wsErr){
          log('  Audit skipped for this batch: fix the '+wsErr+' structural error(s) first — auditing a broken worksheet spends quota to grade a known failure.','warn');
        }

        const RP=ngSplitParts(workRaw);
        results.push({n:b,raw:workRaw,...RP,concepts,qCount:qs.length,factIds:[...ngParseFactIds(workRaw)],
          wsIssues,auditRows:auditRows.map(r=>({num:r.num,status:r.status,criterion:r.criterion,detail:r.detail,warns:r.warns||[]}))});
        setBatches([...results]);
        produced+=qs.length;
        setTrackers(p=>p.map(t=>t.id===b?{...t,status:'done',q:qs.length}:t));

        log('  ✓ '+qs.length+' questions · '+concepts.length+' concepts logged ('+logged.length+' cumulative) · '+batchUsed.length+' used','ok');
        if(P.dist)log('    '+P.dist);
        if(qs.length<size)log('  ⓘ Batch returned '+qs.length+' of '+size+' requested — likely ran out of unused grounded concepts.','warn');

        setProg((b/numBatches)*100);
        if(b<numBatches&&!ctl.signal.aborted)await new Promise(r=>setTimeout(r,900));
      }
      if(allocMode){
        const uncovered=[...allocatedAll].filter(id=>!citedAll.has(id));
        const byId=new Map();for(const g of pool)for(const f of g.facts)byId.set(f.id,{...f,condition:g.condition});
        setCoverage({allocated:allocatedAll.size,cited:citedAll.size,poolSize,
          uncovered:uncovered.map(id=>byId.get(id)).filter(Boolean),
          unallocated:poolSize-allocatedAll.size});
        log(`Fact coverage: ${citedAll.size}/${allocatedAll.size} allocated fact(s) cited · ${poolSize-allocatedAll.size} of ${poolSize} pool fact(s) never allocated.`,uncovered.length?'warn':'ok');
      }
      if(K.registerArtifact)K.registerArtifact('nclexQuestions',results.filter(r=>r.qCount>0).map(r=>({id:'batch-'+r.n,factIds:r.factIds||[],label:'NCLEX batch '+r.n+' ('+r.qCount+' question'+(r.qCount===1?'':'s')+')'})));
      log('✅ Done — '+produced+' questions across '+results.filter(r=>r.qCount>0).length+' batches. '+logged.length+' unique concepts logged.','ok');
      if(produced<targetCount)log('ⓘ Produced fewer than the '+targetCount+' target. The source may not support more non-duplicate questions.','warn');
    }catch(e){
      if(e.name==='AbortError')log('Cancelled.','warn');else log('Error: '+e.message,'err');
    }finally{setBusy(false);setAbortCtl(null);setProg(100);setLiveKB(0);}
  },[cfg,targetCount,batchSize,numBatches,outcomes,points,focusContext,K.knowledgeBase,kbTiers,kbConditionFilter,log,allocMode,factsPerQ,runAudit]);

  // ── Assemble worksheet (renumbered across batches) ──
  const ws=useMemo(()=>{
    let n=1;const qs=[],ks=[];
    for(const b of batches){
      const bq=ngSplitNumbered(b.p3),bk=ngSplitNumbered(b.p4);
      for(const q of bq){
        const k=bk.find(x=>x.num===q.num);
        qs.push(ngRenumber(q.text,n));
        ks.push(k?ngRenumber(k.text,n):n+'. ANSWER: [not parsed — see Raw view]');
        n++;
      }
    }
    return{questions:qs,answers:ks,count:n-1};
  },[batches]);

  const wsMd=useMemo(()=>{
    if(!ws.count)return'';
    return'# NCLEX Practice Questions\n\n**'+ws.count+' questions** generated from source material.\n\n---\n\n## Questions\n\n'
      +ws.questions.join('\n\n')+'\n\n<div class="pagebreak"></div>\n\n## Answer Key\n\n'+ws.answers.join('\n\n');
  },[ws]);

  // v15.7: the audit trail now carries the deterministic worksheet findings, the per-item
  // audit verdicts, and the provenance stamp. The printable worksheet stays clean.
  const workMd=useMemo(()=>(provenance?latteProvenanceStamp(provenance):'')+batches.map(b=>{
    const wi=b.wsIssues||[],ar=b.auditRows||[];
    const errs=wi.filter(x=>x.sev==='error');
    let s='## Batch '+b.n+'\n\n### Concept Inventory\n\n'+(b.p1||'(none)')+'\n\n### Selection & Audit\n\n'+(b.p2||'(none)')+(b.dist?'\n\n### Distribution\n'+b.dist:'');
    if(wi.length){
      s+='\n\n### Worksheet checks (deterministic)\n\n'+errs.length+' error(s), '+(wi.length-errs.length)+' warning(s)\n\n'
        +wi.map(x=>'- '+(x.sev==='error'?'**ERROR**':'warn')+': '+x.msg).join('\n');
    }
    if(ar.length){
      s+='\n\n### Item quality audit\n\n'
        +ar.map(r=>'- Q'+r.num+': **'+r.status+'**'+(r.criterion?' — '+r.criterion:'')+(r.detail&&r.status!=='PASS'?' — '+r.detail:'')
          +(r.warns||[]).map(w=>'\n    - warn '+w.criterion+': '+w.detail).join('')).join('\n');
      s+='\n\nN/A means the rubric does not apply to that format — it is not a pass. No total score is computed.';
    }
    return s;
  }).join('\n\n---\n\n'),[batches,provenance]);

  const totalConcepts=useMemo(()=>new Set(batches.flatMap(b=>b.concepts.map(c=>c.name))).size,[batches]);
  const canRun=cfg.apiKey&&(K.knowledgeBase.conditions||[]).length&&!busy;

  return(
    <div className="tool-panel">
      <div className="tool-header">
        <h2 className="tool-title">✍️ NCLEX Question Generator</h2>
        <p className="tool-desc">Generate original NCLEX-style questions from the shared LATTE Knowledge Base. Batched with carried-forward dedup so nothing repeats.</p>
      </div>

      <div className="tip-banner">Uses the shared, source-cited LATTE facts while preserving the existing NCLEX item-writing prompt, batching, grounding audit, distractor rules, and deduplication safeguards.</div>
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:14,marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:9}}>Knowledge Base Scope</div>
        <div className="field-block" style={{marginBottom:10}}><label>Condition filter <span className="badge-opt">optional</span></label><input type="text" value={kbConditionFilter} onChange={e=>setKbConditionFilter(e.target.value)} placeholder="e.g. heart failure — blank uses all conditions"/></div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--text-dim)',marginRight:3}}>Include tiers:</span>
          {[1,2,3].map(t=><button key={t} type="button" className={'tier-btn t'+t+(kbTiers.includes(t)?' active':'')} onClick={()=>setKbTiers(p=>p.includes(t)?(p.length>1?p.filter(x=>x!==t):p):[...p,t].sort())}><b>Tier {t}</b></button>)}
        </div>
        <div style={{fontSize:10.5,color:'var(--text-dim)',marginTop:9,lineHeight:1.5}}>Tier 1–3 are included by default. Narrowing scope can improve depth, but excluding lower tiers may reduce distractor variety and concept inventory size.</div>
      </div>

      {/* Batch settings */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Batch Settings</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:10}}>
          <div className="field-block" style={{margin:0}}><label>Total Questions</label>
            <input type="number" min={5} max={200} step={5} value={targetCount} onChange={e=>setTargetCount(Math.max(5,parseInt(e.target.value)||50))}/></div>
          <div className="field-block" style={{margin:0}}><label>Questions per Batch</label>
            <select value={batchSize} onChange={e=>setBatchSize(parseInt(e.target.value))}>
              <option value={5}>5 — highest accuracy</option>
              <option value={10}>10 — recommended</option>
              <option value={15}>15 — faster, more drift</option>
            </select></div>
        </div>
        <div style={{fontSize:10,color:'var(--text-dim)',lineHeight:1.5,padding:10,background:'var(--bg-input)',borderRadius:6,border:'1px solid var(--border)'}}>
          <b style={{color:'var(--accent)'}}>{numBatches} API call{numBatches!==1?'s':''}</b> of {batchSize} questions each.{' '}
          {allocMode
            ?<>Each batch receives its own <b style={{color:'var(--text)'}}>disjoint slice of facts</b>, so duplicates are impossible by construction and the payload does not grow across batches.</>
            :<>Each batch receives the full Knowledge Base plus a growing list of concepts already logged and already tested, so it must find <b style={{color:'var(--text)'}}>new</b> material each time.</>}
        </div>
        <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:12,color:'var(--text)',cursor:'pointer',marginTop:10}}>
          <input type="checkbox" checked={allocMode} onChange={e=>setAllocMode(e.target.checked)} style={{accentColor:'var(--accent)',marginTop:2}}/>
          <span>Fact allocation <span className="badge-opt">recommended</span>
            <div style={{fontSize:10,color:'var(--text-dim)',marginTop:2,lineHeight:1.5}}>The app picks each batch's facts instead of resending the whole Knowledge Base and asking the model to avoid repeats. Cuts tokens sharply and makes duplicates structurally impossible. Turn off to compare against the original behaviour.</div>
          </span>
        </label>
        {/* v15.7 B1d: the worksheet's own quality gate is self-reported. This is the
            external check — free structural validation always, plus an optional
            independent review of each MCQ. */}
        <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:12,color:'var(--text)',cursor:'pointer',marginTop:10}}>
          <input type="checkbox" checked={runAudit} onChange={e=>setRunAudit(e.target.checked)} style={{accentColor:'var(--accent)',marginTop:2}}/>
          <span>Independent item audit
            <div style={{fontSize:10,color:'var(--text-dim)',marginTop:2,lineHeight:1.5}}>Every worksheet is structurally validated in code for free — question/answer counts, a rationale per option, truncation, and whether the DISTRIBUTION line matches what was actually produced. This adds a second review pass over each single-best-answer MCQ against 11 stop criteria, in a fresh call that never sees the source facts. <b style={{color:'var(--text)'}}>Costs one extra API call per MCQ</b> ({batchSize} per batch at most), so a run takes materially longer. Failed items are rewritten once, except answer-accuracy failures, which are surfaced for you instead.</div>
          </span>
        </label>
        {allocMode&&<div className="field-block" style={{marginTop:10,marginBottom:0}}>
          <label style={{fontSize:11}}>Target facts per question</label>
          <input type="number" min={1} max={8} step={1} value={factsPerQ} onChange={e=>setFactsPerQ(Math.max(1,Math.min(8,Number(e.target.value)||3)))} style={{width:90}}/>
          <div style={{fontSize:9.5,color:'var(--text-dim)',marginTop:3}}>{Math.max(1,Math.round(batchSize*factsPerQ))} target facts per batch, plus same-condition context facts for realistic distractors. Higher = more material per question; lower = deeper coverage of a small pool.</div>
        </div>}
      </div>

      {/* Focus context */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:4}}>Focus Context <span style={{color:'var(--text-dim)',fontWeight:400,textTransform:'none',letterSpacing:0}}>— optional, steers question selection</span></div>
        <div className="field-block"><label>Outcomes</label>
          <textarea rows={3} value={outcomes} onChange={e=>setOutcomes(e.target.value)} placeholder={"1. Describe nursing care for the burn patient across all phases\n2. Identify infection control precautions for integumentary disorders"}/></div>
        <div className="field-block"><label>Points</label>
          <textarea rows={3} value={points} onChange={e=>setPoints(e.target.value)} placeholder={"• Parkland formula\n• Herpes zoster staffing restrictions\n• ABCDs of melanoma screening"}/></div>
        <div className="field-block" style={{marginBottom:0}}><label>Additional Context</label>
          <textarea rows={2} value={focusContext} onChange={e=>setFocusContext(e.target.value)} placeholder="e.g. 'This is a LATTE study guide' or 'Exam is 50 questions, heavy on burns'"/></div>
      </div>

      <button className="btn-primary" style={{width:'100%'}} disabled={!canRun} onClick={run}>
        {busy?'⟳ Generating...':!cfg.apiKey?'Enter API Key':!(K.knowledgeBase.conditions||[]).length?'Build Knowledge Base':'▶ Generate '+targetCount+' Questions ('+numBatches+' batch'+(numBatches!==1?'es':'')+')'}
      </button>

      {/* Progress */}
      {(busy||trackers.length>0)&&<div style={{marginTop:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <h3 style={{fontSize:12,fontWeight:600,color:'var(--text-bright)'}}>{busy?'Generating...':'Complete'}</h3>
          <span style={{fontSize:11,fontFamily:'JetBrains Mono',color:'var(--text-dim)'}}>{Math.round(prog)}%</span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:prog+'%'}}/></div>
        {liveKB>0&&<div style={{fontSize:10,color:'var(--accent-cyan)',fontFamily:'JetBrains Mono',marginTop:4}}>▼ receiving {liveKB} KB</div>}
        <div style={{marginTop:8}}>{trackers.map(t=>
          <div className="chunk-item" key={t.id}>
            <div className={'chunk-dot '+t.status}>{t.status==='done'?'✓':t.status==='error'?'!':''}</div>
            <span style={{flex:1,fontWeight:500}}>{t.name}</span>
            {t.q>0&&<span style={{fontFamily:'JetBrains Mono',fontSize:9,color:'var(--accent-green)'}}>{t.q} Q</span>}
            <span style={{fontFamily:'JetBrains Mono',fontSize:9,color:'var(--text-dim)',textTransform:'uppercase'}}>{t.status}</span>
          </div>)}</div>
        {busy&&<button className="btn-danger" style={{width:'100%',marginTop:10}} onClick={()=>abortCtl?.abort()}>Cancel</button>}
      </div>}

      {/* Logs */}
      {logs.length>0&&<div style={{marginTop:12,maxHeight:150,overflowY:'auto',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:10,fontFamily:'JetBrains Mono',fontSize:10,lineHeight:1.6}}>
        {logs.map((l,i)=><div key={i} style={{color:l.t==='err'?'var(--accent-red)':l.t==='ok'?'var(--accent-green)':l.t==='warn'?'var(--accent-warm)':'var(--text-dim)'}}>{l.msg}</div>)}
      </div>}

      {/* Fact coverage — verified in code, same pattern as the Anki tab */}
      {coverage&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(coverage.uncovered.length?'rgba(240,168,58,.35)':'rgba(52,211,153,.3)'),background:coverage.uncovered.length?'rgba(240,168,58,.06)':'rgba(52,211,153,.05)'}}>

          <span style={{fontSize:12,fontWeight:600,color:coverage.uncovered.length?'var(--accent-warm)':'var(--accent-green)'}}>
            {coverage.uncovered.length?'\u2691':'\u2713'} Fact coverage: {coverage.cited}/{coverage.allocated} allocated fact(s) cited
            {coverage.unallocated>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> \u00b7 {coverage.unallocated} of {coverage.poolSize} pool fact(s) never allocated</span>}
          </span>
          {coverage.uncovered.length>0&&<button className="btn-secondary" style={{padding:'3px 10px',fontSize:11}} onClick={()=>setShowUncov(s=>!s)}>{showUncov?'Hide':'Show'} {coverage.uncovered.length}</button>}
        </div>
        <div style={{fontSize:9.5,color:'var(--text-dim)',marginTop:5}}>Fact IDs handed to the model, diffed in code against the IDs it actually cited. Unallocated facts stay available \u2014 raise the total question count to reach them.</div>
        {showUncov&&coverage.uncovered.length>0&&<div style={{marginTop:8,maxHeight:180,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {coverage.uncovered.map(f=><div key={f.id} style={{fontSize:10.5,fontFamily:'JetBrains Mono',lineHeight:1.5,marginBottom:4,color:'var(--text-dim)',display:'flex',gap:6,alignItems:'baseline',flexWrap:'wrap'}}><FactTag factId={f.id}/><span>{f.condition} \u00b7 T{f.tier} \u00b7 {f.latteBucket} \u2014 {f.text}</span></div>)}
        </div>}
      </div>}

      {/* Results */}
      {ws.count>0&&<div className="output-container" style={{marginTop:16}}>
        <div className="output-toolbar">
          <h3>{ws.count} Questions · {totalConcepts} concepts</h3>
          <div className="output-toolbar-actions">
            <button className={'btn-secondary'+(view==='worksheet'?' active':'')} onClick={()=>setView('worksheet')} style={view==='worksheet'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>📝 Worksheet</button>
            <button className={'btn-secondary'+(view==='working'?' active':'')} onClick={()=>setView('working')} style={view==='working'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>🔍 Audit Trail</button>
            <button className="btn-secondary" onClick={()=>copyText(view==='worksheet'?wsMd:workMd)}>📋 Copy</button>
            <button className="btn-secondary" onClick={()=>exportAsMd(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX-Practice-Questions.md':'NCLEX-Audit-Trail.md')}>⬇ .md</button>
            <button className="btn-secondary" onClick={()=>exportAsTxt(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX-Practice-Questions.txt':'NCLEX-Audit-Trail.txt')}>⬇ .txt</button>
            <button className="btn-secondary" onClick={()=>exportAsPdf(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX Practice Questions':'NCLEX Audit Trail',ws.count+' questions')}>🖨 PDF</button>
          </div>
        </div>
        <div className="output-body">
          {view==='worksheet'?<>
            <h2 style={{fontFamily:'DM Sans',fontSize:18,color:'var(--text-bright)',marginBottom:12}}>Questions</h2>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.7,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{ws.questions.join('\n\n')}</pre>
            <hr style={{margin:'28px 0',border:'none',borderTop:'1px solid var(--border)'}}/>
            <h2 style={{fontFamily:'DM Sans',fontSize:18,color:'var(--text-bright)',marginBottom:12}}>Answer Key</h2>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.7,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{ws.answers.join('\n\n')}</pre>
          </>:<>
            <div style={{fontSize:11,color:'var(--text-dim)',marginBottom:12,padding:10,background:'var(--bg-input)',borderRadius:6,border:'1px solid var(--border)'}}>
              The model's working: every concept it logged with its verbatim source anchor, and its grounding audit. Spot-check a few anchors against your PDF — if they're real quotes, the questions are grounded.
            </div>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:11,lineHeight:1.6,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{workMd}</pre>
          </>}
        </div>
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// TOOL: Clinical Case Study Generator
// A Knowledge Base consumer, like the NCLEX Generator. It never re-reads source
// PDFs: it selects a grounded fact packet from the shared KB, asks the model for a
// strict JSON unfolding case, then validates every datum, answer, and rationale
// against real fact IDs in code before rendering.
// ══════════════════════════════════════════════════════════════════════════

// ── Balanced fact selector ──
// Chat's correction: a naive .slice(0,N) per bucket can silently drop the later
// emergency finding, the hold parameter, or the only diagnostic value a stage needs.
// So: filter by allowed tiers, sort each bucket safety-critical-then-tier-first (so the
// slice keeps the highest-yield facts), and additionally guarantee numeric facts survive
// when calculation questions are requested. Dedups by id at the end.
function selectCaseFacts(condition,{includeTier2=true,includeTier3=false,includeCalculation=true,includeEducation=true}={}){
  const eligible=(condition.facts||[]).filter(f=>
    Number(f.tier)===1||(includeTier2&&Number(f.tier)===2)||(includeTier3&&Number(f.tier)===3));
  const byBucket=eligible.reduce((groups,f)=>{const b=f.latteBucket||'Other';(groups[b]||(groups[b]=[])).push(f);return groups;},{});
  for(const facts of Object.values(byBucket))
    facts.sort((a,b)=>Number(b.safetyCritical)-Number(a.safetyCritical)||Number(a.tier)-Number(b.tier));
  const selected=[
    ...(byBucket.BriefPatho||[]).slice(0,3),
    ...(byBucket.Look||[]).slice(0,10),
    ...(byBucket.Assess||[]).slice(0,8),
    ...(byBucket.Tests||[]).slice(0,8),
    ...(byBucket.Treatments||[]).slice(0,10),
    ...(includeEducation?(byBucket.Educate||[]).slice(0,6):[]),
  ];
  if(includeCalculation){
    const numeric=eligible.filter(f=>/\d/.test(`${f.text||''} ${f.sourceQuote||''}`));
    for(const f of numeric.slice(0,4))if(!selected.some(x=>x.id===f.id))selected.push(f);
  }
  return[...new Map(selected.map(f=>[f.id,f])).values()];
}

// Sufficiency check: warn (in code, before generating) when a condition lacks enough
// grounded material for a stage, so the model is never tempted to invent it.
function caseFactSufficiency(facts){
  const byBucket={};for(const f of facts){const b=f.latteBucket||'Other';byBucket[b]=(byBucket[b]||0)+1;}
  const warnings=[];
  if(!(byBucket.Tests>0))warnings.push('No source-grounded diagnostic values — diagnostic-stage questions will be limited.');
  if(!(byBucket.Treatments>0))warnings.push('No source-grounded treatments — intervention-stage questions will be limited.');
  if(!(byBucket.Look>0)&&!(byBucket.Assess>0))warnings.push('No presenting findings or assessments — the initial-presentation stage will be thin.');
  if(facts.length<8)warnings.push(`Only ${facts.length} facts available for this condition. Consider including Tier 2/3 or picking a richer condition.`);
  return{byBucket,warnings};
}

// Render the selected facts as a grounded packet the model can cite by ID.
function caseRenderFactPacket(conditionName,facts){
  const L=['CASE SOURCE PACKET','CONDITION: '+conditionName,''];
  for(const f of facts){
    const anchor=String(f.sourceQuote||f.text||'').replace(/\s+/g,' ').trim().split(' ').slice(0,20).join(' ');
    L.push('FACT '+f.id);
    L.push('LATTE: '+f.latteBucket+(f.subtype?' / '+f.subtype:''));
    L.push('TIER: '+f.tier+(f.safetyCritical?' (safety-critical)':''));
    L.push('FACT: '+f.text);
    L.push('ANCHOR: "'+anchor.replace(/"/g,"'")+'"');
    L.push('SOURCE: '+(kbSourceText(f)||'pointer unavailable'));
    L.push('');
  }
  return L.join('\n');
}

// ── v15.6 item 5: operationalized difficulty ──
// [LATTE-HEURISTIC]. Before this, `Difficulty: ${difficulty}` was interpolated bare and the
// three levels had no behavioral contract at all.
// NEIA's Difficulty subcategory carries NO stop criterion — its note reads only "A range of
// difficulty levels recommended for nursing school examinations". Stem Relevance DOES stop.
// That asymmetry is the whole design: hard is permitted, out-of-scope is fatal, so the
// ceiling is the governing constraint at every level and is emitted with every level.
// The STRUCTURAL SIGNATURE lines mirror what caseDifficultySignals() checks in code. The
// model is told the contract because a signature it cannot see is one it cannot satisfy.
function caseDifficultyBlock(difficulty){
  const LEVELS={
    foundational:{
      cog:'direct cue recognition and straightforward application of a single fact',
      dis:'plausible but separable — a prepared student can rule each one out',
      sig:'none — no structural minimum is enforced at this level',
    },
    exam:{
      cog:'integrate at least TWO revealed cues, then prioritize among plausible actions',
      dis:'all options clinically plausible, several initially reasonable',
      sig:'at least one "Analyze Cues" question, at least one "Take Action" question, and at\n  least one question whose rationales cite two or more distinct facts that were each\n  presented as revealed case data',
    },
    advanced:{
      cog:'competing priorities, trend interpretation across stages, and reassessment after an intervention',
      dis:'multiple defensible actions, one clearly best only after integrating every revealed cue',
      sig:'at least one "Prioritize Hypotheses" AND one "Evaluate Outcomes" question; at least\n  one question in stage 3 or later whose rationales cite revealed data first presented in\n  TWO DIFFERENT earlier stages; and at least one MCQ where most distractors trace to\n  Tier 1-2 or safety-critical facts (actions correct at some other moment)',
    },
  };
  const L=LEVELS[String(difficulty||'').toLowerCase()]||LEVELS.exam;
  return `DIFFICULTY: ${difficulty}
DIFFICULTY CEILING (all levels): difficulty must stay within the knowledge, judgment, and
scope expected of a new graduate nurse. Increase difficulty through cue integration,
competing priorities, temporal change, and near-miss options — never through specialty
trivia, obscure facts, convoluted language, or content outside entry-level practice.
An item whose stem requires knowledge outside a new graduate's role is disqualified
regardless of how well it is written.
  Cognitive construction: ${L.cog}.
  Distractor construction: ${L.dis}.
  STRUCTURAL SIGNATURE (checked in code): ${L.sig}.`;
}

// ── Strict case-generation prompt ──
// Uses JSON output (deterministically validatable) + the shared NCLEX quality rules +
// a hard SOURCE BOUNDARY that lists exactly what may and may not be invented, plus the
// supportType vocabulary so combined/inference statements are labelled honestly rather
// than passed off as direct quotes.
function caseBuildPrompt({conditionName,facts,difficulty,stages,questionsPerStage,includeTypes}){
  const typeList=[];
  if(includeTypes.mcq)typeList.push('MCQ (single best answer, 4 options A-D)');
  if(includeTypes.sata)typeList.push('SATA — "(Select all that apply)" at the start of the stem, 5-6 options, 2-4 correct');
  if(includeTypes.prioritization)typeList.push('Prioritization (which action/finding comes first)');
  if(includeTypes.ordering)typeList.push('Ordered response — randomized steps to sequence (never list in correct order)');
  if(includeTypes.calculation)typeList.push('Calculation — only when the supplied facts contain the needed numbers; show the required unit');
  if(includeTypes.education)typeList.push('Client education (which teaching point is correct / indicates understanding)');
  return `═══ CLINICAL CASE STUDY GENERATOR (strict, source-grounded, JSON output) ═══

ROLE: You are a nursing clinical-judgment case author with expertise in the NCSBN Clinical
Judgment Measurement Model (CJMM). You build UNFOLDING patient cases that test reasoning across
stages, using ONLY the supplied Knowledge Base facts.

Return ONLY a single valid JSON object. No markdown fence, no preamble, no commentary.

═══ SOURCE BOUNDARY (the most important rule) ═══
You may invent ONLY neutral narrative details that do NOT affect clinical reasoning:
time of day, room number, whether a family member is present, the client's first name.
You may NOT invent any of the following — every one must trace to a supplied fact ID:
  diagnoses · comorbidities · allergies · home medications · medication doses ·
  laboratory or vital-sign values · assessment findings · procedures · provider orders ·
  contraindications · treatment responses · discharge restrictions · complications.
A client age and sex may be chosen freely ONLY if they do not change the clinical reasoning
(e.g. do not invent "72-year-old with CKD" unless CKD is a supplied fact).
Laboratory and vital-sign values must trace to a supplied fact EITHER verbatim OR as a
bounded instantiation of a threshold that fact states — see supportType "instantiated"
below. Presenting a concrete value rather than restating the rule is preferred, because a
stem that quotes the decision rule hands the student the answer.

TERMINOLOGY: use NCSBN Test Plan vocabulary in all learner-facing text — client (not
patient), prescription for medications and order for other interventions, primary health
care provider (not doctor/physician), UAP. Never use q.d., QOD, IU, a bare U for unit, a
trailing zero (5.0 mg), or a decimal without a leading zero (.5 mg).
This applies to text YOU write. Quoted source material keeps its own wording — never
reword a verbatim quote to satisfy this rule.
Every clinical datum, every correct answer, and every rationale MUST cite at least one supplied
fact ID in its factIds array. If the facts cannot support a stage or question, produce fewer and
say so in debrief.notes — NEVER fabricate to fill a quota.

═══ PROSE FIELDS CARRY NO CLINICAL DATA ═══
These fields are free text and cannot carry fact IDs, so they must contain NO clinical values:
  title · patient.background · stage narrative · debrief.priorityProblem ·
  debrief.keyDecisions · debrief.notes
Put every finding, vital sign, lab, dose, and measurement in the structured "data" array, where
it can be cited. Narrative may set the scene only.
  ALLOWED in narrative:  "The nurse enters the room at 0800." · "A 72-year-old woman arrives
                          with her daughter." · "The call light is within reach."
  FORBIDDEN in narrative: "BP is 82/50." · "Potassium fell to 2.8 mEq/L." · "She takes
                          furosemide 80 mg daily." · "Oxygen saturation dropped to 88%."
This is checked automatically: any number carrying a clinical unit (mg, mcg, mL, mEq/L, mm Hg,
bpm, %, units) or a blood-pressure pair found in these fields FAILS validation. Ages, room
numbers, and clock times are fine.

═══ SUPPORT TYPE (label honesty) ═══
Each data item and rationale carries a supportType describing how it relates to the facts:
  "direct"         — restates a single fact
  "combined"       — merges two or more facts (list every id)
  "inference"      — a valid clinical inference from several facts (e.g. "client is
                     deteriorating" from falling SpO2 + new confusion); list every id
  "instantiated"   — a specific client value generated from a cited THRESHOLD or RANGE
                     fact (source says "urine output <30 mL/hr"; the case presents
                     "22 mL/hr"). The cited fact MUST contain the threshold, and the
                     value MUST fall on the side of it the case is claiming.
                     Never use this to invent a value the facts do not bound.
  "neutral-framing"— invented narrative detail with no clinical weight (factIds may be empty)
Do not pretend an inference is a direct quote.
This is checked in code: a value absent from its cited facts is an ERROR unless you declare
it "instantiated" AND a cited fact states a bound the value actually satisfies.

═══ STAGE DEPENDENCY ═══
Generate exactly ${stages} stages that unfold in clinical order. A question in a stage may only
depend on data revealed in that stage or an earlier one. Never let a Stage 1 question hinge on a
lab that is not revealed until Stage 2. Background pathophysiology may be marked availability
"background"; client data that has been shown is availability "revealed".
Stage arc for ${stages} stages:
  Stage 1 — Initial presentation (BriefPatho + Look + baseline findings)
  Stage 2 — Assessment & diagnostics (Assess + Tests)
  Stage 3 — Intervention (Treatments: orders, meds, precautions)
${stages>=4?'  Stage 4 — Discharge teaching OR deterioration (Educate, or a grounded complication)\n':''}${stages>=5?'  Stage 5 — Outcome evaluation (Evaluate response using revealed data)\n':''}
═══ QUESTIONS ═══
${caseDifficultyBlock(difficulty)}
Produce ${questionsPerStage} question(s) per stage.
Allowed question types (use a mix drawn from these; do not use a type the facts cannot support):
  ${typeList.join('\n  ')}
Tag exactly one CJMM skill per question from: Recognize Cues · Analyze Cues ·
Prioritize Hypotheses · Generate Solutions · Take Action · Evaluate Outcomes.

${CASE_QUESTION_RULES}

═══ JSON SHAPE (return EXACTLY this structure) ═══
{
  "title": "string",
  "condition": "${conditionName}",
  "difficulty": "${difficulty}",
  "patient": { "age": 0, "sex": "string", "background": "neutral, source-safe context only" },
  "stages": [
    {
      "stageNumber": 1,
      "title": "string",
      "narrative": "2-4 sentences of unfolding scenario",
      "data": [
        { "label": "e.g. Respiratory rate", "value": "e.g. 28/min", "supportType": "direct",
          "availability": "revealed", "factIds": ["fact-104"] }
      ],
      "questions": [
        {
          "id": "s1q1",
          "type": "MCQ|SATA|Prioritization|Ordering|Calculation|Education",
          "stem": "string",
          "options": [ { "label": "A", "text": "string" } ],
          "correctAnswers": ["B"],
          "rationales": [ { "option": "B", "text": "string", "supportType": "direct", "factIds": ["fact-104"] } ],
          "cjmmSkill": "Recognize Cues"
        }
      ]
    }
  ],
  "debrief": { "priorityProblem": "string", "keyDecisions": ["string"], "notes": "any shortfalls or facts you could not cover", "factIds": ["fact-104"] }
}

Every question needs a rationale entry for EVERY option (correct and incorrect). Ordering-question
correctAnswers list the step labels in correct sequence. Return ONLY the JSON object.

${caseRenderFactPacket(conditionName,facts)}`;
}

// ── Deterministic post-generation validation ──
// Everything the prompt promises is re-checked in code against the real KB.
// Clinical values that must never appear in uncited prose. A number carrying a clinical unit
// (or a BP pair) is patient data and belongs in the cited `data` array, not in free narrative
// where nothing ties it to a source. Plain integers are deliberately NOT matched, so an age,
// a room number, or a clock time stays legal neutral framing.
const CASE_CLINICAL_TOKEN_RE=/\b\d+(?:\.\d+)?\s*(?:mg|mcg|g|kg|mL|L|mEq\/L|mg\/dL|mmol\/L|mm\s*Hg|bpm|breaths?\/min|units?)\b|\b\d+(?:\.\d+)?\s*%|\b\d{1,3}\s*\/\s*min\b|\b\d{2,3}\/\d{2,3}\b/gi; // v15: % and bare NN/min get boundary-free alternatives — a \b after "%" sits between two non-word chars and can never match, which exempted exactly the SpO2-style values the prompt names as forbidden
// v15.1: qualitative findings ("becomes hypotensive", "appears confused") carry no numeric
// token and sailed past the value scan. Term matches are WARN-tier because a stem scan will
// false-positive on genuinely neutral phrasing; the numeric scan above stays error-tier.
const CASE_CLINICAL_TERM_RE=/\b(?:hypotensi\w*|hypertensi\w*|tachycard\w*|bradycard\w*|tachypne\w*|bradypne\w*|hypoxi\w*|hypoxem\w*|dyspne\w*|cyanosis|cyanotic|diaphore\w*|letharg\w*|obtunded|unresponsive|confus\w*|disoriented|edema\w*|crackles|wheez\w*|stridor|seizure\w*|hemorrhag\w*|infect\w*|febrile|fever\w*|nausea\w*|vomit\w*|hypoglycem\w*|hyperglycem\w*|oligur\w*|anuri\w*|jaundice\w*|pallor|mottl\w*|deteriorat\w*|decompensat\w*|unstable|distress\w*|anxious|restless\w*|agitat\w*|pain|painful)\b/gi;
function scanUncitedProse(text,where,issues){
  const source=String(text||'');
  const hits=source.match(CASE_CLINICAL_TOKEN_RE);
  if(hits&&hits.length)issues.push({sev:'error',msg:`${where}: contains uncited clinical value(s) ${[...new Set(hits.map(h=>h.trim()))].join(', ')} \u2014 clinical data must go in the cited data array`});
  const terms=source.match(CASE_CLINICAL_TERM_RE);
  if(terms&&terms.length)issues.push({sev:'warn',msg:`${where}: possible uncited clinical finding(s): ${[...new Set(terms.map(t=>t.toLowerCase()))].join(', ')} \u2014 assessment findings belong in the cited data array (warn-tier: neutral phrasing can trip this)`});
}

// \u2500\u2500 v15.6: NEIA terminology linter \u2500\u2500
// [NEIA-VALIDATED] Terminology Reference, Appendix A of Simms, Hensel & Kumar,
// Nurse Educ Pract 93:104804 (2026). Preferred vocabulary and unsafe abbreviations.
// WARN tier only \u2014 the rubric's Terminology subcategory carries NO stop criterion; its
// note reads "If the Terminology subcategory scores below 3 points, consider revision."
// Making these fatal would over-reject on a criterion the rubric itself treats as advisory.
// The trailing/leading-zero patterns partially overlap CASE_CLINICAL_TOKEN_RE. That overlap
// is deliberate: different purpose (safe formatting vs. uncited data) and different severity.
// Do NOT merge them \u2014 a single shared regex is how the %\b never-match bug happened.
const NEIA_TERMINOLOGY_RULES=[
  {re:/\bpatients?\b/gi,        msg:'use "client" (NCSBN Test Plan terminology)'},
  {re:/\b(doctors?|physicians?|MDs?)\b/gi, msg:'use "primary health care provider"'},
  {re:/\bq\.?\s?d\.?\b/gi,      msg:'"q.d." is unsafe \u2014 use "daily"'},
  {re:/\bq\.?\s?o\.?\s?d\.?\b/gi, msg:'"QOD" is unsafe \u2014 use "every other day"'},
  {re:/\bIU\b/g,                msg:'"IU" is unsafe \u2014 use "International Unit"'},

// SCOPE: model-authored, learner-facing text ONLY. Never run this over f.sourceQuote,
// caseRenderFactPacket output, or any KB source text \u2014 a textbook that says "patient" is

// never over Priority Analyzer Stage 1 output, whose rule 2 requires verbatim qualifiers.
function neiaTerminologyScan(text,where,issues){
  for(const r of NEIA_TERMINOLOGY_RULES){
    r.re.lastIndex=0; // module-level literals reused across calls
    const hits=String(text||'').match(r.re);
    if(hits&&hits.length)

// v15.7 B5: the unsafe-abbreviation subset only, for Anki. Deliberately placed AFTER
// neiaTerminologyScan so the rules and their primary scanner stay adjacent.
// The AUTHORITY here is medication-safety practice \u2014 which the NEIA Terminology Reference
// reproduces rather than originates. Do NOT claim NEIA validates flashcards; it validated
// exam items. Cloze cards are the highest medication-safety surface in the suite: the Anki
// prompt explicitly prioritizes doses, units, routes, and thresholds, and a missing leading
// zero on a card is a dose error drilled to automaticity.
// The preferred-vocabulary half (client / PHCP / UAP) is DELIBERATELY excluded: cloze cards
// test recall of source content, not NCLEX register, and rewriting mid-cloze risks breaking
// the deletion span for no learning benefit.

  for(const r of NEIA_TERMINOLOGY_RULES){
    if(!NEIA_UNSAFE_ABBREV_MSGS.some(k=>r.msg.includes(k)))continue; // skip vocabulary rules
    r.re.lastIndex=0;
    const hits=String(text||'').match(r.re);
    if(hits&&hits.length)
      issues.push({sev:'warn',msg:`${where}: ${r.msg} (found "${hits[0]}")`});
  }
}

// Deterministic post-generation validation.
// `allowedFactIds` is the packet actually sent to the model. Checking against the whole KB
// would let a Heart Failure case cite a Diabetes fact and call it grounded, so IDs are graded
// three ways: unknown to the KB, known but never supplied to this run, or genuinely in-packet.
// ── v15.2: numeric value-entailment audit (warn-tier) ──
// Packet scoping proves a cited ID was supplied; it cannot prove the cited fact supports
// the generated number. A fabricated "K+ 2.4 mEq/L" pinned to a real "monitor potassium"
// fact would wear a legitimate Inspector badge. Every unit-bearing value in a datum must
// appear somewhere in its cited facts' text or source quotes, with unit synonyms
// normalized on both sides. WARN tier by design: instantiating a sourced threshold
// (22 mL/hr from "<30 mL/hr") is a legitimate authoring move that also trips this —
// the amber flag is telemetry to eyeball, not a gate.
function caseNormalizeClinical(t){
  return String(t||'').toLowerCase()
    .replace(/\u00b5g|\u03bcg/g,'mcg')
    .replace(/milligrams?/g,'mg')
    .replace(/micrograms?/g,'mcg')
    .replace(/millilit(?:er|re)s?/g,'ml')
    .replace(/milliequivalents?/g,'meq')
    .replace(/beats\s*(?:per|\/)\s*min(?:ute)?s?/g,'bpm')
    .replace(/breaths\s*(?:per|\/)\s*min(?:ute)?s?/g,'/min')
    .replace(/per\s+minute/g,'/min')
    .replace(/mm\s*hg/g,'mmhg')
    .replace(/[,\u00a0]/g,'')
    .replace(/\s+/g,'');
}
// ── v15.6 item 2: instantiated values ──
// [LATTE-HEURISTIC] structure, [NEIA-DERIVED] motivation. v15.2-15.5 emitted a warn whenever
// a value was absent from its cited facts, because the legitimate case was indistinguishable
// from fabrication: source says "<30 mL/hr", the case presents "22 mL/hr". Forbidding
// instantiation is the wrong fix — a case that can only restate the threshold puts the
// decision rule verbatim in the stem, and the key then repeats it, which fails NEIA's Answer
// Integration criterion by construction. Instead the author must SAY it is an instantiation,
// and the claim is then checked in code.
// Splits a matched clinical token into a number and a normalized unit. A blood-pressure pair
// (82/50) reports its systolic value in mmHg — the pair form carries no unit of its own, and
// the systolic number is what a threshold like "SBP below 90" is about.
function caseSplitValue(v){
  const raw=String(v||'').trim();
  const bp=raw.match(/^(\d{2,3})\s*\/\s*(\d{2,3})$/);
  if(bp)return{num:parseFloat(bp[1]),unit:'mmhg'};

}
// Compatible when equal, when either side is unknown, or when one is a prefix of the other.

// units ("22 mL/hr" tokenizes as "22 mL") while the fact text keeps "30 mL/hr" intact.
function caseUnitsCompatible(a,b){

}
// [LATTE-HEURISTIC] Parses a comparator + bound out of a KB fact so an instantiated client

// thresholds. Deliberately conservative: the number must follow the comparator immediately
// (after whitespace stripping), and an unparseable fact yields null so the caller errors
// rather than silently passing the value.
function caseParseThreshold(factText){
  const t=caseNormalizeClinical(factText);

  if(th.op==='<=')return num<=th.value;
  if(th.op==='>')return num>th.value;
  if(th.op==='>=')return num>=th.value;

}
// v15.3: refactored into a text+ids core so rationales share the audit (per-rationale

// v15.6: takes supportType and escalates warn -> error. A value absent from its cited facts
// is now an error for direct/combined/inference, because the one legitimate reason it could
// be absent — threshold instantiation — has its own declared support type.
function caseAuditTextValues(text,factIds,factIndex,where,issues,supportType){
  const st=String(supportType||'');

  if(!(factIds||[]).length)return; // the missing/lacks-fact-ID checks already cover this

  // %\b never-match bug happened the first time.
  const values=String(text||'').match(CASE_CLINICAL_TOKEN_RE);
  if(!values||!values.length)return;

  });

function caseAuditDatumValues(d,factIndex,where,issues){

// ── v15.6 item 3: deterministic item heuristics ──
// [LATTE-HEURISTIC], telemetry tier. NOT NEIA-validated: the rubric says distractor lengths

// and names NO ratio. Every threshold below is ours and provisional until the test-retest
// harness produces real numbers — do not attribute any of them to NEIA.
// Motivation, and the only claim made here: the June study's domain-level ICC(2,1) for AI
// raters was lowest for Distractors (0.524) and Correct Answer (0.575) against Stem (0.770).
// Those are the two domains with the most mechanizable criteria, so moving the computable
// parts into code reduces reliance on the model where it is measurably weakest.
// Every diagnostic carries its measurement so the numbers are reviewable before any cutoff
// is trusted. All findings are WARN — none of these gate anything.
const CASE_LEN_RATIO_HI=1.4,CASE_LEN_RATIO_LO=0.71,CASE_JACCARD_DUP=0.8;

    .filter(w=>w.length>2&&!CASE_STOPWORDS.has(w));
}
function itemHeuristics(q,issues,where){
  if((q.type||'')!=='MCQ')return;
  const opts=(q.options||[]).filter(o=>o&&o.text!=null&&String(o.text).trim());
  const keyLabels=new Set((q.correctAnswers||[]).map(String));
  const key=opts.find(o=>keyLabels.has(String(o.label)));
  // Negative-stem check does not depend on a resolvable key, so it runs first.
  // v4.2's NCLEX prompt explicitly rules "least restrictive" clinical content rather than a
  // negative construction; excluded here so the two generators cannot disagree on one item.
  const negStem=String(q.stem||'').replace(/least\s+restrictive/gi,' ');
  const neg=negStem.match(/\b(except|not|never|least|all of the following)\b/i);
  if(neg)issues.push({sev:'warn',msg:`${where}: stem may use a negative construction ("${neg[1]}") — negatively worded stems are a stem-clarity defect`});
  if(opts.length<3||!key)return;
  const distractors=opts.filter(o=>o!==key);
  if(!distractors.length)return;

  // Option length. Flags only when the key is BOTH a unique extreme and outside the ratio
  // band — uniqueness alone fires on a one-word difference and would be pure noise.
  const wc=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
  const kw=wc(key.text),dw=distractors.map(o=>wc(o.text)).sort((a,b)=>a-b);
  const median=dw.length%2?dw[(dw.length-1)/2]:(dw[dw.length/2-1]+dw[dw.length/2])/2;
  const allw=opts.map(o=>wc(o.text)),maxw=Math.max(...allw),minw=Math.min(...allw);
  const uniqLong=kw===maxw&&allw.filter(w=>w===maxw).length===1;
  const uniqShort=kw===minw&&allw.filter(w=>w===minw).length===1;
  if(median>0){
    const ratio=kw/median;
    if((uniqLong&&ratio>=CASE_LEN_RATIO_HI)||(uniqShort&&ratio<=CASE_LEN_RATIO_LO))
      issues.push({sev:'warn',msg:`${where}: option length — key is the unique ${uniqLong?'longest':'shortest'} option at ${ratio.toFixed(2)}× the median distractor (${kw} vs ${median} words)`});
  }
  // Stem/key lexical overlap. A SMOKE DETECTOR for answer integration, not a replacement:
  // it cannot see a key that stands out by specificity, qualification, or grammatical
  // structure, all of which the same criterion covers. Absence of this flag proves nothing.
  const stemWords=new Set(caseContentWords(q.stem));
  if(stemWords.size){
    const ov=o=>{const w=caseContentWords(o.text);if(!w.length)return 0;return w.filter(x=>stemWords.has(x)).length/w.length;};
    const kOv=ov(key),dOv=distractors.map(ov);

      issues.push({sev:'warn',msg:`${where}: stem overlap — key shares more stem vocabulary than any distractor (${Math.round(kOv*100)}% vs ${Math.round(Math.max(...dOv)*100)}% max) — smoke detector for answer integration, not a verdict`});
  }
  // Near-duplicate options — touches distractor distinctiveness.
  for(let i=0;i<opts.length;i++)for(let j=i+1;j<opts.length;j++){
    const A=new Set(caseContentWords(opts[i].text)),B=new Set(caseContentWords(opts[j].text));
    if(!A.size||!B.size)continue;
    let inter=0;for(const w of A)if(B.has(w))inter++;
    const jac=inter/(A.size+B.size-inter);
    if(jac>=CASE_JACCARD_DUP)
      issues.push({sev:'warn',msg:`${where}: options ${opts[i].label} and ${opts[j].label} are near-duplicates (Jaccard ${jac.toFixed(2)}) — distractors must be meaningfully different choices`});
  }
}
// ── v15.6 item 5: countable difficulty contract ──
// [LATTE-HEURISTIC]. A cjmmSkill label is free to stamp, so a skill distribution alone
// proves nothing — the model can relabel its way to any spread. These check STRUCTURAL
// signatures it cannot fake after the fact: which stage a cited fact was first revealed in,
// and what tier the distractors' facts carry.
// WARN tier. A difficulty shortfall is a quality signal for the author, not a broken
// artifact — the case is still valid, it just is not as hard as it was asked to be.
function caseDifficultySignals(caseStudy,factIndex){
  const issues=[],level=String(caseStudy.difficulty||'').toLowerCase();
  if(level!=='exam'&&level!=='advanced')return issues; // foundational imposes no minimum
  const stages=caseStudy.stages||[];
  const skills=new Set();
  for(const st of stages)for(const q of st.questions||[])if(q.cjmmSkill)skills.add(String(q.cjmmSkill).trim());
  // factId -> earliest stage that presented it as REVEALED data (background is available
  // everywhere and so can never evidence cross-stage integration).
  const firstRevealed=new Map();
  for(const st of stages){
    const n=Number(st.stageNumber);
    if(!isFinite(n))continue;
    for(const d of st.data||[]){
      if((d.availability||'revealed')!=='revealed')continue;
      for(const id of d.factIds||[]){
        const k=String(id).toLowerCase();
        if(!firstRevealed.has(k)||n<firstRevealed.get(k))firstRevealed.set(k,n);
      }
    }
  }
  const miss=m=>issues.push({sev:'warn',msg:`Requested difficulty "${caseStudy.difficulty}" but ${m}`});
  if(level==='exam'){
    if(!skills.has('Analyze Cues'))miss('no question is tagged "Analyze Cues"');
    if(!skills.has('Take Action'))miss('no question is tagged "Take Action"');
    let multi=false;
    for(const st of stages)for(const q of st.questions||[]){
      const ids=new Set();
      for(const r of q.rationales||[])for(const id of r.factIds||[]){
        const k=String(id).toLowerCase();
        if(firstRevealed.has(k))ids.add(k);
      }
      if(ids.size>=2){multi=true;break;}
    }
    if(!multi)miss('no question integrates two or more distinct facts presented as revealed case data');
    return issues;
  }
  // advanced
  if(!skills.has('Prioritize Hypotheses'))miss('no question is tagged "Prioritize Hypotheses"');
  if(!skills.has('Evaluate Outcomes'))miss('no question is tagged "Evaluate Outcomes"');
  let crossStage=false;
  for(const st of stages){
    const n=Number(st.stageNumber);
    if(!isFinite(n)||n<3)continue;
    for(const q of st.questions||[]){
      const earlier=new Set();
      for(const r of q.rationales||[])for(const id of r.factIds||[]){
        const s=firstRevealed.get(String(id).toLowerCase());
        if(s!==undefined&&s<n)earlier.add(s);
      }
      if(earlier.size>=2){crossStage=true;break;}
    }
    if(crossStage)break;
  }
  if(!crossStage)miss('the case shows no cross-stage integration (no stage-3-or-later question cites revealed data from two different earlier stages)');
  // Near-miss density: wrong options that are actions a competent nurse would legitimately
  // take at some other moment, rather than obviously-wrong filler.
  let nearMiss=false;
  for(const st of stages)for(const q of st.questions||[]){
    if((q.type||'')!=='MCQ')continue;
    const keys=new Set((q.correctAnswers||[]).map(String));
    const distractors=(q.options||[]).filter(o=>o&&!keys.has(String(o.label)));
    if(!distractors.length)continue;
    const byOption=new Map((q.rationales||[]).map(r=>[String(r.option),r]));
    let strong=0;
    for(const o of distractors){
      const r=byOption.get(String(o.label));
      const hit=(r&&r.factIds||[]).some(id=>{
        const e=factIndex.get(String(id).toLowerCase());
        return e&&e.fact&&(Number(e.fact.tier)<=2||!!e.fact.safetyCritical);
      });
      if(hit)strong++;
    }
    if(strong>distractors.length/2){nearMiss=true;break;}
  }
  if(!nearMiss)miss('no MCQ builds most of its distractors from Tier 1-2 or safety-critical facts (near-miss density)');
  return issues;
}
// Enums exactly as caseBuildPrompt defines them. Downstream logic string-matches these
