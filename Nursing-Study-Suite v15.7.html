     v15.6 added NEIA-derived item quality to the Case Study Generator: terminology linting (warn), `instantiated` value provenance with numeric entailment at ERROR tier, deterministic MCQ heuristics, operationalized difficulty, and an independent per-item audit pass whose auditor sees only what the student sees.
     v15.7 extends that to the NCLEX Generator: `validateNCLEXWorksheet` checks the worksheet's self-reported DISTRIBUTION against what it actually produced, the audit profile is now a single tool-agnostic `itemAudit` row, worksheet MCQs route through the same auditor and repair path, artifacts carry a provenance stamp naming the configuration that made them, and Anki cards are linted for error-prone dose abbreviations.
     Full history: LATTE-v15-changelog.md · regression harness: latte-tests.js (354 assertions) · test-retest: neia-retest.js -->

     BEFORE the app can render anything unsanitized. v15's fallback-to-3.0.8 is gone: a
     failed secure pin must never silently downgrade the XSS boundary. -->

<style>
:root {
  --bg-deep: #08090f;
  --bg-surface: #10121a;
  --bg-card: #161924;
  --bg-card-alt: #1c2030;
  --bg-input: #0e1018;
  --bg-hover: #222638;
  --border: #1f2338;
  --border-focus: #4a7ff7;
  --accent: #4a7ff7;
  --accent-glow: rgba(74,127,247,0.12);
  --accent2: #a78bfa;
  --accent-warm: #f0a83a;
  --accent-green: #34d399;
  --accent-cyan: #22d3ee;
  --accent-red: #f87171;
  --text: #cdd2e0;
  --text-dim: #7b82a0;
  --text-bright: #eaecf4;
  --radius: 8px;
  --radius-lg: 12px;
  --nav-width: 64px;
  --sidebar-width: 320px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg-deep);color:var(--text);min-height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::selection{background:var(--accent);color:#fff;}

/* ─── Shell Layout ─── */
.suite-shell{display:flex;height:100vh;overflow:hidden;}

/* ─── Nav Rail ─── */
.nav-rail{width:var(--nav-width);min-width:var(--nav-width);background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;z-index:10;}
.nav-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:17px;color:#fff;margin-bottom:12px;flex-shrink:0;}
.nav-btn{width:44px;height:44px;border-radius:10px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'DM Sans',sans-serif;font-size:8px;font-weight:600;letter-spacing:.3px;transition:all .15s;position:relative;}
.nav-btn:hover{background:var(--bg-hover);color:var(--text);}
.nav-btn.active{background:var(--accent-glow);color:var(--accent);}
.nav-btn.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-spacer{flex:1;}
.nav-btn-cfg{margin-top:auto;margin-bottom:8px;}

/* ─── Sidebar ─── */
.config-sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;max-height:100vh;}
.sb-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.sb-header h2{font-size:14px;font-weight:700;color:var(--text-bright);letter-spacing:-.2px;}
.sb-header p{font-size:11px;color:var(--text-dim);margin-top:2px;}
.sb-section{padding:14px 18px;border-bottom:1px solid var(--border);}
.sb-section:last-child{border-bottom:none;}
.sb-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-dim);margin-bottom:8px;}
.sb-field{margin-bottom:10px;}
.sb-field:last-child{margin-bottom:0;}
.sb-field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:500;}
input[type="text"],input[type="password"],input[type="number"],select{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;transition:border-color .2s;outline:none;}
input:focus,select:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px var(--accent-glow);}
textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.55;resize:vertical;min-height:60px;outline:none;transition:border-color .2s;}
textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px var(--accent-glow);}
textarea::placeholder{color:#3a3f54;}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.toggle-row span{font-size:12px;font-weight:500;}
.toggle-switch:focus-visible,.upload-zone:focus-visible,.level-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.toggle-switch{width:38px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;}
.toggle-switch.on{background:var(--accent);}
.toggle-switch::after{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:3px;left:3px;transition:transform .25s;}
.toggle-switch.on::after{transform:translateX(18px);}

/* Level picker */
.level-pills{display:flex;gap:3px;}
.level-pill{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s;text-transform:uppercase;}
.level-pill:hover{border-color:var(--text-dim);color:var(--text);}
.level-pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Model info */
.model-badge{margin-top:6px;padding:6px 8px;background:var(--bg-input);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);display:flex;align-items:center;gap:5px;}
.model-dot{width:5px;height:5px;border-radius:50%;background:var(--accent-green);flex-shrink:0;}
.model-dot.pro{background:var(--accent-warm);}

/* Hint */
.sb-hint{font-size:10px;color:var(--text-dim);line-height:1.5;margin-top:4px;}

/* ─── Main Content Area ─── */
.main-area{flex:1;overflow-y:auto;max-height:100vh;}

/* ─── Shared UI components ─── */
.btn-primary{padding:11px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;border:none;border-radius:var(--radius);cursor:pointer;transition:all .2s;letter-spacing:.2px;}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-glow);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-secondary{padding:8px 14px;background:var(--bg-card);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;}
.btn-secondary:hover:not(:disabled){border-color:var(--text-dim);background:var(--bg-hover);}
.btn-danger{padding:8px 14px;background:rgba(248,113,113,.08);color:var(--accent-red);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;border:1px solid rgba(248,113,113,.2);border-radius:6px;cursor:pointer;transition:all .15s;}
.btn-danger:hover:not(:disabled){background:rgba(248,113,113,.15);}

/* Upload zone shared */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:32px 20px;text-align:center;cursor:pointer;transition:all .25s;background:var(--bg-card);}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-glow);}
.upload-zone svg{width:36px;height:36px;margin-bottom:8px;color:var(--text-dim);}
.upload-zone h3{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--text);}
.upload-zone p{font-size:11px;color:var(--text-dim);}

/* File chips */
.file-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:5px;}
.file-chip .f-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;text-transform:uppercase;flex-shrink:0;}
.f-icon.pdf{background:rgba(248,113,113,.12);color:#f87171;}
.f-icon.pptx{background:rgba(249,115,22,.12);color:#fb923c;}
.f-icon.txt{background:rgba(148,163,184,.12);color:#94a3b8;}
.file-chip .f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.file-chip .f-size{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
.file-chip .f-rm{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 2px;}
.file-chip .f-rm:hover{color:var(--accent-red);}

/* Progress */
.progress-bar{height:5px;background:var(--bg-input);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease;background:linear-gradient(90deg,var(--accent),var(--accent2));}

/* Chunk list */
.chunk-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-card);border-radius:5px;font-size:11px;border:1px solid var(--border);margin-bottom:4px;}
.chunk-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.chunk-dot.pending{border:2px solid var(--border);}
.chunk-dot.running{border:2px solid var(--accent);animation:pulse 1.2s infinite;}
.chunk-dot.done{background:var(--accent-green);color:#0a0f1a;}
.chunk-dot.error{background:var(--accent-red);color:white;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* Output container */
.output-container{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.output-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-card-alt);flex-wrap:wrap;gap:6px;}
.output-toolbar h3{font-size:13px;font-weight:600;color:var(--text-bright);}
.output-toolbar-actions{display:flex;gap:6px;flex-wrap:wrap;}
.output-body{padding:20px;max-height:65vh;overflow-y:auto;line-height:1.7;font-size:13px;}
.output-body h1,.output-body h2,.output-body h3,.output-body h4{color:var(--text-bright);margin:16px 0 8px;line-height:1.3;}
.output-body h1{font-size:20px;font-family:'Playfair Display',serif;}
.output-body h2{font-size:16px;border-bottom:1px solid var(--border);padding-bottom:5px;}
.output-body h3{font-size:14px;color:var(--accent);}
.output-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:11px;}
.output-body th{background:var(--bg-card-alt);padding:7px 9px;text-align:left;font-weight:600;border:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.4px;}
.output-body td{padding:7px 9px;border:1px solid var(--border);vertical-align:top;}
.output-body tr:nth-child(even){background:rgba(255,255,255,.015);}
.output-body ul,.output-body ol{padding-left:18px;margin:6px 0;}
.output-body li{margin-bottom:3px;}
.output-body code{font-family:'JetBrains Mono',monospace;background:var(--bg-input);padding:1px 4px;border-radius:3px;font-size:11px;}
.output-body pre{background:var(--bg-input);padding:12px;border-radius:6px;overflow-x:auto;margin:10px 0;}
.output-body pre code{background:none;padding:0;}
.output-body strong{color:var(--text-bright);}
.output-body blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-dim);margin:10px 0;}

/* Error */
.error-banner{padding:10px 14px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:var(--radius);color:var(--accent-red);font-size:12px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;}

/* Tip banner */
.tip-banner{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:rgba(240,168,58,.06);border:1px solid rgba(240,168,58,.18);border-radius:var(--radius);font-size:11px;color:var(--accent-warm);margin-bottom:16px;line-height:1.5;}

/* ─── Tool-specific panels (each tool wraps in .tool-panel) ─── */
.tool-panel{padding:24px 32px;min-height:100vh;}
.tool-panel h2.tool-title{font-size:18px;font-weight:700;color:var(--text-bright);margin-bottom:4px;letter-spacing:-.3px;}
.tool-panel .tool-desc{font-size:12px;color:var(--text-dim);margin-bottom:20px;}
.field-block{margin-bottom:16px;}
.field-block label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field-block .badge-req{font-size:9px;font-weight:600;color:var(--accent-warm);text-transform:uppercase;letter-spacing:.8px;background:rgba(240,168,58,.1);padding:2px 7px;border-radius:3px;}
.field-block .badge-opt{font-size:9px;font-weight:400;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;background:var(--bg-card-alt);padding:2px 7px;border-radius:3px;}

/* Extraction toggle */
.ext-toggle{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;margin-bottom:14px;user-select:none;}
.ext-toggle:hover{border-color:var(--text-dim);}
.ext-toggle .arrow{transition:transform .2s;font-size:9px;}
.ext-toggle .arrow.open{transform:rotate(90deg);}
.ext-viewer{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:16px;max-height:250px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;white-space:pre-wrap;color:var(--text-dim);}
.retry-banner{padding:10px 14px;background:rgba(74,127,247,.06);border:1px solid rgba(74,127,247,.18);border-radius:var(--radius);font-size:12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Format options */
.format-opt{padding:8px 10px;border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:4px;}
.format-opt .fo-head{display:flex;align-items:center;gap:6px;}
.format-opt .fo-desc{font-size:9px;color:var(--text-dim);margin-top:3px;padding-left:20px;line-height:1.3;}

/* ─── NCLEX-specific ─── */
.nclex-card{border:1px solid var(--border);border-radius:10px;background:var(--bg-card);margin-bottom:12px;overflow:hidden;transition:box-shadow .2s;}
.nclex-card.open{box-shadow:0 0 0 1px var(--accent-glow),0 4px 16px rgba(0,0,0,.25);}
.nclex-header{width:100%;padding:10px 14px;background:none;border:none;cursor:pointer;display:flex;align-items:flex-start;gap:8px;text-align:left;}
.nclex-qnum{background:rgba(74,127,247,.1);color:var(--accent);font-weight:700;font-size:10px;padding:2px 7px;border-radius:5px;flex-shrink:0;margin-top:2px;}
.nclex-body{padding:0 14px 14px;}

/* ─── Anki table view ─── */
.anki-tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);}
.anki-tbl-wrap table{width:100%;border-collapse:collapse;}
.anki-tbl-wrap thead{background:var(--bg-card-alt);}
.anki-tbl-wrap th{padding:8px 10px;font-size:9.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;text-align:left;border-bottom:1px solid var(--border);}
.anki-tbl-wrap td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.anki-tbl-wrap tr:last-child td{border-bottom:none;}
.anki-tbl-wrap tr.dim{opacity:.35;}
.cell-ta{width:100%;background:var(--bg-input);border:1px solid transparent;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 7px;border-radius:5px;resize:none;outline:none;line-height:1.5;transition:border .2s;}
.cell-ta:focus{border-color:var(--border-focus);}
.cell-ta.tags-ta{color:var(--accent);font-size:10px;}

/* Tier badges */
.tier-badge{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.2px;line-height:1;white-space:nowrap;flex-shrink:0;}
.tier-badge.t1{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.2);}
.tier-badge.t2{background:rgba(240,168,58,.1);color:#fde68a;border:1px solid rgba(240,168,58,.2);}
.tier-badge.t3{background:rgba(74,127,247,.1);color:#93c5fd;border:1px solid rgba(74,127,247,.2);}
.tier-btn{display:inline-flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);cursor:pointer;transition:.15s;}
.tier-btn b{font-weight:700;}
.tier-btn:hover{border-color:var(--text-dim);color:var(--text);}
.tier-btn.t1.active{background:rgba(248,113,113,.1);color:#fca5a5;border-color:rgba(248,113,113,.25);}

<div id="root"><div id="boot-status" style="max-width:720px;margin:60px auto;padding:24px;color:#cdd2e0;background:#161924;border:1px solid #1f2338;border-radius:12px;font-family:system-ui,sans-serif">Loading LATTE Study Suite…</div></div>
<script>
(function(){
  function bootFail(message){
    var root=document.getElementById('root');
    if(!root)return;
    root.innerHTML='<div style="max-width:720px;margin:60px auto;padding:24px;color:#fca5a5;background:#161924;border:1px solid #7f1d1d;border-radius:12px;font-family:system-ui,sans-serif"><h2 style="margin:0 0 10px">LATTE Study Suite could not start</h2><p style="line-height:1.55">'+String(message||'Unknown startup error').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})+'</p><p style="color:#9ca3af;line-height:1.55">Confirm that you are online and that React, Babel, PDF.js, and other CDN scripts are not blocked. Open the browser console for technical details.</p></div>';
  }
  window.__latteBootFail=bootFail;
  window.addEventListener('error',function(e){if(!window.__latteMounted)bootFail(e.message||'A startup script failed.');});
  setTimeout(function(){if(!window.__latteMounted)bootFail('Startup timed out. One or more CDN dependencies may have failed to load.');},12000);
})();
</script>
<script type="text/babel">
const {useState,useRef,useCallback,useEffect,useMemo,createContext,useContext}=React;

// ── Recommended per-tool profiles (Auto mode) ──
// Starting points synthesized from the model-routing discussion, NOT measured results.
// 'flash'/'pro' resolve against whatever is typed in the Flash/Pro model fields, so
// these stay correct when model names change. Every value is user-editable.
const TOOL_PROFILE_DEFAULTS={
  knowledge:{m:'flash',lv:'medium'},      // extraction — completeness-critical; pending A/B
  knowledgeAudit:{m:'flash',lv:'medium'}, // omission audit — comparison task
  priorityHarvest:{m:'flash',lv:'low'},   // stage-1 inventory — same default v14 hardcoded
  priority:{m:'flash',lv:'medium'},       // stage-2 R1–R9 cascade, needs rule evaluation
  anki:{m:'flash',lv:'low'},              // transformation of already-atomized facts
  nclex:{m:'flash',lv:'medium'},          // parsing existing Q&A out of messy PDF text
  nclexgen:{m:'flash',lv:'high'},         // distractor plausibility is genuine reasoning
  cases:{m:'flash',lv:'high'},            // unfolding clinical reasoning + strict grounding
  // v15.6: applying a rubric to a rendered artifact is a JUDGMENT task, not a grounded
  // extraction task, so high reasoning is appropriate here and specifically NOT in the
  // ingestion stages — this does not contradict the earlier finding that high thinking
  // degrades grounded summarization. Both top-performing raters in the June study were
  // reasoning-enhanced configurations.
  // v15.7: defaulted to FLASH, not Pro. This is a COST decision, not a quality one. The
  // audit runs once per MCQ, and a real free-tier key exhausted its Pro allowance after
  // ~26 calls — an audit you cannot afford to run is worth less than a cheaper one you can.
  // Thinking stays high, which is the part that matters for rubric judgment. Switch this
  // row to Pro in the per-tool profiles when quota allows; nothing else needs to change.
  itemAudit:{m:'flash',lv:'high'},       // NEIA item-quality review of a rendered item
};
const PROFILE_ROWS=[
  {id:'knowledge',label:'Knowledge · extract'},
  {id:'knowledgeAudit',label:'Knowledge · audit'},
  {id:'priorityHarvest',label:'Priority · harvest'},
  {id:'priority',label:'Priority · synthesis'},
  {id:'anki',label:'Anki'},
  {id:'nclex',label:'NCLEX · extract'},
  {id:'nclexgen',label:'NCLEX · generate'},
  {id:'cases',label:'Case studies'},
  // v15.7: ONE audit row, not one per source tool. The payload is a rendered item and the
  // prompt is criterion text; neither differs by which tool authored the item. Two rows
  // would be two places to drift.
  {id:'itemAudit',label:'Item quality · audit'},
];

/* ═══════════════════════════════════════════════════════
   SHARED CONFIG CONTEXT
   ═══════════════════════════════════════════════════════ */
const ConfigCtx=createContext();
function useConfig(){return useContext(ConfigCtx);}

// Shared, project-level LATTE knowledge base. Existing tools remain independent;
// consumers can opt into this source without changing their established prompts.
const KnowledgeCtx=createContext();
function useKnowledge(){return useContext(KnowledgeCtx);}
const EMPTY_LATTE_KB={
  metadata:{course:'',exam:'',createdAt:'',schemaVersion:'1.0'},
  sources:[],conditions:[],medications:[],diagnostics:[],scoringTools:[],formulas:[],contradictions:[]
};

// Shared Fact Inspector state. One selected fact ID drives a read-only drawer that can be
// opened from any fact-* reference across the suite. Kept separate from KnowledgeCtx so a
// fact-tag click never re-renders every KB consumer.
const FactInspectorCtx=createContext(null);
function useFactInspector(){return useContext(FactInspectorCtx);}

// Indexed KB lookup: id -> {condition, fact}. Normalizes case once so opening the inspector
// is O(1) instead of scanning every condition's facts on each click.
function buildFactIndex(kb){
  const map=new Map();
  for(const condition of (kb&&kb.conditions)||[])
    for(const fact of condition.facts||[])
      map.set(String(fact.id||'').toLowerCase(),{condition,fact});
  return map;
}
function findFactById(index,factId){return index?index.get(String(factId||'').toLowerCase())||null:null;}

// Compact, shared registry of generated artifacts, so the inspector can answer "Used in".
// Only lightweight indexes live here (id + factIds + a short label); full bodies stay in
// their own component/tab state.
// NOT PERSISTED, deliberately. kbNormalizeImported re-keys every fact id on load, so a
// registry restored across a KB rebuild would point at the wrong facts and show confident,
// wrong provenance. Persisting this safely needs content-derived fact ids (or a KB
// fingerprint that invalidates the registry); until then it is session-scoped.
const EMPTY_ARTIFACT_REGISTRY={schemaVersion:'1.0',ankiNotes:[],nclexQuestions:[],caseStudies:[]};
// Upsert by id, unioning factIds. Used where outputs ACCUMULATE (cases): generating a second
// case must not erase the first one's provenance. Regenerating Anki cards or NCLEX batches
// replaces the visible output, so those kinds keep replace semantics — merging there would
// leave "Used in" pointing at cards that no longer exist in the UI.
function mergeArtifactEntries(existing,incoming){
  const map=new Map((existing||[]).map(i=>[i.id,i]));
  for(const item of incoming||[]){
    const prev=map.get(item.id);
    map.set(item.id,prev?{...prev,...item,factIds:[...new Set([...(prev.factIds||[]),...(item.factIds||[])])]}:item);
  }
  return[...map.values()];
}
function getFactUsage(registry,factId){
  const id=String(factId||'').toLowerCase();
  const hit=arr=>(arr||[]).filter(item=>(item.factIds||[]).some(x=>String(x).toLowerCase()===id));
  return{anki:hit(registry.ankiNotes),nclex:hit(registry.nclexQuestions),cases:hit(registry.caseStudies)};
}

/* ═══════════════════════════════════════════════════════
   SHARED UTILITIES
   ═══════════════════════════════════════════════════════ */
function formatSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';}
function getExt(name){return name.split('.').pop().toLowerCase();}
// All markdown that reaches the DOM goes through this — marked does NOT sanitize HTML.
function mdToSafeHtml(md){return DOMPurify.sanitize(marked.parse(md||''));}
// navigator.clipboard requires a secure context. Under file:// or plain http:// it can be
// undefined or reject, which would silently break Copy buttons. Fall back to execCommand.
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true;}
  catch{
    try{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
      document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;
    }catch{return false;}
  }
}
// A merged fact can carry several supporting sources — cite all of them, not just the first.
function formatFactCitation(fact){
  const sources=(fact.sources||[]).map(s=>`${s.filename||''}${s.location?` (${s.location})`:''}`).filter(Boolean).join('; ');
  return `"${fact.sourceQuote||fact.text||''}"${sources?` — ${sources}`:''}`;
}
// crypto.randomUUID requires a secure context. file:// and https:// are fine, but on a
// plain http:// host it is undefined and calling it throws — which would kill card
// parsing outright. Fall back to a collision-safe local id.
let _uidN=0;
function uid(){
  try{if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();}catch(e){}
  return 'id-'+Date.now().toString(36)+'-'+(_uidN++).toString(36)+'-'+Math.random().toString(36).slice(2,8);
}



// PPTX text extraction. A .pptx is a ZIP of XML; slide text lives in <a:t> runs.
// Gemini's document understanding is PDF-centric — Office binary formats are not a
// documented inline_data type, so a deck sent as raw bytes can come back empty or
// error. Extracting client-side guarantees the slide content actually reaches the
// model, and preserves per-slide numbering so Source Pointers stay citable.
const _OOXML_A_NS = 'http://schemas.openxmlformats.org/drawingml/2006/main';
function _pptxRunText(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  let runs = doc.getElementsByTagNameNS(_OOXML_A_NS, 't');
  if (!runs || !runs.length) runs = doc.getElementsByTagName('a:t');
  const out = [];
  for (let i = 0; i < runs.length; i++) {
    const t = runs[i].textContent;
    if (t && t.trim()) out.push(t.trim());
  }
  return out;
}
function _zipNormalizePath(basePath,target){
  const base=basePath.split('/');base.pop();
  for(const part of String(target||'').replace(/\\/g,'/').split('/')){
    if(!part||part==='.')continue;
    if(part==='..')base.pop();else base.push(part);
  }
  return base.join('/').replace(/^\//,'');
}
function _xmlElementsByLocalName(doc,name){
  return Array.from(doc.getElementsByTagName('*')).filter(el=>el.localName===name||el.nodeName.split(':').pop()===name);
}
function _relsMap(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');const map=new Map();
  for(const rel of _xmlElementsByLocalName(doc,'Relationship'))map.set(rel.getAttribute('Id'),{target:rel.getAttribute('Target')||'',type:rel.getAttribute('Type')||''});
  return map;
}
async function extractPptxText(file) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip failed to load — cannot read PPTX. Convert the deck to PDF and re-upload.');
  const zip = await JSZip.loadAsync(file);
  let slides=[];
  // PowerPoint presentation order is defined by presentation.xml relationships, not slide filenames.
  if(zip.files['ppt/presentation.xml']&&zip.files['ppt/_rels/presentation.xml.rels']){
    const presXml=await zip.files['ppt/presentation.xml'].async('string');
    const presDoc=new DOMParser().parseFromString(presXml,'application/xml');
    const rels=_relsMap(await zip.files['ppt/_rels/presentation.xml.rels'].async('string'));
    slides=_xmlElementsByLocalName(presDoc,'sldId').map(el=>{
      const rid=el.getAttribute('r:id')||el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      const rel=rels.get(rid);return rel?_zipNormalizePath('ppt/presentation.xml',rel.target):null;
    }).filter(n=>n&&zip.files[n]);
  }
  // Fallback for malformed decks.
  if(!slides.length)slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/slide(\d+)/)[1])-parseInt(b.match(/slide(\d+)/)[1]));
  if (!slides.length) throw new Error('No slides found in "' + file.name + '" — is it a valid .pptx?');
  let out = '';
  for (let i = 0; i < slides.length; i++) {
    const slidePath=slides[i];
    const body = _pptxRunText(await zip.files[slidePath].async('string'));
    const slideBase=slidePath.split('/').pop();
    const relPath='ppt/slides/_rels/'+slideBase+'.rels';
    let notes = '';
    if(zip.files[relPath]){
      const rels=_relsMap(await zip.files[relPath].async('string'));
      const noteRel=[...rels.values()].find(r=>/\/notesSlide$/i.test(r.type));
      const notesPath=noteRel?_zipNormalizePath(slidePath,noteRel.target):'';
      if(notesPath&&zip.files[notesPath]){
        const n=_pptxRunText(await zip.files[notesPath].async('string'));
        if(n.length)notes='\n[Speaker notes] '+n.join(' ');
      }
    }
    out += '\n--- SLIDE ' + (i + 1) + ' ---\n' + body.join('\n') + notes + '\n';
  }
  return out;
}





// Single core for ALL Gemini traffic: header auth, retry/backoff on 429/5xx,
// SAFETY detection, empty-response retry, thought-part filtering.
// Adjustable safety filters pinned to BLOCK_NONE. Docs (June 2026): these filters
// already default to Off for Gemini 2.5/3 models; pinning makes behavior deterministic
// across any model string. Medical-education content (dosages, self-harm assessment,
// abuse scenarios) is a classic false-positive source. Core-harm protections are
// built into the API and are NOT adjustable by this setting.
const SAFETY_SETTINGS=[
  {category:'HARM_CATEGORY_HARASSMENT',threshold:'BLOCK_NONE'},
  {category:'HARM_CATEGORY_HATE_SPEECH',threshold:'BLOCK_NONE'},
  {category:'HARM_CATEGORY_SEXUALLY_EXPLICIT',threshold:'BLOCK_NONE'},
  {category:'HARM_CATEGORY_DANGEROUS_CONTENT',threshold:'BLOCK_NONE'}
];

// Single core for ALL Gemini traffic. Pass onUpdate(fullTextSoFar) to stream via SSE;
// omit it for a standard request. Retry/backoff, SAFETY + prompt-block detection,
// empty-response retry, and thought-part filtering apply to both paths.
// Abortable delay. Retry backoff can be up to 60s (Retry-After), so a plain
// setTimeout would leave Cancel unresponsive for that whole window. Rejects with
// AbortError the instant the signal fires, and always detaches its listener.
const _sleep=(ms,signal)=>new Promise((resolve,reject)=>{
  if(signal?.aborted)return reject(new DOMException('Aborted','AbortError'));
  let onAbort=null;
  const done=fn=>()=>{clearTimeout(timer);if(onAbort&&signal)signal.removeEventListener('abort',onAbort);fn();};
  const finish=done(resolve);
  const timer=setTimeout(finish,ms);
  if(signal){onAbort=done(()=>reject(new DOMException('Aborted','AbortError')));signal.addEventListener('abort',onAbort,{once:true});}
});
async function geminiRequest(apiKey,model,body,{signal,retries=2,onUpdate,onMeta,timeoutMs=600000}={}){
  body.safetySettings=SAFETY_SETTINGS;
  const streaming=typeof onUpdate==='function';
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:${streaming?'streamGenerateContent?alt=sse':'generateContent'}`;
  for(let attempt=0;attempt<=retries;attempt++){
    // Watchdog: aborts after timeoutMs with NO activity. Streaming resets it on every
    // chunk; non-streaming has no mid-request activity, so it bounds the whole call.
    // Generous by design (10 min): Pro at high thinking legitimately runs for minutes,
    // and thinking produces no stream traffic until answer tokens start.
    const wd=new AbortController();let timedOut=false,timer=null;
    const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>{timedOut=true;wd.abort();},timeoutMs);};
    const onOuterAbort=()=>wd.abort();
    if(signal){if(signal.aborted)wd.abort();else signal.addEventListener('abort',onOuterAbort,{once:true});}
    arm();
    try{
      const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify(body),signal:wd.signal});
      if(!resp.ok){
        const err=await resp.json().catch(()=>({}));
        const msg=err.error?.message||`API error ${resp.status}`;
        // 4xx (except 429 rate-limit and 408 timeout) will fail identically on every
        // retry — bad key, bad model, malformed body. Surface immediately instead of
        // burning the retry budget and making the user wait out pointless backoff.
        const retryable=resp.status===429||resp.status===408||resp.status>=500;
        if(!retryable){const e=new Error(msg);e.isFatal=true;throw e;}
        if(attempt<retries){
          const ra=parseInt(resp.headers.get('retry-after'),10);
          const raMs=Number.isFinite(ra)&&ra>0?Math.min(ra,60)*1000:0;
          await _sleep(Math.max(raMs,Math.pow(2,attempt+1)*1000+Math.random()*1000),signal);
          continue;
        }
        throw new Error(msg);
      }
      let text='',finish=null,blocked=null,usage=null;
      if(streaming){
        // SSE lines can split across network chunks — buffer and only parse complete lines.
        const reader=resp.body.getReader();const dec=new TextDecoder();let buf='',lastEmit=0;
        const handleLine=line=>{
          const s=line.trim();if(!s.startsWith('data:'))return;
          const payload=s.slice(5).trim();if(!payload||payload==='[DONE]')return;
          let d;try{d=JSON.parse(payload);}catch(e){return;}
          if(d.promptFeedback?.blockReason)blocked=d.promptFeedback.blockReason;
          if(d.usageMetadata)usage=d.usageMetadata;
          const c=d.candidates?.[0];if(c?.finishReason)finish=c.finishReason;
          if(c?.content?.parts)for(const p of c.content.parts){if(p.text&&!p.thought)text+=p.text;}
        };
        while(true){
          const{done,value}=await reader.read();if(done)break;
          arm();
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split('\n');buf=lines.pop();
          for(const line of lines)handleLine(line);
          const now=Date.now();if(text&&now-lastEmit>150){lastEmit=now;onUpdate(text);}
        }
        buf+=dec.decode();if(buf)handleLine(buf);
        if(text)onUpdate(text);
      }else{
        const data=await resp.json();
        blocked=data.promptFeedback?.blockReason||null;
        finish=data.candidates?.[0]?.finishReason||null;
        usage=data.usageMetadata||null;
        if(data.candidates?.[0]?.content?.parts){for(const part of data.candidates[0].content.parts){if(part.text&&!part.thought)text+=part.text;}}
      }
      // Retrying identical content against the safety filter wastes the retry budget —
      // the same input gets the same verdict.
      if(finish==='SAFETY'||blocked){const e=new Error('Response blocked by safety filters'+(blocked?` (prompt: ${blocked})`:'.'));e.isFatal=true;throw e;}
      if(!text.trim()){if(attempt<retries){await _sleep(2000,signal);continue;}throw new Error('Empty response from API.');}
      // finishReason is already in every response; it was previously discarded.
      // MAX_TOKENS means the model ran out of room mid-document, NOT that it finished.
      // usageMetadata.thoughtsTokenCount matters because on Gemini 3 thinking tokens
      // and output tokens share the SAME maxOutputTokens budget.
      if(typeof onMeta==='function'){try{onMeta({finishReason:finish,truncated:finish==='MAX_TOKENS',usage,model});}catch(e){}}
      return text;
    }catch(err){
      // Watchdog fired: convert the internal AbortError into a retryable timeout.
      // A user abort keeps its AbortError identity and propagates untouched.
      if(timedOut){
        if(attempt===retries)throw new Error(`No response data for ${Math.round(timeoutMs/1000)}s — request timed out.`);
        await _sleep(Math.pow(2,attempt+1)*1000,signal);
        continue;
      }
      if(err.name==='AbortError'||err.isFatal)throw err;
      if(attempt===retries)throw err;
      await _sleep(Math.pow(2,attempt+1)*1000,signal);
    }finally{
      clearTimeout(timer);
      if(signal)signal.removeEventListener('abort',onOuterAbort);
    }
  }
}

async function callGemini(apiKey,model,parts,useThinking,thinkingLevel,signal,retries=2,onUpdate,onMeta,genCfg){
  // genCfg (v15): optional generationConfig overrides (e.g. responseMimeType) so a call
  // site can opt in per-request without forking the wrapper. useThinking is inert and is
  // kept only so existing positional call sites stay valid until the options-object
  // refactor. NOTE: never set a JSON mime here globally — Priority/Anki/NCLEXgen consume
  // markdown / code-block / plain-text output from this same wrapper.
  const body={contents:[{parts}],generationConfig:Object.assign({maxOutputTokens:65536},genCfg||{})};
  // The level is applied as given — it is no longer forced to 'low' when the Pro
  // toggle is off. cfg.thinkingLevel already resolves to the active model's level,
  // so Flash+medium/high is now expressible. useThinking is kept in the signature
  // for call-site compatibility but no longer gates the level.
  body.generationConfig.thinkingConfig={thinkingLevel:thinkingLevel||'low'};
  return geminiRequest(apiKey,model,body,{signal,retries,onUpdate,onMeta});
}

function extractJSON(text){
  const fm=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(fm)try{return JSON.parse(fm[1].trim());}catch(e){}
  const bs=text.indexOf('{'),bk=text.indexOf('[');const start=Math.min(bs>=0?bs:Infinity,bk>=0?bk:Infinity);
  if(start===Infinity)throw new Error('No JSON found.');
  const opener=text[start],closer=opener==='{'?'}':']';let depth=0,inStr=false,esc=false;
  for(let i=start;i<text.length;i++){const ch=text[i];
    if(esc){esc=false;continue;}
    if(inStr){if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'){inStr=true;continue;}
    if(ch===opener)depth++;else if(ch===closer)depth--;
    if(depth===0){try{return JSON.parse(text.substring(start,i+1));}catch(e){throw new Error('Malformed JSON.');}}
  }
  throw new Error('JSON truncated.');
}

// PDF text extraction (shared) — each File is parsed once and cached.
// isEvalSupported:false is the vendor-documented complete mitigation for CVE-2024-4367
// (pdf.js <=4.1.392: a crafted PDF's font matrix reaches eval and runs arbitrary JS in
// this page's origin, i.e. with sessionStorage/IndexedDB access). The pinned 3.11.174 is
// affected; this flag closes it. The long-term fix is pdf.js >=4.2.67, which is ESM-only
// and changes the script-tag load path — do that upgrade in a supervised smoke test.
const _pdfDocCache=new WeakMap();
function getPdfDoc(file){
  if(!_pdfDocCache.has(file))_pdfDocCache.set(file,file.arrayBuffer().then(ab=>pdfjsLib.getDocument({data:ab,isEvalSupported:false}).promise));
  return _pdfDocCache.get(file);
}
// Release a cached document's worker-side memory when its file leaves the UI. GC of the
// main-thread proxy never tells the pdf.js worker to drop its parsed structures, so long
// multi-book sessions grew until page unload. Fire-and-forget: callers are click handlers.
function destroyPdfDoc(file){
  const p=file&&_pdfDocCache.get(file);
  if(!p)return;
  _pdfDocCache.delete(file);
  p.then(pdf=>pdf.destroy()).catch(()=>{});
}
// v15.4: coordinate-aware page assembly, lifted out of extractPdfTextSpaced so the
// Knowledge Base can share it. pdf.js returns text as positioned runs in no guaranteed
// reading order; the naive tc.items.map(x=>x.str).join(' ') the KB used flattens a whole
// page into ONE space-joined line, so a table's rows merge into their neighbours and
// "Drug | Dose | Hold if" arrives as "Drug Dose Hold if" with the values that followed
// it. Rebuilding line breaks from y-deltas (and column wraps from large negative x-jumps)
// preserves row structure, which is most of what a nursing textbook's tables, alert
// boxes, and lab-value panels actually carry.
function pdfLayoutText(tc){
  const items=(tc&&tc.items)||[];let result='';let lastX=-1,lastWidth=0,lastY=-1;
  for(const item of items){if(!item.str)continue;const x=item.transform?.[4]??0,y=item.transform?.[5]??0,fontSize=item.transform?.[0]??12;
    if(lastY!==-1&&Math.abs(y-lastY)>fontSize*0.5){result+='\n';lastX=-1;}
    if(lastX!==-1){const gap=x-(lastX+lastWidth);if(gap>fontSize*0.25)result+=' ';else if(gap<-fontSize*2)result+='\n';}
    result+=item.str;lastX=x;lastWidth=item.width??(item.str.length*fontSize*0.5);lastY=y;}
  return result;
}
// Probe the text layer before spending API calls. A scanned or photographed PDF has no
// text layer at all, so pdf.js returns almost nothing and the build used to proceed in
// silence, producing an empty Knowledge Base with no explanation of why.
function kbTextQuality(units){
  const pages=(units||[]).filter(u=>u&&(u.kind==='page'||u.kind==='slide'));
  if(!pages.length)return null;
  const chars=pages.map(u=>String(u.text||'').replace(/^\s*---\s*(?:PAGE|SLIDE)\s*\d+\s*---/i,'').trim().length);
  const total=chars.reduce((a,b)=>a+b,0);
  return{pages:pages.length,empty:chars.filter(c=>c<50).length,total,avg:Math.round(total/pages.length)};
}
async function extractPdfTextSpaced(file){
  const pdf=await getPdfDoc(file);let text='';
  for(let i=1;i<=pdf.numPages;i++){
    const p=await pdf.getPage(i);const c=await p.getTextContent();
    text+=pdfLayoutText(c)+'\n\n';
  }
  return text;
}

async function getPdfPageCount(file){const pdf=await getPdfDoc(file);return pdf.numPages;}

function markdownToPlainText(md){

  return String(md||'').replace(/<div class="pagebreak"><\/div>/g,'\n---\n').replace(/^#{1,6}\s+/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/`(.+?)`/g,'$1').replace(/```[\s\S]*?```/g,'').replace(/^\|.*\|$/gm,line=>{if(/^[\|\s:-]+$/.test(line))return'';return line.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()).join('\t');}).replace(/^[-*+]\s+/gm,'\u2022 ').replace(/^>\s+/gm,'  ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/---+/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

// Fallback when a popup blocker eats the preview window: print from a hidden iframe.
function printViaIframe(html){
  const frame=document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:8.5in;height:11in;border:0;';
  frame.onload=()=>{
    // Remove as soon as the print dialog closes. The old flat 120s hold meant several
    // full-document iframes could pile up if you exported repeatedly.
    let gone=false;
    const cleanup=()=>{if(gone)return;gone=true;try{frame.remove();}catch(e){}};
    try{frame.contentWindow.addEventListener('afterprint',cleanup,{once:true});}catch(e){}
    try{frame.contentWindow.focus();frame.contentWindow.print();}catch(e){console.error('Print failed',e);}
    setTimeout(cleanup,15000);
  };
  document.body.appendChild(frame);
  frame.srcdoc=html;
}

function exportAsPdf(mdContent,title,subtitle){
  if(!mdContent||!mdContent.trim()){alert('Nothing to export yet.');return;}
  const html=buildPrintDoc(mdContent,title,subtitle);
  let win=null,winDoc=null;
  // v15.3: belt-and-suspenders. Same-origin about:blank cannot throw on .document access
  // (COOP governs cross-origin), but the read is wrapped so any exotic blocker/embedding
  // environment falls back to iframe printing instead of dying mid-export.
  try{win=window.open('','_blank');winDoc=win?win.document:null;}catch(e){win=null;winDoc=null;}
  if(!win||!winDoc){printViaIframe(html);return;}
  win.document.open();
  win.document.write(html);
  win.document.close();
  const fire=()=>{
    try{
      const btn=win.document.getElementById('lp-print');
      if(btn)btn.onclick=()=>win.print();
      win.focus();
      win.print();
    }catch(e){console.error('Print failed',e);}
  };
  // Long guides need a beat to lay out before the print engine measures pages.
  if(win.document.readyState==='complete')setTimeout(fire,350);
  else win.addEventListener('load',()=>setTimeout(fire,350),{once:true});
}

// Surfaces a MAX_TOKENS stop. The model prompt cannot prevent this — the cut happens

// A clickable fact-* reference. Renders anywhere a fact ID appears; opens the read-only
// inspector. Flagged as `.missing` (non-clickable) if the ID is not in the current KB.
function FactTag({factId,children}){
  const K=useKnowledge();const FI=useFactInspector();
  const id=String(factId||'');
  const known=K.factIndex?K.factIndex.has(id.toLowerCase()):false;
  if(!FI)return <span className="fact-tag">{children||id}</span>;
  if(!known)return <span className="fact-tag missing" title={`${id} is not in the current Knowledge Base`}>{children||id}</span>;
  return <button type="button" className="fact-tag" onClick={()=>FI.openFactInspector(id)} title={`Inspect ${id}`}>{children||id}</button>;
}

// Renders a run of text, turning every fact-NN token into a clickable FactTag.

// body scroll lock, focus restoration.

  const usage=useMemo(()=>factId&&K.artifactRegistry?getFactUsage(K.artifactRegistry,factId):{anki:[],nclex:[],cases:[]},[factId,K.artifactRegistry]);

  useEffect(()=>{
    if(!factId)return;
    returnFocusRef.current=document.activeElement;
    const onKey=e=>{if(e.key==='Escape'){e.preventDefault();FI.closeFactInspector();}};
    document.addEventListener('keydown',onKey);
    const prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
    const t=setTimeout(()=>{try{closeRef.current&&closeRef.current.focus();}catch(e){}},30);

      clearTimeout(t);
      try{returnFocusRef.current&&returnFocusRef.current.focus&&returnFocusRef.current.focus();}catch(e){}
    };
  },[factId,FI]);

  if(!factId)return null;
  const fact=found&&found.fact,condition=found&&found.condition;
  const doCopy=async(text)=>{await copyText(text);};

  return <>
    <div className="fact-drawer-scrim" onClick={()=>FI.closeFactInspector()}/>

            {usage.anki.map((a,i)=><div key={'a'+i} className="fd-usage-item">🗂 Anki note {a.label||a.id}</div>)}
            {usage.nclex.map((q,i)=><div key={'q'+i} className="fd-usage-item">✍️ {q.label||('NCLEX question '+q.id)}</div>)}

  </>;
}

const KB_EXTRACTION_PROMPT=`You are extracting a structured nursing knowledge base from ONE supplied source file.
Treat the supplied source as the sole source of truth. Do not add outside knowledge.
Return valid JSON only. Do not wrap the JSON in a markdown fence.

JSON SHAPE:
{
  "source":{"filename":"string"},
  "conditions":[{
    "name":"string",
    "aliases":["string"],
    "facts":[{
      "text":"string",
      "latteBucket":"BriefPatho|Look|Assess|Tests|Treatments|Educate",
      "subtype":"early|late|independent|dependent|acute|discharge|null",
      "factType":"mechanism|symptom|assessment|test|medication|intervention|education|threshold|contraindication|other",
      "safetyCritical":false,
      "tier":1,
      "sourceQuote":"verbatim source phrase, 20 words maximum",
      "sourcePointer":{"filename":"string","location":"page N or slide N"}
    }]
  }],
  "medications":[],
  "diagnostics":[],
  "scoringTools":[],
  "formulas":[],
  "contradictions":[]
}

PHASE 0 — INPUT HANDLING

- Clean repeated headers, footers, page numbers, offsets, citation markers, and artifact text internally.
- If duplicate content appears, keep it once unless the duplicate adds meaningful differences.
- Preserve the order of first appearance within each condition and LATTE bucket.
- Separate combined conditions. Do not invent diseases, values, thresholds, or missing facts.

PHASE 1 — LATTE ASSIGNMENT

Before returning JSON, assign every extractable fact to exactly one LATTE bucket.

BriefPatho = disease mechanism, etiology, classification, what is going wrong
Look = signs, symptoms, complaints, red flags, deterioration signs, observable side effects
Assess = what the nurse assesses, checks, asks, inspects, trends, monitors, sequences
Tests = labs, imaging, diagnostics, values, ranges, units, interpretations
Treatments = medications, doses, routes, timing, interventions, procedures, safety steps, contraindications, precautions, hold/notify thresholds
Educate = patient/family teaching, discharge teaching, home management, follow-up, when to seek care

Every fact must belong to exactly one LATTE bucket. If a sentence spans multiple buckets, split it into separate atomic facts.

Look vs Assess:
- Look = what is present.
- Assess = what the nurse does.

Quick bucket rules:
- drug mechanism of action stated in the source -> Treatments
- disease cause or etiology -> BriefPatho
- disease subtype or classification -> BriefPatho
- side effects and findings -> Look
- assessment actions -> Assess
- labs, values, ranges, and diagnostic interpretations -> Tests
- medications, interventions, precautions, and hold parameters -> Treatments
- home and discharge teaching -> Educate

PHASE 1.25 — FAST-REVIEW LANGUAGE

Rewrite long source wording into concise review language.
Target style: compressed, punchy, minimal, non-fluffy, easy to scan, and still precise.
Do not write essay-like facts.

COVERAGE-OVER-COMPRESSION RULE

If compression would drop a threshold, qualifier, timing, route, population, exception, or condition that changes meaning, do not compress it away.
Keep the qualifier in the same fact or split the content into multiple atomic facts.

Details that must not be lost:
- exact dose and unit
- frequency and route
- timing and duration
- hold and notify thresholds
- population or person to whom the instruction applies
- when to seek care
- contraindication condition
- comparison words such as increased, decreased, high, low, above, and below

PHASE 1.5 — ATOMICITY

Each fact should contain one tightly linked clinical idea.
Split when:
- a sentence contains unrelated facts
- the facts matter independently
- one item would become a list-recall prompt
- brevity would otherwise omit a qualifier needed for full meaning

Combine only when facts are naturally linked, such as:
- drug + dose + route
- threshold + required action
- a clinically taught pair where one fact is necessary to interpret the other

SOURCE POINTER RULES

- Use the actual filename in every source pointer.
- Never use generic labels such as File 1, Source 1, the textbook, or the slides.
- Preserve the page or slide location whenever it can be determined.
- For every fact, preserve a short verbatim sourceQuote of no more than 20 words containing the supporting fact, value, or rule.
- The sourceQuote must be copied from the supplied source, not rewritten. If no clean quote can be recovered, use an empty string rather than inventing one.
- Every numeric value, dose, route, threshold, timeframe, contraindication, emergency finding, and safety instruction must carry a source pointer.
- Do not silently correct or modernize source content.
- When two source statements conflict within this file, preserve both and add a concise item to contradictions.

TIER RULES

Every fact receives exactly one tier.

Tier 1 = must-know for exams: core concepts, hallmark findings, priority nursing interventions, safety concerns, major labs, major medications and critical parameters, key complications, and essential teaching.
Tier 2 = important supporting detail: secondary findings, additional monitoring, less common but testable adverse effects, supporting pathophysiology, supporting interpretations, and additional teaching.
Tier 3 = useful lower-priority context: minor details, rare exceptions, deep mechanisms, exhaustive list completions, and edge-case qualifiers.

Assignment safeguards:
- When uncertain, round up in priority rather than down.
- Drug names, doses, routes, hold parameters, notify thresholds, contraindications, and safety warnings are always Tier 1.
- Patient education about when to seek emergency care is always Tier 1.
- Do not omit Tier 3 facts. Tiering is for prioritization, not extraction filtering.

FINAL VALIDATION BEFORE RETURNING JSON

Silently verify:
- every fact belongs to exactly one valid LATTE bucket
- no fact lost a clinically meaningful qualifier
- combined conditions were split
- every fact has one tier
- safety-critical and numerical facts have actual filename pointers
- each fact has a verbatim sourceQuote when the source text allows one
- no outside facts were introduced
- the response is valid JSON matching the required shape`;

// Second-pass omission audit. Fresh attention on the same chunk beats a same-call

// Focus context for the Knowledge Base. Two modes, because "tailor this" means two
// incompatible things at the extraction layer:
//   prioritize — extract everything, demote out-of-scope content to Tier 3 (non-destructive)
//   scope      — skip out-of-scope content entirely (smaller/cheaper, but lossy and permanent)

// effort "recovering" exactly the content the scope filter was told to drop.
function kbBuildFocusBlock(outcomes,points,extra,mode){

  if(String(points||'').trim())seg.push('POINTS (specific content that must be covered):\n'+points.trim());
  if(String(extra||'').trim())seg.push('ADDITIONAL CONTEXT:\n'+extra.trim());
  if(!seg.length)return'';
  const rules=mode==='scope'?
`HOW TO APPLY THIS FOCUS CONTEXT — SCOPE MODE (deliberately restrictive):
- Extract ONLY content that supports a listed outcome or point, plus the background a student needs to understand it.
- Content in this chunk that is clearly unrelated to every listed outcome and point should be SKIPPED. Skipping it is correct and expected in this mode, and does not violate the zero-skip rules above.
- If this chunk contains no in-scope content at all, return {"conditions":[]}. An empty result is a valid answer here.
- Within in-scope content, every completeness rule above still applies at FULL strength: every numeric value, dose, route, threshold, contraindication, and teaching point.
- When you cannot tell whether something is in scope, INCLUDE it. Ambiguity always resolves toward inclusion.`
:
`HOW TO APPLY THIS FOCUS CONTEXT — PRIORITIZE MODE (nothing is skipped):
- Extract the source COMPLETELY. Do NOT omit content because it falls outside the focus context. Every zero-skip rule above still applies in full.
- Use the focus context ONLY to steer tier assignment:
  - Content matching a listed outcome or point is Tier 1.
  - Content related to the focus but not directly named keeps its normal tier.
  - Content clearly unrelated to every listed outcome and point is Tier 3.
- Clearly out-of-scope content is Tier 3 even when it is a drug, dose, threshold, or safety warning. This deliberately overrides the "always Tier 1" tier rules above, and applies ONLY to content unrelated to every listed outcome and point.
- Every listed outcome and point that this source actually covers must be represented by at least one extracted fact.`;
  return'\n\n═══ STUDENT-PROVIDED FOCUS CONTEXT ═══\n'+seg.join('\n\n')+'\n\n'+rules+'\n═══════════════════════════════════════\n';
}

// Underextraction flag: relative density (facts per 1000 chars) against the run's own
// median, plus absolute floors. Diagnostics only — never added to the knowledge base.
function kbFlagUnderextraction(stats,scoped){
  const valid=stats.filter(s=>!s.failed&&s.chars>=1500);
  const dens=valid.map(s=>s.facts/(s.chars/1000)).sort((a,b)=>a-b);
  const med=dens.length?dens[Math.floor(dens.length/2)]:0;
  return stats.map(s=>{
    const density=s.chars?s.facts/(s.chars/1000):0;
    let flag=null;
    if(s.failed)flag='failed';
    // In scope mode a thin or empty chunk is the filter working, not a defect. Density
    // comparisons are meaningless once output is deliberately restricted, so only the
    // empty case is surfaced — and as a "confirm this" prompt, not a warning.
    else if(scoped)flag=(s.chars>=1500&&s.facts===0)?'scoped-zero':null;
    else if(s.chars>=1500&&s.facts===0)flag='zero';
    else if(s.chars>=1500&&density<0.25)flag='sparse';
    else if(valid.length>=3&&med>0&&s.chars>=1500&&density<med*0.5)flag='below-median';
    return{...s,density,flag};
  });
}
const KB_FLAG_LABEL={failed:'extraction failed',zero:'no facts returned',sparse:'very low fact density',['below-median']:'well below run median',['scoped-zero']:'no in-scope content — confirm that is correct'};
// Per-condition LATTE bucket gaps. Informational: a source may legitimately carry no

function kbBucketGaps(kb){

}


function kbSlug(s){return String(s||'item').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function kbFactKey(f){return [f.latteBucket||'',f.subtype||'',String(f.text||'').toLowerCase().replace(/[^a-z0-9.%/<>-]+/g,' ').trim()].join('|');}
function mergeLatteParts(parts,course='',exam=''){

      const names=[c.name,...aliases].map(x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()).filter(Boolean);
      let target=null,key=null;
      for(const [k,v] of map){const known=[v.name,...v.aliases].map(x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim());if(names.some(n=>known.includes(n))){target=v;key=k;break;}}

      target.aliases=[...new Set([...target.aliases,...aliases])];
      const existing=new Map(target.facts.map(f=>[kbFactKey(f),f]));
      for(const raw of c.facts||[]){
        if(!raw||!String(raw.text||'').trim())continue;
        const k=kbFactKey(raw),src=raw.sourcePointer?[raw.sourcePointer]:[];
        if(existing.has(k)){
          const f=existing.get(k);f.sources=[...new Map([...(f.sources||[]),...src].map(x=>[(x.filename||'')+'|'+(x.location||''),x])).values()];
        }else{
          const f={...raw,id:'fact-'+(++factN),sourceQuote:String(raw.sourceQuote||'').trim(),tier:[1,2,3].includes(Number(raw.tier))?Number(raw.tier):(raw.safetyCritical?1:2),sources:src};delete f.sourcePointer;target.facts.push(f);existing.set(k,f);
        }

}
// ── Imported-KB sanitizer (structural; runs BEFORE anything enters app state) ──
// An imported file is untrusted input. Previously only `Array.isArray(conditions)` was
// checked and the raw object was committed straight to state and localStorage, so
// {"conditions":[null,12,{"facts":"nope"}]} passed and detonated later during render.
// This coerces to a known shape, drops unusable entries, and reports what it dropped.
const KB_IMPORT_MAX_BYTES=25*1024*1024;

// key skip is what does the work.)

  const dropped={conditions:0,facts:0};

    if(!c0||typeof c0!=='object'||Array.isArray(c0)){dropped.conditions++;continue;}
    const c=_kbSafeKeys(c0);

      const f=_kbSafeKeys(f0);

        id:_kbStr(f.id,60)||'',
        text,tier,
        latteBucket:KB_BUCKETS.includes(f.latteBucket)?f.latteBucket:'Look',
        subtype:f.subtype==null?null:_kbStr(f.subtype,60),
        factType:_kbStr(f.factType,60)||'other',

        sources:Array.isArray(f.sources)?f.sources.slice(0,50).filter(s=>s&&typeof s==='object').map(s=>{const x=_kbSafeKeys(s);return{filename:_kbStr(x.filename,300),location:_kbStr(x.location,300)};}):[],

  }

  // the imported file had duplicates, gaps, or none at all.

  const arr=k=>Array.isArray(src[k])?src[k].slice(0,5000).map(x=>x&&typeof x==='object'&&!Array.isArray(x)?_kbSafeKeys(x):x):[];

    metadata:{course:_kbStr(meta.course,300),exam:_kbStr(meta.exam,300),createdAt:_kbStr(meta.createdAt,80),schemaVersion:_kbStr(meta.schemaVersion,20)||'1.1'},
    sources:Array.isArray(src.sources)?src.sources.slice(0,500):[],
    conditions,
    medications:arr('medications'),diagnostics:arr('diagnostics'),scoringTools:arr('scoringTools'),
    formulas:arr('formulas'),contradictions:arr('contradictions'),

}

const KB_DB_NAME='latte-study-suite';
const KB_DB_VERSION=1;
const KB_DB_STORE='knowledge';
const KB_DB_KEY='active';
function kbOpenDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window))return reject(new Error('IndexedDB is unavailable in this browser.'));
    const req=indexedDB.open(KB_DB_NAME,KB_DB_VERSION);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(KB_DB_STORE))db.createObjectStore(KB_DB_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Could not open IndexedDB.'));

async function kbLoadPersisted(){

}

function validateLatteKnowledgeBase(kb){
  const issues=[];
  const buckets=new Set(['BriefPatho','Look','Assess','Tests','Treatments','Educate']);
  const ids=new Set();
  for(const c of kb.conditions||[]){
    if(!String(c.name||'').trim())issues.push({severity:'error',message:'A condition is missing its name.'});
    if(!(c.facts||[]).length)issues.push({severity:'warning',condition:c.name,message:'Condition has no extracted facts.'});
    for(const f of c.facts||[]){
      if(ids.has(f.id))issues.push({severity:'error',condition:c.name,factId:f.id,message:'Duplicate fact ID.'});

function kbForNCLEX(kb,{tiers=[1,2,3],buckets=null,conditionQuery=''}={}){

// ── KB source chunking (unit-based: one unit = one page or one slide) ──
// Splitting on unit boundaries keeps a page intact, gives every chunk a truthful
// page/slide label, and lets a truncated chunk be halved and retried losslessly.
function kbUnitLabel(units){
  if(!units||!units.length)return'chunk';
  const a=units[0],b=units[units.length-1];

async function kbSourceUnits(file,{signal,onProgress}={}){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.pptx')){
    const text=await extractPptxText(file);
    // v15: split on the slide markers extractPptxText actually emits. v14 split on
    // /(fact-\d+)/gi (FactText's regex, pasted here), which collapsed every deck into ONE
    // unit mislabeled "slide 1", broke per-slide source pointers, ignored the chunk-size
    // setting, and made kbSplitChunk's MAX_TOKENS halving impossible. The number match is
    // deliberately un-anchored: each part begins with the "\n" the extractor emits.
    const parts=String(text||'').split(/(?=--- SLIDE \d+ ---)/g).filter(p=>p.trim());
    if(!parts.length)return[];
    return parts.map((t,i)=>{const m=t.match(/--- SLIDE (\d+) ---/);return{kind:'slide',n:m?parseInt(m[1],10):i+1,text:t};});
  }
  if(name.endsWith('.pdf')){
    const pdf=await getPdfDoc(file),units=[];
    for(let i=1;i<=pdf.numPages;i++){
      // Cancel used to be dead during this pre-scan: a 900-page book had to finish
      // being read before the button did anything.
      if(signal?.aborted)throw new DOMException('Aborted','AbortError');
      const pg=await pdf.getPage(i),tc=await pg.getTextContent();
      // v15.4: was tc.items.map(x=>x.str).join(' ') — the app's best extractor already
      // existed 40 lines away and only the NCLEX tab used it.
      units.push({kind:'page',n:i,text:'\n--- PAGE '+i+' ---\n'+pdfLayoutText(tc)});
      // Release the page's operator list / font data instead of holding every page
      // object alive until the whole document is scanned.
      try{pg.cleanup();}catch(e){}
      if(onProgress&&(i%10===0||i===pdf.numPages))onProgress(i,pdf.numPages);
    }
    return units;
  }

}
// Group units into chunks, carrying `overlap` trailing units of the previous chunk
// forward. Overlap is free of duplicate cost: mergeLatteParts keys facts by
// bucket+subtype+normalized text, so a fact seen in both chunks merges into one
// entry with its source pointers unioned. Without overlap, a condition straddling
// a chunk seam is extracted twice from half its context.
function kbGroupUnits(units,maxChars,overlap){
  if(!units||!units.length)return[];
  const groups=[];let cur=[],len=0;
  for(let i=0;i<units.length;i++){
    if(cur.length&&len+units[i].text.length>maxChars){groups.push(cur);cur=[];len=0;}
    cur.push(i);len+=units[i].text.length;
  }
  if(cur.length)groups.push(cur);
  return groups.map((g,gi)=>{
    let idx=g;
    if(gi>0&&overlap>0){
      const prev=groups[gi-1],carry=prev.slice(Math.max(0,prev.length-overlap)),have=new Set(idx);
      idx=[...carry.filter(x=>!have.has(x)),...idx];
    }
    const u=idx.map(x=>units[x]);
    return{text:u.map(x=>x.text).join('\n'),label:kbUnitLabel(u),units:u};
  });
}
// Halve a chunk on a unit boundary so a MAX_TOKENS truncation can be retried
// instead of discarded. Returns null when the chunk is a single indivisible unit.
function kbSplitChunk(chunk){
  const u=(chunk&&chunk.units)||[];
  if(u.length<2)return null;
  const mid=Math.ceil(u.length/2);
  return[u.slice(0,mid),u.slice(mid)].map(part=>({text:part.map(x=>x.text).join('\n'),label:kbUnitLabel(part),units:part}));
}
async function kbBuildSourceChunks(file,maxChars=45000,overlap=1,opts){
  const units=await kbSourceUnits(file,opts);

  // rather than billing them for a run over a page of nothing.
  if(opts&&opts.onQuality){try{const q=kbTextQuality(units);if(q)opts.onQuality(q);}catch(e){}}

// Verify a model-supplied verbatim quote actually occurs in the source chunk.
