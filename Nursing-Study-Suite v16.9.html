            let verdict;
            try{
              const out=await ownedCallGemini(cfg.apiKey,aModel,[{text:itemBuildAuditPrompt(payload)}],{thinkingLevel:aLevel,signal:ctl.signal,retries:AUDIT_RETRIES});
              verdict=itemParseAuditVerdict(out);
            }catch(e){
              if(e.name==='AbortError')throw e;
              // v15.7: see the NCLEX audit — stop after two quota failures instead of
              // spending minutes confirming the allowance is still gone.
              if(isQuotaError(e)&&++quotaFails>=2)throw Object.assign(new Error('API quota exhausted'),{name:'QuotaStop'});
              verdict={status:'ERROR',criterion:'',detail:e.message||String(e),warns:[],autoRepairable:false};
            }
            done++;
            owned_setAudit(p=>({...(p||{}),[it.key]:verdict}));
            owned_setAuditPhase('audit '+done+'/'+eligible.length);
            return{...it,...verdict};
          },ctl.signal);
          }catch(e){
            if(e.name!=='QuotaStop')throw e;
            results=(e.partial||[]).filter(Boolean); // keep the verdicts already paid for
            auditInterrupted=true;
            if(generatorSlot.current.current(operation))setAuditState('interrupted');
            owned_log('⚠ Audit stopped early — your Gemini API quota is exhausted. The case itself is complete and still passed its grounding checks; only the optional item review was cut short. Wait for your quota to reset, switch the "Item quality · audit" profile to Flash, or turn the audit off.','err');
          }

          const sum=itemAuditSummary(results.concat(Object.values(seed)));
          owned_log('Audit: '+sum.pass+' pass · '+sum.fail+' fail · '+sum.review+' review'+(sum.error?' · '+sum.error+' error':'')+(sum.na?' · '+sum.na+' N/A':'')+'.',sum.fail?'err':'ok');
          for(const r of results){
            if(r.status==='FAIL')owned_log('  ✗ Stage '+r.stageNumber+' '+(r.q.id||'')+' FAIL — '+r.criterion,'err');
            else if(r.status==='REVIEW')owned_log('  ? Stage '+r.stageNumber+' '+(r.q.id||'')+' REVIEW — '+(r.detail||'unresolved'),'warn');
            for(const w of r.warns||[])owned_log('  ⓘ Stage '+r.stageNumber+' '+(r.q.id||'')+' WARN '+w.criterion+': '+w.detail,'warn');
          }

          // ── Repair, one round only ──
          const accuracyFails=results.filter(r=>r.status==='FAIL'&&!r.autoRepairable);
          const repairable=results.filter(r=>r.autoRepairable);
          for(const r of accuracyFails)
            owned_log('  ⚠ Stage '+r.stageNumber+' '+(r.q.id||'')+' failed on answer accuracy — NOT auto-repaired. This is the one criterion where the reviewer overrules a keyed answer with no reference standard; it needs your eyes.','err');
          if(repairable.length){
            owned_setAuditPhase('repair');
            owned_log('Repairing '+repairable.length+' item(s) in a fresh call (one round, no re-audit)...','warn');
            let repaired=0;
            await itemRunPool(repairable,AUDIT_POOL_WIDTH,async(r)=>{
              try{
                const visible=caseAuditPayload(parsed,r.stageNumber,r.q);
                const out=await ownedCallGemini(cfg.apiKey,model,[{text:caseBuildRepairPrompt({
                  conditionName:activeCondition.name,facts:selectedFacts,stageNumber:r.stageNumber,
                  q:r.q,criterion:r.criterion,visibleContext:visible})}],
                  {thinkingLevel:level,signal:ctl.signal,retries:1,generationConfig:{responseMimeType:'application/json'}});
                const fixed=extractJSON(out);
                if(!fixed||!fixed.stem||!Array.isArray(fixed.options))throw new Error('repair returned no usable item');
                // v15.14: rebuild rather than mutate. `parsed` is the SAME object already
                // handed to owned_setCaseStudy above, so st.questions[ix]=fixed wrote straight into
                // React state. caseMd/casePrintMd are useMemo'd on [caseStudy,...] and cannot
                // see a mutation; today they recompute only because owned_setIssues happens to fire
                // afterwards and happens to be in their dependency list. Reorder that, or add
                // a React.memo, and the EXPORT silently ships pre-repair item text while the
                // screen shows the repaired one. There is no await between the read and the
                // write below, so the swap stays atomic across the pool's lanes.
                const stIx=(parsed.stages||[]).findIndex(s=>Number(s.stageNumber)===Number(r.stageNumber));
                const st=stIx>=0?parsed.stages[stIx]:null;
                const ix=(st&&st.questions||[]).findIndex(x=>String(x.id||'')===String(r.q.id||''));
                if(!st||ix<0)throw new Error('could not locate the item to replace');
                const note=fixed.repairNote||'';
                delete fixed.repairNote;
                // v15.17: malformed or ungrounded repairs cannot replace the prior usable case.
                const candidate={...parsed,stages:parsed.stages.map((s,si)=>si!==stIx?s:{...s,questions:s.questions.map((q,qi)=>qi!==ix?q:fixed)})};
                if(fixed.id!==r.q.id||fixed.type!==r.q.type||revalidate(candidate).some(i=>i.sev==='error'))throw new Error('repair failed the captured case contract; original kept');
                parsed=candidate;
                owned_setCaseStudy(parsed);
                repaired++;
                // Keep the panel honest: the old FAIL described text that no longer exists.
                owned_setAudit(p=>({...(p||{}),[r.key]:{status:'REPAIRED',criterion:r.criterion,
                  detail:'rewritten after failing; not re-audited',warns:[]}}));
                owned_log('  ✓ Stage '+r.stageNumber+' '+(r.q.id||'')+' repaired'+(note?' — '+note:''),'ok');
              }catch(e){
                if(e.name==='AbortError')throw e;
                owned_log('  ✗ Stage '+r.stageNumber+' '+(r.q.id||'')+' repair failed: '+(e.message||e),'err');
              }
            },ctl.signal);
            if(repaired){
              // Re-validate the repaired case. Repaired items are deliberately NOT re-audited:
              // the loop is capped at one round, and anything still failing is surfaced instead.
              allIssues=revalidate(parsed);
              owned_setIssues(allIssues);
              errCount=allIssues.filter(x=>x.sev==='error').length;
              owned_log('Re-validated after repair: '+errCount+' error(s), '+(allIssues.length-errCount)+' warning(s).',errCount?'err':'ok');
              if(errCount)owned_log('A repaired item broke grounding. The case is shown but was NOT linked into the Fact Inspector.','err');
            }
          }
          owned_setAuditPhase('');
        }
      }else if(runAudit&&errCount){
        owned_log('Audit skipped: the case has '+errCount+' structural error(s). Fix grounding first — a rubric review of an ungrounded item spends quota to grade a known failure.','warn');
      }
      // Coverage counts only the intersection with the packet, so it can never report more
      // facts grounded than were actually supplied.
      const cited=new Set(caseAllFactIds(parsed));
      const usedSelected=new Set([...cited].filter(id=>allowedFactIds.has(id)));
      const outOfPacket=[...cited].filter(id=>!allowedFactIds.has(id));
      owned_setCoverage({selected:selectedFacts.length,used:usedSelected.size,outOfPacket,
        uncovered:selectedFacts.filter(f=>!usedSelected.has(String(f.id).toLowerCase()))});
      // A case that failed validation is still shown and exportable (you may want to inspect
      // or hand-correct it), but it must NOT enter the registry: once a fact badge appears in
      // the inspector it reads as verified provenance, and linking an invalid case there would
      // make a fabrication look audited.
      if(K.registerArtifact&&errCount===0){
        // Namespaced per case. Models reuse ids like "q1" for every case they write, so an
        // un-namespaced key would silently merge two different questions' provenance.
        const caseId='case-'+Date.now().toString(36)+'-'+uid().slice(0,6);
        const title=parsed.title||activeCondition.name;
        // v15.1: stage data and question rationales get SEPARATE registry entries. v15
        // seeded every question's entry with the whole stage's data facts, so the Inspector
        // claimed all of a stage's findings were "used in" each question. Now "Stage N
        // clinical data" carries the presented findings, and a question entry carries only
        // the facts its own rationales actually cite — honest question-level provenance.
        const entries=[];let qi=0;const claimed=new Set();
        for(const stage of parsed.stages||[]){
          const stageData=new Set();
          for(const d of stage.data||[])for(const id of d.factIds||[])stageData.add(String(id).toLowerCase());
          stageData.forEach(id=>claimed.add(id));
          if(stageData.size)entries.push({id:caseId+':'+stage.stageNumber+':data',caseId,
            factIds:[...stageData],label:title+' — Stage '+stage.stageNumber+' clinical data'});
          for(const q of stage.questions||[]){
            qi++;
            const ids=new Set();
            for(const r of q.rationales||[])for(const id of r.factIds||[])ids.add(String(id).toLowerCase());
            ids.forEach(id=>claimed.add(id));
            if(ids.size)entries.push({id:caseId+':'+stage.stageNumber+':'+(q.id||('q'+qi)),caseId,
              factIds:[...ids],label:title+' — Stage '+stage.stageNumber+' '+(q.id||('Q'+qi))});
          }
        }
        // Facts used only in narrative framing, background, or the debrief would otherwise
        // never appear under "Used in" — catch the residue in one case-level entry.
        const residual=[...cited].filter(id=>!claimed.has(id));
        if(residual.length)entries.push({id:caseId+':case',caseId,factIds:residual,label:title+' — case context / debrief'});
        publishArtifact('caseStudies',entries,{merge:true});
      }
      owned_log('✅ Case generated: '+parsed.stages.length+' stages, '+(parsed.stages||[]).reduce((n,s)=>n+((s.questions||[]).length),0)+' questions.','ok');
      owned_log('Validation: '+errCount+' error(s), '+(allIssues.length-errCount)+' warning(s). Coverage: '+usedSelected.size+'/'+selectedFacts.length+' supplied facts grounded.',errCount?'err':'ok');
      if(outOfPacket.length)owned_log('⚠ '+outOfPacket.length+' cited fact ID(s) were never supplied to this run: '+outOfPacket.slice(0,6).join(', ')+(outOfPacket.length>6?'…':''),'err');
      if(errCount)owned_log('Case failed validation — it is shown and exportable, but was NOT linked into the Fact Inspector. Fix the errors or regenerate before using it as study content.','err');
      if(generatorSlot.current.current(operation))setAuditState(runAudit?(auditInterrupted?'interrupted':'complete'):'disabled');
    }catch(e){
      if(generatorSlot.current.owns(operation))setAuditState(e.name==='AbortError'?'interrupted':'failed');
      if(e.name==='AbortError')owned_log('Cancelled.','warn');else owned_log('Error: '+(e.message||String(e)),'err');
    }finally{if(generatorSlot.current.finish(operation)){setBusy(false);setAbortCtl(null);setLiveKB(0);setAuditPhase('');}}
  },[cfg,activeCondition,selectedFacts,sufficiency,difficulty,stages,questionsPerStage,types,K,runAudit]);

  // v15.6: audit verdicts joined back to their items for display.
  // NOTE: deriving the rows does NOT by itself keep them fresh — the verdict map is written
  // once during the audit, so a repair must explicitly restamp its entry as REPAIRED. An
  // earlier comment here claimed staleness was impossible; it was not, and that claim is
  // what masked the stale-verdict bug fixed in v15.8.
  const auditRows=useMemo(()=>{
    if(!caseStudy||!audit)return[];
    return caseGateItems(caseStudy).map(it=>{
      const v=audit[it.key];
      if(!v)return null;
      return{key:it.key,label:'Stage '+it.stageNumber+' '+(it.q.id||''),
        status:v.status,criterion:v.criterion||'',detail:v.detail||'',warns:v.warns||[]};
    }).filter(Boolean);
  },[caseStudy,audit]);
  const auditTotals=useMemo(()=>{
    const n=s=>auditRows.filter(r=>r.status===s).length;
    return{pass:n('PASS'),fail:n('FAIL'),repaired:n('REPAIRED'),review:n('REVIEW'),na:n('N/A'),error:n('ERROR'),
      accuracyFails:auditRows.filter(r=>r.status==='FAIL'&&itemAuditIsAnswerAccuracy(r.criterion)).length};
  },[auditRows]);

  // The audit-trail view carries the provenance stamp; the printable student view does not.
  const exportNotice=useMemo(()=>artifactExportNotice({source:artifactSource,activeKB:K.knowledgeBase,requested:artifactSource?.requested,actual:(caseStudy?.stages||[]).reduce((n,s)=>n+(s.questions||[]).length,0),auditRequested:artifactSource?.auditRequested,auditState,rows:auditRows}),[artifactSource,K.knowledgeBase,caseStudy,auditState,auditRows]);
  const caseMd=useMemo(()=>caseStudy?exportNotice+caseValidationStamp(issues)+(provenance?latteProvenanceStamp(provenance):'')+caseToMarkdown(caseStudy):'',[caseStudy,issues,provenance,exportNotice]);
  const casePrintMd=useMemo(()=>caseStudy?exportNotice+caseValidationStamp(issues)+caseToMarkdown(caseStudy,{worksheetFactIds:false}):'',[caseStudy,issues,exportNotice]);
  // Every checkbox can be unchecked, which would send the model an empty type list.
  const enabledTypeCount=Object.values(types).filter(Boolean).length;
  const canRun=cfg.apiKey&&conditions.length&&enabledTypeCount>0&&!busy;
  const errCount=issues.filter(x=>x.sev==='error').length;

  return(
    <ArtifactSourceCtx.Provider value={artifactSource}><div className="tool-panel">
      {artifactSource&&!artifactSourceCurrent(artifactSource,K.knowledgeBase)&&<div className="error-banner">Earlier Knowledge Base: this output and its coverage belong to the original source. Current fact links are disabled.</div>}
      <h2 className="tool-title">🩺 Clinical Case Study Generator</h2>
      {invalidCaseRaw&&<div className="error-banner"><div><strong>Invalid case response</strong><ul>{issues.map((x,i)=><li key={i}>{x.msg}</li>)}</ul><button className="btn-secondary" onClick={()=>exportAsTxt('VALIDATION FAILED\n'+invalidCaseRaw,'LATTE-Case-Study-invalid.txt')}>Export invalid response</button><pre style={{whiteSpace:'pre-wrap',maxHeight:400,overflow:'auto'}}>{invalidCaseRaw}</pre></div></div>}
      <p className="tool-desc">Generate source-grounded unfolding nursing cases from the shared LATTE Knowledge Base. Every clinical datum, answer, and rationale is validated against real fact IDs in code.</p>

      {!conditions.length&&!caseStudy?<div className="tip-banner" style={{color:'var(--accent-warm)'}}>No Knowledge Base loaded. Open <strong>Knowledge</strong> and build it from your source files first — the case generator reads facts, never PDFs.</div>:<>

      <div className="tip-banner">Reuses the NCLEX Generator's item-quality rules (distractor plausibility, per-option rationales, anchor grounding, completeness) plus a strict source-boundary policy so the model cannot invent labs, doses, comorbidities, or diagnoses.</div>

      {/* Condition + fact scope */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Condition & Fact Scope</div>
        <div className="field-block" style={{marginBottom:10}}>
          <label htmlFor="case-condition">Condition</label>
          <select id="case-condition" value={conditionId} onChange={e=>setConditionId(e.target.value)}>
            {conditions.map(c=><option key={c.id} value={c.id}>{c.name} ({(c.facts||[]).length} facts)</option>)}
          </select>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:12,color:'var(--text-dim)',marginRight:3}}>Fact tiers:</span>
          <span className="tier-btn t1 active" style={{cursor:'default'}}><b>Tier 1</b> always</span>
          <button type="button" className={'tier-btn t2'+(includeTier2?' active':'')} aria-pressed={includeTier2} onClick={()=>setIncludeTier2(v=>!v)}><b>Tier 2</b> context</button>
          <button type="button" className={'tier-btn t3'+(includeTier3?' active':'')} aria-pressed={includeTier3} onClick={()=>setIncludeTier3(v=>!v)}><b>Tier 3</b> distractors</button>
        </div>
        <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5}}>Tier 1 facts drive the critical decisions. Tier 2 adds realistic context; Tier 3 adds lower-priority background detail. Distractors are built from contextually plausible near-misses at any tier, not from Tier 3. <b style={{color:'var(--text)'}}>{selectedFacts.length}</b> fact(s) selected for this case.</div>
        {sufficiency.warnings.length>0&&<div className="tip-banner" style={{marginTop:10,marginBottom:0,fontSize:12,lineHeight:1.5}}>⚠ {sufficiency.warnings.join(' · ')} The generator will not invent to fill these gaps.</div>}
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:12,cursor:'pointer'}}>
            <input type="checkbox" checked={runAudit} onChange={()=>setRunAudit(v=>!v)} style={{marginTop:2}} />
            <span>
              <b>Run the item-quality audit</b> after generating
              <span style={{display:'block',fontSize:12,color:'var(--text-dim)',lineHeight:1.5,marginTop:3}}>
                A second review pass over each single-best-answer MCQ, checked against 11 stop criteria adapted from the NEIA scoring tool. Costs one extra API call per MCQ. Items that fail are rewritten once — except answer-accuracy failures, which are surfaced for you rather than auto-corrected.
              </span>
            </span>
          </label>
        </div>
      </div>

      {/* Case shape */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Case Shape</div>
        <div className="form-grid form-grid-three" style={{marginBottom:12}}>
          <div className="field-block" style={{margin:0}}><label htmlFor="case-difficulty">Difficulty</label>
            <select id="case-difficulty" value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
              <option value="foundational">Foundational</option>
              <option value="exam">Exam-level</option>
              <option value="advanced">Advanced</option>
            </select></div>
          <div className="field-block" style={{margin:0}}><label htmlFor="case-stages">Stages</label>
            <select id="case-stages" value={stages} onChange={e=>setStages(parseInt(e.target.value))}>
              <option value={3}>3</option><option value={4}>4</option><option value={5}>5</option>
            </select></div>
          <div className="field-block" style={{margin:0}}><label htmlFor="case-questions-per-stage">Questions / stage</label>
            <select id="case-questions-per-stage" value={questionsPerStage} onChange={e=>setQuestionsPerStage(parseInt(e.target.value))}>
              <option value={2}>2</option><option value={3}>3</option><option value={4}>4</option>
            </select></div>
        </div>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--text-dim)',marginBottom:8}}>Question types to include</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {[['mcq','Multiple choice'],['sata','SATA'],['prioritization','Prioritization'],['ordering','Ordered response'],['calculation','Calculation (when sourced)'],['education','Patient education']].map(([k,lbl])=>
            <label key={k} style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:types[k]?'var(--text)':'var(--text-dim)',cursor:'pointer',userSelect:'none'}}>
              <input type="checkbox" checked={types[k]} onChange={()=>toggleType(k)} style={{accentColor:'var(--accent)'}}/>{lbl}
            </label>)}
        </div>
      </div>

      <button className="btn-primary" style={{width:'100%'}} disabled={!canRun} onClick={run}>
        {busy?'⟳ Generating case...':!cfg.apiKey?'Enter API Key':!enabledTypeCount?'Select at least one question type':'▶ Generate Case Study'}
      </button>
      {!enabledTypeCount&&<div style={{fontSize:12,color:'var(--accent-warm)',marginTop:6}}>Select at least one question type above.</div>}

      {busy&&<button className="btn-danger" style={{width:'100%',marginTop:10}} onClick={()=>abortCtl?.abort()}>Cancel</button>}
      {busy&&liveKB>0&&<div style={{fontSize:12,color:'var(--accent-cyan)',fontFamily:'JetBrains Mono',marginTop:6}}>▼ receiving {liveKB} KB</div>}
      {busy&&auditPhase&&<div style={{fontSize:12,color:'var(--accent-warm)',fontFamily:'JetBrains Mono',marginTop:6}}>⚖ {auditPhase==='repair'?'repairing failed items':auditPhase.startsWith('audit ')?'item-quality audit '+auditPhase.slice(6):'item-quality audit'}</div>}

      {/* Logs */}
      {logs.length>0&&<div style={{marginTop:12,maxHeight:150,overflowY:'auto',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:10,fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.6}}>
        {logs.map((l,i)=><div key={i} style={{color:l.t==='err'?'var(--accent-red)':l.t==='ok'?'var(--accent-green)':l.t==='warn'?'var(--accent-warm)':'var(--text-dim)'}}>{l.msg}</div>)}
      </div>}

      {/* Validation panel */}
      {caseStudy&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(errCount?'var(--error-border)':issues.length?'var(--warning-border)':'var(--success-border)'),background:errCount?'var(--error-bg)':issues.length?'var(--warning-bg)':'var(--success-bg)'}}>
        <span style={{fontSize:12,fontWeight:600,color:errCount?'var(--accent-red)':issues.length?'var(--accent-warm)':'var(--accent-green)'}}>
          {errCount?'⚠':issues.length?'⚑':'✓'} Validation: {errCount} error(s), {issues.length-errCount} warning(s)
          {coverage&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {coverage.used}/{coverage.selected} selected facts grounded</span>}
        </span>
        <div style={{fontSize:12,color:'var(--text-dim)',marginTop:5}}>Structural checks, unknown-fact-ID checks, and stage-timing all run in code against the current Knowledge Base — not on the model's word.</div>
        {issues.length>0&&<div style={{marginTop:8,maxHeight:170,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {issues.map((x,i)=><div key={i} style={{fontSize:12,fontFamily:'JetBrains Mono',lineHeight:1.6,color:x.sev==='error'?'var(--accent-red)':'var(--accent-warm)'}}>{x.sev==='error'?'✕':'⚠'} {x.msg}</div>)}
        </div>}
        {coverage&&coverage.outOfPacket&&coverage.outOfPacket.length>0&&<div style={{fontSize:12,color:'var(--accent-red)',marginTop:7,lineHeight:1.5}}>{coverage.outOfPacket.length} cited fact ID(s) were never supplied to this run: {coverage.outOfPacket.slice(0,8).join(', ')}{coverage.outOfPacket.length>8?'…':''}</div>}
        {coverage&&coverage.uncovered.length>0&&<div style={{fontSize:12,color:'var(--text-dim)',marginTop:7,lineHeight:1.5}}>{coverage.uncovered.length} supplied fact(s) were not referenced by the case — that is expected; a single case cannot use every fact.</div>}
        {errCount>0&&<div style={{fontSize:12,color:'var(--accent-red)',marginTop:8,lineHeight:1.5,paddingTop:8,borderTop:'1px solid var(--border)'}}>This case was <b>not</b> linked into the Fact Inspector. Export is still available, and the exported file is stamped with these errors.</div>}
      </div>}

      {/* v15.6: item-quality audit panel. Reports per-item verdicts only — deliberately no
          total score, percentage, or quality band, because those bands were set a priori and
          have never had criterion-validity testing. */}
      {auditRows.length>0&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(auditTotals.fail?'var(--error-border)':auditTotals.review?'var(--warning-border)':'var(--success-border)'),background:auditTotals.fail?'var(--error-bg)':auditTotals.review?'var(--warning-bg)':'var(--success-bg)'}}>
        <span style={{fontSize:12,fontWeight:600,color:auditTotals.fail?'var(--accent-red)':auditTotals.review?'var(--accent-warm)':'var(--accent-green)'}}>
          {auditTotals.fail?'⚠':auditTotals.review||auditTotals.repaired?'⚑':'✓'} Item quality: {auditTotals.pass} pass · {auditTotals.fail} fail · {auditTotals.review} review
          {auditTotals.repaired>0&&<span style={{color:'var(--accent-warm)',fontWeight:400}}> · {auditTotals.repaired} repaired</span>}
          {auditTotals.na>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {auditTotals.na} N/A</span>}
          {auditTotals.error>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> · {auditTotals.error} not scored</span>}
        </span>
        <div style={{fontSize:12,color:'var(--text-dim)',marginTop:5,lineHeight:1.5}}>Each MCQ was reviewed against 11 stop criteria adapted from the NEIA scoring tool (Simms, Hensel &amp; Kumar 2026), seeing only what the student sees. <b>N/A means the rubric does not apply</b> to that format — it is not a pass. No total score is computed: the published quality bands have never been criterion-validated.</div>
        <div style={{marginTop:8,maxHeight:190,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {auditRows.map(r=>{
            const c=r.status==='FAIL'?'var(--accent-red)':r.status==='REVIEW'||r.status==='REPAIRED'?'var(--accent-warm)':r.status==='PASS'?'var(--accent-green)':'var(--text-dim)';
            const mark=r.status==='FAIL'?'✕':r.status==='REPAIRED'?'⟳':r.status==='REVIEW'?'?':r.status==='PASS'?'✓':'–';
            return(<div key={r.key} style={{fontSize:12,fontFamily:'JetBrains Mono',lineHeight:1.6}}>
              <span style={{color:c}}>{mark} {r.label} — {r.status}{r.criterion?': '+r.criterion:''}{r.detail&&r.status!=='PASS'?': '+r.detail:''}</span>
              {(r.warns||[]).map((w,i)=><div key={i} style={{color:'var(--text-dim)',paddingLeft:14}}>⚠ {w.criterion}: {w.detail}</div>)}
            </div>);
          })}
        </div>
        {auditTotals.accuracyFails>0&&<div style={{fontSize:12,color:'var(--accent-red)',marginTop:8,lineHeight:1.5,paddingTop:8,borderTop:'1px solid var(--border)'}}>{auditTotals.accuracyFails} item(s) failed on <b>answer accuracy</b> and were deliberately <b>not</b> auto-repaired. This is the only criterion where the reviewer overrules a keyed answer with no reference standard, and an automated rewrite could replace a correct answer with a wrong one. Check these by hand against your source.</div>}
      </div>}

      {/* Results */}
      {caseStudy&&<div className="output-container" style={{marginTop:16}}>
        <div className="output-toolbar">
          <h3>{caseStudy.title||'Case Study'}</h3>
          <div className="output-toolbar-actions">
            <button className="btn-secondary" aria-pressed={view==='case'} onClick={()=>setView('case')} style={view==='case'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>🩺 Case</button>
            <button className="btn-secondary" aria-pressed={view==='json'} onClick={()=>setView('json')} style={view==='json'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>{'{ }'} JSON</button>
            <button className="btn-secondary" onClick={()=>copyText(view==='json'?artifactJsonExport(caseStudy,exportNotice,issues,auditRows):caseMd)}>📋 Copy</button>
            <button className="btn-secondary" onClick={()=>exportAsMd(caseMd,'LATTE-Case-Study.md')}>⬇ .md</button>
            <button className="btn-secondary" onClick={()=>exportAsPdf(casePrintMd,caseStudy.title||'Case Study',caseStudy.condition||'')}>🖨 PDF</button>
          </div>
        </div>
        <div className="output-body">
          {view==='json'
            ?<pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.55,color:'var(--text)',margin:0}}>{JSON.stringify(caseStudy,null,2)}</pre>
            :<CaseRenderer caseStudy={caseStudy}/>}
        </div>
      </div>}
      </>}
    </div></ArtifactSourceCtx.Provider>
  );
}

// Per-tool crash isolation (v15). All six tools stay mounted to preserve state across
// tab switches; before this, any one tool's render error surfaced at the ROOT boundary
// and replaced the entire app — exactly what the v14 showUncov ReferenceError did.
class ToolBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('LATTE tool crash ('+this.props.name+')',error,info);}
  render(){
    if(!this.state.error)return this.props.children;
    return <div className="tool-panel"><div className="error-banner"><span>⚠</span><div>
      <strong>{this.props.name} hit a render error:</strong> {this.state.error?.message||String(this.state.error)}
      <div style={{marginTop:6,fontSize:12,color:'var(--text-dim)',lineHeight:1.5}}>The other tabs are unaffected — export anything you need from them. The console has the full stack trace.</div>
      <div style={{marginTop:8}}><button className="btn-secondary" onClick={()=>this.setState({error:null})}>Retry this tab</button></div>
    </div></div></div>;
  }
}

class BootErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('LATTE render error',error,info);}
  render(){if(!this.state.error)return this.props.children;return <div role="alert" style={{maxWidth:720,margin:'60px auto',padding:24,color:'var(--accent-red)',background:'var(--bg-surface)',border:'1px solid var(--danger-border)',borderRadius:12,fontFamily:'system-ui,sans-serif'}}><h2 style={{margin:'0 0 10px'}}>LATTE Study Suite encountered an error</h2><p style={{lineHeight:1.55}}>{this.state.error?.message||String(this.state.error)}</p><p style={{color:'var(--text-dim)',lineHeight:1.55}}>Reload the page after exporting any available data. Open the browser console for the technical stack trace.</p></div>;}
}

const TOOL_COMPONENTS={knowledge:KnowledgeBaseBuilder,priority:PriorityAnalyzer,anki:AnkiGenerator,nclex:NCLEXExtractor,nclexgen:NCLEXGenerator,cases:CaseStudyGenerator}; // v15: hoisted — was rebuilt on every App render

function App(){
  const [apiKey,setApiKey]=useState(()=>{try{return sessionStorage.getItem('suite_key')||'';}catch{return'';}});
  const [flashModel,setFlashModel]=useState('gemini-3.8-flash'); // v15.15 model refresh (2026-09-02): 3.8 Flash is stable and keeps the supported low/medium/high thinking levels and 65,536-token output ceiling.
  const [proModel,setProModel]=useState('gemini-3.1-pro-preview'); // v15 note: this IS the current main Pro path — Google ships Pro as -preview only (gemini-3-pro-preview was shut down and now redirects here); re-verified 2026-08: Google shipped 3.7 Flash with still no Pro successor announced
  const [thinkingMode,setThinkingMode]=useState(false);
  // Thinking level is tracked per model family so decoupling doesn't silently change
  // anyone's defaults: Flash keeps running at low and Pro at high until changed.
  // The old single toggle couldn't express Flash+medium/high at all.
  const [flashLevel,setFlashLevel]=useState('low');
  const [proLevel,setProLevel]=useState('high');
  // Auto mode: each tool resolves its own model+level from a profile table, overriding
  // the manual Flash/Pro toggle. Opt-in and persisted, so an untouched build behaves
  // exactly as before and a customized profile survives reload.
  const [autoProfile,setAutoProfile]=useState(()=>{try{const v=localStorage.getItem('latte_auto_profile_v1');return v===null?true:v==='1';}catch{return true;}});
  // v15.7: `casesAudit` was renamed to `itemAudit`. A saved profile from v15.6 still carries
  // the old key, which would silently fall back to defaults and quietly change the model a
  // user had deliberately chosen. Migrate on read, and drop the stale key so it cannot
  // resurface later. Keep this shim — removing it re-breaks anyone who has not re-saved.
  const [profiles,setProfiles]=useState(()=>{try{const r=localStorage.getItem('latte_tool_profiles_v1');const p=r?JSON.parse(r):null;if(!p||typeof p!=='object'||Array.isArray(p))return TOOL_PROFILE_DEFAULTS;if(p.casesAudit&&!p.itemAudit){p.itemAudit=p.casesAudit;}delete p.casesAudit;return{...TOOL_PROFILE_DEFAULTS,...p};}catch{return TOOL_PROFILE_DEFAULTS;}});
  useEffect(()=>{try{localStorage.setItem('latte_auto_profile_v1',autoProfile?'1':'0');localStorage.setItem('latte_tool_profiles_v1',JSON.stringify(profiles));}catch(e){}},[autoProfile,profiles]);
  const setProfile=useCallback((id,patch)=>setProfiles(p=>({...p,[id]:{...(p[id]||TOOL_PROFILE_DEFAULTS[id]||{m:'flash',lv:'low'}),...patch}})),[]);
  const resetProfiles=useCallback(()=>setProfiles(TOOL_PROFILE_DEFAULTS),[]);
  const [activeTool,setActiveTool]=useState('knowledge');
  const [knowledgeBase,publishKnowledgeBase]=useState(EMPTY_LATTE_KB);
  // v15.17: mutation ownership, source object identity, and durable save order are distinct.
  const currentKnowledge=useRef(EMPTY_LATTE_KB),kbMutation=useRef(0),mounted=useRef(true);
  const [hydrated,setHydrated]=useState(false),[recoveryChoices,setRecoveryChoices]=useState([]);
  const [saveRequest,setSaveRequest]=useState(null);
  const saveQueue=useRef(null);
  if(!saveQueue.current)saveQueue.current=kbCreateSaveQueue({write:kbSavePersisted,remove:kbDeletePersisted,writeFallback:record=>localStorage.setItem(KB_FALLBACK_KEY,JSON.stringify(record)),captureFallbacks:kbCaptureFallbacks,clearFallbacks:kbClearFallbacks,writer:Date.now()+'-'+Math.random().toString(36).slice(2)});
  const setKnowledgeBase=useCallback(value=>{
    const kb=typeof value==='function'?value(currentKnowledge.current):value;
    const replaced=kb!==currentKnowledge.current;currentKnowledge.current=kb;const mutation=++kbMutation.current;
    publishKnowledgeBase(kb);setSaveRequest({kb,mutation});setPersistenceStatus('pending');
    if(replaced){setArtifactRegistry(EMPTY_ARTIFACT_REGISTRY);setInspectedFactId(null);}
  },[]);
  const [persistenceStatus,setPersistenceStatus]=useState('loading');
  const [persistenceError,setPersistenceError]=useState('');
  // v16.0: narrow screens start with the study tool visible; settings remain one named button away.
  const [showConfig,setShowConfig]=useState(()=>window.matchMedia('(min-width: 801px)').matches);
  const settingsTrigger=useRef(null);
  const closeSettings=()=>{setShowConfig(false);settingsTrigger.current?.focus();};
  const openSettings=()=>{setShowConfig(true);requestAnimationFrame(()=>document.getElementById('suite-api-key')?.focus());};
  // Fact Inspector: one selected fact ID drives the read-only drawer.
  const [inspectedFactId,setInspectedFactId]=useState(null);
  // Shared, session-scoped artifact registry powering the inspector's "Used in".
  const [artifactRegistry,setArtifactRegistry]=useState(EMPTY_ARTIFACT_REGISTRY);

  useEffect(()=>{try{if(apiKey)sessionStorage.setItem('suite_key',apiKey);else sessionStorage.removeItem('suite_key');}catch{}},[apiKey]);
  useEffect(()=>{
    mounted.current=true;let alive=true;const started=kbMutation.current;
    (async()=>{
      try{
        let durable=null,unavailable=false;
        try{durable=await kbLoadPersisted();}catch{unavailable=true;}
        const fallbackRecords=kbReadFallbacks();let capturedFallbacks;
        // v16.7: failed fallback access also enters paused recovery; it cannot leave hydration pending forever.
        try{capturedFallbacks=kbCaptureFallbacks();}
        catch(e){fallbackRecords.push({kb:null,storageKey:'browser fallback',raw:null,unavailable:true,recoveryError:'Browser fallback access failed: '+String(e.message||e)+'. Restore browser storage access, then reload before choosing a recovery copy.'});}
        const reconciled=kbReconcileStored([durable,...fallbackRecords]);
        if(!alive)return;saveQueue.current.setHead(durable,capturedFallbacks);
        if(reconciled.choices.length){setRecoveryChoices(reconciled.choices);setPersistenceStatus('conflict');setPersistenceError('Saved copies disagree. Both are preserved. Export or inspect each copy, then choose one to continue saving.');}
        else{
          if(kbMutation.current===started&&reconciled.record){
            try{const kb=reconciled.record.kb?kbNormalizeImported(reconciled.record.kb,{restore:true}).kb:EMPTY_LATTE_KB;currentKnowledge.current=kb;publishKnowledgeBase(kb);}
            // v16.7: rejected saved data stays exportable; a recovery choice pauses writes, not the whole session.
            catch(e){setRecoveryChoices([reconciled.record]);setPersistenceStatus('conflict');setPersistenceError('Saved copy could not be restored: '+(e.message||String(e))+' Export or inspect the preserved copy. Import a corrected copy or build a new Knowledge Base, then choose Use current workspace to resume saving.');setHydrated(true);return;}
          }
          setPersistenceStatus(unavailable?'fallback':'ready');setPersistenceError(unavailable?'IndexedDB is unavailable. Export JSON regularly; the browser fallback may have limited space.':'');
        }
        setHydrated(true);
      }catch(e){if(alive){setPersistenceStatus('error');setPersistenceError(e.message);}}
    })();return()=>{alive=false;mounted.current=false;};
  },[]);
  useEffect(()=>{
    if(!hydrated||recoveryChoices.length||!saveRequest)return;
    const request=saveRequest;setPersistenceStatus('saving');
    saveQueue.current.save((request.kb.conditions||[]).length?request.kb:null).then(result=>{
      if(!mounted.current||kbMutation.current!==request.mutation)return;
      setPersistenceStatus(result.status);setPersistenceError(result.status==='saved'?'':'Saved in browser fallback. Export JSON regularly; IndexedDB is unavailable.');
    },e=>{if(mounted.current&&kbMutation.current===request.mutation){setPersistenceStatus('error');setPersistenceError(e.message);}});
  },[hydrated,recoveryChoices,saveRequest]);
  const chooseRecovery=useCallback(async index=>{
    const choices=recoveryChoices,mutation=kbMutation.current;try{
      const record=index===-1?{kb:currentKnowledge.current}:choices[index];if(!record)return;
      // v16.7: raw failures are exportable evidence, not usable KBs; inaccessible bytes cannot be safely replaced.
      if(record.recoveryError)throw new Error('This raw copy cannot be restored directly. Export it for correction, or choose a readable copy or the current workspace.');
      if(choices.some(copy=>copy.unavailable))throw new Error('Browser fallback bytes could not be read. Restore browser storage access, then reload before choosing a recovery copy.');
      await kbArchiveRecovery(choices);if(!mounted.current||kbMutation.current!==mutation)return;
      // v16.7: explicit replacement archives every preserved copy before saving the chosen workspace.
      // v16.7: validate the entire saved copy before clearing recovery choices.
      const kb=record.kb?kbNormalizeImported(record.kb,{restore:true}).kb:EMPTY_LATTE_KB;
      setRecoveryChoices([]);setPersistenceError('');setKnowledgeBase(kb);
    }catch(e){setPersistenceError('Could not restore this recovery copy: '+(e.message||String(e))+'. Existing data is unchanged. Export the saved copies before retrying.');}
  },[recoveryChoices,setKnowledgeBase]);

  // cfg.thinkingLevel stays in the API for all existing consumers, derived from the
  // active model's level; setThinkingLevel routes the write to that model's level.
  // Single resolution point for "what model and thinking level does this tool use?"
  // Auto on -> the tool's profile row. Auto off -> the manual global toggle, unchanged.
  const forTool=useCallback(id=>{
    if(autoProfile){
      const p=profiles[id]||TOOL_PROFILE_DEFAULTS[id]||{m:'flash',lv:'low'};
      return{model:p.m==='pro'?proModel:flashModel,level:p.lv,family:p.m,auto:true};
    }
    return{model:thinkingMode?proModel:flashModel,level:thinkingMode?proLevel:flashLevel,family:thinkingMode?'pro':'flash',auto:false};
  },[autoProfile,profiles,proModel,flashModel,thinkingMode,proLevel,flashLevel]);

  const cfg=useMemo(()=>({apiKey,setApiKey,flashModel,setFlashModel,proModel,setProModel,thinkingMode,setThinkingMode,flashLevel,proLevel,thinkingLevel:thinkingMode?proLevel:flashLevel,setThinkingLevel:thinkingMode?setProLevel:setFlashLevel,activeModel:thinkingMode?proModel:flashModel,autoProfile,setAutoProfile,profiles,setProfile,resetProfiles,forTool,activeTool}),[apiKey,flashModel,proModel,thinkingMode,flashLevel,proLevel,autoProfile,profiles,setProfile,resetProfiles,forTool,activeTool]);

  // O(1) fact lookup, rebuilt only when the KB changes — powers FactTag and the drawer.
  const factIndex=useMemo(()=>buildFactIndex(knowledgeBase),[knowledgeBase]);
  // Merge a batch of generated artifacts into the registry (replacing any prior entries of
  // the same kind, since a fresh generation supersedes the last).
  const registerArtifact=useCallback((kind,entries,{merge=false,sourceKB=currentKnowledge.current}={})=>{
    if(sourceKB!==currentKnowledge.current)return;
    const next=Array.isArray(entries)?entries:[];
    setArtifactRegistry(r=>({...r,[kind]:merge?mergeArtifactEntries(r[kind],next):next}));
  },[]);
  const knowledgeValue=useMemo(()=>({knowledgeBase,setKnowledgeBase,isCurrentSource:sourceKB=>sourceKB===currentKnowledge.current,persistenceStatus,persistenceError,recoveryChoices,chooseRecovery,factIndex,artifactRegistry,registerArtifact}),[knowledgeBase,persistenceStatus,persistenceError,recoveryChoices,chooseRecovery,factIndex,artifactRegistry,registerArtifact]);
  const inspectorValue=useMemo(()=>({inspectedFactId,openFactInspector:setInspectedFactId,closeFactInspector:()=>setInspectedFactId(null)}),[inspectedFactId]);


  return(
    <ConfigCtx.Provider value={cfg}>
      <FactInspectorCtx.Provider value={inspectorValue}>
      <KnowledgeCtx.Provider value={knowledgeValue}>
      <FactInspectorDrawer/>
      {/* v16.0: landmark navigation and a source-aware header clarify the workflow; all tools remain mounted. */}
      <a className="skip-link" href="#study-workspace">Skip to study workspace</a>
      <div className="suite-shell">
        <nav className="nav-rail" aria-label="Study tools">
          <div className="nav-brand"><div className="nav-logo" aria-hidden="true">L</div><div className="nav-brand-copy"><strong>LATTE</strong><span>Study Suite</span></div></div>
          {TOOLS.map(t=>(
            <button key={t.id} className={`nav-btn ${activeTool===t.id?'active':''}`} aria-current={activeTool===t.id?'page':undefined} aria-controls={'tool-'+t.id} onClick={()=>setActiveTool(t.id)} title={t.title}>
              <t.icon/><span className="nav-label">{t.label}<span className="nav-sublabel">{t.step}</span></span>
            </button>
          ))}
          <div className="nav-spacer"/>
          <button ref={settingsTrigger} className={`nav-btn nav-btn-cfg ${showConfig?'active':''}`} aria-label="Study settings" aria-expanded={showConfig} aria-controls="suite-settings" onClick={()=>setShowConfig(s=>!s)} title="Show or hide study settings">
            <NavIcons.gear/><span className="nav-label">Settings<span className="nav-sublabel">API key & models</span></span>
          </button>
          <div className="nav-footer">Version {suiteVersion()} <span>Built for your next step.</span></div>
        </nav>
        {showConfig&&<ConfigSidebar onClose={closeSettings}/>}
        <main className="main-area" id="study-workspace" tabIndex={-1}>
          <header className="workspace-header">
            <div><p className="workspace-eyebrow">SOURCE → STUDY → PRACTICE</p><h1 className="workspace-heading">Your study workspace</h1></div>
            <div className="workspace-status">
              <span className="workspace-source">{knowledgeBase.conditions?.length?knowledgeBase.conditions.length+' conditions · '+factIndex.size+' facts':'Start with your sources'}</span>
              <button type="button" className="btn-secondary" onClick={openSettings}>{apiKey?'API key added':'Add API key'}</button>
            </div>
          </header>
          {TOOLS.map(t=>{const C=TOOL_COMPONENTS[t.id];return <section key={t.id} id={'tool-'+t.id} aria-label={t.title} style={{display:activeTool===t.id?'contents':'none'}}><ToolBoundary name={t.title}><C/></ToolBoundary></section>;})}
        </main>
      </div>
      </KnowledgeCtx.Provider>
      </FactInspectorCtx.Provider>
    </ConfigCtx.Provider>
  );
}

try{if(!window.React)throw new Error('React failed to load.');if(!window.ReactDOM)throw new Error('ReactDOM failed to load.');ReactDOM.createRoot(document.getElementById('root')).render(<BootErrorBoundary><App/></BootErrorBoundary>);window.__latteMounted=true;}catch(e){console.error(e);window.__latteBootFail?.(e.message||String(e));}
</script>
</body>
</html>
