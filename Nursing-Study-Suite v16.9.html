     v15.15 (2026-08-29): NCLEX Question Extractor — three fixes found by testing v15.14 against a real question bank. No prompt constant was touched; all three were code faults.
     (1) ANSWER CHOICES WERE BEING READ AS QUESTION NUMBERS. nclexSplitByQNum matched "1." at a line start, which is the stem marker AND the first-choice marker. The slice for question 1 therefore ended at its own first choice: item 1 was the stem alone, items 2-4 were single choice lines posing as questions, and questions 2 and 3 were dropped outright because their numbers had already been claimed. That is the reported "only the stem is captured" symptom, and it was also deleting most of the section. Choice runs are now identified by SPACING and removed from the candidate starts, behind three guards so a genuine question list is never eaten.
     (2) CHOICES ARE PARSED, RENDERED AND REPAIRED. nclexSplitStemOptions reads the choice list back out of the question text (numbered, lettered, parenthesised, inline or on its own lines), so cards show choices as a list and an item that arrived WITHOUT choices is visibly flagged instead of looking complete. In split mode the batch still holds each question's verbatim page text, so a bare stem has its choices restored from the source bytes — no extra call, nothing invented.
     (3) ANSWERS ARE GROUPED AT THE END. Every export (.md, .txt, Copy, PDF) is now Questions first, then one Answer Key, matching the shape the NCLEX Generator worksheet has always used. Answers used to sit under their own question, which made an exported set unusable for actual practice.
     Also: Inline mode gains the page-range picker Split Q&A has, opt-in so the whole document remains the default. With ranges on it takes the same one-PDF-per-run restriction, because a range describes one file's layout.
     v15.14 (2026-08-29): correctness release driven by a three-way review (Claude Code / ChatGPT / Gemini). Findings were re-verified against the bytes before being acted on; the ones that did not survive verification are recorded in CHANGELOG.md so they are not re-raised.
     TIER 1 - integrity of the material. kbFactKey kept ASCII < and > but DELETED the Unicode operators and '+', so an up-arrow and a down-arrow fact produced one merge key and mergeLatteParts silently kept the first with the OTHER chunk's source pointer unioned on. kbNormForMatch collapses [^a-z0-9], so an INVERTED comparator verified cleanly against a source saying the opposite - kbQuoteOperatorsAgree now checks that additively, after a quote has already passed, and reports at WARN tier pending measurement. Card transcripts survived removal of their photo and collided on basename; both now key on name+size+lastModified. The flashcard build gate existed only as UI text: Build was clickable mid-transcription, on an unpaired back, on two fronts merged as a pair, and on numbers the app had already flagged unstable.
     TIER 2 - availability and spend. nclexBatchPairs hung the tab on a cleared batch-size field (i+=0). targetCount had no ceiling, so one keystroke could schedule ~99,999 calls. itemRunPool let the sibling lane keep issuing calls after a QuotaStop. No IndexedDB helper handled tx.onabort, so an aborted transaction left persistenceStatus on 'loading' and silently disabled every later save. Backoff read a Retry-After header the v1beta endpoint never sends, ignoring the RetryInfo in the body. Card photos had no size bound against the ~20MB inline ceiling.
     TIER 3 - consolidation. Printable worksheets now carry a validation stamp and failed batches are not registered. Three PDF page walks became one cancellable, page-cleaning primitive. AI pairing walks the whole text instead of its first 12,000 characters. Dedup went from quadratic to linear, logs are capped, condition ids are unique, a single dense page splits rather than being discarded, callGemini takes an options object, and the unreachable PDF cleanup is gone. Narrow CSP added; all eight SRI pins re-hashed against their CDNs.
     v15.12 (2026-08-29): v15 series — crash/PPTX/CVE fixes, DOMPurify no-downgrade chain, KB replace guards, layout-aware PDF extraction + scanned-file detection, SRI integrity pins on every CDN script.

     v15.7 extends that to the NCLEX Generator: `validateNCLEXWorksheet` checks the worksheet's self-reported DISTRIBUTION against what it actually produced, the audit profile is now a single tool-agnostic `itemAudit` row, worksheet MCQs route through the same auditor and repair path, artifacts carry a provenance stamp naming the configuration that made them, and Anki cards are linted for error-prone dose abbreviations.
     v15.8 is the first release driven by real usage rather than fixtures: fact coverage had been structurally always zero since v15 (the adapter cites fact IDs in PART 1, the prompt cites C-numbers in PART 4, and the scan counted the wrong token in Parts 3/4), a malformed DISTRIBUTION line silently disabled its own self-report check, and a repaired item kept showing its pre-repair verdict. The item audit now defaults to Flash and paces itself for free-tier limits. The audit gate's reliability is measured, not assumed — a full test-retest produced zero verdict flips.
     v15.9 is a correctness release driven entirely by real runs and a two-reviewer audit: the worksheet repair splice no longer expands $-sequences in model text, a quota stop no longer discards verdicts already paid for, ordering-step lists no longer destroy answer-key parsing, comma-grouped and trailing-zero values compare correctly, and both generators now size themselves to the facts they actually have instead of asking the model to invent the difference. Rationales may reference values the case itself presents as validated data.
     v15.10 is measurement, not behavior. quoteMiss was a bare count, which could not answer the question the v16 build decision turns on: whether a failed quote is line-break hyphenation (fixable by normalizing the matcher, no vision needed) or column-major reading-order scrambling (which only seeing the page fixes). Misses are now retained and classified, kbTextQuality names which pages are sparse, an opt-in probe counts raster/vector/text ops per page, and the diagnostics panel exports to JSON. kbQuoteInSource is byte-identical: no fact's fate changed.
     v15.11 acts on what v15.10 measured. A real cardiovascular chapter produced 190 failed quotes: 83 line-break hyphenation/ligature, 107 column reading order, and zero 'partial' or 'absent' — not one fabricated quote in the run. De-hyphenation is therefore promoted into kbQuoteInSource as a strictly additive fallback (plain match first; the fallback can only turn a FAIL into a PASS), recovering the 83 without loosening anything. Reading-order failures are left alone by design: the fact is sound, only its proof fails. The same run exposed a reporting bug — pass-1 misses and pass-2 discards shared one rollup printed beneath the first-pass count, so a breakdown summing to 190 sat under a sentence saying 182. They now roll up separately.
     v15.12 adds flashcard ingestion. Photographs of printed cards have no text layer at all, so they take a two-pass path: pass 1 transcribes the image to structured verbatim text, pass 2 is the EXISTING frozen extractor reading that text. Because pass 2 reads text, kbQuoteInSource verifies its quotes with no new machinery — which is why none of the v16 spec's evidence states, routers or visual safety gates were needed. The transcript is therefore the trust boundary: a number misread in pass 1 is verified flawlessly against the wrong transcript by everything downstream, so transcripts are reviewed before use and every clinical number is surfaced for an eye check. Front and back pair on category + card number, because a Davis back face carries no condition name.

/* // v16.0: The icon-only dark shell and tiny controls obscured workflow and evidence.
   One light design system supplies readable surfaces, explicit navigation and responsive controls. */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-ui);background:var(--bg-deep);color:var(--text);font-size:var(--text-base);line-height:1.55;min-width:320px;min-height:100vh;}
button,input,select,textarea{font:inherit;}
button{color:inherit;touch-action:manipulation;}
button:not(:disabled),summary,[role="button"],[role="switch"]{cursor:pointer;}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.58;}
a{color:var(--accent);text-underline-offset:3px;}
a:hover{color:var(--accent-hover);}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:3px;box-shadow:var(--focus-ring);}
:where(h1,h2,h3,h4){color:var(--text-bright);line-height:1.3;}
:where(pre,code){font-family:var(--font-mono);}
:where(pre){max-width:100%;overflow:auto;}
:where(details){border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);padding:var(--space-3);margin-block:var(--space-2);}
:where(summary){min-height:32px;font-size:var(--text-sm);font-weight:600;color:var(--text);align-content:center;}
:where(details[open]>summary){margin-bottom:var(--space-3);}
input[type="checkbox"],input[type="radio"]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);vertical-align:middle;}
label:has(input[type="checkbox"]),label:has(input[type="radio"]){min-height:32px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border:2px solid var(--bg-surface);border-radius:8px;}
::selection{background:#cfe2f8;color:var(--text-bright);}
.skip-link{position:fixed;z-index:100;left:var(--space-4);top:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--bg-surface);border:1px solid var(--accent);border-radius:var(--radius);transform:translateY(-200%);font-weight:600;}
.skip-link:focus{transform:translateY(0);}

/* Workspace: navigation, shared settings, then the active study tool. */
.suite-shell{display:flex;min-height:100vh;height:100dvh;overflow:hidden;}
.nav-rail{width:var(--nav-width);min-width:var(--nav-width);display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6) var(--space-3);background:var(--bg-surface);border-right:1px solid var(--border);overflow-y:auto;z-index:10;}
.nav-brand{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-2) var(--space-6);}
.nav-logo{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:25px;font-weight:800;color:#fff;box-shadow:inset -4px -4px 0 rgba(255,255,255,.12);}
.nav-brand-copy{display:flex;flex-direction:column;line-height:1.35;color:var(--text-bright);font-size:var(--text-lg);font-weight:700;}
.nav-brand-copy small,.nav-brand-copy span:last-child{font-size:var(--text-xs);font-weight:500;color:var(--text-dim);}
.nav-btn{width:100%;min-height:58px;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-dim);text-align:left;transition:background var(--transition),color var(--transition),border-color var(--transition);position:relative;}
.nav-btn:hover{background:var(--bg-card-alt);color:var(--text-bright);}
.nav-btn.active{background:var(--accent-soft);border-color:var(--info-border);color:var(--accent);}
.nav-btn.active::before{content:'';position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent2);}
.nav-btn svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-label{display:block;min-width:0;font-size:var(--text-sm);font-weight:700;line-height:1.35;}
.nav-sublabel{display:block;margin-top:3px;font-size:11px;font-weight:400;color:var(--text-dim);line-height:1.35;}
.nav-spacer{flex:1;min-height:var(--space-4);}
.nav-btn-cfg{min-height:44px;}
.nav-footer{border-top:1px solid var(--border);padding:var(--space-4) var(--space-3) 0;margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-dim);}
.nav-footer span{display:block;margin-top:var(--space-1);}
.config-sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.sb-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);padding:var(--space-6) var(--space-5) var(--space-5);border-bottom:1px solid var(--border);}
.sb-header h2{font-size:var(--text-lg);font-weight:700;letter-spacing:-.2px;}
.sb-header p{font-size:var(--text-xs);color:var(--text-dim);margin-top:var(--space-1);}
.settings-close{width:36px;height:36px;flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);}
.settings-close:hover{background:var(--bg-hover);color:var(--text-bright);}
.sb-section{padding:var(--space-5);border-bottom:1px solid var(--border);}
.sb-section:last-child{border-bottom:none;}
.sb-label{font-size:var(--text-xs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);margin-bottom:var(--space-3);}

.sb-field:last-child{margin-bottom:0;}
.sb-field label{display:block;font-size:var(--text-sm);color:var(--text);margin-bottom:6px;font-weight:600;}
.sb-hint{font-size:var(--text-xs);color:var(--text-dim);line-height:1.65;margin-top:6px;overflow-wrap:anywhere;}
.main-area{flex:1;min-width:0;overflow-y:auto;scrollbar-gutter:stable;}
.workspace-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);padding:var(--space-6) var(--space-8);border-bottom:1px solid var(--border);background:var(--bg-surface);}
.workspace-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:6px;}
.workspace-heading{font-size:var(--text-xl);font-weight:700;letter-spacing:-.65px;}
.workspace-status{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:var(--space-2);font-size:var(--text-xs);color:var(--text-dim);}
.workspace-status>span,.workspace-status>button{padding:6px 10px;background:var(--bg-card-alt);border:1px solid var(--border);border-radius:var(--radius-sm);}
.workspace-status>button{color:var(--accent);min-height:36px;}
.workspace-status>button:hover{background:var(--accent-soft);border-color:var(--info-border);}
.workspace-content{min-width:0;}
.tool-panel{width:100%;max-width:1344px;margin:0 auto;padding:var(--space-8);overflow-wrap:anywhere;}
.tool-panel h2.tool-title{font-size:24px;font-weight:700;letter-spacing:-.6px;margin-bottom:var(--space-2);}
.tool-panel .tool-desc{font-size:var(--text-base);line-height:1.7;color:var(--text-dim);max-width:78ch;margin-bottom:var(--space-6);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4);box-shadow:var(--shadow-sm);}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);}
.form-grid-three{grid-template-columns:repeat(3,minmax(0,1fr));}
.form-grid>*{min-width:0;}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin:var(--space-5) 0;}
.kb-browser{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:420px;}
.kb-condition-list{border-right:1px solid var(--border);padding:var(--space-3);max-height:65vh;overflow-y:auto;background:var(--bg-card-alt);}
.kb-condition-list .btn-secondary{box-shadow:none;overflow-wrap:anywhere;}
.priority-layout{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:var(--space-5);}
.priority-controls{min-width:0;}
.action-row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;}
.segmented-control{display:flex;flex-wrap:wrap;gap:var(--space-1);padding:var(--space-1);border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card-alt);}
.segmented-control>button{flex:1 1 min-content;min-height:42px;min-width:min-content;overflow-wrap:normal;padding:9px 12px;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--text-dim);font-size:var(--text-sm);font-weight:600;text-align:left;transition:background var(--transition),border-color var(--transition);}
.segmented-control>button:hover{background:var(--bg-surface);color:var(--accent);}
.segmented-control>button[aria-pressed="true"]{background:var(--bg-surface);border-color:var(--info-border);color:var(--accent);box-shadow:var(--shadow-sm);}

/* Forms and actions retain native controls, with common sizing and clear focus. */
input[type="text"],input[type="password"],input[type="number"],select,textarea{width:100%;max-width:100%;min-width:0;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-bright);padding:10px 12px;border-radius:var(--radius);font-family:var(--font-ui);font-size:var(--text-sm);line-height:1.55;transition:border-color var(--transition),box-shadow var(--transition);}
input[type="text"],input[type="password"],input[type="number"],select{min-height:44px;}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:#738aa4;}
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-soft);}
input::placeholder,textarea::placeholder{color:var(--text-dim);opacity:1;}
textarea{resize:vertical;min-height:80px;}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--accent-red);background:var(--danger-soft);}
.field-block{margin-bottom:var(--space-4);min-width:0;}
.field-block label{display:flex;align-items:center;gap:6px;font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-2);color:var(--text-bright);}
.badge-req,.badge-opt{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.3px;border-radius:var(--radius-sm);padding:2px 6px;line-height:1.5;}
.badge-req{color:var(--accent2);background:var(--orange-soft);}
.badge-opt{color:var(--text-dim);background:var(--bg-card-alt);}
.btn-primary,.btn-secondary,.btn-danger,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;max-width:100%;padding:9px 14px;border:1px solid transparent;border-radius:var(--radius);font-family:var(--font-ui);font-size:var(--text-sm);font-weight:600;line-height:1.4;text-align:center;transition:background var(--transition),border-color var(--transition),box-shadow var(--transition);overflow-wrap:break-word;}
.btn-primary{min-height:44px;background:var(--accent);color:#fff;border-color:var(--accent);padding:11px 18px;box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:var(--shadow-card);}
.btn-secondary{background:var(--bg-card);color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover:not(:disabled){background:var(--bg-hover);border-color:var(--accent);color:var(--accent);}
.btn-secondary.active,.btn-secondary[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.btn-danger{background:var(--danger-soft);color:var(--accent-red);border-color:var(--danger-border);}
.btn-danger:hover:not(:disabled){background:#fbdede;border-color:var(--accent-red);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 10px;}
.btn-ghost:hover:not(:disabled){background:var(--accent-soft);border-color:var(--info-border);}
.btn-primary:active:not(:disabled),.btn-secondary:active:not(:disabled),.btn-danger:active:not(:disabled),.btn-ghost:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(29,48,72,.12);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;}
.toggle-row span{font-size:var(--text-sm);font-weight:500;}
.toggle-switch{width:44px;height:26px;background:#77879a;border-radius:20px;position:relative;flex-shrink:0;transition:background var(--transition);}
.toggle-switch.on{background:var(--accent);}
.toggle-switch::after{content:'';position:absolute;width:20px;height:20px;background:white;border-radius:50%;top:3px;left:3px;box-shadow:var(--shadow-sm);transition:transform var(--transition);}
.toggle-switch.on::after{transform:translateX(18px);}
.level-pills{display:flex;flex-wrap:wrap;gap:var(--space-1);}
.level-pill{font-size:11px;font-weight:600;min-height:32px;padding:5px 9px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-dim);transition:background var(--transition),border-color var(--transition);text-transform:capitalize;}
.level-pill:hover{border-color:var(--accent);color:var(--accent);}
.level-pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.model-badge{margin-top:var(--space-2);padding:var(--space-2) 10px;background:var(--info-soft);border:1px solid var(--info-border);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:11px;color:var(--accent);display:flex;align-items:center;gap:6px;overflow-wrap:anywhere;}
.model-badge>span{min-width:0;}
.model-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);flex-shrink:0;}
.model-dot.pro{background:var(--accent2);}

/* Source intake and processing feedback. */
.upload-zone{border:2px dashed var(--info-border);border-radius:var(--radius-lg);padding:var(--space-8) var(--space-6);text-align:center;background:var(--info-soft);transition:border-color var(--transition),background var(--transition);}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-soft);}
.upload-zone svg{width:32px;height:32px;margin-bottom:var(--space-2);color:var(--accent);}
.upload-zone h3{font-size:var(--text-lg);font-weight:700;margin-bottom:6px;color:var(--accent);}
.upload-zone p{font-size:var(--text-sm);color:var(--text-dim);max-width:65ch;margin-inline:auto;line-height:1.65;}
.file-chip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm);margin-bottom:6px;min-width:0;}
.file-chip .f-icon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0;background:var(--accent-soft);color:var(--accent);}
.f-icon.pdf{background:var(--danger-soft);color:var(--accent-red);}
.f-icon.pptx{background:var(--orange-soft);color:var(--accent2);}
.f-icon.txt{background:var(--bg-card-alt);color:var(--text-dim);}
.file-chip .f-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.file-chip .f-size{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap;}
.f-rm{width:36px;min-width:36px;height:36px;flex-shrink:0;background:transparent;border:none;border-radius:var(--radius-sm);color:var(--text-dim);font-size:20px;}
.f-rm:hover{background:var(--danger-soft);color:var(--accent-red);}
.progress-bar{height:7px;background:var(--bg-hover);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:10px;transition:width 300ms ease;background:var(--accent);}
.chunk-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--bg-card);border-radius:var(--radius-sm);font-size:var(--text-xs);border:1px solid var(--border);margin-bottom:6px;}
.chunk-item>span{min-width:0;overflow-wrap:anywhere;}
.chunk-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.chunk-dot.pending{border:2px solid var(--border-strong);}
.chunk-dot.running{border:2px solid var(--accent);animation:pulse 1.5s infinite;}
.chunk-dot.done{background:var(--accent-green);color:white;}
.chunk-dot.error{background:var(--accent-red);color:white;}
.error-banner,.tip-banner,.retry-banner{padding:var(--space-3) var(--space-4);border:1px solid;border-radius:var(--radius);font-size:var(--text-sm);margin-bottom:var(--space-4);display:flex;gap:var(--space-2);align-items:flex-start;line-height:1.65;overflow-wrap:anywhere;}
.error-banner{background:var(--danger-soft);border-color:var(--danger-border);color:var(--accent-red);}
.error-banner>div{min-width:0;}
.tip-banner{background:var(--warning-soft);border-color:var(--warning-border);color:var(--accent-warm);}
.retry-banner{background:var(--info-soft);border-color:var(--info-border);color:var(--accent);align-items:center;justify-content:space-between;flex-wrap:wrap;}
.ext-toggle{display:flex;align-items:center;gap:var(--space-2);padding:10px var(--space-3);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm);font-weight:500;margin-bottom:var(--space-3);user-select:none;}
.ext-toggle:hover{border-color:var(--accent);background:var(--bg-card-alt);}
.ext-toggle .arrow{transition:transform var(--transition);font-size:11px;}
.ext-toggle .arrow.open{transform:rotate(90deg);}
.ext-viewer{background:var(--bg-card-alt);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4);margin-bottom:var(--space-4);max-height:280px;overflow:auto;font-family:var(--font-mono);font-size:var(--text-xs);line-height:1.7;white-space:pre-wrap;color:var(--text);}
.format-opt{padding:10px var(--space-3);border:1px solid transparent;border-radius:var(--radius);transition:background var(--transition);margin-bottom:var(--space-1);}
.format-opt:hover{background:var(--bg-hover);}
.format-opt .fo-head{display:flex;align-items:center;gap:var(--space-2);}
.format-opt .fo-desc{font-size:var(--text-xs);color:var(--text-dim);margin-top:var(--space-1);padding-left:26px;line-height:1.5;}

/* Study outputs: readable text, bounded tables, and source references. */
.output-container{min-width:0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);}
.output-toolbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);border-bottom:1px solid var(--border);background:var(--bg-card-alt);flex-wrap:wrap;gap:var(--space-3);}
.output-toolbar h3{font-size:var(--text-base);font-weight:700;}
.output-toolbar-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;}
.output-body{min-width:0;padding:var(--space-6);max-height:70vh;overflow:auto;line-height:1.8;font-size:15px;overflow-wrap:anywhere;}
.output-body h1,.output-body h2,.output-body h3,.output-body h4{margin:var(--space-6) 0 var(--space-3);line-height:1.35;}
.output-body :is(h1,h2,h3,h4):first-child{margin-top:0;}
.output-body h1{font-size:26px;letter-spacing:-.5px;}
.output-body h2{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:var(--space-2);}
.output-body h3{font-size:var(--text-lg);color:var(--accent);}
.output-body p{margin:var(--space-2) 0 var(--space-3);}
.output-body table,.tier-body table{display:block;width:100%;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:var(--space-4) 0;font-size:var(--text-sm);}
.output-body th,.tier-body th{background:var(--bg-card-alt);padding:10px 12px;text-align:left;font-weight:700;border:1px solid var(--border);font-size:var(--text-xs);color:var(--text-bright);}
.output-body td,.tier-body td{padding:10px 12px;border:1px solid var(--border);vertical-align:top;min-width:110px;}
.output-body tr:nth-child(even),.tier-body tr:nth-child(even){background:#f8fafc;}
.output-body ul,.output-body ol,.tier-body ul,.tier-body ol{padding-left:var(--space-6);margin:var(--space-2) 0 var(--space-3);}
.output-body li,.tier-body li{margin-bottom:6px;}
.output-body code{background:var(--bg-card-alt);padding:2px 5px;border-radius:var(--radius-sm);font-size:var(--text-xs);}
.output-body pre{background:var(--bg-card-alt);padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;margin:var(--space-3) 0;}
.output-body pre code{background:none;padding:0;}
.output-body strong,.tier-body strong{color:var(--text-bright);}
.output-body blockquote{border-left:3px solid var(--accent2);padding:var(--space-3) var(--space-4);background:var(--orange-soft);color:var(--text);margin:var(--space-4) 0;border-radius:0 var(--radius) var(--radius) 0;}
.nclex-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-card);margin-bottom:var(--space-3);overflow:hidden;transition:border-color var(--transition);box-shadow:var(--shadow-sm);}
.nclex-card.open{border-color:var(--info-border);box-shadow:var(--shadow-card);}
.nclex-header{width:100%;min-height:54px;padding:var(--space-4);background:transparent;border:none;display:flex;align-items:flex-start;gap:var(--space-3);text-align:left;}
.nclex-header:hover{background:var(--bg-card-alt);}
.nclex-qnum{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:var(--text-xs);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);flex-shrink:0;}
.nclex-body{padding:0 var(--space-4) var(--space-4);}
.anki-tbl-wrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-card);}
.anki-tbl-wrap table{width:100%;min-width:680px;border-collapse:collapse;}
.anki-tbl-wrap thead{background:var(--bg-card-alt);}
.anki-tbl-wrap th{padding:var(--space-3);white-space:nowrap;overflow-wrap:normal;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;text-align:left;border-bottom:1px solid var(--border);}
.anki-tbl-wrap td{padding:var(--space-2);border-bottom:1px solid var(--border);vertical-align:top;}
.anki-tbl-wrap tr:last-child td{border-bottom:none;}
.anki-tbl-wrap tr.dim{background:var(--bg-card-alt);color:var(--text-dim);}
.anki-tbl-wrap tr.dim .cell-ta{color:var(--text-dim);background:var(--bg-card-alt);}
.cell-ta{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:var(--font-ui);font-size:var(--text-sm);padding:var(--space-2);border-radius:var(--radius-sm);resize:vertical;line-height:1.6;min-height:80px;}
.cell-ta:focus{border-color:var(--border-focus);}
.cell-ta.tags-ta{color:var(--accent);font-size:var(--text-xs);font-family:var(--font-mono);}
.tier-badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;padding:4px 7px;border-radius:var(--radius-sm);letter-spacing:.2px;line-height:1.3;white-space:nowrap;flex-shrink:0;}
.tier-badge.t1,.tier-btn.t1.active{background:var(--orange-soft);color:var(--accent2);border:1px solid var(--orange-border);}
.tier-badge.t2,.tier-btn.t2.active{background:var(--accent-soft);color:var(--accent);border:1px solid var(--info-border);}
.tier-badge.t3,.tier-btn.t3.active{background:var(--bg-card-alt);color:var(--text-dim);border:1px solid var(--border-strong);}
.tier-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);min-height:34px;font-size:var(--text-xs);font-weight:500;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-dim);transition:background var(--transition),border-color var(--transition);}
.tier-btn b{font-weight:700;}
.tier-btn:hover{border-color:var(--accent);color:var(--accent);}
.stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4) var(--space-3);text-align:center;box-shadow:var(--shadow-sm);}
.stat-box .stat-val{font-size:26px;line-height:1.3;font-weight:700;color:var(--text-bright);font-variant-numeric:tabular-nums;}
.stat-box .stat-lbl{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
.tier-section{border-radius:var(--radius-lg);padding:var(--space-5);border:1px solid;margin-bottom:var(--space-4);}
.tier-section.t1{background:var(--orange-soft);border-color:var(--orange-border);}
.tier-section.t2{background:var(--info-soft);border-color:var(--info-border);}
.tier-section.t3{background:var(--bg-card);border-color:var(--border);}
.tier-section .tier-header{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4);}
.tier-section .tier-title{font-size:var(--text-lg);font-weight:700;}
.tier-section.t1 .tier-title{color:var(--accent2);}
.tier-section.t2 .tier-title{color:var(--accent);}
.tier-section.t3 .tier-title{color:var(--text-bright);}
.tier-body{font-size:15px;line-height:1.8;color:var(--text);overflow-wrap:anywhere;}
.tier-body h1,.tier-body h2,.tier-body h3,.tier-body h4{margin:var(--space-4) 0 var(--space-2);}
.fact-tag{display:inline-flex;align-items:center;gap:3px;min-height:24px;font-family:var(--font-mono);font-size:11px;font-weight:600;line-height:1.25;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid var(--info-border);background:var(--accent-soft);color:var(--accent);transition:background var(--transition),border-color var(--transition);vertical-align:baseline;white-space:nowrap;}
.fact-tag:hover{background:#dceafb;border-color:var(--accent);}
.fact-tag.missing{border-color:var(--danger-border);background:var(--danger-soft);color:var(--accent-red);cursor:help;}
.fact-tag:disabled{opacity:1;}
.fact-bucket-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:4px 8px;border-radius:var(--radius-sm);line-height:1.3;white-space:nowrap;background:var(--bg-card-alt);color:var(--accent);border:1px solid var(--border);}

/* Evidence drawer remains modal, with a stable close action and comfortable reading. */
.fact-drawer-scrim{position:fixed;inset:0;background:rgba(29,48,72,.32);z-index:80;animation:scrimIn 160ms ease;}
.fact-drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg-surface);border-left:1px solid var(--border);box-shadow:var(--shadow-drawer);z-index:81;display:flex;flex-direction:column;animation:drawerIn 180ms ease;}
.fact-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border);background:var(--bg-card-alt);}
.fact-drawer-head .fd-id{font-family:var(--font-mono);font-size:var(--text-lg);font-weight:700;color:var(--accent);}
.fact-drawer-close{width:40px;height:40px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);font-size:24px;line-height:1;border-radius:var(--radius);}
.fact-drawer-close:hover{background:var(--bg-hover);color:var(--text-bright);}
.fact-drawer-body{flex:1;min-height:0;overflow-y:auto;padding:var(--space-6);overflow-wrap:anywhere;}
.fd-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-dim);margin:var(--space-6) 0 var(--space-2);}
.fd-section-label:first-child{margin-top:0;}
.fd-fact-text{font-size:var(--text-lg);line-height:1.75;color:var(--text-bright);font-weight:500;}
.fd-anchor{font-size:var(--text-base);line-height:1.75;color:var(--text);border-left:3px solid var(--accent2);padding:var(--space-3) var(--space-4);background:var(--orange-soft);border-radius:0 var(--radius) var(--radius) 0;}

<script>
(function(){
  function bootFail(message){
    var root=document.getElementById('root');
    if(!root)return;
    // v16.0: startup feedback uses the same readable light surfaces as the workspace.
    root.innerHTML='<div role="alert" style="max-width:720px;margin:60px auto;padding:24px;color:var(--accent-red);background:var(--bg-surface);border:1px solid var(--danger-border);border-radius:12px;font-family:system-ui,sans-serif"><h2 style="margin:0 0 10px">LATTE Study Suite could not start</h2><p style="line-height:1.55">'+String(message||'Unknown startup error').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})+'</p><p style="color:var(--text-dim);line-height:1.55">Confirm that you are online and that React, Babel, PDF.js, and other CDN scripts are not blocked. Open the browser console for technical details.</p></div>';
  }
  window.__latteBootFail=bootFail;
  window.addEventListener('error',function(e){if(!window.__latteMounted)bootFail(e.message||'A startup script failed.');});
  setTimeout(function(){if(!window.__latteMounted)bootFail('Startup timed out. One or more CDN dependencies may have failed to load.');},12000);
})();
</script>
<script type="text/babel">
const {useState,useRef,useCallback,useEffect,useMemo,createContext,useContext}=React;

// ── Recommended per-tool profiles (Auto mode) ──
// Starting points synthesized from the model-routing discussion, NOT measured results.
// 'flash'/'pro' resolve against whatever is typed in the Flash/Pro model fields, so
// these stay correct when model names change. Every value is user-editable.
const TOOL_PROFILE_DEFAULTS={
  knowledge:{m:'flash',lv:'medium'},      // extraction — completeness-critical; pending A/B
  knowledgeAudit:{m:'flash',lv:'medium'}, // omission audit — comparison task
  // v15.12: reading printed text off a photograph is transcription, not reasoning. Low
  // thinking, and Flash — the constraint is legibility, which more deliberation does not
  // improve. Raise it only if measured output drifts between identical runs.
  cardTranscribe:{m:'flash',lv:'low'},    // flashcard photo -> verbatim transcript
  priorityHarvest:{m:'flash',lv:'low'},   // stage-1 inventory — same default v14 hardcoded
  priority:{m:'flash',lv:'medium'},       // stage-2 R1–R9 cascade, needs rule evaluation
  // v16.2: paired exports showed fewer shared-index gap bundles with Medium; saved overrides still win.
  anki:{m:'flash',lv:'medium'},           // recommended Anki Auto profile
  nclex:{m:'flash',lv:'medium'},          // parsing existing Q&A out of messy PDF text
  nclexgen:{m:'flash',lv:'high'},         // distractor plausibility is genuine reasoning
  cases:{m:'flash',lv:'high'},            // unfolding clinical reasoning + strict grounding
  // v15.6: applying a rubric to a rendered artifact is a JUDGMENT task, not a grounded
  // extraction task, so high reasoning is appropriate here and specifically NOT in the
  // ingestion stages — this does not contradict the earlier finding that high thinking
  // degrades grounded summarization. Both top-performing raters in the June study were
  // reasoning-enhanced configurations.
  // v15.7: defaulted to FLASH, not Pro. This is a COST decision, not a quality one. The
  // audit runs once per MCQ, and a real free-tier key exhausted its Pro allowance after
  // ~26 calls — an audit you cannot afford to run is worth less than a cheaper one you can.
  // Thinking stays high, which is the part that matters for rubric judgment. Switch this
  // row to Pro in the per-tool profiles when quota allows; nothing else needs to change.
  itemAudit:{m:'flash',lv:'high'},       // NEIA item-quality review of a rendered item
};
const PROFILE_ROWS=[
  {id:'knowledge',label:'Knowledge · extract'},
  {id:'knowledgeAudit',label:'Knowledge · audit'},
  {id:'cardTranscribe',label:'Knowledge · card OCR'},
  {id:'priorityHarvest',label:'Priority · harvest'},
  {id:'priority',label:'Priority · synthesis'},
  {id:'anki',label:'Anki'},
  {id:'nclex',label:'NCLEX · extract'},
  {id:'nclexgen',label:'NCLEX · generate'},
  {id:'cases',label:'Case studies'},
  // v15.7: ONE audit row, not one per source tool. The payload is a rendered item and the
  // prompt is criterion text; neither differs by which tool authored the item. Two rows
  // would be two places to drift.
  {id:'itemAudit',label:'Item quality · audit'},
];

/* ═══════════════════════════════════════════════════════
   SHARED CONFIG CONTEXT
   ═══════════════════════════════════════════════════════ */
const ConfigCtx=createContext();
function useConfig(){return useContext(ConfigCtx);}

// Shared, project-level LATTE knowledge base. Existing tools remain independent;
// consumers can opt into this source without changing their established prompts.
const KnowledgeCtx=createContext();
function useKnowledge(){return useContext(KnowledgeCtx);}
const EMPTY_LATTE_KB={
  metadata:{course:'',exam:'',createdAt:'',schemaVersion:'1.0'},
  sources:[],conditions:[],medications:[],diagnostics:[],scoringTools:[],formulas:[],contradictions:[]
};

// Shared Fact Inspector state. One selected fact ID drives a read-only drawer that can be
// opened from any fact-* reference across the suite. Kept separate from KnowledgeCtx so a
// fact-tag click never re-renders every KB consumer.
const FactInspectorCtx=createContext(null);
function useFactInspector(){return useContext(FactInspectorCtx);}

// Indexed KB lookup: id -> {condition, fact}. Normalizes case once so opening the inspector
// is O(1) instead of scanning every condition's facts on each click.
function buildFactIndex(kb){
  const map=new Map();
  for(const condition of (kb&&kb.conditions)||[])
    for(const fact of condition.facts||[])
      map.set(String(fact.id||'').toLowerCase(),{condition,fact});
  return map;
}
function findFactById(index,factId){return index?index.get(String(factId||'').toLowerCase())||null:null;}

// Compact, shared registry of generated artifacts, so the inspector can answer "Used in".
// Only lightweight indexes live here (id + factIds + a short label); full bodies stay in
// their own component/tab state.
// NOT PERSISTED, deliberately. kbNormalizeImported re-keys every fact id on load, so a
// registry restored across a KB rebuild would point at the wrong facts and show confident,
// wrong provenance. Persisting this safely needs content-derived fact ids (or a KB
// fingerprint that invalidates the registry); until then it is session-scoped.
const EMPTY_ARTIFACT_REGISTRY={schemaVersion:'1.0',ankiNotes:[],nclexQuestions:[],caseStudies:[]};
// Upsert by id, unioning factIds. Used where outputs ACCUMULATE (cases): generating a second
// case must not erase the first one's provenance. Regenerating Anki cards or NCLEX batches
// replaces the visible output, so those kinds keep replace semantics — merging there would
// leave "Used in" pointing at cards that no longer exist in the UI.
function mergeArtifactEntries(existing,incoming){
  const map=new Map((existing||[]).map(i=>[i.id,i]));
  for(const item of incoming||[]){
    const prev=map.get(item.id);
    map.set(item.id,prev?{...prev,...item,factIds:[...new Set([...(prev.factIds||[]),...(item.factIds||[])])]}:item);
  }
  return[...map.values()];
}
function getFactUsage(registry,factId){
  const id=String(factId||'').toLowerCase();
  const hit=arr=>(arr||[]).filter(item=>(item.factIds||[]).some(x=>String(x).toLowerCase()===id));
  return{anki:hit(registry.ankiNotes),nclex:hit(registry.nclexQuestions),cases:hit(registry.caseStudies)};
}

/* ═══════════════════════════════════════════════════════
   SHARED UTILITIES
   ═══════════════════════════════════════════════════════ */
function formatSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';}
function getExt(name){return name.split('.').pop().toLowerCase();}
// All markdown that reaches the DOM goes through this — marked does NOT sanitize HTML.
// v15.17: default sanitization admitted styles and auto-fetch media; study output needs only text markup.
const STUDY_OUTPUT_POLICY=Object.freeze({
  ALLOWED_TAGS:['h1','h2','h3','h4','h5','h6','p','br','hr','strong','em','b','i','u','s','del','blockquote','ul','ol','li','table','thead','tbody','tfoot','tr','th','td','caption','pre','code','sup','sub','a','div','span'],
  ALLOWED_ATTR:['href','title','colspan','rowspan','scope','start','class'],
  ALLOW_DATA_ATTR:false,ALLOW_ARIA_ATTR:false,RETURN_DOM_FRAGMENT:true,
});
function mdToSafeHtml(md){
  if(!DOMPurify||!DOMPurify.isSupported)throw new Error('The required HTML sanitizer is unavailable.');
  const fragment=DOMPurify.sanitize(marked.parse(md||''),STUDY_OUTPUT_POLICY);
  for(const node of fragment.querySelectorAll('[class]')){
    if(node.tagName==='DIV'&&node.classList.contains('pagebreak'))node.setAttribute('class','pagebreak');
    else node.removeAttribute('class');
  }
  const wrapper=document.createElement('div');wrapper.appendChild(fragment);return wrapper.innerHTML;
}
// navigator.clipboard requires a secure context. Under file:// or plain http:// it can be
// undefined or reject, which would silently break Copy buttons. Fall back to execCommand.
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true;}
  catch{
    try{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
      document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;
    }catch{return false;}
  }
}
// A merged fact can carry several supporting sources — cite all of them, not just the first.
function formatFactCitation(fact){
  const sources=(fact.sources||[]).map(s=>`${s.filename||''}${s.location?` (${s.location})`:''}`).filter(Boolean).join('; ');
  return `"${fact.sourceQuote||fact.text||''}"${sources?` — ${sources}`:''}`;
}
// crypto.randomUUID requires a secure context. file:// and https:// are fine, but on a
// plain http:// host it is undefined and calling it throws — which would kill card
// parsing outright. Fall back to a collision-safe local id.
let _uidN=0;
function uid(){
  try{if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();}catch(e){}
  return 'id-'+Date.now().toString(36)+'-'+(_uidN++).toString(36)+'-'+Math.random().toString(36).slice(2,8);
}



// PPTX text extraction. A .pptx is a ZIP of XML; slide text lives in <a:t> runs.
// Gemini's document understanding is PDF-centric — Office binary formats are not a
// documented inline_data type, so a deck sent as raw bytes can come back empty or
// error. Extracting client-side guarantees the slide content actually reaches the
// model, and preserves per-slide numbering so Source Pointers stay citable.
const _OOXML_A_NS = 'http://schemas.openxmlformats.org/drawingml/2006/main';
function _pptxRunText(xml,maxChars=PPTX_LIMITS.textChars) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  let runs = doc.getElementsByTagNameNS(_OOXML_A_NS, 't');
  if (!runs || !runs.length) runs = doc.getElementsByTagName('a:t');
  const out = [];let chars=0;
  for (let i = 0; i < runs.length; i++) {
    // v16.7: DrawingML a:t is leaf text; nested runs duplicated descendants before the final limit.
    if(runs[i].firstElementChild)throw new Error('PPTX text runs contain nested markup. Repair the deck or convert it to PDF.');
    const t=(runs[i].textContent||'').trim();
    if(!t)continue;
    const extra=t.length+(out.length?1:0); // both slide and note joins use a one-character separator
    if(extra>maxChars-chars)throw new Error('PPTX extracted text exceeds the safe limit. Split the deck before importing.');
    chars+=extra;out.push(t);
  }
  return out;
}
function _zipNormalizePath(basePath,target){
  const base=basePath.split('/');base.pop();
  for(const part of String(target||'').replace(/\\/g,'/').split('/')){
    if(!part||part==='.')continue;
    if(part==='..')base.pop();else base.push(part);
  }
  return base.join('/').replace(/^\//,'');
}
function _xmlElementsByLocalName(doc,name){
  return Array.from(doc.getElementsByTagName('*')).filter(el=>el.localName===name||el.nodeName.split(':').pop()===name);
}
function _relsMap(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');const map=new Map();
  for(const rel of _xmlElementsByLocalName(doc,'Relationship'))map.set(rel.getAttribute('Id'),{target:rel.getAttribute('Target')||'',type:rel.getAttribute('Type')||''});
  return map;
}
// v16.7: eager ZIP strings allowed compressed decks to exhaust the tab before chunking.
const PPTX_LIMITS=Object.freeze({fileBytes:64*1024*1024,entries:10000,xmlBytes:4*1024*1024,totalBytes:32*1024*1024,slides:2000,textChars:4*1024*1024});
function pptxCheckAbort(signal){if(signal?.aborted)throw new DOMException('Aborted','AbortError');}
function pptxAwait(promise,signal){
  if(!signal)return promise;
  return new Promise((resolve,reject)=>{
    let done=false;
    const finish=(fn,value)=>{if(done)return;done=true;signal.removeEventListener('abort',abort);fn(value);};
    const abort=()=>finish(reject,new DOMException('Aborted','AbortError'));
    // Observe the source promise even if cancellation wins during its creation.
    Promise.resolve(promise).then(value=>{if(signal.aborted)abort();else finish(resolve,value);},error=>finish(reject,error));
    if(signal.aborted)abort();else signal.addEventListener('abort',abort,{once:true});
  });
}
function pptxReadXml(entry,budget,signal){
  pptxCheckAbort(signal);
  // Count actual output bytes before decoding/DOM parsing; ZIP size headers are not trusted.
  return new Promise((resolve,reject)=>{
    const stream=entry.internalStream('uint8array'),chunks=[];let size=0,done=false;
    const fail=error=>{if(done)return;done=true;stream.pause();chunks.length=0;signal?.removeEventListener('abort',abort);reject(error);};
    const abort=()=>fail(new DOMException('Aborted','AbortError'));
    stream.on('data',chunk=>{
      // JSZip can finish its current inflate block after pause; retain none of those bytes.
      if(done)return;
      if(signal?.aborted){abort();return;}
      if(chunk.length>PPTX_LIMITS.xmlBytes-size||chunk.length>PPTX_LIMITS.totalBytes-budget.bytes){fail(new Error('PPTX XML expansion exceeds the safe extraction limit. Split the deck or convert it to PDF.'));return;}
      size+=chunk.length;budget.bytes+=chunk.length;chunks.push(chunk);
    }).on('error',fail).on('end',()=>{
      if(done)return;
      if(signal?.aborted){abort();return;}
      try{
        const decoder=new TextDecoder('utf-8'),text=chunks.map(chunk=>decoder.decode(chunk,{stream:true}));text.push(decoder.decode());
        const result=text.join('');done=true;chunks.length=0;signal?.removeEventListener('abort',abort);resolve(result);
      }catch(error){fail(error);}
    });
    signal?.addEventListener('abort',abort,{once:true});
    if(signal?.aborted)abort();else stream.resume();
  });
}
async function extractPptxText(file,{signal}={}) {
  pptxCheckAbort(signal);
  if (typeof JSZip === 'undefined') throw new Error('JSZip failed to load — cannot read PPTX. Convert the deck to PDF and re-upload.');
  if(!Number.isFinite(file.size)||file.size>PPTX_LIMITS.fileBytes)throw new Error('PPTX exceeds the 64 MiB source limit. Split the deck or convert it to PDF.');
  // JSZip metadata parsing is not interruptible; its input is bounded first, then entries are capped.
  const zip = await pptxAwait(JSZip.loadAsync(file),signal);
  pptxCheckAbort(signal);
  const entries=Object.keys(zip.files),budget={bytes:0};
  if(entries.length>PPTX_LIMITS.entries)throw new Error('PPTX contains too many ZIP entries. Split the deck or convert it to PDF.');
  const read=name=>pptxReadXml(zip.files[name],budget,signal);
  let slides=[];
  // PowerPoint presentation order is defined by presentation.xml relationships, not slide filenames.
  if(zip.files['ppt/presentation.xml']&&zip.files['ppt/_rels/presentation.xml.rels']){
    const presXml=await read('ppt/presentation.xml');
    const presDoc=new DOMParser().parseFromString(presXml,'application/xml');
    const rels=_relsMap(await read('ppt/_rels/presentation.xml.rels'));
    const references=_xmlElementsByLocalName(presDoc,'sldId');
    if(references.length>PPTX_LIMITS.slides)throw new Error('PPTX contains more than 2,000 slide references. Split the deck before importing.');
    slides=references.map(el=>{
      const rid=el.getAttribute('r:id')||el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      const rel=rels.get(rid);return rel?_zipNormalizePath('ppt/presentation.xml',rel.target):null;
    }).filter(n=>n&&zip.files[n]);
  }

  if(!slides.length)slides=entries.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/slide(\d+)/)[1])-parseInt(b.match(/slide(\d+)/)[1]));
  if (!slides.length) throw new Error('No slides found in "' + file.name + '" — is it a valid .pptx?');
  if(slides.length>PPTX_LIMITS.slides)throw new Error('PPTX contains more than 2,000 slides. Split the deck before importing.');
  let out = '';

// not send that header — it returns the wait inside the error BODY as a google.rpc.RetryInfo

// either over-waits or retries inside a still-closed per-minute window. The number was
// already in hand: the caller parses `err` three lines earlier and then discards it. Free-tier

async function callGemini(apiKey,model,parts,opts={}){
  // v15.14: options object. The old signature was TEN positional parameters, one of them
  // (useThinking) inert since v15 and kept only so existing call sites stayed valid — so
  // passing an onMeta meant filling three earlier slots with true/null/null placeholders.
  // The guard below makes a missed migration fail loudly and immediately instead of binding
  // a stray boolean to opts and silently losing every option after it.
  if(typeof opts!=='object'||opts===null||Array.isArray(opts))
    throw new Error('callGemini: pass an options object - the positional signature was removed in v15.14');
  const {thinkingLevel,signal,retries=2,onUpdate,onMeta,generationConfig}=opts;
  // generationConfig: optional per-request overrides (e.g. responseMimeType) so a call site
  // can opt in without forking the wrapper. NOTE: never set a JSON mime here globally —
  // Priority/Anki/NCLEXgen consume markdown / code-block / plain-text from this same wrapper.
  const body={contents:[{parts}],generationConfig:Object.assign({maxOutputTokens:65536},generationConfig||{})};
  // The level is applied as given — it is no longer forced to 'low' when the Pro toggle is
  // off. cfg.thinkingLevel already resolves to the active model's level, so Flash+medium/high
  // is expressible.
  body.generationConfig.thinkingConfig={thinkingLevel:thinkingLevel||'low'};
  return geminiRequest(apiKey,model,body,{signal,retries,onUpdate,onMeta});
}

function extractJSON(text){
  const fm=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(fm)try{return JSON.parse(fm[1].trim());}catch(e){}
  const bs=text.indexOf('{'),bk=text.indexOf('[');const start=Math.min(bs>=0?bs:Infinity,bk>=0?bk:Infinity);
  if(start===Infinity)throw new Error('No JSON found.');
  const opener=text[start],closer=opener==='{'?'}':']';let depth=0,inStr=false,esc=false;
  for(let i=start;i<text.length;i++){const ch=text[i];
    if(esc){esc=false;continue;}
    if(inStr){if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'){inStr=true;continue;}
    if(ch===opener)depth++;else if(ch===closer)depth--;
    if(depth===0){try{return JSON.parse(text.substring(start,i+1));}catch(e){throw new Error('Malformed JSON.');}}
  }
  throw new Error('JSON truncated.');
}

// reading order; the naive tc.items.map(x=>x.str).join(' ') the KB used flattens a whole

function markdownToPlainText(md){
  // The print-only page-break marker must not leak into plaintext exports; render it as a rule.
  return String(md||'').replace(/<div class="pagebreak"><\/div>/g,'\n---\n').replace(/^#{1,6}\s+/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/`(.+?)`/g,'$1').replace(/```[\s\S]*?```/g,'').replace(/^\|.*\|$/gm,line=>{if(/^[\|\s:-]+$/.test(line))return'';return line.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()).join('\t');}).replace(/^[-*+]\s+/gm,'\u2022 ').replace(/^>\s+/gm,'  ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/---+/g,'\n').replace(/\n{3,}/g,'\n\n').trim();

// Fallback when a popup blocker eats the preview window: print from a hidden iframe.
function printViaIframe(html){
  const frame=document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  // v15.17: the fallback needs parent DOM access and print dialogs, but never frame scripts.
  frame.setAttribute('sandbox','allow-same-origin allow-modals');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:8.5in;height:11in;border:0;';
  frame.onload=()=>{
    // Remove as soon as the print dialog closes. The old flat 120s hold meant several
    // full-document iframes could pile up if you exported repeatedly.
    let gone=false;
    const cleanup=()=>{if(gone)return;gone=true;try{frame.remove();}catch(e){}};
    try{frame.contentWindow.addEventListener('afterprint',cleanup,{once:true});}catch(e){}
    try{frame.contentWindow.focus();frame.contentWindow.print();}catch(e){console.error('Print failed',e);}
    setTimeout(cleanup,15000);
  };
  frame.srcdoc=html;
  document.body.appendChild(frame);
}

function exportAsPdf(mdContent,title,subtitle){
  if(!mdContent||!mdContent.trim()){alert('Nothing to export yet.');return;}
  const html=buildPrintDoc(mdContent,title,subtitle);
  let win=null,winDoc=null;
  // v15.3: belt-and-suspenders. Same-origin about:blank cannot throw on .document access
  // (COOP governs cross-origin), but the read is wrapped so any exotic blocker/embedding
  // environment falls back to iframe printing instead of dying mid-export.
  // v16.7: retained external links may navigate the preview; their destination must have no opener.
  try{win=window.open('','_blank');if(win)win.opener=null;winDoc=win?win.document:null;}catch(e){win=null;winDoc=null;}
  if(!win||!winDoc){printViaIframe(html);return;}
  win.document.open();
  win.document.write(html);
  win.document.close();
  const fire=()=>{
    try{
      const btn=win.document.getElementById('lp-print');
      if(btn)btn.onclick=()=>win.print();
      win.focus();
      win.print();
    }catch(e){console.error('Print failed',e);}
  };
  // Long guides need a beat to lay out before the print engine measures pages.
  if(win.document.readyState==='complete')setTimeout(fire,350);
  else win.addEventListener('load',()=>setTimeout(fire,350),{once:true});
}

// Surfaces a MAX_TOKENS stop. The model prompt cannot prevent this — the cut happens
// at the API layer, below the prompt's "never truncate silently" instruction.
// v16.0: long-form warnings need the same readable type and semantic surfaces as tool results.
function TruncationNotice({meta,label}){
  if(!meta||!meta.truncated)return null;
  const u=meta.usage||{};
  const think=u.thoughtsTokenCount||0,out=u.candidatesTokenCount||0,inp=u.promptTokenCount||0;
  return <div className="error-banner" role="status" style={{color:'var(--accent-warm)',borderColor:'var(--warning-border)',background:'var(--warning-soft)'}}>
    <span>⚠</span>
    <div>
      <strong style={{color:'var(--accent-warm)'}}>{label?label+' — ':''}Output hit the token ceiling (MAX_TOKENS)</strong>
      <div style={{fontSize:12,marginTop:5,lineHeight:1.65,color:'var(--text-dim)'}}>
        The response stopped because it ran out of room, not because it finished. Content is missing from the end.
        {(think>0||out>0||inp>0)&&<div style={{fontFamily:'JetBrains Mono',fontSize:12,marginTop:6,color:'var(--text)'}}>
          input {inp.toLocaleString()} · thinking {think.toLocaleString()} · output {out.toLocaleString()} · ceiling 65,536
        </div>}
        {think>0
          ? <div style={{marginTop:6}}>Thinking tokens draw from the same budget as the document. Dropping Thinking Level (or switching to Standard) would free about <b style={{color:'var(--text)'}}>{think.toLocaleString()}</b> tokens for content.</div>
          : <div style={{marginTop:6}}>Thinking was not the cause — the document itself filled the budget. Split the source into fewer files per run, or trim the prompt's output scope.</div>}
      </div>
    </div>
  </div>;
}

// A clickable fact-* reference. Renders anywhere a fact ID appears; opens the read-only
// inspector. Flagged as `.missing` (non-clickable) if the ID is not in the current KB.
// v15.17: old fact IDs must never resolve against a replacement KB with reused numbering.
const ArtifactSourceCtx=React.createContext(null);
function artifactSourceSnapshot(sourceKB){
  const freeze=value=>{if(value&&typeof value==='object'){Object.values(value).forEach(freeze);Object.freeze(value);}return value;};
  const kb=freeze(JSON.parse(JSON.stringify(sourceKB)));
  return Object.freeze({sourceKB,kb,factIndex:buildFactIndex(kb)});
}
function artifactSourceCurrent(source,kb){return !!source&&source.sourceKB===kb;}
function artifactExportNotice({source,activeKB,requested,actual,auditRequested,auditState,rows=[]}){
  const lines=[];
  if(source&&!artifactSourceCurrent(source,activeKB))lines.push('Source: earlier Knowledge Base. References belong to that original source; current links are disabled.');
  if(Number.isFinite(requested))lines.push('Completeness: '+actual+' of '+requested+' requested questions'+(actual<requested?' — incomplete generation; no padding was added.':'.'));
  if(!auditRequested)lines.push('Item quality audit: disabled.');
  else{
    const counts=['PASS','FAIL','ERROR','REVIEW','N/A','REPAIRED'].map(status=>[status,rows.filter(r=>r.status===status).length]);
    const incomplete=auditState!=='complete'||rows.length<actual;
    lines.push('Item quality audit: '+(incomplete?(auditState==='complete'?'incomplete':auditState||'not completed'):'complete')+'. '+counts.filter(([,n])=>n).map(([status,n])=>status+' '+n).join(', ')+'.');
    if(counts.some(([status,n])=>n&&['FAIL','ERROR','REVIEW'].includes(status)))lines.push('Unresolved item findings remain; review before studying.');
    if(counts.some(([status,n])=>status==='REPAIRED'&&n))lines.push('REPAIRED means rewritten, not re-audited. N/A is not a pass.');
  }
  return '> '+lines.join('\n> ')+'\n\n';
}
// v15.17: JSON-view Copy must retain the same review limitations as Markdown and print.
function artifactJsonExport(artifact,notice,validation=[],auditRows=[]){
  return JSON.stringify({...artifact,_suiteReview:{notice:String(notice||'').trim(),validation:validation.map(i=>({severity:i.sev,message:i.msg})),itemAudit:auditRows.map(r=>({id:r.key||r.num||r.q?.id||'',status:r.status,criterion:r.criterion||''}))}},null,2);
}
function FactTag({factId,children}){
  const K=useKnowledge();const FI=useFactInspector();
  const source=useContext(ArtifactSourceCtx);
  const id=String(factId||'');
  if(source&&!artifactSourceCurrent(source,K.knowledgeBase))return <span className="fact-tag missing" title="Earlier Knowledge Base: this reference belongs to the original source">{children||id} (earlier source)</span>;
  const known=K.factIndex?K.factIndex.has(id.toLowerCase()):false;
  if(!FI)return <span className="fact-tag">{children||id}</span>;
  if(!known)return <span className="fact-tag missing" title={`${id} is not in the current Knowledge Base`}>{children||id}</span>;
  return <button type="button" className="fact-tag" onClick={()=>FI.openFactInspector(id)} title={`Inspect ${id}`}>{children||id}</button>;
}

// Renders a run of text, turning every fact-NN token into a clickable FactTag.
function FactText({text}){
  const parts=String(text||'').split(/(fact-\d+)/gi);

}

// Read-only Fact Inspector drawer. Slides in from the right; shows the fact, its LATTE
// bucket/tier/type, source pointer, verbatim anchor, and downstream "Used in" usage from
// the shared artifact registry. Accessible: role=dialog, Escape-to-close, focus management,
// body scroll lock, focus restoration.
function FactInspectorDrawer(){
  const K=useKnowledge();const FI=useFactInspector();
  const factId=FI&&FI.inspectedFactId;
  const closeRef=useRef(null),returnFocusRef=useRef(null),drawerRef=useRef(null);
  const found=useMemo(()=>factId?findFactById(K.factIndex,factId):null,[factId,K.factIndex]);
  const usage=useMemo(()=>factId&&K.artifactRegistry?getFactUsage(K.artifactRegistry,factId):{anki:[],nclex:[],cases:[]},[factId,K.artifactRegistry]);

  useEffect(()=>{
    if(!factId)return;
    returnFocusRef.current=document.activeElement;
    const onKey=e=>{
      if(e.key==='Escape'){e.preventDefault();FI.closeFactInspector();return;}
      if(e.key!=='Tab')return;
      // v15.14: the dialog declared aria-modal but never trapped focus, so Tab left it.
      const root=drawerRef.current;if(!root)return;
      const f=[...root.querySelectorAll('a[href],button:not([disabled]),textarea,input:not([disabled]),select,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
      if(!f.length)return;
      const first=f[0],last=f[f.length-1],here=document.activeElement;
      if(!root.contains(here)){e.preventDefault();first.focus();}
      else if(e.shiftKey&&here===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&here===last){e.preventDefault();first.focus();}
    };
    document.addEventListener('keydown',onKey);
    const prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
    const t=setTimeout(()=>{try{closeRef.current&&closeRef.current.focus();}catch(e){}},30);
    return()=>{
      document.removeEventListener('keydown',onKey);
      document.body.style.overflow=prevOverflow;
      clearTimeout(t);
      try{returnFocusRef.current&&returnFocusRef.current.focus&&returnFocusRef.current.focus();}catch(e){}
    };
  },[factId,FI]);

  if(!factId)return null;
  const fact=found&&found.fact,condition=found&&found.condition;
  const doCopy=async(text)=>{await copyText(text);};

  return <>
    <div className="fact-drawer-scrim" onClick={()=>FI.closeFactInspector()}/>
    <div ref={drawerRef} className="fact-drawer" role="dialog" aria-modal="true" aria-labelledby="fact-inspector-title">
      <div className="fact-drawer-head">
        <span className="fd-id" id="fact-inspector-title">{String(factId).toUpperCase()}</span>
        <button ref={closeRef} className="fact-drawer-close" aria-label="Close fact inspector" onClick={()=>FI.closeFactInspector()}>×</button>
      </div>
      <div className="fact-drawer-body">
        {!fact?<div style={{fontSize:12.5,color:'var(--text-dim)',lineHeight:1.6}}>This fact ID is not in the current Knowledge Base. It may have come from an older run, or the Knowledge Base was rebuilt since this output was generated.</div>:<>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text-bright)',marginBottom:8}}>{condition?condition.name:'—'}</div>
          <div className="fd-meta-row" style={{marginBottom:14}}>
            <span className="fact-bucket-badge">{fact.latteBucket}{fact.subtype?' · '+fact.subtype:''}</span>
            <span className={'tier-badge t'+(fact.tier||'')}>Tier {fact.tier}</span>
            {fact.factType&&fact.factType!=='other'&&<span className="fact-bucket-badge" style={{color:'var(--text-dim)'}}>{fact.factType}</span>}
            {fact.safetyCritical&&<span className="tier-badge t1">safety-critical</span>}
            {fact.recovered&&<span className="fact-bucket-badge" style={{color:'var(--accent-green)'}}>audit-recovered</span>}
          </div>
          <div className="fd-section-label">Fact</div>
          <div className="fd-fact-text">{fact.text}</div>
          {fact.sourceQuote&&<><div className="fd-section-label">Verbatim anchor</div><div className="fd-anchor">{fact.sourceQuote}</div></>}
          <div className="fd-section-label">Source</div>
          <div className="fd-source">{kbSourceText(fact)||'Pointer unavailable'}</div>
          <div className="fd-section-label">Used in</div>
          {(usage.anki.length||usage.nclex.length||usage.cases.length)?<div>
            {usage.anki.map((a,i)=><div key={'a'+i} className="fd-usage-item">🗂 Anki note {a.label||a.id}</div>)}
            {usage.nclex.map((q,i)=><div key={'q'+i} className="fd-usage-item">✍️ {q.label||('NCLEX question '+q.id)}</div>)}
            {usage.cases.map((c,i)=><div key={'c'+i} className="fd-usage-item">🩺 {c.label||('Case '+c.id)}</div>)}
          </div>:<div className="fd-usage-empty">No generated Anki notes, NCLEX questions, or case studies reference this fact yet. Generate outputs to build the traceability chain.</div>}
        </>}
      </div>
      {fact&&<div className="fd-drawer-actions">
        <button className="btn-secondary" onClick={()=>doCopy(fact.text)}>Copy fact</button>
        <button className="btn-secondary" onClick={()=>doCopy(formatFactCitation(fact))}>Copy citation</button>
      </div>}
    </div>

PHASE 0 — INPUT HANDLING

- Clean repeated headers, footers, page numbers, offsets, citation markers, and artifact text internally.
- If duplicate content appears, keep it once unless the duplicate adds meaningful differences.
- Preserve the order of first appearance within each condition and LATTE bucket.
- Separate combined conditions. Do not invent diseases, values, thresholds, or missing facts.

PHASE 1 — LATTE ASSIGNMENT

Before returning JSON, assign every extractable fact to exactly one LATTE bucket.

BriefPatho = disease mechanism, etiology, classification, what is going wrong
Look = signs, symptoms, complaints, red flags, deterioration signs, observable side effects
Assess = what the nurse assesses, checks, asks, inspects, trends, monitors, sequences
Tests = labs, imaging, diagnostics, values, ranges, units, interpretations
Treatments = medications, doses, routes, timing, interventions, procedures, safety steps, contraindications, precautions, hold/notify thresholds
Educate = patient/family teaching, discharge teaching, home management, follow-up, when to seek care

Every fact must belong to exactly one LATTE bucket. If a sentence spans multiple buckets, split it into separate atomic facts.

Look vs Assess:
- Look = what is present.
- Assess = what the nurse does.

Quick bucket rules:
- drug mechanism of action stated in the source -> Treatments
- disease cause or etiology -> BriefPatho
- disease subtype or classification -> BriefPatho
- side effects and findings -> Look
- assessment actions -> Assess
- labs, values, ranges, and diagnostic interpretations -> Tests
- medications, interventions, precautions, and hold parameters -> Treatments
- home and discharge teaching -> Educate

PHASE 1.25 — FAST-REVIEW LANGUAGE

Rewrite long source wording into concise review language.
Target style: compressed, punchy, minimal, non-fluffy, easy to scan, and still precise.
Do not write essay-like facts.

COVERAGE-OVER-COMPRESSION RULE

If compression would drop a threshold, qualifier, timing, route, population, exception, or condition that changes meaning, do not compress it away.
Keep the qualifier in the same fact or split the content into multiple atomic facts.

Details that must not be lost:
- exact dose and unit
- frequency and route
- timing and duration
- hold and notify thresholds
- population or person to whom the instruction applies
- when to seek care
- contraindication condition
- comparison words such as increased, decreased, high, low, above, and below

PHASE 1.5 — ATOMICITY

Each fact should contain one tightly linked clinical idea.
Split when:
- a sentence contains unrelated facts
- the facts matter independently
- one item would become a list-recall prompt
- brevity would otherwise omit a qualifier needed for full meaning

Combine only when facts are naturally linked, such as:
- drug + dose + route
- threshold + required action
- a clinically taught pair where one fact is necessary to interpret the other

SOURCE POINTER RULES

- Use the actual filename in every source pointer.
- Never use generic labels such as File 1, Source 1, the textbook, or the slides.
- Preserve the page or slide location whenever it can be determined.
- For every fact, preserve a short verbatim sourceQuote of no more than 20 words containing the supporting fact, value, or rule.
- The sourceQuote must be copied from the supplied source, not rewritten. If no clean quote can be recovered, use an empty string rather than inventing one.
- Every numeric value, dose, route, threshold, timeframe, contraindication, emergency finding, and safety instruction must carry a source pointer.
- Do not silently correct or modernize source content.
- When two source statements conflict within this file, preserve both and add a concise item to contradictions.

TIER RULES

Every fact receives exactly one tier.

Tier 1 = must-know for exams: core concepts, hallmark findings, priority nursing interventions, safety concerns, major labs, major medications and critical parameters, key complications, and essential teaching.
Tier 2 = important supporting detail: secondary findings, additional monitoring, less common but testable adverse effects, supporting pathophysiology, supporting interpretations, and additional teaching.
Tier 3 = useful lower-priority context: minor details, rare exceptions, deep mechanisms, exhaustive list completions, and edge-case qualifiers.

- When uncertain, round up in priority rather than down.
- Drug names, doses, routes, hold parameters, notify thresholds, contraindications, and safety warnings are always Tier 1.
- Patient education about when to seek emergency care is always Tier 1.
- Do not omit Tier 3 facts. Tiering is for prioritization, not extraction filtering.

FINAL VALIDATION BEFORE RETURNING JSON

Silently verify:
- every fact belongs to exactly one valid LATTE bucket
- no fact lost a clinically meaningful qualifier
- combined conditions were split
- every fact has one tier
- safety-critical and numerical facts have actual filename pointers
- each fact has a verbatim sourceQuote when the source text allows one

function validateLatteKnowledgeBase(kb){
  const issues=[];

  const ids=new Set();
  for(const c of kb.conditions||[]){
    if(!String(c.name||'').trim())issues.push({severity:'error',message:'A condition is missing its name.'});
    if(!(c.facts||[]).length)issues.push({severity:'warning',condition:c.name,message:'Condition has no extracted facts.'});
    for(const f of c.facts||[]){
      if(ids.has(f.id))issues.push({severity:'error',condition:c.name,factId:f.id,message:'Duplicate fact ID.'});
      ids.add(f.id);
      if(!buckets.has(f.latteBucket))issues.push({severity:'error',condition:c.name,factId:f.id,message:'Invalid LATTE bucket: '+String(f.latteBucket)});
      if(![1,2,3].includes(Number(f.tier)))issues.push({severity:'error',condition:c.name,factId:f.id,message:'Fact does not have exactly one valid tier.'});
      if(!String(f.text||'').trim())issues.push({severity:'error',condition:c.name,factId:f.id,message:'Fact text is empty.'});
      if(!String(f.sourceQuote||'').trim())issues.push({severity:'warning',condition:c.name,factId:f.id,message:'Fact has no short verbatim source anchor; NCLEX grounding will fall back to the concise fact text.'});
      const critical=!!f.safetyCritical||f.factType==='threshold'||f.factType==='contraindication'||/(?:\b(?:mg|mcg|mEq|mm\s*Hg|bpm|mL|hours?|minutes?|days?|hold|notify|emergency|rapid response)\b|contraindicat|\d\s*%)/i.test(f.text||''); // v15: "%" and "contraindicat" sat before a \b that a non-word/continuing char can never satisfy — neither alternative had ever matched

}

function kbForNCLEX(kb,{tiers=[1,2,3],buckets=null,conditionQuery=''}={}){

// ── v15.12: flashcard ingestion, pass 1 of 2 ────────────────────────────────

// pipeline is split in two:
//   pass 1  image  -> structured transcript, verbatim, no interpretation   (this block)
//   pass 2  transcript -> LATTE facts, via the EXISTING frozen extractor   (unchanged)
//
// The split is the whole design. Because pass 2 never sees the image, the transcript is
// the artifact everything downstream grounds against — kbQuoteInSource verifies quotes
// against transcript text exactly as it does against PDF text, so no new evidence model
// is needed. It also means iterating on extraction costs zero image calls.
//
// The cost of that split, stated plainly: THE TRANSCRIPT IS THE TRUST BOUNDARY. If pass 1
// misreads "small bowel >3 cm" as ">8 cm", pass 2 grounds against the wrong transcript

// v15.12 exists for — photographing a Davis deck — as an HTTP 413 or a tab that spikes memory
// on a phone.
//
// THE CONSTRAINT THAT SETS THE NUMBERS. This is an OCR path whose prompt says NEVER GUESS A
// NUMBER, and the transcript is the trust boundary for everything downstream. An aggressive
// resize would trade a 413 for the precise failure the two-pass design exists to prevent: a
// digit that is still legible enough to be read, and read wrong. So nothing below the
// threshold is touched at all, and above it the long edge lands at 3000px — still well over

async function cardFilePayload(file){
