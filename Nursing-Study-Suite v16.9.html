function NCLEXExtractor(){
  // v16.0: named controls, visible selection states, and reflowing groups replace inaccessible fixed layouts.
  const cfg=useConfig();
  const [files,setFiles]=useState([]);
  const [mode,setMode]=useState('inline'); // 'inline' or 'split'
  const [chunkSize,setChunkSize]=useState(3000);
  const [overlap,setOverlap]=useState(800);
  const [pageCount,setPageCount]=useState(null);
  // v15.15: inline mode gets the same page-range picker split mode has. OFF by default, so
  // the whole document stays the norm; a range is opt-in for the chapters you actually want.
  const [iRangeOn,setIRangeOn]=useState(false);
  const [iRanges,setIRanges]=useState([{start:1,end:50}]);
  const [qRanges,setQRanges]=useState([{start:1,end:50}]);
  const [aRanges,setARanges]=useState([{start:51,end:100}]);
  const [batchSize,setBatchSize]=useState(8);
  const [status,setStatus]=useState('idle');
  const [progress,setProgress]=useState({current:0,total:0});
  const [questions,setQuestions]=useState([]);
  const [error,setError]=useState('');
  const [log,setLog]=useState([]);
  const [filterStrategy,setFilterStrategy]=useState('');
  const [filterDisease,setFilterDisease]=useState('');
  const abortRef=useRef(null); // v15: holds the run's AbortController — the old boolean only skipped FUTURE chunks; in-flight requests and retries could not be cancelled
  const fRef=useRef(null);

  const {model,level:toolLevel}=cfg.forTool('nclex');
  // v15.14: one intake path, filtering and de-duplicating on the same rule as the KB builder.
  // v16.7: capture the event's live FileList before input reset or drop completion empties it.
  const addPdfs=fl=>{const selected=Array.from(fl||[]);setFiles(p=>[...p,...selected
    .filter(f=>/.pdf$/i.test(f.name||'')||f.type==='application/pdf')
    .filter(f=>!p.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))]);};

  // Auto-detect page count when files change
  const firstFileRef=useRef('');
  useEffect(()=>{
    const f=files[0];
    if(!f){setPageCount(null);firstFileRef.current='';return;}
    // v15.14: stale-guard the resolve, and only seed the ranges when the file in slot 0 has
    // actually CHANGED identity. cardFileId is the same name+size+lastModified key the rest
    // of the suite uses for "is this the same file".
    let stale=false;
    const id=cardFileId(f);
    getPdfPageCount(f).then(n=>{
      if(stale)return;
      setPageCount(n);
      if(firstFileRef.current!==id){
        firstFileRef.current=id;
        const mid=Math.ceil(n/2);setQRanges([{start:1,end:mid}]);setARanges([{start:mid+1,end:n}]);setIRanges([{start:1,end:n}]);
      }
    }).catch(()=>{if(!stale)setPageCount(null);});
    return()=>{stale=true;};
  },[files]);

  const allStrategies=useMemo(()=>[...new Set(questions.map(q=>q.test_taking_strategy).filter(Boolean))].sort(),[questions]);
  const filtered=useMemo(()=>questions.filter(q=>{
    if(filterStrategy&&q.test_taking_strategy!==filterStrategy)return false;
    if(filterDisease){const term=filterDisease.toLowerCase();if(!q.diseases_conditions?.some(d=>d.toLowerCase().includes(term))&&!q.question?.toLowerCase().includes(term))return false;}
    return true;
  }),[questions,filterStrategy,filterDisease]);

  const addLog=useCallback(msg=>setLog(p=>[...p.slice(-200),`[${new Date().toLocaleTimeString()}] ${msg}`]),[]); // v15.14: capped, like the KB builder

  // ── v15: the run pipeline threads a real AbortController through every request and
  // inter-chunk sleep (the old boolean flag only skipped FUTURE chunks — an in-flight
  // request kept streaming and billing until it finished). Questions are tagged with
  // stable ids at extraction so React keys survive filtering, and split mode processes
  // one PDF per run because the page-range fields describe exactly one file's layout.
  // v15.14: nclexSleep and nclexId were local re-implementations of _sleep and uid. The
  // sleep copy leaked one abort listener per chunk; _sleep has always detached its own.

  // Gemini call for NCLEX (with retry)
  async function nclexCallGemini(prompt,signal){
    // Was 8192 — the legacy ceiling. A dense chunk overflowed it, the JSON came back
    // truncated, the bare parse threw, and the whole chunk was silently skipped.
    const gc={maxOutputTokens:65536,responseMimeType:'application/json'};gc.thinkingConfig={thinkingLevel:toolLevel};
    let cut=false;
    const raw=await geminiRequest(cfg.apiKey,model,{contents:[{parts:[{text:prompt}]}],generationConfig:gc},{signal,onMeta:m=>{cut=!!m.truncated;}});
    const cleaned=raw.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
    try{return JSON.parse(cleaned);}
    catch(e){
      // Fall back to the depth-scanning extractor before writing off the chunk.
      try{return extractJSON(cleaned);}catch(e2){}
      throw new Error(cut?'Output hit the token ceiling mid-JSON \u2014 reduce chunk size or questions per batch.':'Model returned unparseable JSON (chunk skipped)');
    }
  }

  // ── Inline mode runner ──
  async function runInline(file,existingQ,signal){
    addLog(`📄 Extracting "${file.name}"...`);
    // v15.14: the signal is threaded now, so Cancel works during the local read instead of
    // only between chunks. runInline awaits the whole extraction before its first check.
    // v15.15: read only the requested pages when the range picker is on. nclexExtractPageRange
    // is the same cancellable, page-cleaning walk split mode uses.
    let text;
    if(iRangeOn&&iRanges.length){
      text='';
      for(const r of iRanges){addLog(`  Pages ${r.start}–${r.end}`);text+=await nclexExtractPageRange(file,r.start,r.end,signal);}
    }else text=await extractPdfTextSpaced(file,signal);
    addLog(`  ${text.length.toLocaleString()} chars`);
    const chunks=nclexChunkText(text,chunkSize,overlap);addLog(`  ${chunks.length} chunks (size: ${chunkSize}, overlap: ${overlap})`);
    setProgress({current:0,total:chunks.length});
    const allQ=[...existingQ],seen=new Set();for(const q of allQ)if(q&&q.question)seen.add(nclexKey(q)); // v15.14: one Set for the run
    for(let i=0;i<chunks.length;i++){
      if(signal.aborted)throw new DOMException('Aborted','AbortError');
      addLog(`  Chunk ${i+1}/${chunks.length}...`);
      try{
        const result=await nclexCallGemini(NCLEX_INLINE_PROMPT+chunks[i],signal);
        if(Array.isArray(result)&&result.length>0){nclexAccumulate(seen,allQ,result.map(q=>({...q,id:uid()})));setQuestions(allQ.slice());addLog(`    ✓ ${result.length} found → ${allQ.length} unique`);}else addLog(`    — No questions.`);
      }catch(e){if(e.name==='AbortError')throw e;addLog(`    ⚠ ${e.message}`);}
      setProgress({current:i+1,total:chunks.length});if(i<chunks.length-1)await _sleep(500,signal);
    }
    return allQ;
  }

  // ── Split Q&A mode runner ──
  async function runSplit(file,existingQ,signal){
    addLog(`📄 Extracting QUESTION pages from "${file.name}"...`);
    let qText='';for(const r of qRanges){addLog(`  Pages ${r.start}–${r.end}`);qText+=await nclexExtractPageRange(file,r.start,r.end,signal)+'\n\n';}
    addLog(`  → ${qText.length.toLocaleString()} chars`);
    addLog(`📄 Extracting ANSWER pages...`);
    let aText='';for(const r of aRanges){addLog(`  Pages ${r.start}–${r.end}`);aText+=await nclexExtractPageRange(file,r.start,r.end,signal)+'\n\n';}
    addLog(`  → ${aText.length.toLocaleString()} chars`);
    addLog(`🔗 Pairing by question number...`);
    let pairs=nclexPairQA(qText,aText);
    const matched=pairs.filter(p=>p.matched).length;
    addLog(`  → Regex found ${pairs.length} questions, ${matched} matched, ${pairs.length-matched} unmatched`);
    // AI fallback if regex found too few
    if(pairs.length<3||(pairs.length>0&&matched/pairs.length<0.3)){
      addLog('🤖 Regex found too few — using AI to pair...');
      try{
        // v15.14: was ONE call over qText.slice(0,12000)+aText.slice(0,12000), and its result
        // replaced the regex pairing whenever it returned more pairs. On a 200-question Davis
        // section the model saw roughly the first 20 questions, returned 20 pairs, beat a weak
        // 2-pair regex result - and the other 180 questions vanished with no warning at all.
        // The whole text is now walked in windows and merged by question number, so "better
        // than regex" is measured against everything rather than against a prefix.
        //
        // PROPORTIONAL windows, not equal-size ones: both sections run in question-number
        // order, which is the premise of split mode itself, so window w of the questions lines
        // up with window w of the answers. A 10% seam overlap keeps a pair that straddles a
        // boundary intact in at least one window.
        const MAX_WIN=12000;
        const W=Math.max(1,Math.ceil(Math.max(qText.length,aText.length)/MAX_WIN));
        const qStep=Math.ceil(qText.length/W)||1,aStep=Math.ceil(aText.length/W)||1;
        const grab=(s,step,w)=>s.slice(Math.max(0,Math.floor(w*step-step*0.1)),Math.ceil((w+1)*step+step*0.1));
        const byNum=new Map();
        for(let w=0;w<W;w++){
          if(signal.aborted)throw new DOMException('Aborted','AbortError');
          const qs=grab(qText,qStep,w),as=grab(aText,aStep,w);
          if(!qs.trim()&&!as.trim())continue;
          if(W>1)addLog('  pairing window '+(w+1)+'/'+W+'...');
          const part=await nclexCallGemini(NCLEX_AI_PAIR_PROMPT+qs+'\n\nANSWERS SECTION:\n'+as,signal);
          if(!Array.isArray(part))continue;
          for(const r of part){
            const row={number:Number(r&&r.number)||0,question:String(r&&r.question||''),answer:String(r&&r.answer||''),matched:!!(r&&r.answer)};
            if(!row.question.trim())continue;
            const prev=byNum.get(row.number);
            // An overlapping seam can yield the same number twice; keep the fuller record.
            if(!prev||(!prev.matched&&row.matched)||row.question.length>prev.question.length)byNum.set(row.number,row);
          }
          if(w<W-1)await _sleep(500,signal);
        }
        const aiResult=[...byNum.values()].sort((x,y)=>x.number-y.number);
        if(aiResult.length>pairs.length){
          pairs=aiResult;
          addLog(`  → AI paired ${pairs.length} questions (better than regex)`);
        }else if(aiResult.length){
          // v16.9: the fallback replaced the pairing only when it found MORE questions, so a run
          // that recovered the missing ANSWERS for the same questions paid for the call and then
          // threw the answers away. Merge them into unmatched pairs; keep every question found.
          const recovered=new Map(aiResult.filter(r=>r.matched).map(r=>[Number(r.number),r]));
          let filled=0;
          pairs=pairs.map(p=>{const r=recovered.get(Number(p.number));if(p.matched||!r)return p;filled++;return {...p,answer:r.answer,matched:true};});
          if(filled)addLog(`  → AI recovered ${filled} answer(s) for existing questions`);
        }
      }catch(e){if(e.name==='AbortError')throw e;addLog(`  ⚠ AI pairing failed: ${e.message}`);}
    }
    if(!pairs.length){addLog('⚠ No numbered questions detected. Try adjusting page ranges or Inline mode.');return existingQ;}
    const batches=nclexBatchPairs(pairs,batchSize);
    addLog(`Sending ${batches.length} batches of ~${batchSize} to ${model}...`);
    setProgress({current:0,total:batches.length});
    const allQ=[...existingQ],seen=new Set();for(const q of allQ)if(q&&q.question)seen.add(nclexKey(q)); // v15.14: one Set for the run
    for(let i=0;i<batches.length;i++){
      if(signal.aborted)throw new DOMException('Aborted','AbortError');
      const batch=batches[i];addLog(`  Batch ${i+1}/${batches.length} (Q#${batch[0].number}–#${batch[batch.length-1].number})...`);
      try{
        const result=await nclexCallGemini(NCLEX_SPLIT_PROMPT+nclexPairsToText(batch),signal);
        if(Array.isArray(result)&&result.length>0){
          // v15.15: put the choices back from the page when the model returned a bare stem.
          // The batch still holds each question's verbatim source text, so this costs nothing
          // and invents nothing.
          const srcByNum=new Map(batch.map(p=>[Number(p.number),p.question]));
          const fixed=result.map(q=>nclexRepairOptions(q,srcByNum.get(Number(q&&q.question_number))));
          const nRepaired=fixed.filter(q=>q&&q.options_repaired).length;
          nclexAccumulate(seen,allQ,fixed.map(q=>({...q,id:uid()})));setQuestions(allQ.slice());
          addLog(`    ✓ ${result.length} → ${allQ.length} unique${nRepaired?` (${nRepaired} choice list${nRepaired!==1?'s':''} restored from the page)`:''}`);
        }else addLog(`    — No output.`);
      }catch(e){if(e.name==='AbortError')throw e;addLog(`    ⚠ ${e.message}`);}
      setProgress({current:i+1,total:batches.length});if(i<batches.length-1)await _sleep(500,signal);
    }
    return allQ;
  }

  const run=useCallback(async()=>{
    if(!cfg.apiKey||!files.length)return;
    const ctl=new AbortController();abortRef.current=ctl;
    setError('');setQuestions([]);setLog([]);setStatus('processing');
    try{
      addLog(`Mode: ${mode==='inline'?'Inline (Q+A together)':'Split Q&A (separated sections)'} · ${model} [${toolLevel}]${cfg.autoProfile?' (auto)':''}`);
      // v15.15: a page range describes ONE file's layout, so inline mode with ranges enabled
      // takes the same one-PDF-per-run restriction split mode has always had. Applying page
      // 1-50 of file A to file B would quietly extract the wrong chapter.
      const oneFile=files.length>1&&(mode==='split'||iRangeOn);
      const workFiles=oneFile?[files[0]]:files;
      if(oneFile)addLog(`⚠ ${mode==='split'?'Split mode':'Inline mode with page ranges'} uses one PDF per run — processing "${files[0].name}" only (the page ranges describe a single file). Run the other file(s) separately.`);
      addLog(`Processing ${workFiles.length} PDF(s)...`);
      let allQ=[];
      for(let fi=0;fi<workFiles.length;fi++){
        if(ctl.signal.aborted)throw new DOMException('Aborted','AbortError');
        addLog(`\n📁 File ${fi+1}/${workFiles.length}: ${workFiles[fi].name}`);
        if(mode==='inline')allQ=await runInline(workFiles[fi],allQ,ctl.signal);
        else allQ=await runSplit(workFiles[fi],allQ,ctl.signal);
      }
      addLog(`✅ Done! ${allQ.length} unique questions from ${workFiles.length} file(s).`);setStatus('done');
    }catch(e){
      if(e.name==='AbortError'){addLog('⚠ Aborted \u2014 keeping the questions extracted so far.');setStatus('done');}
      else{setError(e.message);setStatus('error');addLog(`❌ ${e.message}`);}
    }finally{abortRef.current=null;}
  },[cfg,files,mode,chunkSize,overlap,iRangeOn,iRanges,qRanges,aRanges,batchSize,model,toolLevel,addLog]);

  // v15.15: every export is now QUESTIONS first, then ONE answer key at the end. Answers used
  // to sit directly under their own question, so an exported file could not be worked through
  // without the answer already in view — which is the reason to export it at all. This is the
  // same shape the NCLEX Generator worksheet has always used (## Questions / ## Answer Key).
  const nclexQText=q=>{const {stem,options}=nclexSplitStemOptions(q.question);return options.length?stem+'\n'+options.map(o=>`   ${o.label}. ${o.text}`).join('\n'):String(q.question||'');};
  const exportTxt=()=>{
    let out='NCLEX PRACTICE QUESTIONS\n\n'+filtered.length+' questions\n\n';
    filtered.forEach((q,i)=>{out+=`${i+1}. ${nclexQText(q)}\n\n`;});
    out+='\n============================\nANSWER KEY\n============================\n\n';
    filtered.forEach((q,i)=>{out+=`${i+1}. Answer: ${q.correct_answer}\nRationale: ${q.rationale}\n${q.priority_nursing_tip?'Tip: '+q.priority_nursing_tip+'\n':''}${q.test_taking_strategy?'Strategy: '+q.test_taking_strategy+'\n':''}${q.clinical_judgment_skill?'CJ: '+q.clinical_judgment_skill+'\n':''}${q.diseases_conditions?.length?'Conditions: '+q.diseases_conditions.join(', ')+'\n':''}\n---\n\n`;});
    downloadBlob(new Blob([out],{type:'text/plain'}),'nclex_questions.txt');
  };

  const nclexToMd=()=>{
    let out='# NCLEX Practice Questions\n\n**'+filtered.length+' questions** extracted from source material.\n\n---\n\n## Questions\n\n';
    filtered.forEach((q,i)=>{
      const {stem,options}=nclexSplitStemOptions(q.question);
      out+=`**${i+1}.** ${options.length?stem:String(q.question||'')}\n\n`;
      if(options.length)out+=options.map(o=>`${o.label}. ${o.text}`).join('\n')+'\n\n';
    });
    // The pagebreak marker starts the answer key on its own printed page and degrades to a
    // rule in plaintext — the same one the generator worksheet uses.
    out+='<div class="pagebreak"></div>\n\n## Answer Key\n\n';
    filtered.forEach((q,i)=>{
      out+=`**${i+1}.** ${q.correct_answer}\n\n`;
      out+=`${q.rationale}\n\n`;
      if(q.priority_nursing_tip)out+=`> ⚡ **Tip:** ${q.priority_nursing_tip}\n\n`;
      if(q.test_taking_strategy)out+=`> 🎯 **Strategy:** ${q.test_taking_strategy}\n\n`;
      if(q.clinical_judgment_skill)out+=`> 🧠 **CJ:** ${q.clinical_judgment_skill}\n\n`;
      if(q.diseases_conditions?.length)out+=`Conditions: ${q.diseases_conditions.join(', ')}\n\n`;
      out+=`---\n\n`;
    });
    return out;
  };
  const exportMd=()=>downloadBlob(new Blob([nclexToMd()],{type:'text/markdown'}),'nclex_questions.md');
  const copyAll=()=>copyText(nclexToMd()); // v15: shared helper with textarea fallback
  const exportPdf=()=>exportAsPdf(nclexToMd(),'NCLEX Practice Questions',`${filtered.length} questions`);

  const isProcessing=status==='processing';

  return(
    <div className="tool-panel">
      <h2 className="tool-title">NCLEX Question Extractor</h2>
      <p className="tool-desc">Upload nursing review PDFs → extracted practice questions with rationales, strategies, and disease tagging</p>

      {/* Mode Toggle */}
      <div className="segmented-control" role="group" aria-label="Question extraction mode" style={{marginBottom:14}}>
        {[{id:'inline',icon:'📄',title:'Inline Mode',desc:'Q & A together on same pages'},{id:'split',icon:'📑',title:'Split Q&A Mode',desc:'Questions & answers on separate pages (Davis-style)'}].map(m=>
          <button key={m.id} aria-pressed={mode===m.id} onClick={()=>setMode(m.id)} >
            <div style={{fontSize:13,fontWeight:600,color:mode===m.id?'var(--text-bright)':'var(--text-dim)'}}>{m.icon} {m.title}</div>
            <div style={{fontSize:12,color:'var(--text-dim)',marginTop:2}}>{m.desc}</div>
          </button>
        )}
      </div>

      {/* Config */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:18,marginBottom:14}}>
        {/* Inline settings */}
        {mode==='inline'&&<><div className="form-grid" style={{marginBottom:10}}>
          <div className="sb-field"><label htmlFor="extract-chunk-size">Chunk Size (chars)</label><input id="extract-chunk-size" type="number" min={500} max={15000} value={chunkSize} onChange={e=>setChunkSize(Math.max(500,Math.min(15000,Number(e.target.value)||3000)))}/></div>
          <div className="sb-field"><label htmlFor="extract-overlap">Overlap (chars)</label><input id="extract-overlap" type="number" min={0} max={5000} value={overlap} onChange={e=>setOverlap(Math.max(0,Math.min(5000,Number(e.target.value)||0)))}/><div style={{fontSize:12,color:'var(--text-dim)',marginTop:2}}>~800 = 1-2 pages. Duplicates auto-removed.</div></div>
        </div>
        {/* v15.15: page ranges for inline mode, the same picker split mode uses. Opt-in, so
            the default is still the whole document. */}
        <div style={{background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:8,padding:12,marginBottom:10}}>
          <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:12,color:'var(--text)',fontWeight:600}}>
            <input type="checkbox" checked={iRangeOn} onChange={e=>setIRangeOn(e.target.checked)} style={{width:14,height:14,cursor:'pointer'}}/>
            📄 Limit to specific pages
          </label>
          <div style={{fontSize:12,color:'var(--text-dim)',marginTop:4,lineHeight:1.5}}>Off = the whole PDF. On = only the pages you list, so you can pull one chapter out of a large book.</div>
          {iRangeOn&&<div style={{marginTop:10}}>
            {pageCount&&<div style={{fontSize:12,color:'var(--accent)',marginBottom:8}}>📖 This PDF has <b>{pageCount}</b> pages</div>}
            <div style={{padding:8,background:'var(--bg-card)',borderRadius:6,border:'1px solid var(--border)'}}><PageRangeSection label="📄 Pages to extract" ranges={iRanges} onChange={setIRanges} maxPages={pageCount}/></div>
            <div style={{fontSize:12,color:'var(--accent-warm)',marginTop:6}}>With page ranges on, inline mode processes one PDF per run — the ranges describe a single file.</div>
          </div>}
        </div></>}

        {/* Split settings */}
        {mode==='split'&&<div style={{marginBottom:12}}>
          <div style={{background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:8,padding:12,marginBottom:10}}>
            <div style={{fontSize:12,color:'var(--accent-warm)',fontWeight:600,marginBottom:6}}>📑 For PDFs like Davis Test Success where questions and answers are in separate sections.</div>
            <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5,marginBottom:8}}>Specify which pages contain <strong style={{color:'var(--text)'}}>questions</strong> and which contain <strong style={{color:'var(--text)'}}>answers/rationales</strong>. The tool pairs them by question number before sending to Gemini.</div>
            {pageCount&&<div style={{fontSize:12,color:'var(--accent)',marginBottom:8}}>📖 This PDF has <b>{pageCount}</b> pages</div>}
            <div className="form-grid">
              <div style={{padding:8,background:'var(--bg-card)',borderRadius:6,border:'1px solid var(--border)'}}><PageRangeSection label="📝 Question Pages" ranges={qRanges} onChange={setQRanges} maxPages={pageCount}/></div>
              <div style={{padding:8,background:'var(--bg-card)',borderRadius:6,border:'1px solid var(--border)'}}><PageRangeSection label="✅ Answer Pages" ranges={aRanges} onChange={setARanges} maxPages={pageCount}/></div>
            </div>
            <div style={{marginTop:8}}>
              <div className="sb-field"><label htmlFor="extract-batch-size">Questions per batch</label><input id="extract-batch-size" type="number" min={2} max={25} value={batchSize} onChange={e=>setBatchSize(Math.max(2,Math.min(25,Math.floor(Number(e.target.value))||8)))} style={{width:90}}/><span style={{fontSize:12,color:'var(--text-dim)',marginLeft:6}}>Lower = more reliable</span></div>
              <div style={{fontSize:12,color:'var(--accent-warm)',marginTop:6}}>Split mode processes one PDF per run — these page ranges describe a single file.</div>
            </div>
          </div>
        </div>}

        {/* Upload */}
        <div role="button" tabIndex={0} aria-label="Add PDF files" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fRef.current?.click();}}} className="upload-zone" onClick={()=>fRef.current?.click()} onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('dragover');}} onDragLeave={e=>e.currentTarget.classList.remove('dragover')} onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('dragover');addPdfs(e.dataTransfer.files);}}>
          <input aria-label="NCLEX review PDFs" ref={fRef} type="file" accept=".pdf" multiple style={{display:'none'}} onChange={e=>{addPdfs(e.target.files);e.target.value='';}}/>
          <div style={{fontSize:28,marginBottom:4,opacity:.6}}>📋</div>
          <p style={{fontSize:12,color:'var(--text)'}}>Drop PDFs or <strong style={{color:'var(--accent)'}}>click to browse</strong></p>
        </div>
        {files.map((f,i)=><div className="file-chip" key={f.name+f.size+f.lastModified}><div className="f-icon pdf">PDF</div><span className="f-name">{f.name}</span><span className="f-size">{formatSize(f.size)}</span><button className="f-rm" aria-label={'Remove PDF '+f.name} onClick={()=>{destroyPdfDoc(f);setFiles(p=>p.filter((_,j)=>j!==i));}}>×</button></div>)}
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn-primary" onClick={run} disabled={!cfg.apiKey||!files.length||isProcessing}>{isProcessing?'⏳ Processing...':`🚀 Extract from ${files.length||0} PDF${files.length!==1?'s':''}`}</button>
          {isProcessing&&<button className="btn-danger" onClick={()=>abortRef.current?.abort()}>Abort</button>}
          {files.length>0&&!isProcessing&&<button className="btn-secondary" onClick={()=>{files.forEach(destroyPdfDoc);setFiles([]);}}>Clear</button>}
        </div>
      </div>

      {error&&<div className="error-banner"><span>❌</span>{error}</div>}

      {/* Progress */}
      {(isProcessing||log.length>0)&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        {progress.total>0&&<div className="progress-bar" role="progressbar" aria-label="Question extraction" aria-valuemin={0} aria-valuemax={progress.total} aria-valuenow={progress.current} style={{marginBottom:6}}><div className="progress-fill" style={{width:`${(progress.current/progress.total)*100}%`}}/></div>}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text-dim)',marginBottom:6}}>
          <span>{isProcessing?(mode==='split'?`Batch ${progress.current}/${progress.total}`:`Chunk ${progress.current}/${progress.total}`):'Done'}</span>
          <span style={{color:'var(--accent)'}}>{questions.length} questions</span>
        </div>
        <div style={{maxHeight:140,overflowY:'auto',background:'var(--bg-deep)',borderRadius:5,padding:7,fontSize:12,fontFamily:'JetBrains Mono',color:'var(--text-dim)',lineHeight:1.7}}>{log.map((l,i)=><div key={i}>{l}</div>)}</div>
      </div>}

      {/* Results */}
      {questions.length>0&&<>
        <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
          <div className="form-grid" style={{marginBottom:10}}>
            <div className="sb-field"><label htmlFor="extract-strategy">Filter by Strategy</label><select id="extract-strategy" value={filterStrategy} onChange={e=>setFilterStrategy(e.target.value)}><option value="">All ({allStrategies.length})</option>{allStrategies.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="sb-field"><label htmlFor="extract-search">Search Disease/Keyword</label><input id="extract-search" type="text" placeholder="e.g. Heart Failure" value={filterDisease} onChange={e=>setFilterDisease(e.target.value)}/></div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:'var(--text-dim)'}}>Showing <b style={{color:'var(--accent)'}}>{filtered.length}</b> of {questions.length}</span>
            {(filterStrategy||filterDisease)&&<button className="btn-secondary" style={{padding:'3px 8px',fontSize:12}} onClick={()=>{setFilterStrategy('');setFilterDisease('');}}>Clear filters</button>}
            <div style={{flex:1}}/>
            <button className="btn-secondary" onClick={copyAll}>📋 Copy</button>
            <button className="btn-secondary" onClick={exportMd}>⬇ .md</button>
            <button className="btn-secondary" onClick={exportTxt}>📝 .txt</button>
            <button className="btn-secondary" onClick={exportPdf}>🖨 PDF</button>
          </div>
        </div>
        {filtered.map((q,i)=><NCLEXQuestionCard key={q.id||i} q={q} index={i}/>)}{/* v15: id assigned at extraction — index keys made open/closed state jump across cards whenever the filter changed */}
      </>}

      {status==='idle'&&questions.length===0&&<div style={{textAlign:'center',padding:'40px 16px',color:'var(--text-dim)'}}>
        <div style={{fontSize:40,marginBottom:10}}>📋</div>
        <div style={{fontSize:14,marginBottom:6}}>Upload NCLEX review PDFs to extract practice questions</div>
        <div style={{fontSize:12,maxWidth:460,margin:'0 auto',lineHeight:1.6}}>
          Two modes: <strong style={{color:'var(--text)'}}>Inline</strong> for books where Q&A are on the same pages.
          <strong style={{color:'var(--text)'}}> Split Q&A</strong> for books like Davis Test Success where questions and answers are in separate sections.
          Multi-pattern question detection with AI fallback pairing.
        </div>
      </div>}
    </div>
  );
}

// ──── TOOL: NCLEX Question Generator ────
// v15.5: NCLEX_GEN_PROMPT v4.1 → v4.2. Adds NCSBN terminology scoping, an eleven-criterion
// item-quality gate in FINAL VERIFY, a bias check, the five distractor tests, and the
// answer-integration test. Criteria are adapted in original wording from the NEIA Scoring
// Tool (Simms, Hensel & Kumar, Nurse Educ Pract 93:104804, 2026) — NOT reproduced verbatim,
// because this repo ships GPL-3.0 and the rubric is Elsevier-copyrighted.
// Test Plan Alignment is WARN-only: no Test Plan document is supplied to the model, and a
// gate that FAILs on an unverifiable criterion would either reject every item or induce
// fabricated activity statements. Restore it to a hard FAIL only if real Test Plan text is
// ever supplied to the prompt.
const NCLEX_CATEGORY_LABELS={
  version:2026,                   // must equal NCLEX_TEST_PLAN_VERSION
  map:{
    ManagementOfCare:        'Management of Care',

TIER 1 — AUTOMATIC. Assign Tier 1 if ANY of these are true:

  · It is a hold/notify parameter, contraindication, isolation requirement, or
    route restriction
  · It is a staffing/exposure restriction protecting a vulnerable person
  · It is a fall/injury prevention measure
  · Getting it wrong causes direct patient harm

TIER 2 — Solid clinical application, secondary considerations, expected findings.

TIER 3 — Procedure technique minutiae and isolated diagnostic trivia. Examples of
  content that belongs in TIER 3, NOT Tier 1:

  · what fluoresces under a diagnostic lamp
  · which layer of skin contains which cell type

A fact being obscure does not make it high-yield. A fact being lethal does.
If the source shouts about something, the tier must reflect that. Never bury a
critical safety rule at Tier 2 while promoting technique trivia to Tier 1.

// ── Parsers ──
// ── JS-side fact allocation for NCLEX generation ──
// Previously every batch resent the whole KB packet plus a carry list of used concepts
// and stems that grew each round, and duplicate avoidance was the model's job. Here the
// application picks a disjoint slice of facts per batch, so repeats are structurally
// impossible rather than prompt-suppressed, and the payload stops growing.
function ngFactRow(f,condName){
  const anchor=String(f.sourceQuote||f.text||'').replace(/\s+/g,' ').trim().split(' ').slice(0,20).join(' ');
  return `KBFACT ${f.id} | CONDITION: ${condName} | LATTE: ${f.latteBucket}${f.subtype?' / '+f.subtype:''} | TIER: ${f.tier} | ANCHOR: "${anchor.replace(/"/g,"'")}" | FACT: ${f.text} | SOURCE: ${kbSourceText(f)||'pointer unavailable'}`;
}
// Pool grouped by condition — grouping is what makes both topical spread and
// same-condition neighbour context possible.
function ngBuildFactPool(kb,{tiers=[1,2,3],conditionQuery=''}={}){
  const q=String(conditionQuery||'').trim().toLowerCase();
  const groups=[];
  for(const c of kb.conditions||[]){
    if(q&&!String(c.name||'').toLowerCase().includes(q)&&!(c.aliases||[]).some(a=>String(a).toLowerCase().includes(q)))continue;
    const facts=(c.facts||[]).filter(f=>tiers.includes(Number(f.tier)));
    if(facts.length)groups.push({condition:c.name||'—',facts});
  }
  return groups;
}
function ngPoolSize(groups){return groups.reduce((n,g)=>n+g.facts.length,0);}
// Round-robin across conditions in slices, so one batch spans several conditions with
// a few facts each. The prompt caps any single topic at ~30% of a batch, so pulling all
// targets from one condition would fight that quota.
function ngAllocateBatch(groups,usedIds,{want,perCondition=4,neighborCap=2}={}){
  const targets=[],taken=new Set();
  let progressed=true;
  while(targets.length<want&&progressed){
    progressed=false;
    for(const g of groups){

  // Truncation. A worksheet cut mid-answer-key is unusable, and the prompt explicitly says
  // to shorten the batch rather than truncate — so a short last entry is a contract breach.
  const last4=q4[q4.length-1];
  if(last4&&!/Tags:/i.test(last4.raw))
    issues.push({sev:'error',msg:`PART 4 entry ${last4.num} has no Tags line — the answer key appears truncated mid-entry`});
  if(q3.length&&!parts.dist)
    issues.push({sev:'warn',msg:'No DISTRIBUTION line — the prompt requires one after PART 4'});

  const byNum=new Map(q4.map(k=>[k.num,k]));
  for(const item of q3){
    const where=`Q${item.num}`;
    const key=byNum.get(item.num);
    if(!key){issues.push({sev:'error',msg:`${where}: no matching PART 4 answer entry`});continue;}
    if(!key.answer)issues.push({sev:'error',msg:`${where}: PART 4 entry has no ANSWER line`});
    issues.push(...ngWorksheetQuestionIssues(item,key));
    // The prompt promises a Why line for EVERY option, correct and incorrect alike.
    for(const o of item.options)
      if(!key.whyLabels.has(o.label))
        issues.push({sev:'error',msg:`${where}: option ${o.label} has no "Why ${o.label} is…" line in PART 4`});
    if(item.type==='MCQ'&&item.options.length!==4)
      issues.push({sev:'warn',msg:`${where}: MCQ has ${item.options.length} options; the prompt specifies 4`});
    if(item.type==='SATA'&&(item.options.length<5||item.options.length>6))
      issues.push({sev:'warn',msg:`${where}: SATA has ${item.options.length} options; the prompt specifies 5-6`});

    neiaTerminologyScan(item.stem,`${where} stem`,issues);

    if(item.type==='MCQ'){
      const keyLabels=(key.answer.match(/\b([A-Z])\b/)||[])[1];

        correctAnswers:keyLabels?[keyLabels]:[]},issues,where);

  // contents means the model reported compliance it did not verify — the exact failure the
  // in-call gate cannot detect, because it is the thing being checked.
  const d=ngParseDistribution(parts.dist);
  // v15.7: a DISTRIBUTION line in the wrong FORMAT is not the same as a compliant one. A real
  // run emitted prose ("Tier 1: 6 (Q1, Q3, ...), Tier 2: 3 ...") instead of the required
  // "Tier [1:_ 2:_ 3:_] | Types [...]" shape. Both regexes missed, every comparison loop
  // iterated over nothing, and the batch reported 0 errors — the self-report check silently
  // disabled itself on exactly the output it exists to police. Say so out loud instead.
  if(d.present&&q3.length&&!Object.keys(d.types).length&&!Object.keys(d.tiers).length)
    issues.push({sev:'warn',msg:'DISTRIBUTION line is present but not in the required "Tier [1:_ 2:_ 3:_] | Types [MCQ:_ ...]" format, so its counts could not be checked against the worksheet'});

    const actualTypes={};
    for(const it of q3)actualTypes[it.type.toLowerCase()]=(actualTypes[it.type.toLowerCase()]||0)+1;

    for(const[k,v]of Object.entries(d.types)){
      const a=actualTypes[alias(k)]||0;

    for(const k of q4)if(k.tier)actualTiers[k.tier]=(actualTiers[k.tier]||0)+1;
    if(Object.keys(actualTiers).length)
      for(const[k,v]of Object.entries(d.tiers)){
        const a=actualTiers[k]||0;
        if(a!==v)issues.push({sev:'error',msg:`DISTRIBUTION claims ${v} Tier ${k} item(s) but PART 4 tags show ${a}`});
      }

}
// v15.7 B1d: worksheet items are freestanding, so the gate list is a flat map over PART 3.
// Same MCQ-only scope as the case generator — the rubric is not validated for the others.
function nclexGateItems(items){
  return (items||[]).map(it=>({num:it.num,item:it,key:'q'+it.num,
    eligible:it.type==='MCQ'&&it.options.length>=3}));
}
// Render a repaired item back into worksheet text. STRATEGY and TAGS are carried over
// verbatim from the original PART 4 entry rather than regenerated: they encode tier, CJMM,
// and LATTE bucket, which the DISTRIBUTION line already counts. Letting a repair rewrite
// them would silently invalidate the distribution the worksheet just asserted.
function ngRenderQuestionBlock(num,item){
  const opts=(item.options||[]).map(o=>'     '+o.label+'. '+String(o.text||'').trim()).join('\n');
  return '  '+num+'. '+String(item.stem||'').trim()+'\n\n'+opts;
}
function ngRenderKeyBlock(num,item,carryStrategy,carryTags){
  const L=['  '+num+'. ANSWER: '+String(item.correctLabel||'').trim()];
  for(const r of item.rationales||[]){
    const lbl=String(r.label||'').trim();
    const kind=lbl===String(item.correctLabel||'').trim()?'correct':'wrong';
    L.push('     Why '+lbl+' is '+kind+': '+String(r.text||'').trim()+(r.source?' (Source: '+r.source+')':''));
  }
  if(carryStrategy)L.push(carryStrategy);
  if(carryTags)L.push(carryTags);

// Replace one numbered block inside a PART section. Returns null if the block cannot be
// located unambiguously — the caller then leaves the worksheet untouched. Corrupting a
// worksheet to "fix" a style finding is strictly worse than shipping the finding.
function ngSpliceBlock(sectionText,num,replacement){
  const blocks=ngSplitNumbered(sectionText);
  const target=blocks.filter(b=>b.num===num);
  if(target.length!==1)return null;
  const idx=sectionText.indexOf(target[0].text);
  if(idx<0)return null;
  return sectionText.slice(0,idx)+replacement+sectionText.slice(idx+target[0].text.length);
}
// v15.8: index-based section splice. The previous line used
// workRaw.replace(parts.p3,newP3), which had two defects on model-generated text:
//   1. String.replace(str,str) interprets $$ $& $` $' $n IN THE REPLACEMENT. A repaired
//      option containing "$&" spliced the whole of PART 3 back into itself.
//   2. It replaced the FIRST occurrence anywhere in the document, so if PART 2's audit
//      prose echoed a stem the write landed there and PART 3 was left stale.
// Slicing by index does neither. An empty oldSec returns the doc untouched, because
// replace('') would have prepended.
function ngSpliceSection(doc,oldSec,newSec){
  if(!oldSec)return doc;
  const at=String(doc).indexOf(oldSec);
  return at<0?doc:doc.slice(0,at)+newSec+doc.slice(at+oldSec.length);
}
function ngBuildRepairPrompt({item,criterion,keyBlock}){
  return `═══ REPAIR ONE NCLEX ITEM ═══

An independent reviewer failed the item below on this criterion:

  FAILED: ${criterion}

Rewrite ONLY this item so it no longer meets that disqualifying condition.

RULES
- Keep the same question TYPE (single-best-answer MCQ) and the same number of options.
- Keep the same option labels (A, B, C, D) in the same order.
- The item must remain answerable from the same underlying content. Do not introduce a
  new topic, a new condition, or clinical facts the original item did not rest on.
- Every option still needs its own rationale.
- Do NOT fix a length or integration problem by making the key the shortest option or by
  padding the distractors. The target is options indistinguishable on surface features.
- Do NOT restate the answer in the stem.

═══ THE FAILING ITEM ═══
STEM: ${item.stem}
${(item.options||[]).map(o=>'  '+o.label+'. '+o.text).join('\n')}

Its current answer key entry, for reference:
${keyBlock||'(unavailable)'}

═══ RETURN EXACTLY THIS JSON, NOTHING ELSE ═══
{
  "stem": "string",
  "options": [ { "label": "A", "text": "string" } ],
  "correctLabel": "B",
  "rationales": [ { "label": "A", "text": "one sentence", "source": "C7" } ],
  "repairNote": "one sentence on what you changed, or why you could not"

function ngRenumber(text,n){return text.replace(/^(\s{0,4})(?:Q)?\d{1,3}[.)]\s+/,'$1'+n+'. ');} // v15.14: {1,2} -> {1,3}
function ngStem(t){
  const f=t.replace(/^(\s{0,4})(?:Q)?\d{1,3}[.)]\s+/,'').split('\n')[0].trim(); // v15.14: {1,2} -> {1,3}
  return f.length>95?f.slice(0,95)+'…':f;
}
