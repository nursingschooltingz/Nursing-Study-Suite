        logged=[...new Set([...logged,...concepts.map(c=>c.name)])];
        used=[...new Set([...used,...batchUsed])];
        stems=[...stems,...qs.map(q=>ngStem(q.text))];
        let batchCited=0;
        if(allocMode&&alloc){
          // v15: count citations from Parts 3+4 only. The adapter REQUIRES every
          // allocated fact to be logged in PART 1, so scanning the whole response made
          // the coverage metric ~always 100% regardless of the actual questions.
          const mentioned=ngCitedFactIds(P.p1,P.p3,P.p4);
          const allocIds=new Set(alloc.targets.map(f=>f.id));
          for(const id of mentioned)if(allocIds.has(id)){citedAll.add(id);batchCited++;}
          const missed=alloc.targets.length-batchCited;
          owned_log(`  Coverage: ${batchCited}/${alloc.targets.length} allocated fact(s) cited${missed>0?` — ${missed} not referenced`:''}.`,missed>0?'warn':'ok');
        }

        // ── v15.7 B1c/B1d: deterministic validation, then an independent audit ──
        // The in-call gate on the DISTRIBUTION line is self-reported and unfalsifiable.
        // These two passes are the external witness: code first (free, catches the
        // self-report gap), then fresh attention on each MCQ (costs a call per item).
        let workRaw=raw;
        let wsIssues=validateNCLEXWorksheet(workRaw,size,worksheetContract);
        let wsErr=wsIssues.filter(x=>x.sev==='error').length;
        owned_log('  Worksheet check: '+wsErr+' error(s), '+(wsIssues.length-wsErr)+' warning(s).',wsErr?'err':'ok');
        for(const x of wsIssues.filter(x=>x.sev==='error').slice(0,6))owned_log('    ✕ '+x.msg,'err');
        let auditRows=[];
        const publishBatch=()=>{
          const RP=ngSplitParts(workRaw);
          const entry={n:b,raw:workRaw,...RP,concepts,qCount:qs.length,completeness:ngWorksheetCompleteness(RP,size),factIds:[...ngCitedFactIds(RP.p1,RP.p3,RP.p4)],
            wsIssues,auditRows:auditRows.map(r=>({num:r.num,status:r.status,criterion:r.criterion,detail:r.detail,warns:r.warns||[]}))};
          results=ngUpsertWorksheetBatch(results,entry);owned_setBatches(results);
        };
        publishBatch();
        if(runAudit&&!wsErr){
          const {model:aModel,level:aLevel}=cfg.forTool('itemAudit');
          const parsedItems=ngSplitNumbered(ngSplitParts(workRaw).p3).map(ngParseItem);
          const keyItems=new Map(ngSplitNumbered(ngSplitParts(workRaw).p4).map(k=>[k.num,ngParseKeyItem(k)]));
          const gate=nclexGateItems(parsedItems);
          const eligible=gate.filter(g=>g.eligible);
          const naCount=gate.length-eligible.length;
          auditRows=ngWorksheetAuditSeed(gate);publishBatch();
          if(!eligible.length){
            owned_log('  Audit skipped for this batch: no single-best-answer MCQ items ('+naCount+' N/A).','warn');
          }else{
            owned_log('  Auditing '+eligible.length+' MCQ item(s) · '+aModel+' [Thinking: '+aLevel+']'+(naCount?' · '+naCount+' N/A (rubric is MCQ-only)':''),'warn');
            let adone=0,quotaFails=0;
            try{
            await itemRunPool(eligible,AUDIT_POOL_WIDTH,async(g)=>{
              const k=keyItems.get(g.num);
              const q={type:'MCQ',stem:g.item.stem,options:g.item.options,
                correctAnswers:[(String(k&&k.answer||'').match(/\b([A-Z])\b/)||[])[1]||''].filter(Boolean)};
              let v;
              try{
                const out=await ownedCallGemini(cfg.apiKey,aModel,[{text:itemBuildAuditPrompt(itemAuditPayload('',q))}],{thinkingLevel:aLevel,signal:ctl.signal,retries:AUDIT_RETRIES});
                v=itemParseAuditVerdict(out);
              }catch(e){
                if(e.name==='AbortError')throw e;
                // v15.7: stop after two quota failures rather than grinding through every
                // remaining item. geminiRequest already backed off and retried; a further
                // 429 means the allowance is gone and each attempt costs real time.
                if(isQuotaError(e)&&++quotaFails>=2)throw Object.assign(new Error('API quota exhausted'),{name:'QuotaStop'});
                v={status:'ERROR',criterion:'',detail:e.message||String(e),warns:[],autoRepairable:false};
              }
              adone++;
              owned_log('    '+(v.status==='PASS'?'✓':v.status==='FAIL'?'✗':v.status==='REVIEW'?'?':'!')+' Q'+g.num+' '+v.status+(v.criterion?' — '+v.criterion:'')+'  ('+adone+'/'+eligible.length+')',
                v.status==='FAIL'?'err':v.status==='PASS'?'ok':'warn');
              for(const w of v.warns||[])owned_log('      ⓘ Q'+g.num+' WARN '+w.criterion+': '+w.detail,'warn');
              const completed={...g,...v};
              auditRows=[...auditRows.filter(row=>row.num!==g.num),completed];publishBatch();
              return completed;
            },ctl.signal);
            }catch(e){
              if(e.name!=='QuotaStop')throw e;
              // Every completed verdict was already published; retain N/A and completed outcomes on interruption.
              auditInterrupted=true;
              if(generatorSlot.current.current(operation))setAuditState('interrupted');
              publishBatch();
              owned_log('  ⚠ Audit stopped early — your Gemini API quota is exhausted. The worksheet itself is complete and still passed its structural checks; only the optional item review was cut short. Wait for your quota to reset, switch the "Item quality · audit" profile to Flash, or turn the audit off.','err');
            }

            const fails=auditRows.filter(r=>r.status==='FAIL');
            const accuracy=fails.filter(r=>!r.autoRepairable);
            for(const r of accuracy)
              owned_log('    ⚠ Q'+r.num+' failed on answer accuracy — NOT auto-repaired. The key here is the model\'s own and there is no reference standard; check it yourself.','err');
            const repairable=fails.filter(r=>r.autoRepairable);
            if(repairable.length){
              owned_log('  Repairing '+repairable.length+' item(s), one round, no re-audit...','warn');
              const {model:gModel,level:gLevel}=cfg.forTool('nclexgen');
              await itemRunPool(repairable,AUDIT_POOL_WIDTH,async(r)=>{
                try{
                  const k=keyItems.get(r.num);
                  const keyRaw=k?k.raw:'';
                  const out=await ownedCallGemini(cfg.apiKey,gModel,[{text:ngBuildRepairPrompt({item:r.item,criterion:r.criterion,keyBlock:keyRaw})}],{thinkingLevel:gLevel,signal:ctl.signal,retries:1,generationConfig:{responseMimeType:'application/json'}});
                  const fixed=extractJSON(out);
                  const repairShape=ngRepairShapeIssues(fixed);if(repairShape.length)throw new Error(repairShape.map(i=>i.msg).join('; '));
                  if(fixed.options.map(o=>o.label).join('|')!==r.item.options.map(o=>o.label).join('|'))throw new Error('repair changed the original option labels');
                  const strat=(keyRaw.match(/^\s*Strategy:[^\n]*$/m)||[])[0]||'';
                  const tags=(keyRaw.match(/^\s*Tags:[^\n]*$/m)||[])[0]||'';
                  const parts=ngSplitParts(workRaw);
                  const newP3=ngSpliceBlock(parts.p3,r.num,ngRenderQuestionBlock(r.num,fixed));
                  const newP4=ngSpliceBlock(parts.p4,r.num,ngRenderKeyBlock(r.num,fixed,strat,tags));
                  if(newP3===null||newP4===null)throw new Error('could not locate the item unambiguously — worksheet left untouched');
                  // v15.17: validate the candidate before replacing a usable worksheet; failed repair keeps the original.
                  const candidate=ngSpliceSection(ngSpliceSection(workRaw,parts.p3,newP3),parts.p4,newP4);
                  if(validateNCLEXWorksheet(candidate,size,worksheetContract).some(i=>i.sev==='error'))throw new Error('repair failed the captured worksheet contract');
                  workRaw=candidate;
                  // Same honesty fix as the case generator: the stored FAIL described the
                  // pre-repair text and would otherwise persist into the audit trail export.
                  const row=auditRows.find(x=>x.num===r.num);
                  if(row){row.status='REPAIRED';row.detail='rewritten after failing; not re-audited';}
                  publishBatch();
                  owned_log('    ✓ Q'+r.num+' repaired'+(fixed.repairNote?' — '+fixed.repairNote:''),'ok');
                }catch(e){
                  if(e.name==='AbortError')throw e;
                  owned_log('    ✗ Q'+r.num+' repair failed: '+(e.message||e)+' (original kept)','err');
                }
              },ctl.signal);
              // Re-run the deterministic pass over the spliced worksheet. Repaired items are
              // deliberately NOT re-audited: one round, and anything still failing surfaces.
              wsIssues=validateNCLEXWorksheet(workRaw,size,worksheetContract);
              wsErr=wsIssues.filter(x=>x.sev==='error').length;
              owned_log('  Re-checked after repair: '+wsErr+' error(s), '+(wsIssues.length-wsErr)+' warning(s).',wsErr?'err':'ok');
            }
          }
        }else if(runAudit&&wsErr){
          owned_log('  Audit skipped for this batch: fix the '+wsErr+' structural error(s) first — auditing a broken worksheet spends quota to grade a known failure.','warn');
        }

        publishBatch();
        produced+=qs.length;
        owned_setTrackers(p=>p.map(t=>t.id===b?{...t,status:'done',q:qs.length}:t));

        owned_log('  ✓ '+qs.length+' questions · '+concepts.length+' concepts logged ('+logged.length+' cumulative) · '+batchUsed.length+' used','ok');
        if(P.dist)owned_log('    '+P.dist);
        if(qs.length<size)owned_log('  ⓘ Batch returned '+qs.length+' of '+size+' requested — likely ran out of unused grounded concepts.','warn');

        owned_setProg((b/numBatches)*100);
        // v15.17: batch pacing must release promptly on cancellation.
        if(b<numBatches&&!ctl.signal.aborted)await _sleep(900,ctl.signal);
      }
      if(allocMode){
        const uncovered=[...allocatedAll].filter(id=>!citedAll.has(id));
        const byId=new Map();for(const g of pool)for(const f of g.facts)byId.set(f.id,{...f,condition:g.condition});
        owned_setCoverage({allocated:allocatedAll.size,cited:citedAll.size,poolSize,
          uncovered:uncovered.map(id=>byId.get(id)).filter(Boolean),
          unallocated:poolSize-allocatedAll.size});
        owned_log(`Fact coverage: ${citedAll.size}/${allocatedAll.size} allocated fact(s) cited · ${poolSize-allocatedAll.size} of ${poolSize} pool fact(s) never allocated.`,uncovered.length?'warn':'ok');
      }
      // v15.14: gated on validation, not just on question count. Once a fact badge shows up
      // in the Inspector it reads as verified provenance, and the case generator already
      // refuses to register a case that failed. These two now agree.
      if(K.registerArtifact)publishArtifact('nclexQuestions',results.filter(r=>r.qCount>0&&!(r.wsIssues||[]).some(x=>x.sev==='error')).map(r=>({id:'batch-'+r.n,factIds:r.factIds||[],label:'NCLEX batch '+r.n+' ('+r.qCount+' question'+(r.qCount===1?'':'s')+')'})));
      owned_log('✅ Done — '+produced+' questions across '+results.filter(r=>r.qCount>0).length+' batches. '+logged.length+' unique concepts logged.','ok');
      if(produced<targetCount)owned_log('ⓘ Produced fewer than the '+targetCount+' target. The source may not support more non-duplicate questions.','warn');
      if(generatorSlot.current.current(operation))setAuditState(runAudit?(auditInterrupted?'interrupted':'complete'):'disabled');
    }catch(e){
      if(generatorSlot.current.owns(operation))setAuditState(e.name==='AbortError'?'interrupted':'failed');
      if(e.name==='AbortError')owned_log('Cancelled.','warn');else owned_log('Error: '+e.message,'err');
    }finally{if(generatorSlot.current.finish(operation)){setBusy(false);setAbortCtl(null);setProg(100);setLiveKB(0);}}
  },[cfg,targetCount,batchSize,numBatches,outcomes,points,focusContext,K.knowledgeBase,kbTiers,kbConditionFilter,log,allocMode,factsPerQ,runAudit]);

  // ── Assemble worksheet (renumbered across batches) ──
  const ws=useMemo(()=>{
    let n=1;const qs=[],ks=[];
    for(const b of batches){
      const bq=ngSplitNumbered(b.p3),bk=ngSplitNumbered(b.p4);
      for(const q of bq){
        const k=bk.find(x=>x.num===q.num);
        qs.push(ngRenumber(q.text,n));
        ks.push(k?ngRenumber(k.text,n):n+'. ANSWER: [not parsed — see Raw view]');
        n++;
      }
    }
    return{questions:qs,answers:ks,count:n-1};
  },[batches]);

  // v15.14: validateNCLEXWorksheet already found these; nothing carried them out of the app.
  const wsIssuesAll=useMemo(()=>batches.flatMap(b=>(b.wsIssues||[]).map(x=>({...x,msg:'Batch '+b.n+': '+x.msg}))),[batches]);
  const wsErrCount=useMemo(()=>wsIssuesAll.filter(x=>x.sev==='error').length,[wsIssuesAll]);
  const exportNotice=useMemo(()=>artifactExportNotice({source:artifactSource,activeKB:K.knowledgeBase,requested:artifactSource?.requested,actual:ws.count,auditRequested:artifactSource?.auditRequested,auditState,rows:batches.flatMap(b=>b.auditRows||[])}),[artifactSource,K.knowledgeBase,ws.count,auditState,batches]);
  const wsMd=useMemo(()=>{
    if(!ws.count)return'';
    // Stamped, not blocked. A failed worksheet is still worth inspecting and hand-correcting;
    // what it must not do is leave the app looking indistinguishable from a validated one.
    // Same policy the case generator already applies to a failed case.
    return exportNotice+caseValidationStamp(wsIssuesAll,'worksheet')
      +'# NCLEX Practice Questions\n\n**'+ws.count+' questions** generated from source material.\n\n---\n\n## Questions\n\n'
      +ws.questions.join('\n\n')+'\n\n<div class="pagebreak"></div>\n\n## Answer Key\n\n'+ws.answers.join('\n\n');
  },[ws,wsIssuesAll,exportNotice]);

  // v15.7: the audit trail now carries the deterministic worksheet findings, the per-item
  // audit verdicts, and the provenance stamp. The printable worksheet stays clean.
  const workMd=useMemo(()=>exportNotice+(provenance?latteProvenanceStamp(provenance):'')+batches.map(b=>{
    const wi=b.wsIssues||[],ar=b.auditRows||[];
    const errs=wi.filter(x=>x.sev==='error');
    let s='## Batch '+b.n+'\n\n### Concept Inventory\n\n'+(b.p1||'(none)')+'\n\n### Selection & Audit\n\n'+(b.p2||'(none)')+(b.dist?'\n\n### Distribution\n'+b.dist:'');
    if(wi.length){
      s+='\n\n### Worksheet checks (deterministic)\n\n'+errs.length+' error(s), '+(wi.length-errs.length)+' warning(s)\n\n'
        +wi.map(x=>'- '+(x.sev==='error'?'**ERROR**':'warn')+': '+x.msg).join('\n');
    }
    if(ar.length){
      s+='\n\n### Item quality audit\n\n'
        +ar.map(r=>'- Q'+r.num+': **'+r.status+'**'+(r.criterion?' — '+r.criterion:'')+(r.detail&&r.status!=='PASS'?' — '+r.detail:'')
          +(r.warns||[]).map(w=>'\n    - warn '+w.criterion+': '+w.detail).join('')).join('\n');
      s+='\n\nN/A means the rubric does not apply to that format — it is not a pass. No total score is computed.';
    }
    return s;
  }).join('\n\n---\n\n'),[batches,provenance,exportNotice]);

  const totalConcepts=useMemo(()=>new Set(batches.flatMap(b=>b.concepts.map(c=>c.name))).size,[batches]);
  const canRun=cfg.apiKey&&(K.knowledgeBase.conditions||[]).length&&!busy;

  return(
    <ArtifactSourceCtx.Provider value={artifactSource}><div className="tool-panel">
      {artifactSource&&!artifactSourceCurrent(artifactSource,K.knowledgeBase)&&<div className="error-banner">Earlier Knowledge Base: this output and its coverage belong to the original source. Current fact links are disabled.</div>}
      <div className="tool-header">
        <h2 className="tool-title">✍️ NCLEX Question Generator</h2>
        <p className="tool-desc">Generate original NCLEX-style questions from the shared LATTE Knowledge Base. Batched with carried-forward dedup so nothing repeats.</p>
      </div>

      <div className="tip-banner">Uses the shared, source-cited LATTE facts while preserving the existing NCLEX item-writing prompt, batching, grounding audit, distractor rules, and deduplication safeguards.</div>
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:14,marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:9}}>Knowledge Base Scope</div>
        <div className="field-block" style={{marginBottom:10}}><label htmlFor="nclex-condition">Condition filter <span className="badge-opt">optional</span></label><input id="nclex-condition" type="text" value={kbConditionFilter} onChange={e=>setKbConditionFilter(e.target.value)} placeholder="e.g. heart failure — blank uses all conditions"/></div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:12,color:'var(--text-dim)',marginRight:3}}>Include tiers:</span>
          {[1,2,3].map(t=><button key={t} type="button" aria-pressed={kbTiers.includes(t)} className={'tier-btn t'+t+(kbTiers.includes(t)?' active':'')} onClick={()=>setKbTiers(p=>p.includes(t)?(p.length>1?p.filter(x=>x!==t):p):[...p,t].sort())}><b>Tier {t}</b></button>)}
        </div>
        <div style={{fontSize:12,color:'var(--text-dim)',marginTop:9,lineHeight:1.5}}>Tier 1–3 are included by default. Narrowing scope can improve depth, but excluding lower tiers may reduce distractor variety and concept inventory size.</div>
      </div>

      {/* Batch settings */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:10}}>Batch Settings</div>
        <div className="form-grid" style={{marginBottom:10}}>
          <div className="field-block" style={{margin:0}}><label htmlFor="nclex-total">Total Questions</label>
            <input id="nclex-total" type="number" min={5} max={200} step={5} value={targetCount} onChange={e=>setTargetCount(Math.max(5,Math.min(200,parseInt(e.target.value)||50)))}/></div>
          <div className="field-block" style={{margin:0}}><label htmlFor="nclex-batch-size">Questions per Batch</label>
            <select id="nclex-batch-size" value={batchSize} onChange={e=>setBatchSize(parseInt(e.target.value))}>
              <option value={5}>5 — highest accuracy</option>
              <option value={10}>10 — recommended</option>
              <option value={15}>15 — faster, more drift</option>
            </select></div>
        </div>
        <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5,padding:10,background:'var(--bg-input)',borderRadius:6,border:'1px solid var(--border)'}}>
          <b style={{color:'var(--accent)'}}>{numBatches} API call{numBatches!==1?'s':''}</b> of {batchSize} questions each.{' '}
          {allocMode
            ?<>Each batch receives its own <b style={{color:'var(--text)'}}>disjoint slice of facts</b>, so duplicates are impossible by construction and the payload does not grow across batches.</>
            :<>Each batch receives the full Knowledge Base plus a growing list of concepts already logged and already tested, so it must find <b style={{color:'var(--text)'}}>new</b> material each time.</>}
        </div>
        <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:12,color:'var(--text)',cursor:'pointer',marginTop:10}}>
          <input type="checkbox" checked={allocMode} onChange={e=>setAllocMode(e.target.checked)} style={{accentColor:'var(--accent)',marginTop:2}}/>
          <span>Fact allocation <span className="badge-opt">recommended</span>
            <div style={{fontSize:12,color:'var(--text-dim)',marginTop:2,lineHeight:1.5}}>The app picks each batch's facts instead of resending the whole Knowledge Base and asking the model to avoid repeats. Cuts tokens sharply and makes duplicates structurally impossible. Turn off to compare against the original behaviour.</div>
          </span>
        </label>
        {/* v15.7 B1d: the worksheet's own quality gate is self-reported. This is the
            external check — free structural validation always, plus an optional
            independent review of each MCQ. */}
        <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:12,color:'var(--text)',cursor:'pointer',marginTop:10}}>
          <input type="checkbox" checked={runAudit} onChange={e=>setRunAudit(e.target.checked)} style={{accentColor:'var(--accent)',marginTop:2}}/>
          <span>Independent item audit
            <div style={{fontSize:12,color:'var(--text-dim)',marginTop:2,lineHeight:1.5}}>Every worksheet is structurally validated in code for free — question/answer counts, a rationale per option, truncation, and whether the DISTRIBUTION line matches what was actually produced. This adds a second review pass over each single-best-answer MCQ against 11 stop criteria, in a fresh call that never sees the source facts. <b style={{color:'var(--text)'}}>Costs one extra API call per MCQ</b> ({batchSize} per batch at most), so a run takes materially longer. Failed items are rewritten once, except answer-accuracy failures, which are surfaced for you instead.</div>
          </span>
        </label>
        {allocMode&&<div className="field-block" style={{marginTop:10,marginBottom:0}}>
          <label htmlFor="nclex-facts-per-question" style={{fontSize:12}}>Target facts per question</label>
          <input id="nclex-facts-per-question" type="number" min={1} max={8} step={1} value={factsPerQ} onChange={e=>setFactsPerQ(Math.max(1,Math.min(8,Number(e.target.value)||3)))} style={{width:90}}/>
          <div style={{fontSize:12,color:'var(--text-dim)',marginTop:3}}>{Math.max(1,Math.round(batchSize*factsPerQ))} target facts per batch, plus same-condition context facts for realistic distractors. Higher = more material per question; lower = deeper coverage of a small pool.</div>
        </div>}
      </div>

      {/* Focus context */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--accent)',marginBottom:4}}>Focus Context <span style={{color:'var(--text-dim)',fontWeight:400,textTransform:'none',letterSpacing:0}}>— optional, steers question selection</span></div>
        <div className="field-block"><label htmlFor="nclex-outcomes">Outcomes</label>
          <textarea id="nclex-outcomes" rows={3} value={outcomes} onChange={e=>setOutcomes(e.target.value)} placeholder={"1. Describe nursing care for the burn patient across all phases\n2. Identify infection control precautions for integumentary disorders"}/></div>
        <div className="field-block"><label htmlFor="nclex-points">Points</label>
          <textarea id="nclex-points" rows={3} value={points} onChange={e=>setPoints(e.target.value)} placeholder={"• Parkland formula\n• Herpes zoster staffing restrictions\n• ABCDs of melanoma screening"}/></div>
        <div className="field-block" style={{marginBottom:0}}><label htmlFor="nclex-context">Additional Context</label>
          <textarea id="nclex-context" rows={2} value={focusContext} onChange={e=>setFocusContext(e.target.value)} placeholder="e.g. 'This is a LATTE study guide' or 'Exam is 50 questions, heavy on burns'"/></div>
      </div>

      <button className="btn-primary" style={{width:'100%'}} disabled={!canRun} onClick={run}>
        {busy?'⟳ Generating...':!cfg.apiKey?'Enter API Key':!(K.knowledgeBase.conditions||[]).length?'Build Knowledge Base':'▶ Generate '+targetCount+' Questions ('+numBatches+' batch'+(numBatches!==1?'es':'')+')'}
      </button>

      {/* Progress */}
      {(busy||trackers.length>0)&&<div style={{marginTop:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <h3 style={{fontSize:12,fontWeight:600,color:'var(--text-bright)'}}>{busy?'Generating...':'Complete'}</h3>
          <span style={{fontSize:12,fontFamily:'JetBrains Mono',color:'var(--text-dim)'}}>{Math.round(prog)}%</span>
        </div>
        <div className="progress-bar" role="progressbar" aria-label="NCLEX question generation" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(prog)}><div className="progress-fill" style={{width:prog+'%'}}/></div>
        {liveKB>0&&<div style={{fontSize:12,color:'var(--accent-cyan)',fontFamily:'JetBrains Mono',marginTop:4}}>▼ receiving {liveKB} KB</div>}
        <div style={{marginTop:8}}>{trackers.map(t=>
          <div className="chunk-item" key={t.id}>
            <div className={'chunk-dot '+t.status}>{t.status==='done'?'✓':t.status==='error'?'!':''}</div>
            <span style={{flex:1,fontWeight:500}}>{t.name}</span>
            {t.q>0&&<span style={{fontFamily:'JetBrains Mono',fontSize:12,color:'var(--accent-green)'}}>{t.q} Q</span>}
            <span style={{fontFamily:'JetBrains Mono',fontSize:12,color:'var(--text-dim)',textTransform:'uppercase'}}>{t.status}</span>
          </div>)}</div>
        {busy&&<button className="btn-danger" style={{width:'100%',marginTop:10}} onClick={()=>abortCtl?.abort()}>Cancel</button>}
      </div>}

      {/* Logs */}
      {logs.length>0&&<div style={{marginTop:12,maxHeight:150,overflowY:'auto',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:10,fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.6}}>
        {logs.map((l,i)=><div key={i} style={{color:l.t==='err'?'var(--accent-red)':l.t==='ok'?'var(--accent-green)':l.t==='warn'?'var(--accent-warm)':'var(--text-dim)'}}>{l.msg}</div>)}
      </div>}

      {/* Fact coverage — verified in code, same pattern as the Anki tab */}
      {coverage&&<div style={{marginTop:12,padding:'11px 13px',borderRadius:8,border:'1px solid '+(coverage.uncovered.length?'var(--warning-border)':'var(--success-border)'),background:coverage.uncovered.length?'var(--warning-bg)':'var(--success-bg)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:12,fontWeight:600,color:coverage.uncovered.length?'var(--accent-warm)':'var(--accent-green)'}}>
            {coverage.uncovered.length?'\u2691':'\u2713'} Fact coverage: {coverage.cited}/{coverage.allocated} allocated fact(s) cited
            {coverage.unallocated>0&&<span style={{color:'var(--text-dim)',fontWeight:400}}> \u00b7 {coverage.unallocated} of {coverage.poolSize} pool fact(s) never allocated</span>}
          </span>
          {coverage.uncovered.length>0&&<button className="btn-secondary" style={{padding:'3px 10px',fontSize:12}} aria-expanded={showUncov} onClick={()=>setShowUncov(s=>!s)}>{showUncov?'Hide':'Show'} {coverage.uncovered.length}</button>}
        </div>
        <div style={{fontSize:12,color:'var(--text-dim)',marginTop:5}}>Fact IDs handed to the model, diffed in code against the IDs it actually cited. Unallocated facts stay available \u2014 raise the total question count to reach them.</div>
        {showUncov&&coverage.uncovered.length>0&&<div style={{marginTop:8,maxHeight:180,overflowY:'auto',background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
          {coverage.uncovered.map(f=><div key={f.id} style={{fontSize:12,fontFamily:'JetBrains Mono',lineHeight:1.5,marginBottom:4,color:'var(--text-dim)',display:'flex',gap:6,alignItems:'baseline',flexWrap:'wrap'}}><FactTag factId={f.id}/><span>{f.condition} \u00b7 T{f.tier} \u00b7 {f.latteBucket} \u2014 {f.text}</span></div>)}
        </div>}
      </div>}

      {/* Results */}
      {ws.count>0&&<div className="output-container" style={{marginTop:16}}>
        <div className="output-toolbar">
          <h3>{ws.count} Questions · {totalConcepts} concepts</h3>
          <div className="output-toolbar-actions">
            <button className={'btn-secondary'+(view==='worksheet'?' active':'')} aria-pressed={view==='worksheet'} onClick={()=>setView('worksheet')} style={view==='worksheet'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>📝 Worksheet</button>
            <button className={'btn-secondary'+(view==='working'?' active':'')} aria-pressed={view==='working'} onClick={()=>setView('working')} style={view==='working'?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}>🔍 Audit Trail</button>
            <button className="btn-secondary" onClick={()=>copyText(view==='worksheet'?wsMd:workMd)}>📋 Copy</button>
            <button className="btn-secondary" onClick={()=>exportAsMd(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX-Practice-Questions.md':'NCLEX-Audit-Trail.md')}>⬇ .md</button>
            <button className="btn-secondary" onClick={()=>exportAsTxt(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX-Practice-Questions.txt':'NCLEX-Audit-Trail.txt')}>⬇ .txt</button>
            <button className="btn-secondary" onClick={()=>exportAsPdf(view==='worksheet'?wsMd:workMd,view==='worksheet'?'NCLEX Practice Questions':'NCLEX Audit Trail',ws.count+' questions')}>🖨 PDF</button>
          </div>
        </div>
        <div className="output-body">
          {view==='worksheet'?<>
            <h2 style={{fontFamily:'DM Sans',fontSize:18,color:'var(--text-bright)',marginBottom:12}}>Questions</h2>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.7,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{ws.questions.join('\n\n')}</pre>
            <hr style={{margin:'28px 0',border:'none',borderTop:'1px solid var(--border)'}}/>
            <h2 style={{fontFamily:'DM Sans',fontSize:18,color:'var(--text-bright)',marginBottom:12}}>Answer Key</h2>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.7,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{ws.answers.join('\n\n')}</pre>
          </>:<>
            <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:12,padding:10,background:'var(--bg-input)',borderRadius:6,border:'1px solid var(--border)'}}>
              The model's working: every concept it logged with its verbatim source anchor, and its grounding audit. Spot-check a few anchors against your PDF — if they're real quotes, the questions are grounded.
            </div>
            <pre style={{whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono',fontSize:12,lineHeight:1.6,color:'var(--text)',background:'transparent',border:'none',padding:0,margin:0}}>{workMd}</pre>
          </>}
        </div>
      </div>}
    </div></ArtifactSourceCtx.Provider>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// TOOL: Clinical Case Study Generator
// A Knowledge Base consumer, like the NCLEX Generator. It never re-reads source
// PDFs: it selects a grounded fact packet from the shared KB, asks the model for a
// strict JSON unfolding case, then validates every datum, answer, and rationale
// against real fact IDs in code before rendering.
// ══════════════════════════════════════════════════════════════════════════

// ── Balanced fact selector ──
// Chat's correction: a naive .slice(0,N) per bucket can silently drop the later
// emergency finding, the hold parameter, or the only diagnostic value a stage needs.
// So: filter by allowed tiers, sort each bucket safety-critical-then-tier-first (so the
// slice keeps the highest-yield facts), and additionally guarantee numeric facts survive
// when calculation questions are requested. Dedups by id at the end.
function selectCaseFacts(condition,{includeTier2=true,includeTier3=false,includeCalculation=true,includeEducation=true}={}){
  const eligible=(condition.facts||[]).filter(f=>
    Number(f.tier)===1||(includeTier2&&Number(f.tier)===2)||(includeTier3&&Number(f.tier)===3));
  const byBucket=eligible.reduce((groups,f)=>{const b=f.latteBucket||'Other';(groups[b]||(groups[b]=[])).push(f);return groups;},{});
  for(const facts of Object.values(byBucket))
    facts.sort((a,b)=>Number(b.safetyCritical)-Number(a.safetyCritical)||Number(a.tier)-Number(b.tier));
  const selected=[
    ...(byBucket.BriefPatho||[]).slice(0,3),
    ...(byBucket.Look||[]).slice(0,10),
    ...(byBucket.Assess||[]).slice(0,8),
    ...(byBucket.Tests||[]).slice(0,8),
    ...(byBucket.Treatments||[]).slice(0,10),
    ...(includeEducation?(byBucket.Educate||[]).slice(0,6):[]),
  ];
  if(includeCalculation){
    const numeric=eligible.filter(f=>/\d/.test(`${f.text||''} ${f.sourceQuote||''}`));
    for(const f of numeric.slice(0,4))if(!selected.some(x=>x.id===f.id))selected.push(f);
  }
  return[...new Map(selected.map(f=>[f.id,f])).values()];
}

// Sufficiency check: warn (in code, before generating) when a condition lacks enough
// grounded material for a stage, so the model is never tempted to invent it.
// v15.8: takes the requested shape, not just the fact list.
// This checked only that facts EXISTED, never whether there were enough for what was asked.
// Real runs generated 12 questions from 6, 8, and 13 facts — 0.5 to 1.1 facts per question,
// against the NCLEX generator's own factsPerQ default of 3. The model then had nothing left
// to cite and reached forward into unrevealed stages, which validateStageTiming correctly
// reported as 12, 31, and 21 warnings. Those were not model misbehaviour; they were an
// impossible request. Two facts per question is deliberately laxer than the NCLEX
// generator's three, because a case reuses its data across stages.
const CASE_FACTS_PER_QUESTION=2;
function caseFactSufficiency(facts,totalQuestions){
  const byBucket={};for(const f of facts){const b=f.latteBucket||'Other';byBucket[b]=(byBucket[b]||0)+1;}
  const warnings=[];
  const want=Number(totalQuestions)||0;
  if(want>0){
    const supports=Math.floor(facts.length/CASE_FACTS_PER_QUESTION);
    if(supports<want){
      // Name a shape that actually fits, so the warning is actionable rather than generic.
      // Two questions per stage once the pool allows it: a one-stage case does not unfold,
      // which is the whole point of the format.
      const q=supports>=4?2:1;
      const st=Math.max(1,Math.min(4,Math.floor(supports/q)))||1;
      warnings.push(`${facts.length} fact(s) supports about ${supports} grounded question(s), but ${want} were requested. Expect the case to cite facts before they are revealed. Try ${st} stage(s) × ${q} question(s), or include Tier 2/3 facts.`);
    }
  }
  if(!(byBucket.Tests>0))warnings.push('No source-grounded diagnostic values — diagnostic-stage questions will be limited.');
  if(!(byBucket.Treatments>0))warnings.push('No source-grounded treatments — intervention-stage questions will be limited.');
  if(!(byBucket.Look>0)&&!(byBucket.Assess>0))warnings.push('No presenting findings or assessments — the initial-presentation stage will be thin.');
  if(facts.length<8)warnings.push(`Only ${facts.length} facts available for this condition. Consider including Tier 2/3 or picking a richer condition.`);
  return{byBucket,warnings};
}

// Render the selected facts as a grounded packet the model can cite by ID.
function caseRenderFactPacket(conditionName,facts){
  const L=['CASE SOURCE PACKET','CONDITION: '+conditionName,''];
  for(const f of facts){
    const anchor=String(f.sourceQuote||f.text||'').replace(/\s+/g,' ').trim().split(' ').slice(0,20).join(' ');
    L.push('FACT '+f.id);
    L.push('LATTE: '+f.latteBucket+(f.subtype?' / '+f.subtype:''));
    L.push('TIER: '+f.tier+(f.safetyCritical?' (safety-critical)':''));
    L.push('FACT: '+f.text);
    L.push('ANCHOR: "'+anchor.replace(/"/g,"'")+'"');
    L.push('SOURCE: '+(kbSourceText(f)||'pointer unavailable'));
    L.push('');
  }
  return L.join('\n');
}

// ── v15.6 item 5: operationalized difficulty ──
// [LATTE-HEURISTIC]. Before this, `Difficulty: ${difficulty}` was interpolated bare and the
// three levels had no behavioral contract at all.
// NEIA's Difficulty subcategory carries NO stop criterion — its note reads only "A range of
// difficulty levels recommended for nursing school examinations". Stem Relevance DOES stop.
// That asymmetry is the whole design: hard is permitted, out-of-scope is fatal, so the
// ceiling is the governing constraint at every level and is emitted with every level.
// The STRUCTURAL SIGNATURE lines mirror what caseDifficultySignals() checks in code. The
// model is told the contract because a signature it cannot see is one it cannot satisfy.
function caseDifficultyBlock(difficulty){
  const LEVELS={
    foundational:{
      cog:'direct cue recognition and straightforward application of a single fact',
      dis:'plausible but separable — a prepared student can rule each one out',
      sig:'none — no structural minimum is enforced at this level',
    },
    exam:{
      cog:'integrate at least TWO revealed cues, then prioritize among plausible actions',
      dis:'all options clinically plausible, several initially reasonable',
      sig:'at least one "Analyze Cues" question, at least one "Take Action" question, and at\n  least one question whose rationales cite two or more distinct facts that were each\n  presented as revealed case data',
    },
    advanced:{
      cog:'competing priorities, trend interpretation across stages, and reassessment after an intervention',
      dis:'multiple defensible actions, one clearly best only after integrating every revealed cue',
      sig:'at least one "Prioritize Hypotheses" AND one "Evaluate Outcomes" question; at least\n  one question in stage 3 or later whose rationales cite revealed data first presented in\n  TWO DIFFERENT earlier stages; and at least one MCQ where most distractors trace to\n  Tier 1-2 or safety-critical facts (actions correct at some other moment)',
    },
  };
  const L=LEVELS[String(difficulty||'').toLowerCase()]||LEVELS.exam;
  return `DIFFICULTY: ${difficulty}
DIFFICULTY CEILING (all levels): difficulty must stay within the knowledge, judgment, and
scope expected of a new graduate nurse. Increase difficulty through cue integration,
competing priorities, temporal change, and near-miss options — never through specialty
trivia, obscure facts, convoluted language, or content outside entry-level practice.
An item whose stem requires knowledge outside a new graduate's role is disqualified
regardless of how well it is written.
  Cognitive construction: ${L.cog}.
  Distractor construction: ${L.dis}.
  STRUCTURAL SIGNATURE (checked in code): ${L.sig}.`;
}

// ── Strict case-generation prompt ──
// Uses JSON output (deterministically validatable) + the shared NCLEX quality rules +
// a hard SOURCE BOUNDARY that lists exactly what may and may not be invented, plus the
// supportType vocabulary so combined/inference statements are labelled honestly rather
// than passed off as direct quotes.
function caseBuildPrompt({conditionName,facts,difficulty,stages,questionsPerStage,includeTypes}){
  const typeList=[];
  if(includeTypes.mcq)typeList.push('MCQ (single best answer, 4 options A-D)');
  if(includeTypes.sata)typeList.push('SATA — "(Select all that apply)" at the start of the stem, 5-6 options, 2-4 correct');
  if(includeTypes.prioritization)typeList.push('Prioritization (which action/finding comes first)');
  if(includeTypes.ordering)typeList.push('Ordered response — randomized steps to sequence (never list in correct order)');
  if(includeTypes.calculation)typeList.push('Calculation — only when the supplied facts contain the needed numbers; show the required unit');
  if(includeTypes.education)typeList.push('Client education (which teaching point is correct / indicates understanding)');
  return `═══ CLINICAL CASE STUDY GENERATOR (strict, source-grounded, JSON output) ═══

ROLE: You are a nursing clinical-judgment case author with expertise in the NCSBN Clinical
Judgment Measurement Model (CJMM). You build UNFOLDING patient cases that test reasoning across
stages, using ONLY the supplied Knowledge Base facts.

Return ONLY a single valid JSON object. No markdown fence, no preamble, no commentary.

═══ SOURCE BOUNDARY (the most important rule) ═══
You may invent ONLY neutral narrative details that do NOT affect clinical reasoning:
time of day, room number, whether a family member is present, the client's first name.
You may NOT invent any of the following — every one must trace to a supplied fact ID:
  diagnoses · comorbidities · allergies · home medications · medication doses ·
  laboratory or vital-sign values · assessment findings · procedures · provider orders ·
  contraindications · treatment responses · discharge restrictions · complications.
A client age and sex may be chosen freely ONLY if they do not change the clinical reasoning
(e.g. do not invent "72-year-old with CKD" unless CKD is a supplied fact).
BODY WEIGHT is the one clinical value you may choose, and ONLY when a weight-based
calculation requires it and no supplied fact states one. Choose a plainly ordinary adult
weight, present it in the stage "data" array like any other datum with supportType
"neutral-framing", and use that same number in every rationale that computes from it.
Never choose a weight that changes the clinical picture (do not invent obesity or
cachexia), and never invent any other laboratory or vital-sign value this way.
Laboratory and vital-sign values must trace to a supplied fact EITHER verbatim OR as a
bounded instantiation of a threshold that fact states — see supportType "instantiated"
below. Presenting a concrete value rather than restating the rule is preferred, because a
stem that quotes the decision rule hands the student the answer.

TERMINOLOGY: use NCSBN Test Plan vocabulary in all learner-facing text — client (not
patient), prescription for medications and order for other interventions, primary health
care provider (not doctor/physician), UAP. Never use q.d., QOD, IU, a bare U for unit, a
trailing zero (5.0 mg), or a decimal without a leading zero (.5 mg).
This applies to text YOU write. Quoted source material keeps its own wording — never
reword a verbatim quote to satisfy this rule.
Every clinical datum, every correct answer, and every rationale MUST cite at least one supplied
fact ID in its factIds array. If the facts cannot support a stage or question, produce fewer and
say so in debrief.notes — NEVER fabricate to fill a quota.

═══ PROSE FIELDS CARRY NO CLINICAL DATA ═══
These fields are free text and cannot carry fact IDs, so they must contain NO clinical values:
  title · patient.background · stage narrative · debrief.priorityProblem ·
  debrief.keyDecisions · debrief.notes
Put every finding, vital sign, lab, dose, and measurement in the structured "data" array, where
it can be cited. Narrative may set the scene only.
  ALLOWED in narrative:  "The nurse enters the room at 0800." · "A 72-year-old woman arrives
                          with her daughter." · "The call light is within reach."
  FORBIDDEN in narrative: "BP is 82/50." · "Potassium fell to 2.8 mEq/L." · "She takes
                          furosemide 80 mg daily." · "Oxygen saturation dropped to 88%."
This is checked automatically: any number carrying a clinical unit (mg, mcg, mL, mEq/L, mm Hg,
bpm, %, units) or a blood-pressure pair found in these fields FAILS validation. Ages, room
numbers, and clock times are fine.

═══ SUPPORT TYPE (label honesty) ═══
Each data item and rationale carries a supportType describing how it relates to the facts:
  "direct"         — restates a single fact
  "combined"       — merges two or more facts (list every id)
  "inference"      — a valid clinical inference from several facts (e.g. "client is
                     deteriorating" from falling SpO2 + new confusion); list every id
  "instantiated"   — a specific client value generated from a cited THRESHOLD or RANGE
                     fact (source says "urine output <30 mL/hr"; the case presents
                     "22 mL/hr"). The cited fact MUST contain the threshold, and the
                     value MUST fall on the side of it the case is claiming.
                     Never use this to invent a value the facts do not bound.
  "neutral-framing"— invented narrative detail with no clinical weight (factIds may be empty)
Do not pretend an inference is a direct quote.
This is checked in code: a value absent from its cited facts is an ERROR unless you declare
it "instantiated" AND a cited fact states a bound the value actually satisfies.

═══ STAGE DEPENDENCY ═══
Generate exactly ${stages} stages that unfold in clinical order. A question in a stage may only
depend on data revealed in that stage or an earlier one. Never let a Stage 1 question hinge on a
lab that is not revealed until Stage 2. Background pathophysiology may be marked availability
"background"; client data that has been shown is availability "revealed".
Stage arc for ${stages} stages:
  Stage 1 — Initial presentation (BriefPatho + Look + baseline findings)
  Stage 2 — Assessment & diagnostics (Assess + Tests)
  Stage 3 — Intervention (Treatments: orders, meds, precautions)
${stages>=4?'  Stage 4 — Discharge teaching OR deterioration (Educate, or a grounded complication)\n':''}${stages>=5?'  Stage 5 — Outcome evaluation (Evaluate response using revealed data)\n':''}
═══ QUESTIONS ═══
${caseDifficultyBlock(difficulty)}
Produce ${questionsPerStage} question(s) per stage.
Allowed question types (use a mix drawn from these; do not use a type the facts cannot support):
  ${typeList.join('\n  ')}
Tag exactly one CJMM skill per question from: Recognize Cues · Analyze Cues ·
Prioritize Hypotheses · Generate Solutions · Take Action · Evaluate Outcomes.

${CASE_QUESTION_RULES}

═══ JSON SHAPE (return EXACTLY this structure) ═══
{
  "title": "string",
  "condition": "${conditionName}",
  "difficulty": "${difficulty}",
  "patient": { "age": 0, "sex": "string", "background": "neutral, source-safe context only" },
  "stages": [
    {
      "stageNumber": 1,
      "title": "string",
      "narrative": "2-4 sentences of unfolding scenario",
      "data": [
        { "label": "e.g. Respiratory rate", "value": "e.g. 28/min", "supportType": "direct",
          "availability": "revealed", "factIds": ["fact-104"] }
      ],
      "questions": [
        {
          "id": "s1q1",
          "type": "MCQ|SATA|Prioritization|Ordering|Calculation|Education",
          "stem": "string",
          "options": [ { "label": "A", "text": "string" } ],
          "correctAnswers": ["B"],
          "rationales": [ { "option": "B", "text": "string", "supportType": "direct", "factIds": ["fact-104"] } ],
          "cjmmSkill": "Recognize Cues"
        }
      ]
    }
  ],
  "debrief": { "priorityProblem": "string", "keyDecisions": ["string"], "notes": "any shortfalls or facts you could not cover", "factIds": ["fact-104"] }
}

Every question needs a rationale entry for EVERY option (correct and incorrect). Ordering-question
correctAnswers list the step labels in correct sequence. Return ONLY the JSON object.

${caseRenderFactPacket(conditionName,facts)}`;
}

// ── Deterministic post-generation validation ──
// Everything the prompt promises is re-checked in code against the real KB.
// Clinical values that must never appear in uncited prose. A number carrying a clinical unit
// (or a BP pair) is patient data and belongs in the cited `data` array, not in free narrative
// where nothing ties it to a source. Plain integers are deliberately NOT matched, so an age,
// a room number, or a clock time stays legal neutral framing.
// v15.8: the numeric part accepts group separators. It was \b\d+, so a real Parkland
// rationale saying "7,000 mL" tokenized as "000 mL" — a token that cannot match any source
// text, so a correctly grounded value was reported as fabricated every time. The comma is
// already stripped by caseNormalizeClinical on both sides, so matching is unaffected.
// v15.17: retain signs and complete denominators. A partial unit can never establish numeric support.
const CASE_CLINICAL_TOKEN_RE=/(?<![\w.,])(?:[+−-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?|[+−-]?\.\d+)\s*(?:(?:micrograms?|milligrams?|kilograms?|grams?|millilit(?:er|re)s?|lit(?:er|re)s?|milliequivalents?|millimoles?|[µμ]g|mcg|mg|kg|mL|mEq|mmol|mm\s*Hg|bpm|beats?\s*(?:per|\/)\s*min(?:ute)?s?|breaths?\s*(?:per|\/)\s*min(?:ute)?s?|units?|g|L)(?:[\p{L}0-9²^]*)(?:\s*(?:\/|per\s+)\s*[\p{L}0-9²^]+)*|%|\/\s*min)\b|(?<![\w.,])(?:[+−-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?|[+−-]?\.\d+)\s*%|(?<![\w/])\d{2,3}\s*\/\s*\d{2,3}(?:\s*mm\s*Hg)?(?![\w/])/giu;
// v15.1: qualitative findings ("becomes hypotensive", "appears confused") carry no numeric
// token and sailed past the value scan. Term matches are WARN-tier because a stem scan will
// false-positive on genuinely neutral phrasing; the numeric scan above stays error-tier.
const CASE_CLINICAL_TERM_RE=/\b(?:hypotensi\w*|hypertensi\w*|tachycard\w*|bradycard\w*|tachypne\w*|bradypne\w*|hypoxi\w*|hypoxem\w*|dyspne\w*|cyanosis|cyanotic|diaphore\w*|letharg\w*|obtunded|unresponsive|confus\w*|disoriented|edema\w*|crackles|wheez\w*|stridor|seizure\w*|hemorrhag\w*|infect\w*|febrile|fever\w*|nausea\w*|vomit\w*|hypoglycem\w*|hyperglycem\w*|oligur\w*|anuri\w*|jaundice\w*|pallor|mottl\w*|deteriorat\w*|decompensat\w*|unstable|distress\w*|anxious|restless\w*|agitat\w*|pain|painful)\b/gi;
function scanUncitedProse(text,where,issues){
  const source=String(text||'');
  const hits=source.match(CASE_CLINICAL_TOKEN_RE);
  if(hits&&hits.length)issues.push({sev:'error',msg:`${where}: contains uncited clinical value(s) ${[...new Set(hits.map(h=>h.trim()))].join(', ')} \u2014 clinical data must go in the cited data array`});
  const terms=source.match(CASE_CLINICAL_TERM_RE);
  if(terms&&terms.length)issues.push({sev:'warn',msg:`${where}: possible uncited clinical finding(s): ${[...new Set(terms.map(t=>t.toLowerCase()))].join(', ')} \u2014 assessment findings belong in the cited data array (warn-tier: neutral phrasing can trip this)`});
}

// \u2500\u2500 v15.6: NEIA terminology linter \u2500\u2500
// [NEIA-VALIDATED] Terminology Reference, Appendix A of Simms, Hensel & Kumar,
// Nurse Educ Pract 93:104804 (2026). Preferred vocabulary and unsafe abbreviations.
// WARN tier only \u2014 the rubric's Terminology subcategory carries NO stop criterion; its
// note reads "If the Terminology subcategory scores below 3 points, consider revision."
// Making these fatal would over-reject on a criterion the rubric itself treats as advisory.
// The trailing/leading-zero patterns partially overlap CASE_CLINICAL_TOKEN_RE. That overlap
// is deliberate: different purpose (safe formatting vs. uncited data) and different severity.
// Do NOT merge them \u2014 a single shared regex is how the %\b never-match bug happened.
const NEIA_TERMINOLOGY_RULES=[

// Stage-timing: a rationale may not depend on patient data that has not been revealed yet.
// Two availability classes, per chat's note: 'revealed' data is progressively disclosed and
// only counts from the stage it appears in onward; 'background' data is instructor knowledge
// (general pathophysiology) and is available from the start, so it is never a timing error.
// A fact cited but never presented anywhere is reported separately — it is a grounding gap,
// not an ordering gap, and conflating the two produced misleading warnings.
function validateStageTiming(caseStudy){

    for(const d of stage.data||[])

        for(const id of d.factIds||[])available.add(String(id).toLowerCase());

      // options all cite the same unrevealed fact produced an identical warning for every
      // rationale — a real run reported fact-82 five times inside one question and 22
      // timing warnings for what were only 8 distinct facts. Volume that repetitive reads
      // as noise and buries the findings that differ.
      const seen=new Set();
      for(const r of q.rationales||[])

// Every distinct fact id referenced anywhere in the case (for the registry + coverage).
function caseAllFactIds(caseStudy){
  if(caseShapeIssues(caseStudy).length)return [];
  const s=new Set();
  const add=ids=>{for(const id of ids||[])s.add(String(id).toLowerCase());};
  for(const stage of caseStudy.stages||[]){
    for(const d of stage.data||[])add(d.factIds);
    for(const q of stage.questions||[])for(const r of q.rationales||[])add(r.factIds);

// Render the validated case to printable markdown (questions then a separate answer key).
// `worksheetFactIds:false` strips [fact-n] tags from the STUDENT-FACING half only. On screen a
// fact tag is a clickable audit affordance; on paper it is noise a student cannot act on. The
// answer key always keeps them, since that is the half being spot-checked against the source.
function caseToMarkdown(cs,{worksheetFactIds=true}={}){
  const L=[];
  L.push('# '+(cs.title||'Clinical Case Study'));
  const p=cs.patient||{};
  L.push('**Condition:** '+(cs.condition||'—')+'  |  **Difficulty:** '+(cs.difficulty||'—'));
  if(p.age||p.sex||p.background)L.push('**Patient:** '+[p.age&&p.age+' y/o',p.sex,p.background].filter(Boolean).join(', '));
  L.push('\n---\n');
  for(const stage of cs.stages||[]){
    L.push('## Stage '+stage.stageNumber+' — '+(stage.title||''));
    if(stage.narrative)L.push('\n'+stage.narrative+'\n');
    if((stage.data||[]).length){
      L.push('**Clinical data**\n');
      for(const d of stage.data)L.push('- '+(d.label?d.label+': ':'')+(d.value||'')+(worksheetFactIds&&d.factIds&&d.factIds.length?'  ['+d.factIds.join(', ')+']':''));
      L.push('');
    }
    (stage.questions||[]).forEach((q,i)=>{
      L.push('**Q'+stage.stageNumber+'.'+(i+1)+' ('+(q.type||'MCQ')+')** '+(q.stem||''));
      for(const o of q.options||[])L.push('   '+(o.label||'')+'. '+(o.text||''));
      L.push('');
    });
  }
  // Hard page break so a printed worksheet never shows its answer key on the same sheet.
  L.push('\n<div class="pagebreak"></div>\n\n## Answer Key\n');
  for(const stage of cs.stages||[]){
    (stage.questions||[]).forEach((q,i)=>{
      L.push('**Q'+stage.stageNumber+'.'+(i+1)+'** — Answer: '+((q.correctAnswers||[]).join(', ')||'—')+(q.cjmmSkill?'  ·  '+q.cjmmSkill:''));
      for(const r of q.rationales||[])L.push('   - '+(r.option||'')+': '+(r.text||'')+(r.factIds&&r.factIds.length?'  ['+r.factIds.join(', ')+']':''));
      L.push('');
    });
  }

  if(db.priorityProblem||((db.keyDecisions||[]).length)||db.notes){
    L.push('\n---\n\n## Debrief\n');
    if(db.priorityProblem)L.push('**Priority problem:** '+db.priorityProblem);
    for(const k of db.keyDecisions||[])L.push('- '+k);
    if(db.notes)L.push('\n*'+db.notes+'*');
  }

// Built by truncating the case and reusing caseToMarkdown, then cutting at the page break
// that separates worksheet from answer key. Assembling a second representation of the case
// would guarantee eventual drift between the audited artifact and the printed one, and
// cutting at the renderer's own boundary means a future field added to the answer key
// cannot leak into the audit payload by accident.

function caseAuditPayload(cs,stageNumber,q){

// Verdict vocabulary. REVIEW exists because the June study measured both rater types
// misclassifying ~86-88% of moderate-quality items, nearly all by rating them upward —
// forcing a borderline item into PASS is exactly the failure mode the data predicts.
// v15.7: REPAIRED is its own status, and the honesty matters. A repaired item was NOT
// re-audited (the loop is capped at one round), so claiming PASS would assert a check that
// never ran. But leaving it FAIL is worse: a real run showed "FAIL — DISTRACTOR LENGTH" in
// the panel for an item the log had already reported as successfully rewritten, so the panel
// was describing text that no longer existed. REPAIRED says exactly what happened.
const ITEM_AUDIT_STATUS=new Set(['PASS','FAIL','REPAIRED','REVIEW','N/A','ERROR']);
// Criterion 3 is the ONLY one where the auditor overrules a keyed answer with no reference
// standard, and it sits in the AI's second-weakest measured domain (ICC 0.575). A wrong
// auto-repair here silently replaces a correct answer with an incorrect one, so an
// answer-accuracy FAIL is surfaced for human review and never repaired automatically.
function itemAuditIsAnswerAccuracy(criterion){
  return /answer\s*accuracy|correct\s*answer\s*[:\-]?\s*accuracy/i.test(String(criterion||''));
}
function itemParseAuditVerdict(text){
  const raw=String(text||'');
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const warns=[];
  let status='REVIEW',criterion='',detail='',verdictSeen=false; // v15.14: see below
  for(const line of lines){
    let m;
    if((m=line.match(/^WARN\s+([^:]+):\s*(.*)$/i))){warns.push({criterion:m[1].trim(),detail:m[2].trim()});continue;}
    if(verdictSeen)continue; // v15.14: an explicit flag. The old test could not tell a
    // leading REVIEW apart from the 'nothing seen yet' default, because they are the same state.
    if(/^PASS\b/i.test(line)){status='PASS';verdictSeen=true;continue;}
    if((m=line.match(/^FAIL\s*[—–\-:]\s*(.+)$/i))){status='FAIL';criterion=m[1].trim();verdictSeen=true;continue;}
    if((m=line.match(/^REVIEW\s*[—–\-:]\s*(.+)$/i))){status='REVIEW';detail=m[1].trim();verdictSeen=true;continue;}
  }
  // A FAIL naming criterion 11 is downgraded here, not trusted. The prompt forbids it, but
  // a prompt instruction is not an enforcement mechanism — this is.
  if(status==='FAIL'&&/test\s*plan|alignment/i.test(criterion)){

// v15.7: quota-aware abort. A free-tier key that has run out will 429 every remaining call,
// and geminiRequest's backoff makes each failure SLOW. Burning through 20 more doomed audits
// wastes minutes and tells the user nothing new, so a caller can throw QuotaStop from the
// worker to end the pool early with the results collected so far.
function isQuotaError(e){
  return /quota|rate limit|429|resource_exhausted/i.test(String((e&&e.message)||e||''));
}
// Two lanes, not three — see the pool comment below. geminiRequest already retries 429 with
// Retry-After and exponential backoff; the audit calls shipped with a budget of 1, which is
// too small to ride out a per-minute window, so they get 3.
const AUDIT_POOL_WIDTH=2,AUDIT_RETRIES=3;
// Bounded concurrency. A 5-stage case at 2 questions/stage is ~6 MCQ-eligible items; at the
// June paper's measured 1.7-2.3 min/item for reasoning-enhanced models, serialized audits
// would run 10-14 minutes and make the feature unusable.
// Width 2, not 3: free-tier Gemini limits are per-minute, and width 3 at the ~6s latency
// measured on this build bursts roughly 28 requests/minute, which exhausts a free-tier Pro
// allowance quickly. Two lanes still overlap the waiting without spiking the rate.
async function itemRunPool(items,width,worker,signal){
  const out=new Array(items.length);
  let next=0,fatal=null;
  // v15.14: a lane that throws no longer leaves its sibling running.
  // v15.8 attached partial results to the error, which fixed HALF the problem. The other
  // half survived: Promise.all rejects the instant ONE lane throws, but the other lane is
  // still inside its own for(;;) and keeps pulling items and issuing Gemini calls. That
  // defeats the entire point of the QuotaStop path above — "stop after two quota failures
  // rather than grinding through every remaining item, because each failure is SLOW" — since
  // only one of the two lanes actually stopped. With AUDIT_RETRIES=3 and exponential backoff
  // on every doomed call, the surviving lane can run for minutes after the user has been told
  // the audit stopped. Worse, e.partial was snapshotted at rejection time, so anything that
  // lane finished afterwards was written into out[] and never surfaced: paid for twice over.
  //
  // The fix is to stop SCHEDULING on the first fatal, then let the in-flight lanes settle
  // before throwing. Lanes return rather than throw, so Promise.all always resolves and
  // `fatal.partial` is complete — every result that finished is represented, including ones
  // the sibling completed after the failure.
  const lane=async()=>{
    for(;;){
      if(fatal)return;
      if(signal&&signal.aborted){fatal=fatal||Object.assign(new Error('Aborted'),{name:'AbortError'});return;}
      const i=next++;
      if(i>=items.length)return;
      try{out[i]=await worker(items[i],i);}
      catch(err){fatal=fatal||err;return;}
    }
  };

  return out;
}
