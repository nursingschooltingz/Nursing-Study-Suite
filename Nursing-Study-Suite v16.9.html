// NOT one of the 11 frozen constants. This is new surface and may be tuned freely — but
// every rule below exists to stop the model doing what it otherwise does, which is tidy
// the content up in transit. Loosen them only against measured output.
const CARD_TRANSCRIBE_PROMPT=`You are transcribing ONE face of a printed nursing flashcard from a photograph.

Your ONLY job is to reproduce what is printed. You are not summarizing, teaching, correcting, or organizing. A later step does all of that, and it will only ever see your output — never this image. If you improve the wording here, the improvement becomes indistinguishable from the source and nobody downstream can catch it.

ORIENTATION
The photograph may be rotated by any amount, shot at an angle, or sit on a patterned background. Read the card in whatever orientation it appears. Ignore everything outside the card's edges.

ABSOLUTE RULES
1. VERBATIM. Reproduce the printed wording exactly, including punctuation and capitalization. Do not rephrase, condense, join, or split.
2. DO NOT EXPAND ABBREVIATIONS. "NGT" stays "NGT". "F and E" stays "F and E". "H&H" stays "H&H". Never write the expansion, not even in parentheses.
3. PRESERVE SYMBOLS EXACTLY. Arrows carry clinical meaning: an up arrow before a lab value means "increased", and dropping it silently reverses the fact. Reproduce every arrow, inequality, degree sign, and unit exactly as printed.
4. NEVER GUESS A NUMBER. If any digit, unit, or inequality is not certain, mark it unreadable rather than reporting your best guess. A missing number is recoverable; a wrong number is not.
5. NO OUTSIDE KNOWLEDGE. If the card says something you believe is incomplete or outdated, transcribe it as printed anyway. Do not add what you know should be there.
6. ONE PRINTED BULLET = ONE ARRAY ENTRY. Do not merge bullets, and do not break one bullet into several.

SECTION KEYS
Use these keys where the printed heading matches. Headings vary between cards and editions, so ALWAYS also record the heading exactly as printed.
  pathophysiology | assessmentAndDiagnosticFindings | complications
  medicalCareAndSurgicalTreatment | keepInMind | makeTheConnection
  clue          (the front's cue or clue block, whatever it is titled)
  other         (ANY heading that does not clearly match the above)
Never force a heading into a key that does not fit. "other" plus the verbatim heading is always correct and always better than a wrong key.

LEGIBILITY
Report legibility per section: "clean", "uncertain", or "unreadable". Use "uncertain" whenever glare, blur, curvature, or the angle of the shot leaves you less than fully confident about any character.

Return ONLY this JSON object, with no commentary:

{
  "face": "front" or "back",
  "category": "the running header, verbatim",
  "cardNumber": "the printed card number, as a string",
  "title": "front only; the condition name, verbatim; null on a back face",
  "pronunciation": "front only; the parenthesized pronunciation, verbatim, or null",
  "sections": [
    {
      "key": "one of the keys above",
      "heading": "the heading exactly as printed",
      "bullets": ["one entry per printed bullet, verbatim"],
      "legibility": "clean or uncertain or unreadable"
    }
  ],
  "numerics": [
    {
      "value": "the number exactly as printed, with unit and any inequality",
      "context": "the few printed words it modifies",
      "legibility": "clean or uncertain or unreadable"
    }
  ],
  "symbols": ["every non-ASCII symbol appearing on the card"],
  "unreadable": ["a short description of each thing you could not read"],
  "overallLegibility": "clean or uncertain or unreadable"
}

"numerics" must list EVERY number carrying clinical meaning — thresholds, doses, sizes, times, lab values — even though those numbers also appear inside the bullets. The duplication is deliberate: it is the list a human checks against the card by eye, and it is what the safety gate keys on.`;
async function cardTranscribe(apiKey,model,level,file,opts){

  // v15.14: bounded payload, with the resize reported so the log can say it happened.
  const payload=await cardFilePayload(file);
  if(opts&&typeof opts.onPayload==='function'){try{opts.onPayload(payload);}catch(e){}}

function cardKey(t){return String((t&&t.category)||'?').trim()+' #'+String((t&&t.cardNumber)||'?').trim();}

// v15.14: the build gate, as code rather than as a paragraph of UI text.

function cardChunkWarnings(c){

        }
        if(opMismatch)owned_addLog(`  ⚠ ${tag}: ${opMismatch} verified quote(s) disagree with the source on a comparator or arrow — check these by eye`,'err');
        stats.push({tag,file:file.name,label:chunk.label,chars:chunk.text.length,facts:nFacts,recovered,discarded,auditStatus,quoteChecked,quoteMissing,quoteMatched:quoteChecked-quoteMiss,sourcePointerEvidence,primaryResponse,auditResponse,quoteMiss,quoteMissDetail:missDetail,quoteMissByReason:missByReason,discardByReason,dehyphSaved,opMismatch,opDetail,failed:false});

// ──── TOOL: Priority Analyzer ────
function paChunkText(text,chunkSize=12000,overlapSize=1500){
  let paragraphs=text.split(/\n{2,}/);if(paragraphs.length===1&&paragraphs[0].length>chunkSize)paragraphs=text.split(/\n/);
  const segments=[];
  for(const para of paragraphs){if(para.length<=chunkSize){segments.push(para);}else{const sentences=para.split(/(?<=[.!?])\s+/);let buf='';for(const sent of sentences){if(sent.length>chunkSize){if(buf){segments.push(buf);buf='';}for(let i=0;i<sent.length;i+=chunkSize)segments.push(sent.slice(i,i+chunkSize));}else if(buf.length+sent.length+1>chunkSize){segments.push(buf);buf=sent;}else{buf+=(buf?' ':'')+sent;}}if(buf)segments.push(buf);}}
  const chunks=[];let current='';let overlapBuffer='';
  for(const seg of segments){if(current.length+seg.length+2>chunkSize&&current.length>0){chunks.push(current.trim());const words=current.split(/\s+/);overlapBuffer='';for(let i=words.length-1;i>=0;i--){const c=words.slice(i).join(' ');if(c.length>overlapSize)break;overlapBuffer=c;}current=overlapBuffer?overlapBuffer+'\n\n'+seg:seg;}else{current+=(current?'\n\n':'')+seg;}}
  if(current.trim())chunks.push(current.trim());return chunks;
}

// STAGE 1 — Harvest (v2). Harvests an inventory only; tiering happens in Stage 2.
function paBuildExtractPrompt(chunk,idx,total,prevSummary){
  return `You are a nursing content analyst harvesting a priority inventory from one chunk of a FINISHED study guide.
Chunk ${idx+1} of ${total}.

${prevSummary?`## Items already harvested from previous chunks\n${prevSummary}\n---\n\n`:''}YOUR JOB: harvest, do NOT rank. Tiers are assigned later by a separate rule-based pass.
Assigning tiers here corrupts that pass. Do not write T1, T2, or T3 anywhere.

For every discrete testable item in this chunk, output ONE line:

- **Item** [§ Section] | QUALIFIER: <the source's own modifying words, or NONE> | FLAGS: <flags, or NONE>

RULES

1. ANCHOR — [§ Section] is the nearest heading or condition name in the chunk. Every item gets one.
   If the chunk has no heading, use [§ untitled].

2. QUALIFIER — copy the source's own modifying words for the finding, verbatim.
   Examples: "not relieved by rest" · "K+ 6.6 with ECG changes" · "temp spiked this afternoon" · "cannot arouse"
   A bare topic name with no modifier = QUALIFIER: NONE. NEVER invent a qualifier.

3. FLAGS — apply ONLY where this chunk's own text supports it. These are observations, not rankings.
   ABC ............ airway, breathing, or circulation compromise
   CRISIS ......... hemorrhage; fever >105°F/40.5°C; hypoglycemia; pulseless or breathless;
                    or the guide itself calls it an emergency
   PSYCH-SAFETY ... suicidal/homicidal ideation, self-harm, violence, elopement risk
   CRIT-LAB ....... critical-range value — INR in the 4s, K+ in the 6s, pH in the 6s/low 7s,
                    CO2 in the 50s, low O2 sat, high WBC, low ANC, low CD4, low platelets —
                    or the guide labels it critical/panic. The ranges above are heuristic
                    buckets, not universal thresholds. A value the chunk itself presents as
                    this client's expected baseline (dialysis K+, therapeutic INR for a
                    mechanical valve) is NOT critical. Flag what the text presents as
                    abnormal for this client, not what the number looks like out of context.
   ROUTINE-LAB .... abnormal but not critical — creatinine, BUN, Hgb 8–11, bicarb, elevated HCT,
                    elevated BNP, elevated Na
   UNSTABLE ....... acute; unexpected or changed finding; post-op <12h; general anesthesia <12h;
                    newly admitted or diagnosed <24h; not ready for discharge; worsening
   STABLE ......... chronic; expected/classic presentation; unchanged assessment; post-op >12h;
                    ready for discharge
   SAFETY ......... black-box warning, contraindication, antidote, hold parameter, allergy,
                    high-alert med, never-event
   SCOPE .......... delegation, assignment, LPN/UAP limits, supervision, staff-management action
   ASSESS-FIRST ... the guide says assess/verify/check BEFORE acting
   ACTION ......... an intervention with an exact parameter (dose, rate, position, timeframe)
   ORGAN:<x> ...... brain | lung | heart | liver | kidney | pancreas | other —
                    the organ affected BY THE QUALIFIER, not by the diagnosis name
   BACKGROUND ..... mechanism, patho detail, epidemiology, incidence, history, context material

4. NO NEW CONTENT. If it is not in this chunk, it does not exist. Never add clinical facts from
   your own knowledge. Never expand an abbreviation into a fact the guide didn't state.
   SCOPE: this bans ADDING clinical content to the inventory. It does not ban CLASSIFYING
   content already in front of you. Applying a FLAG from the list above is classification
   and is permitted. Writing a clinical value, threshold, or interpretation the chunk does
   not state is not.

5. Group items under the guide's own condition/topic headings. One line per item. Telegraphic.

## Content
${chunk}`;
}

// STAGE 2 — Cascade + Grounding (v2.1). Rule-based tiering over the harvested inventory.
function paBuildSynthPrompt(extractions,context){
  const combined=extractions.map((e,i)=>`### Chunk ${i+1}\n${e}`).join('\n\n---\n\n');
  return `You are a nursing priority analyst. You are re-ranking the contents of a FINISHED study guide into a
study order. You are not adding knowledge — you are sorting what is already there, by fixed rules,
and showing your work.

## INPUT
A harvested inventory from ${extractions.length} chunks. Each line carries an item, its [§ Section]
anchor, the source's own QUALIFIER, and objective FLAGS. No tiers were assigned. You assign them.

${context?`## Exam context\n${context}\n\n`:''}## HARD RULES — violating any of these makes the output worthless

G1. NO NEW CONTENT. Every item you output must trace to the inventory. Do not add conditions,
    values, drugs, or interventions from your own knowledge.
    SCOPE OF G1: this bans ADDING clinical content. It does not ban CLASSIFYING content that is
    already in front of you. Sorting an existing item into a pre-written category and reproducing
    that category's pre-written clause introduces nothing new and is permitted. Writing your own
    clinical detail into that clause is not. There is no other exception to G1.

G2. ANCHOR EVERYTHING. Carry the [§ Section] anchor through to your output on every item.

G3. NAME THE RULE. Every tier must cite the cascade rule that assigned it — e.g. (R4 CRIT-LAB).
    "High yield," "important," "commonly tested," and "NCLEX favorite" are NOT rules.
    They are BANNED as justifications. If you cannot name a rule, the item is not T1.

G4. TAG WHAT YOU CANNOT PROVE.
    [UNVERIFIED] — you needed a clinical fact the guide never states. Tag it; never silently supply it.
    [INFERRED]   — the tier came from your cascade reasoning, not from explicit emphasis in the guide.
    An item with NO tag is one the guide itself flagged as critical/emergency/priority.

G5. TIER THE QUALIFIED FINDING, NEVER THE BARE TOPIC.
    "Angina" is not a tier. "Angina not relieved by rest" is.
    If QUALIFIER is NONE, the item may NOT be promoted above T2 on the strength of its topic name.
    Keyword-tiering — seeing the word "potassium" and reaching for T1 — is the single most common
    failure mode in this task. The modifier carries the priority, not the label.

G6. FLAGS ARE HINTS, NOT GOSPEL. Stage 1's FLAGS are a fast first pass and are incomplete by design.
    Read every QUALIFIER yourself and fire the rule its text earns, even when the matching flag is
    absent. "K+ 6.6 with ECG changes" fires R4 whether or not CRIT-LAB was tagged. "cannot arouse"
    fires R1 whether or not ABC was tagged.
    The asymmetry is the point: a MISSING flag may never suppress a rule the text earns; a PRESENT
    flag may never fire a rule the text does not support. The text is the evidence. The flag only
    tells you where to look.

## THE CASCADE — per item, FIRST MATCH WINS, stop at the first rule that fires

Run each rule against the item's own text and its QUALIFIER. Treat FLAGS as a checklist of places
to look, never as the finding itself (G6).

R1  ABC ............ airway compromise, then breathing, then circulation. Airway outranks everything. → T1
R2  CRISIS ......... hemorrhage; fever >105°F; hypoglycemia; pulseless/breathless.
                     Automatic T1 EVEN IF the guide presents them as expected.
R3  PSYCH-SAFETY ... suicidal/homicidal ideation, self-harm, violence, elopement. Automatic T1.
                     Test: "if this is omitted, what is the worst outcome?" If the answer is death,
                     it is T1 — no matter where Maslow would otherwise file it.
R4  CRIT-LAB ....... critical-range value. → T1
R5  UNSTABLE ....... acute; unexpected/changed finding; post-op <12h; newly admitted <24h;
                     worsening. → T1
R6  SAFETY / SCOPE . black-box warnings, contraindications, antidotes, hold parameters, allergies,
                     high-alert meds; delegation, assignment, scope limits, staff-management actions.
                     → T1 (safety-critical and heavily tested)
R7  MASLOW ......... once R1–R6 are clear: physiological > safety > psychosocial > self-actualization.
                     Physiological → T1/T2 · safety → T2 · psychosocial/teaching → T2/T3
R8  NURSING PROCESS  assess before intervene — an ASSESS-FIRST red flag outranks the intervention it
                     gates. EXCEPTION: in an ABC or CRISIS situation you ACT first, you do not
                     assess first.
R9  STABLE/BACKGROUND
                     chronic, expected/classic, unchanged, ROUTINE-LAB, complication-prevention
                     teaching → T2.
                     Mechanism, patho detail, epidemiology, incidence, history → T3.

## TIEBREAKERS — for ORDERING WITHIN a tier, never for promoting between tiers

B1. ORGAN HIERARCHY — brain > lung > heart > liver > kidney > pancreas.
    Apply to the organ named in the QUALIFIER, not the organ of the diagnosis.
    (A chronic renal patient with frothy sputum is a LUNG problem.)
B2. Acute > chronic · unstable > stable · unexpected > expected · actual > potential ·
    fresh post-op (<12h) > medical or other surgical.
B3. Still tied? Whichever the guide gives more space and emphasis to.

## SPECIAL PRECEDENCE

- LOC vs AIRWAY: level of consciousness is the first thing you ASSESS; airway is the first thing you
  DO. Both are T1. Do not let one crowd out the other and do not "resolve" this as a contradiction.
- GUIDE vs CASCADE: if the guide calls something routine but R2/R3 fires, the CASCADE WINS —
  and you tag it [INFERRED] so the override is visible.

## TESTABLE ANGLE — T1 items only, ONE clause appended to the WHY

This is a LOOKUP, not a generation. Select exactly ONE category from the closed list below.
Reproduce its clause as written. Add no clinical content of your own — no drug names, no lab
values, no conditions, no interventions that are not already in the item.

  Pharmacology ....... intended vs side vs adverse vs toxic effect; drug classification
  Lab value .......... normal or abnormal → which organ → which disorder it monitors
  Med/IV calculation . the formula; unit conversion; decimal placement
  Diet ............... diagnosis → organ affected → correct diet
  Positioning ........ the prescription; the complication being prevented
  Communication ...... the client's feelings; therapeutic technique
  Delegation ......... who may do it — UAP = noninvasive, stable, never the first time
  Disaster/triage .... internal vs external; resources; survivability
  Prioritization ..... worst consequence if omitted

// `##?` matches one or two hashes only, so a model emitting `### TIER 2` failed the
// lookahead and TIER 1's lazy (.*?) ran to end-of-string under /s — Tier 1 rendered the

function paParseTiers(text){
  const src=String(text||'');
  const sec={tier1:[],tier2:[],tier3:[],strategy:[]};
  const HEAD=[
    [/^#{1,4}\s*(?:🔴\s*)?TIER\s*1\b/i,'tier1'],
    [/^#{1,4}\s*(?:🟡\s*)?TIER\s*2\b/i,'tier2'],
    [/^#{1,4}\s*(?:🔵\s*)?TIER\s*3\b/i,'tier3'],
    [/^#{1,4}\s*Study\s*Strategy\b/i,'strategy'],
  ];
  let cur=null,audit='';
  for(const line of src.split('\n')){
    const h=HEAD.find(([re])=>re.test(line));
    if(h){cur=h[1];continue;}
    const am=line.match(/^\s*\*?\s*Audit:\s*(.+)$/i);
    if(am){audit=am[1].replace(/\*+\s*$/,'').trim();continue;}
    if(cur)sec[cur].push(line);
  }
  if(!sec.tier1.length&&!sec.tier2.length&&!sec.tier3.length)return null;
  // The strategy block ends at a horizontal rule when the model emits one.
  const clean=a=>a.join('\n').replace(/\n\s*-{3,}\s*$/,'').trim();
  return{tier1:clean(sec.tier1),tier2:clean(sec.tier2),tier3:clean(sec.tier3),
    strategy:clean(sec.strategy),audit};
}

function kbForPriority(kb,{tiers=[1,2,3],conditionQuery=""}={}){
  const q=String(conditionQuery||"").trim().toLowerCase();
  const lines=[
    "STRUCTURED LATTE KNOWLEDGE BASE — FINISHED STUDY CONTENT",
    "Treat the items below exactly as the finished guide content to be harvested and ranked.",
    "Do not change supplied facts, tiers, qualifiers, values, or source pointers. The analyzer still assigns its own cascade tier from the item text.",
    ""
  ];
  // v16.7: packet headers are not evidence; empty selections must make no model calls.
  let factCount=0;
  for(const c of kb.conditions||[]){
    if(q&&!String(c.name||"").toLowerCase().includes(q)&&!(c.aliases||[]).some(a=>String(a).toLowerCase().includes(q)))continue;
    const facts=(c.facts||[]).filter(f=>tiers.includes(Number(f.tier)));
    if(!facts.length)continue;
    factCount+=facts.length;
    lines.push("## "+c.name);
    for(const f of facts){
      const src=kbSourceText(f);
      lines.push(`- ${f.text} [KB ${f.id}; LATTE ${f.latteBucket}; source-tier T${f.tier}${src?'; '+src:''}]`);
    }
    lines.push("");
  }
  return factCount?lines.join("\n").trim():'';
}

function paResultNotice({source,activeKB,harvest,meta,error,busy}){
  const lines=[];
  if(source&&!artifactSourceCurrent(source,activeKB))lines.push('Source: earlier Knowledge Base. This analysis belongs to the source captured when the run started.');
  if(harvest&&(harvest.failed.length||harvest.truncated.length)){
    lines.push('Source coverage: '+harvest.successful+' of '+harvest.total+' chunks harvested.');
    if(harvest.failed.length)lines.push('Missing source chunks: '+harvest.failed.map(f=>f.chunk).join(', ')+'. This guide is incomplete.');
    if(harvest.truncated.length)lines.push('Truncated source chunks: '+harvest.truncated.join(', ')+'. Some supplied facts may be missing.');
  }
  if(meta?.truncated)lines.push('Analysis output was truncated; review it before studying.');
  if(error)lines.push('Analysis status: '+error);
  else if(busy)lines.push('Analysis is still in progress; this output is incomplete.');
  return lines.length?'> '+lines.join('\n> ')+'\n\n':'';
}

2. Partition ALL numbered sourceTokens of that fact exactly once, in source order, into contiguous inventory ranges. Each range is either target or context. A target range identifies the smallest meaningful source detail; an oversized sentence or list cannot stand in for its independently meaningful members. Separate meaningful list members even if one note bundles them. Adjacent connective wording may be context. A context range needs a specific reason explaining its supporting role; do not label an omitted clinical detail as context merely because the current notes do not hide it. Merely naming the detail, calling it accompanying information, or saying it is already visible/Extra is not a supporting-role rationale. Independent risk groups, list members and resolution intervals remain targets even when the existing card tests a different member. Keep necessary connective wording and qualifications with their proposition; not every word needs its own cloze. An all-context fact may have targets:[] only when every range has an explicit supporting-context rationale; this classification remains visible for human review. Never invent a target to force completion.
3. Only after the inventory is drafted, compare every target against actual masked reviewTargets and the revealed Text/Extra. Return exactly one target record for every inventory range whose role is target, using the same sourceRef. All inventory ranges must be accounted for: no overlap, gap, duplicate or unlisted target. The application checks token accounting, not whether your target/context judgment is semantically correct.
4. Minimal target ranges are addresses, not standalone proof. For every target and every Text/Extra assertion compare the FULL SOURCE PROPOSITION and supplied context: actor, action, population, body part, certainty, frequency, modality, route, condition/trigger, timing, comparator direction, number role, AND/OR, and may/must, often/always, potential/definite and if-indicated/if-occurs qualifiers. A note that changes who acts, turns an optional action into an instruction, or changes may to often has changed meaning even if the same answer word appears. A relation must be tested, not merely its nouns. Exact source addresses and matching numbers do not establish entailment.
5. Review all supplied related notes, including linked notes across source chunks and tiers, before calling a target missing or proposing a new note. A matching word in a different condition is not equivalent coverage: compare the question, hidden answer, clinical context and selected tier. This bounded packet does not include the entire deck. A missing-target finding is provisional pending whole-deck review; do not claim exhaustive absence. Suggestions to add, merge or delete a note must explicitly require checking equivalent active coverage elsewhere in the deck. The application supplies separate advisory whole-deck candidate checks; those candidates also require human assessment and do not prove equivalence.

Scope:
- sourceFactIds are this group's primary source facts. Return factReviews only for those with inSelectedTier=true. Other facts support notes; do not demand targets for them here.
- scopeNoteIds are eligible kept notes in the selected tier. Return noteReviews only for these notes. Other supplied notes explain context and selection but do not supply active export coverage. Do not infer coverage from fact links alone.
- Distinguish generated omissions from manual exclusions and tier filtering. Do not pressure the user to restore manually unchecked notes or unselected source tiers. A lower-priority note hiding a selected higher-priority target is possible priority-loss. Assess priority and all-tier coverage before duplicate removal; retain equivalent active higher-priority coverage.
- Text, Extra and reviewTargets are distinct. A detail visible on a review front, in an answer-bearing hint or only in Extra is not automatically tested. Preserve legitimate explanatory context. Do not demand a separate note for every contextual word.
- source-conflict is a contradiction inside supplied facts, including incompatible explicit unit equivalents. Keep it separate from generation-created changes. Never decide which source claim is clinically correct.
- Unmapped notes still require review. Missing links are not proof of hallucination or missing recall. Shared fact IDs or condition tags do not prove duplication.

Addressing:
- Note IDs are EXACT packet-local handles such as n1 and n2. Use only the handles in this packet, including findings and contextual references. Never output a UUID, guess a near match or use a handle from another packet.
- Every sourceRef is exactly {"start":1,"end":2}: inclusive integer source-token IDs from the referenced fact. Use the printed sourceTokens IDs, never character offsets, copied/reworded quotations or guessed word positions. The application restores exact source bytes locally. Preserve capitalization, symbols, numbers and units through these addresses.

Return ONLY one JSON object, optionally enclosed in one JSON code fence, with exactly three arrays: factReviews, noteReviews, findings. Complete the required receipts even when findings is empty. A findings-only response is incomplete.

factReviews: exactly one receipt for every selected primary fact and no others. Each receipt has exactly {"factId":"existing selected primary fact ID","inventory":[{"sourceRef":{"start":1,"end":2},"role":"target","reason":"Specific explanation of this independent retrieval target."},{"sourceRef":{"start":3,"end":4},"role":"context","reason":"Specific explanation of this range's supporting role."}],"targets":[{"sourceRef":{"start":1,"end":2},"status":"tested","noteRefs":[{"noteId":"n1","clozeIndices":[1]}],"contextRefs":[{"noteId":"n2","field":"text"}]}]}. The sample illustrates structure only; ranges must match the actual fact and partition its entire token inventory. Do not copy placeholder ranges.

Target status rules:
- tested: at least one eligible scoped note actually hides this target with its required relation and qualifiers. Each noteRef must list existing nonempty integer clozeIndices from that note's reviewTargets. Never invent or auto-fill an index because a note has only one cloze. Read each masked front to detect a visible sibling or hint that gives away the answer. If another note mentions the target only as visible Text or Extra, put that separate mention in contextRefs; do not attach empty clozeIndices to a tested noteRef and do not downgrade valid tested coverage because a contextual mention also exists.
- visible-only: no eligible scoped note hides the target, and at least one eligible scoped note mentions it in visible Text. Use noteRefs:[]; contextRefs preserves EVERY cited Text and Extra location, including both fields on the same note. Text presence takes precedence over extra-only; neither location is hidden recall. Report missing-target when the lost recall matters.
- extra-only: no eligible scoped note hides or visibly mentions the target in Text; its contextual locations are all nonempty Extra in eligible scoped notes. Use noteRefs:[] and contextRefs with field:extra. If any cited contextual location is Text, use visible-only and retain both kinds of location. Report missing-target when the lost recall matters; useful supporting explanations need not become separate targets.
- missing: no supplied note contains the substantive target. Use noteRefs:[], contextRefs:[] and a matching missing-target finding. State that whole-deck absence is unproven until the remaining notes are reviewed.
- source-conflict: supplied facts conflict. Include a matching source-conflict finding; use contextRefs for visible/Extra mentions and noteRefs only for any actual hidden references. References may be outside active scope. Do not choose a clinical answer.
- manual-excluded: coverage exists only in manually unchecked notes. Reference actual hidden coverage in noteRefs and other mentions in contextRefs. Do not call this a generated omission or demand restoration.
- out-of-tier: coverage exists only in kept, structurally valid notes outside the selected tier. Reference actual hidden coverage in noteRefs and contextual mentions in contextRefs. Use priority-loss if a lower-priority note hides a selected higher-priority source target.
- invalid-note: coverage exists only in kept structurally invalid notes. Reference actual available hidden indices in noteRefs and other mentions in contextRefs. Keep structural failure distinct from absence.
For targets present in several places prefer valid active tested coverage over visible-only/extra-only, and active coverage over excluded coverage. A contextRef has exactly noteId and field (text or extra), never clozeIndices. An empty Extra cannot be a context reference. A noteRef has exactly noteId and clozeIndices, with at least one actual hidden index. Consolidate multiple hidden indices on one note into one reference, such as {"noteId":"n1","clozeIndices":[1,2]}; never repeat an index. Do not classify arbitrary scaffold as an uncovered target or claim full-sentence coverage from a cloze hiding just one member.

Field status rules: supported requires nonempty evidence; unsupported may have empty evidence if no source supports the added claim; changed-meaning requires evidence showing what the source actually says; source-conflict requires source evidence and a matching source-conflict finding. For multiple issues use the most consequential field status and explain every supported finding. Each unsupported or changed-meaning field requires a matching finding for that note. Only actually empty Extra uses status empty with empty evidence; Text cannot use empty. Do not invent support for a generic caption, formal triad, definition or mechanism.

findings: [{"code":"unsupported|changed-meaning|missing-target|duplicate-target|priority-loss|source-conflict","factIds":["existing fact ID"],"noteIds":["n1"],"message":"Specific short explanation of the changed or missing detail and its source context.","suggestion":"Concise source-supported revised wording or retrieval-target change; otherwise an empty string."}]. Use one allowed code per finding. All IDs must exist in this packet. unsupported needs an eligible scoped note; changed-meaning needs an eligible scoped note and a fact; priority-loss needs an existing note and a selected primary fact; missing-target needs a selected primary fact; duplicate-target needs at least two eligible scoped notes; source-conflict needs at least one fact. Other ID arrays may be empty. A suggestion must be a string supported only by the supplied facts and must leave original notes intact. A proposed complete note uses at most three distinct cloze indices (c1,c2,c3), supplies an answerable question, and never reveals its answer in a hint. For a new independent target that would exceed the limit or expand a shared-answer bundle, propose a separate note subject to whole-deck coverage review. For duplicate removal or merging identify the surviving kept note and preserve substantive coverage in the selected tier, especially Tier 1. If coverage is uncertain recommend review rather than deletion. Use an empty suggestion when no source-supported correction exists. All source-conflict suggestions must be empty. Never create placeholder IDs.

If there are no selected primary facts and no scoped notes, factReviews and noteReviews are empty arrays. If there is also no supported finding return {"factReviews":[],"noteReviews":[],"findings":[]}. Required receipts remain mandatory even with findings:[]. Complete protocol accounting does not certify clinical correctness, complete semantic target decomposition or source entailment.

// v16.3: keep exact citations first; recover only uniquely located whitespace or
// the first prose word's initial capital, never general case, symbols or wording.
function ankiMatchSourceSpan(factText,span){
  if(typeof factText!=='string'||typeof span!=='string'||!span.trim()||span.length>2000)return {ok:false,reason:'invalid-span'};
  if(factText.includes(span))return {ok:true,sourceSpan:span,method:null};
  const normalize=text=>{
    let value='';const starts=[],ends=[];
    for(let i=0;i<text.length;){
      const start=i;if(/\s/.test(text[i])){while(i<text.length&&/\s/.test(text[i]))i++;value+=' ';}else{value+=text[i];i++;}
      starts.push(start);ends.push(i);
    }
    return {value,starts,ends};
  };
  const source=normalize(factText),query=normalize(span).value;
  const locations=needle=>{
    const found=[];let pos=source.value.indexOf(needle);
    while(pos>=0){found.push(pos);if(found.length>1)break;pos=source.value.indexOf(needle,pos+1);}
    return found;
  };
  const originalAt=(pos,length)=>factText.slice(source.starts[pos],source.ends[pos+length-1]);
  const recovered=(canonical,method)=>canonical.length<=2000?{ok:true,sourceSpan:canonical,method}:{ok:false,reason:'invalid-span'};
  const white=locations(query);
  if(white.length>1)return {ok:false,reason:'ambiguous-span'};
  if(white.length===1)return recovered(originalAt(white[0],query.length),'whitespace');
  // The case exception is deliberately narrower than lowercasing either string:
  // only a complete, lowercased prose word at the start of the fact may recover.
  const word=query.match(/^([a-z]{4,})\b/);
  // v16.3: unit abbreviations cannot be exhaustively blacklisted. Only named prose words admit case recovery.
  const prose=/^(?:lanugo|assess|assessment|administer|avoid|check|findings|maintain|management|monitor|observe|protect|report|symptoms|treatment)$/;
  if(!word||!prose.test(word[1]))return {ok:false,reason:'no-source-match'};
  const candidate=query[0].toUpperCase()+query.slice(1),positions=locations(candidate);
  if(positions.length>1)return {ok:false,reason:'ambiguous-span'};
  if(positions.length!==1||source.value.slice(0,positions[0]).trim()||/[A-Za-z0-9_]/.test(source.value[positions[0]+word[1].length]||''))return {ok:false,reason:'no-source-match'};
  const canonical=originalAt(positions[0],candidate.length);
  return recovered(canonical,span.slice(1)===canonical.slice(1)?'sentence-initial-case':'whitespace-and-sentence-initial-case');
}
// v16.3: a failed receipt needs a precise location for quarantine and an explicit

function ankiAuditValidationError(group,path,reason,context={}){
  const detail={groupId:typeof group?.id==='string'?group.id:null,path,factId:typeof context.factId==='string'?context.factId:null,noteId:typeof context.noteId==='string'?context.noteId:null,sourceSpan:typeof context.sourceSpan==='string'?context.sourceSpan:null,reason};
  if(typeof context.matchReason==='string')detail.matchReason=context.matchReason;
  const location=[detail.groupId,path,detail.factId,detail.noteId].filter(Boolean).join(' · ');
  const error=new Error('Anki audit '+reason+(location?' ('+location+')':''));
  error.code='anki-audit-validation';error.detail=detail;return error;
}

      const remaining=ankiSourceAuditPending(run).length;
      publish(remaining?'partial':'complete',remaining?'Some required records need another check. Valid records and all attempts are retained.':'');
    }catch(e){if(guard())publish(e.name==='AbortError'?'cancelled':'failed',errorText(e));}
    finally{if(auditRun.current===run){auditRun.current=null;setAuditBusy(false);}}
  };
  const cancelSourceAudit=()=>{const run=auditRun.current;if(run){run.ctl.abort();auditRun.current=null;setAuditBusy(false);setSourceAudit(ankiSourceAuditState(run,'cancelled','Completed source-check groups are retained.'));}};
  const openNote=(id,index)=>{setInspectNote({id,index});};
  // v16.7: Edit in Table must mount the requested note before its existing focus effect runs.
  // v16.9: a source-check FINDING may reference a note outside the selected tier (unlike
  // receipt targets, which are filtered to the selection), so Edit set a focus request for a row
  // that never mounted and the request stuck. The tier filter also decides what exports, so the
  // change is offered explicitly rather than made silently.
  const editNote=id=>{
    const row=cards.find(c=>c.id===id);
    if(row&&!filteredCards.some(c=>c.id===id)){setEditBlocked({id,tier:getTier(row.tags)});return;}
    setEditBlocked(null);setView('table');setStyleOnly(false);setWarningFilter('all');setNotePage(ankiPageForNote(filteredCards,id));setEditFocus(id);
  };
  const acceptBlockedEdit=()=>{
    if(!editBlocked)return;
    const {id,tier}=editBlocked,next=tier==='?'?'all':tier;
    const rows=next==='all'?cards:cards.filter(c=>getTier(c.tags)===next);
    setTierFilter(next);setNotePage(ankiPageForNote(rows,id));setEditBlocked(null);
    setView('table');setStyleOnly(false);setWarningFilter('all');setEditFocus(id);
  };
  const saveSourceAudit=async()=>{
    if(!sourceAudit||savingEvidence)return;
    setSavingEvidence(true);setEvidenceError('');
    try{const evidence=await ankiSourceAuditEvidence(sourceAudit,()=>auditInputs.current);downloadBlob(new Blob([JSON.stringify(evidence,null,2)],{type:'application/json'}),evidence.filename);}
    catch(e){setEvidenceError('Could not save source-check evidence: '+e.message);}
    finally{setSavingEvidence(false);}
  };
  const updateSourceLinks=(id,ids)=>{
    if(!current||busy||batch.sourceKB!==currentKB.current)throw new Error('Source changed or generation is active. Review the current batch before editing links.');
    const original=cards.find(c=>c.id===id);if(!original)throw new Error('This note is no longer available.');
    // v16.2: confirming unchanged clean links must not invalidate a completed check.
    if(ankiSetSourceLinks(original,ids,batch.snapshot)===original)return;
    setCards(rows=>rows.map(c=>c.id===id?ankiSetSourceLinks(c,ids,batch.snapshot):c));
  };

  // Build optional focus context block
  function buildFocusBlock(){
    const parts=[];
    if(outcomes.trim())parts.push(`OUTCOMES (Learning Objectives the student must master):\n${outcomes.trim()}`);
    if(points.trim())parts.push(`POINTS (Specific content that must be covered):\n${points.trim()}`);
    if(focusContext.trim())parts.push(`ADDITIONAL CONTEXT:\n${focusContext.trim()}`);
    if(!parts.length)return'';
    return`\n\n═══ STUDENT-PROVIDED FOCUS CONTEXT ═══\n${parts.join('\n\n')}\n\nINSTRUCTIONS FOR FOCUS CONTEXT:\n- If Outcomes are listed, ensure EVERY outcome is covered by at least one card.\n- If Points are listed, ensure EVERY point has dedicated cards.\n- Use these to guide Tier assignment: content matching outcomes/points should be Tier 1.\n- If the source material is non-nursing (e.g., anatomy, physiology, chemistry, biology), adapt tag hierarchy to match the subject. Use Topic:: instead of Condition:: and subject-appropriate domain tags instead of Nursing::LATTE:: (e.g., AandP::Musculoskeletal::Structure, Bio::CellBiology::Mitosis). Still use the Tier system and the same card quality standards. When the source is the structured LATTE Knowledge Base, its supplied LATTE/Tier tags take precedence — do not re-map them.\n═══════════════════════════════════════\n`;
  }

  const run=useCallback(async()=>{
    if(!cfg.apiKey){log('Enter API key first.','err');return;}
    if(!(K.knowledgeBase.conditions||[]).length){log('Build the LATTE Knowledge Base first.','err');return;}
    cancelSourceAudit();setSourceAudit(null);setInspectNote(null);
    setBusy(true);setProg(0);setLogs([]);setCards([]);setLedger('');setBatch(null);setInterruptedRun(null);setShowUncovered(false);setNotePage(0);setEditBlocked(null);
    // v15.17: capture identity before awaiting; a replaced KB or superseded run cannot publish.
    activeRun.current?.ctl.abort();
    const ctl=new AbortController();setAbortCtl(ctl);
    const sourceKB=K.knowledgeBase,snapshot=ankiSourceSnapshot(sourceKB);
    const runState={sourceKB,ctl,snapshot,model,thinkingLevel:toolLevel,startedAt:new Date().toISOString(),context:{outcomes,points,focusContext},rawResponses:[],chunkIssues:[],truncated:false};activeRun.current=runState;
    const isCurrent=()=>ankiRunIsCurrent(runState,activeRun.current,currentKB.current)&&(!K.isCurrentSource||K.isCurrentSource(sourceKB));
    const focusBlock=buildFocusBlock();
    try{
      log('Loading structured LATTE Knowledge Base...','warn');
      const allTxt=kbForAnki(K.knowledgeBase);
      const validation=validateLatteKnowledgeBase(K.knowledgeBase);
      const errors=validation.filter(x=>x.severity==='error').length;
      if(errors)log(`Knowledge Base has ${errors} validation error(s). Cards will be generated, but source issues should be reviewed.`,'warn');
      log(`Knowledge Base ready: ${K.knowledgeBase.conditions.length} conditions, ${(K.knowledgeBase.conditions||[]).reduce((n,c)=>n+(c.facts||[]).length,0)} facts.`,'ok');
      const chunks=allTxt.trim()?ankiChunkText(allTxt,ANKI_CHUNK_CHARS,ANKI_OVERLAP_PAGES):[''];const n=chunks.length||1;
      log(`${n} chunk(s) — Knowledge Base — Model: ${model} [Thinking: ${toolLevel}]${cfg.autoProfile?' (auto)':''}${focusBlock?' — with focus context':''}`, 'warn');
      const chunkIds=chunks.map(ankiChunkFactIds),ledgers=[];runState.chunkIds=chunkIds;
      // v16.2: record runtime prompt hashes with generation, separately from later audit settings.
      runState.promptHashes={masterRuntimeSha256:await ankiSha256(ANKI_MASTER_PROMPT),adapterRuntimeSha256:null};
      if(!isCurrent())return;
      let all=[],allLedg='';
      for(let i=0;i<n;i++){
        if(!isCurrent())return;
        log(`Chunk ${i+1}/${n}...`,'warn');const parts=[];
        setLiveKB(0);
        const ctx=n>1?`\n\n[CHUNK ${i+1} of ${n}. Process ALL content.]`:'';
        const sourceLabel='═══ STRUCTURED LATTE KNOWLEDGE BASE ═══'; // v15: v14 shipped a literal template placeholder as the header the model saw above every KB
        // v16.0: the former primary-note map concealed valid split-note support and visible-only coverage.
        // v16.2: source fidelity failures included invented definitions, lost qualifiers and visible-only list targets.
        // v16.5: allocate targets before composing, then reconcile actual masked reviews without changing the mapping wire format.
        // v16.6: pin source-owned tags and check qualifier/action changes plus targets displaced into Extra or smaller bundles.
        const kbAdapter=`\n\nKNOWLEDGE BASE ADAPTER — THIS RUN USES A STRUCTURED KNOWLEDGE BASE, NOT RAW PDF TEXT.
- The structured FACT lines below are the sole source of truth. Each already carries a source-grounded meaning, exactly one LATTE bucket, and exactly one Tier.
- Keep Extra empty unless the supplied FACT text explicitly gives a useful supporting explanation or contrast. Do not add cue captions or move unsupported claims into Text. Source-supported symptoms, risk groups, actions and timing still need hidden destinations; Extra is not their substitute. A term listed without a definition must not become a definition card unless this input actually defines it; do not supply missing mechanisms, frequency rankings, severity labels, or durations from memory. Check the definition and heading themselves, not just whether the answer term occurs in a FACT.
- Before combining FACTs, preserve each fact's independent population, trigger, action, timing and certainty (may, often, as prescribed, if indicated). Separate notes when a merger would change AND/OR, preparation versus administration, or distinct eligibility criteria. Keep potential actions conditional; do not turn keeping a treatment available into immediate administration. A lower-priority repetition must not hide a higher-priority source target in the selected tier.
- Never leave a substantive list member permanently visible merely to satisfy a cloze limit. Test that target elsewhere when needed, preserving equivalent units and inseparable clinical decisions.
- CODE BLOCK #1 (ANKI IMPORT): keep the master-prompt rules and the Text | Extra | Tags format EXACTLY. Use each fact's supplied LATTE bucket and Tier tag verbatim — never reassign a bucket or downgrade a tier. Copy the supplied CANONICAL CONDITION TAG verbatim for that condition; aliases are reading cues, not replacement tag values. Do not abbreviate or derive a different spelling. If marked unavailable, retain source-faithful condition/topic labeling for review rather than inventing a supplied canonical token.
- Before composing notes, internally allocate each FACT's independently important clinical targets to planned note(s) and cloze index/indices, retaining the relation and qualifiers needed to test each target. Distinguish necessary supporting context from substantive actions, findings, adverse effects, values and list members; do not classify an important target as context merely to reduce note count. Generic supporting directives without a distinct clinical target may remain as context on a related note; map their IDs there.
- After shortening, splitting or combining notes, reconcile that allocation against the final note lines and actual masked review fronts. Count independent items inside each cloze answer as well as separate gaps; replacing a bundle with fewer targets must not displace the remaining targets. Every planned target needs a hidden destination with its required relation and source priority preserved; add or restore notes when a target became only visible Text, Extra, or absent. A fact-id link alone does not satisfy this check. Do not create a cloze whose label, hint or visible sibling already supplies its answer.
- When the source gives alternative unit representations of the same quantity, hide answer-equivalent representations together under the same cloze index whenever an exposed representation would reveal the answer. Do not confuse equal numbers serving different clinical roles with equivalent representations, and do not calculate replacement source values.
- Keep the allocation and reconciliation internal. Return only the existing two code blocks; do not add target inventories, cloze indices, commentary or extra fields to the FACT COVERAGE MAP.

CODE BLOCK #2 IS REDEFINED FOR THIS RUN — DISREGARD THE "COVERAGE LEDGER FORMAT" SECTION ABOVE (Drug Names, Numeric Values, etc. do NOT apply to structured input).
- CODE BLOCK #2 is a FACT COVERAGE MAP: one line per distinct fact-to-note association, ordered by supplied FACT id and then note line, formatted EXACTLY as:
    fact-<n> -> line #<m>
  where <m> is the 1-based note line in CODE BLOCK #1 supported by that fact.
- If one fact supports several notes, repeat its id on separate mapping lines, one destination per line. If several facts support one note, map each id to that same note.
- Every supplied FACT id MUST appear at least once, and every generated note MUST have at least one supporting FACT id. Never invent, rename, renumber, or omit an id. Do not repeat the same id-and-line pair. Put NO pipe character anywhere in CODE BLOCK #2.
- Use line #0 only when that fact supports no note; never combine line #0 with another destination for the same id.
- The Phase 4/5 zero-skip and "every indexed item appears in the coverage map" requirements still apply, measured against this fact-id map.
`;
        if(!runState.promptHashes.adapterRuntimeSha256)runState.promptHashes.adapterRuntimeSha256=await ankiSha256(kbAdapter);
        if(!isCurrent())return;
        parts.push({text:ANKI_MASTER_PROMPT+focusBlock+kbAdapter+'\n\n'+sourceLabel+'\n\n'+(chunks[i]||'')+ctx});
        const resp=await callGemini(cfg.apiKey,model,parts,{thinkingLevel:toolLevel,signal:ctl.signal,onUpdate:t=>{if(isCurrent()){runState.partialResponse=t;setLiveKB(Math.round(t.length/102.4)/10);}},onMeta:m=>{if(isCurrent()&&m.truncated){runState.truncated=true;const th=m.usage?.thoughtsTokenCount||0;log(`  \u26a0 Chunk ${i+1} hit the 65,536-token ceiling \u2014 cards are missing from the end.`+(th?` Thinking used ${th.toLocaleString()} tok of that budget.`:' Lower the chunk size.'),'err');}}});
        if(!isCurrent()){if(activeRun.current===runState)setInterruptedRun(ankiRunEvidence(runState,'cancelled'));return;}
        runState.rawResponses.push(resp);runState.partialResponse='';
        // v16.5: this structured-KB run owns the hierarchical tag contract; generic parser calls do not.
        const{cards:cc,ledger:cl}=ankiParseCards(resp,i+1,'hierarchical-v1');ledgers.push({chunk:i+1,text:cl});all=[...all,...cc];allLedg+=cl?'\n--- Chunk '+(i+1)+' ---\n'+cl:'';
        // v16.7: a nonempty STOP response can still contain no note records; retain evidence and mark it incomplete.
        if(!cc.length)runState.chunkIssues.push({chunk:i+1,code:'no-note-records',message:'Response contained no usable note records.'});
        setProg(((i+1)/n)*100);log(`Chunk ${i+1} done — ${cc.length} received notes`,cc.length?'ok':'warn');
      }
      // Key on the FULL normalized text. The old 120-char prefix key silently dropped
      // distinct notes that shared an opening — exactly the zero-skip guarantee v10c
      // works hardest to enforce. A surviving near-duplicate is deletable in the UI;
      // a dropped card is not recoverable.
      const mappingIssues=attachCoverageToCards(all,ledgers,snapshot,chunkIds);
      // v16.7: proven alias normalization can create exact duplicates; merge again while retaining original provenance.
      const normalized=ankiNormalizeConditionTags(ankiDedupeCards(all),snapshot),deduped=ankiDedupeCards(normalized.cards);
      if(normalized.changes.length)log('Normalized '+normalized.changes.length+' condition tag(s) from supplied aliases; original tags retained.','warn');
      if(normalized.issues.length)log(normalized.issues.length+' condition/source metadata discrepancy(s) need review.','warn');
      if(all.length-deduped.length>0)log(`Removed ${all.length-deduped.length} duplicate(s); their fact IDs were merged into the surviving cards.`,'warn');
      deduped.forEach(c=>{c.lint=lintAnkiCard(c);});
      // v15.7 B5: unsafe-abbreviation findings are WARN tier and kept OUT of `lint`, because
      // `lint` unchecks the card. A dose written "5.0 mg" is worth flagging, not discarding —
      // the fact is right and the card is still usable once you fix the transcription.
      deduped.forEach(c=>{
        const found=[];
        ankiUnsafeAbbrevScan(c.text,'Text',found);
        ankiUnsafeAbbrevScan(c.extra,'Extra',found);
        c.abbrev=found.map(x=>x.msg);
      });
      const abbrevCount=deduped.filter(c=>(c.abbrev||[]).length).length;
      if(abbrevCount)log(`⚠ ${abbrevCount} card(s) contain an error-prone dose abbreviation (q.d., IU, bare U, trailing/missing zero). They are still exportable — fix the transcription before drilling them.`,'warn');
      const lintCount=deduped.filter(c=>c.lint.length).length;
      if(!isCurrent())return;
      const completed={sourceKB,snapshot,chunkIds,context:runState.context,parsedNotes:all.length,rawCards:all,postDedupeNotes:deduped.length,rawResponses:runState.rawResponses,mappingIssues,truncated:runState.truncated,chunkIssues:runState.chunkIssues||[],model,thinkingLevel:toolLevel,startedAt:runState.startedAt,completedAt:new Date().toISOString(),promptHashes:runState.promptHashes,conditionTagChanges:normalized.changes,conditionTagOutcomes:normalized.outcomes};
      const summary=ankiBatchSummary(deduped,completed,true);
      completed.outcome=ankiGenerationOutcome(deduped,summary,completed);
      setBatch(completed);setCards(deduped);setLedger(allLedg);
      log(completed.outcome.label+'! '+all.length+' received notes; '+deduped.length+' after dedupe; '+summary.kept.length+' kept notes → '+summary.reviews+' review cards.',completed.outcome.level);
      log('Facts linked to kept notes: '+summary.coveredCount+'/'+summary.total+'.','ok');
      if(mappingIssues.length)log(mappingIssues.length+' mapping diagnostics; inspect the Fact Coverage Map.','warn');
      if(lintCount)log(lintCount+' structurally invalid note(s) excluded from export; correct them in Table.','warn');
    }catch(e){if(isCurrent()||activeRun.current===runState){setInterruptedRun(ankiRunEvidence(runState,e.name==='AbortError'?'cancelled':'failed'));if(e.name==='AbortError')log('Cancelled.','warn');else log('Error: '+e.message,'err');}}
    finally{if(activeRun.current===runState){activeRun.current=null;setBusy(false);setAbortCtl(null);setLiveKB(0);}}
  },[cfg,model,toolLevel,log,K.knowledgeBase,focusContext,outcomes,points]);

  const toggle=useCallback(id=>setCards(p=>p.map(c=>c.id===id?{...c,keep:!c.keep}:c)),[]);
  const del=useCallback(id=>setCards(p=>p.filter(c=>c.id!==id)),[]);
  // v15.8: recompute BOTH lint tiers on edit. They were evaluated once at generation, so a
  // user who fixed a missing cloze or a bad dose abbreviation kept the badge permanently and
  // the card stayed unchecked — uncorrectable from the UI, which is where corrections happen.
  // v15.17: structural eligibility and manual selection are independent; edits never flip keep.
  const updateField=useCallback((id,f,v)=>setCards(p=>p.map(c=>{
    if(c.id!==id)return c;
    if(c[f]===v)return c;
    const next={...c,[f]:v};
    // v16.7: edits retain traceability but make the supporting links a fresh manual review; only Text repair resolves a parsed boundary.
    if(f==='text'||f==='extra')next.sourceLinksNeedReview=true;
    if(f==='text')next.parseIssues=[];
    if(f==='text'||f==='extra'||f==='tags'){
      // v15.17: revalidate the actual edited fields; selection belongs to the student.
      next.pipeCount=2;
      next.lint=lintAnkiCard(next);
      const found=[];
      ankiUnsafeAbbrevScan(next.text,'Text',found);
      ankiUnsafeAbbrevScan(next.extra,'Extra',found);
      next.abbrev=found.map(x=>x.msg);
    }
    return next;
  })),[]);

  const exportTxt=useCallback(()=>{
    // v15.17: validate current fields and batch identity again at the export boundary.
    const text=ankiExportText(cards,batch,current,tierFilter,ankiHeader,includeSources);if(!text)return;
    downloadBlob(new Blob([text],{type:'text/plain'}),'latte_anki_import'+(tierFilter!=='all'?'_tier'+tierFilter:'')+'.txt');
  },[cards,batch,current,tierFilter,ankiHeader,includeSources]);

  const keptCount=selected.kept.length;
  const liveLint=useMemo(()=>cards.filter(c=>c.lint&&c.lint.length).length,[cards]);
  const liveAbbrev=useMemo(()=>cards.filter(c=>c.abbrev&&c.abbrev.length).length,[cards]);

  return(
    <div className="tool-panel">
      <h2 className="tool-title">LATTE Anki Generator</h2>
      <p className="tool-desc">Generate source-grounded cloze cards with consistent retrieval cues. Preview each review card and check advisory style warnings before export.</p>
      {/* v16.2: saved profiles remain deliberate choices; offer an Anki-only reset to the new recommendation. */}
      <p style={{fontSize:12}}>Recommended Anki profile: Flash / Medium. Current: {model} / {toolLevel}.{cfg.autoProfile&&(cfg.profiles?.anki?.m!=='flash'||toolLevel!=='medium')&&<button className="btn-secondary" onClick={()=>cfg.setProfile('anki',{m:'flash',lv:'medium'})}>Use recommended Anki profile</button>}{!cfg.autoProfile&&' Manual settings are active; switch to Auto in Settings to use per-tool profiles.'}</p>

      {/* Upload / source */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:18,marginBottom:14}}>
        <div style={{padding:14,background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}}>
          {(K.knowledgeBase.conditions||[]).length?<><div style={{fontSize:13,fontWeight:700,color:'var(--text-bright)'}}>Shared Knowledge Base ready</div><div style={{fontSize:12,color:'var(--text-dim)',marginTop:4}}>{K.knowledgeBase.conditions.length} conditions · {(K.knowledgeBase.conditions||[]).reduce((n,c)=>n+(c.facts||[]).length,0)} source-grounded facts · schema {K.knowledgeBase.metadata?.schemaVersion||'1.0'}</div><div style={{fontSize:12,color:'var(--accent)',marginTop:7}}>The Anki prompt formats these facts into cards without re-extracting source files.</div></>:<><div style={{fontSize:13,fontWeight:700,color:'var(--accent-warm)'}}>No Knowledge Base loaded</div><div style={{fontSize:12,color:'var(--text-dim)',marginTop:4}}>Open Knowledge and build it from your source files first.</div></>}
        </div>

        {/* Optional focus context fields */}
        <div style={{marginTop:12,padding:14,background:'var(--bg-input)',borderRadius:'var(--radius)',border:'1px solid var(--border)'}}>
          <div style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'var(--text-dim)',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
            <span>Focus Context</span><span className="badge-opt">optional</span>
          </div>
          <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5,marginBottom:10}}>
            Guide card generation toward specific topics. Works for nursing <em>and</em> non-nursing content (A&P, chemistry, etc.) — when non-nursing content is detected, LATTE tags adapt to match the subject.
          </div>
          <div className="field-block" style={{marginBottom:8}}>
            <label htmlFor="anki-outcomes" style={{fontSize:12}}>Outcomes <span className="badge-opt">optional</span></label>
            <textarea id="anki-outcomes" rows={3} value={outcomes} onChange={e=>setOutcomes(e.target.value)} placeholder={"e.g.:\n1. Describe the structure and function of skeletal muscle\n2. Explain the sliding filament mechanism"}/>
          </div>
          <div className="field-block" style={{marginBottom:8}}>
            <label htmlFor="anki-points" style={{fontSize:12}}>Points <span className="badge-opt">optional</span></label>
            <textarea id="anki-points" rows={3} value={points} onChange={e=>setPoints(e.target.value)} placeholder={"\u2022 Sarcomere structure (A-band, I-band, Z-disc)\n\u2022 Neuromuscular junction\n\u2022 Calcium role in contraction"}/>
          </div>
          <div className="field-block">
            <label htmlFor="anki-context" style={{fontSize:12}}>Additional Context <span className="badge-opt">optional</span></label>
            <textarea id="anki-context" rows={2} value={focusContext} onChange={e=>setFocusContext(e.target.value)} placeholder="e.g. 'Focus on Ch. 10 only' or 'Exam covers cardiac system' or 'This is a chemistry textbook'"/>
          </div>
        </div>

        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn-primary" onClick={run} disabled={busy||!cfg.apiKey||!(K.knowledgeBase.conditions||[]).length}>{busy?'⟳ Processing...':!cfg.apiKey?'Enter API Key':!(K.knowledgeBase.conditions||[]).length?'Build Knowledge Base':'▶ Generate Cards'}</button>{busy&&<button className="btn-danger" onClick={()=>abortCtl?.abort()}>Cancel</button>}
        </div>
      </div>

      {/* Progress */}
      {(busy||logs.length>0)&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16,marginBottom:14}}>
        <div className="progress-bar" role="progressbar" aria-label="Anki generation" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(prog)}><div className="progress-fill" style={{width:prog+'%'}}/></div>
        {liveKB>0&&<div style={{fontSize:12,color:'var(--accent-cyan)',fontFamily:'JetBrains Mono',marginTop:4}}>▼ receiving {liveKB} KB</div>}
        <div style={{fontSize:12,color:'var(--text-dim)',margin:'6px 0'}}>{Math.round(prog)}%</div>
        <div style={{maxHeight:140,overflowY:'auto',fontFamily:'JetBrains Mono',fontSize:12,background:'var(--bg-deep)',border:'1px solid var(--border)',borderRadius:6,padding:8,lineHeight:1.8}}>
          {logs.map((l,i)=><div key={i} style={{color:l.t==='ok'?'var(--accent-green)':l.t==='err'?'var(--accent-red)':l.t==='warn'?'var(--accent-warm)':'var(--text-dim)'}}>[{l.ts}] {l.msg}</div>)}
        </div>
      </div>}

      {/* v16.0: an inherited unit contradiction needs source review, not an automatic numeric correction. */}
      {sourceConflicts.length>0&&<details style={{marginBottom:12,color:'var(--accent-warm)'}}><summary>Source inconsistencies ({sourceConflicts.length}){batch&&!current?' · captured earlier KB':''}</summary>{sourceConflicts.map((f,i)=><p key={f.factId+':'+i}>{f.factId}: {f.msg}</p>)}<p>Original source values are preserved. These warnings do not block generation or export.</p></details>}

      {/* v16.0: even an empty completed batch needs source coverage and optional audit controls. */}
      {/* Cards */}
      {(cards.length>0||batch)&&<div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:18}}>
        {batch?.outcome&&<p role="status" style={{color:batch.outcome.level==='ok'?'var(--accent-green)':'var(--accent-warm)'}}>{batch.outcome.label}{batch.truncated?' · response truncated':''}{batch.chunkIssues?.length?' · '+batch.chunkIssues.length+' chunk(s) returned no note records':''}. Original responses remain in batch diagnostics.</p>}
        {batch&&!current&&<p role="alert" style={{color:'var(--accent-warm)'}}>These notes belong to an earlier Knowledge Base. Generate a new batch to restore source links, coverage, and export.</p>}
        {current&&<div style={{marginBottom:12,padding:'10px 12px',borderRadius:8,border:'1px solid '+(coverage.uncovered.length?'var(--error-border)':'var(--success-border)'),background:coverage.uncovered.length?'var(--error-bg)':'var(--success-bg)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:12,fontWeight:600,color:coverage.uncovered.length?'var(--accent-red)':'var(--accent-green)'}}>

const NCLEX_INLINE_PROMPT=`You are an expert nursing educator. From the following text chunk of an NCLEX-style review book, extract EVERY test question.\n\nFor EACH question, return a JSON object with:\n- "question": full question text with all choices\n- "correct_answer": correct answer letter and text\n- "rationale": full rationale\n- "priority_nursing_tip": any tip mentioned (or null)\n- "test_taking_strategy": strategy mentioned (or null)\n- "clinical_judgment_skill": CJ skill identified (or null)\n- "diseases_conditions": array of conditions referenced\n- "keywords": important nursing keywords\n\nThis chunk may overlap with a previous chunk. Do NOT return duplicates.\nReturn ONLY a valid JSON array. No markdown fences. If no questions found, return [].\n\nTEXT CHUNK:\n`;

const NCLEX_SPLIT_PROMPT=`You are an expert nursing educator. Below are NCLEX-style questions that have been PRE-MATCHED with their corresponding answers and rationales. The questions were originally on separate pages from their answers and have been paired by question number.\n\nFor EACH question+answer pair, return a JSON object with:\n- "question_number": original question number\n- "question": full question text with all choices\n- "correct_answer": correct answer letter and text\n- "rationale": full rationale\n- "priority_nursing_tip": any tip mentioned (or null)\n- "test_taking_strategy": strategy mentioned (or null)\n- "clinical_judgment_skill": CJ skill identified (or null)\n- "diseases_conditions": array of conditions referenced\n- "keywords": important nursing keywords\n\nReturn ONLY a valid JSON array. No markdown fences. If no valid pairs found, return [].\n\nPAIRED QUESTIONS AND ANSWERS:\n`;

const NCLEX_AI_PAIR_PROMPT=`You are a text-matching assistant. Below are two sections from a nursing test book:\n1. QUESTIONS section - contains numbered test questions\n2. ANSWERS section - contains numbered answers and rationales\n\nMatch each question number with its answer. Return a JSON array where each object has:\n- "number": question number (integer)\n- "question": full question text with all choices\n- "answer": full answer text with rationale\n\nReturn ONLY a valid JSON array. No markdown.\n\nQUESTIONS SECTION:\n`;

function nclexChunkText(text,size,overlap){
  // v15: hard clamps. A cleared Chunk Size input became 0, making the stride
  // Math.max(size-overlap, size*0.3) = 0 — an infinite loop pushing empty chunks until
  // the tab died. The stride is now >=1 no matter what the inputs held.
  size=Math.max(500,Number(size)||0);
  overlap=Math.max(0,Math.min(Number(overlap)||0,size-1));
  const chunks=[];let i=0;
  // v16.7: newline shortening changed the chunk end but not the old fixed stride, leaving source gaps.
  while(i<text.length){
    let end=Math.min(i+size,text.length);
    if(end<text.length){const nl=text.lastIndexOf('\n',end-1);if(nl>i+size*0.5)end=nl+1;}
    chunks.push(text.slice(i,end));if(end===text.length)break;
    // Keep overlap and bounded forward progress relative to this actual chunk, never beyond its end.
    i=Math.max(i+Math.max(1,Math.floor((end-i)*0.3)),end-overlap);
  }
  return chunks;
}

// v15: full-text key — the 120-char prefix collapsed distinct long stems (same fix Anki got).
// v15.14: lifted so the batch dedup and the incremental accumulator cannot drift apart.
function nclexKey(q){return String(q&&q.question||'').replace(/\s+/g,' ').trim().toLowerCase();}
// v15.14: incremental form. Callers keep one Set for the whole run instead of rebuilding it
// per chunk over everything collected so far. Mutates and returns allQ.
// v16.9: the model returns this optional field as a bare string often enough to matter, and
// every consumer calls an array method on it - the expanded card render (.map), the disease
// filter (.some) and the Markdown export (.join) all threw. Normalize once, at admission.
function nclexConditions(value){
  if(Array.isArray(value))return value.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim());
  return typeof value==='string'&&value.trim()?[value.trim()]:[];
}
function nclexAccumulate(seen,allQ,incoming){
  for(const q of incoming||[]){
    if(!q||!q.question)continue;
    const k=nclexKey(q);
    if(seen.has(k))continue;
    seen.add(k);allQ.push({...q,diseases_conditions:nclexConditions(q.diseases_conditions)});
  }
  return allQ;
}

// Split-mode: extract text from specific page ranges
// v15.8 moved this onto the shared pdfLayoutText. v15.14 moves the walk itself: this used
// to check the abort signal but never call page.cleanup(), so a long range held every page's
// operator list until the run finished.
async function nclexExtractPageRange(file,startPage,endPage,signal){
  const out=[];
  await pdfWalkPages(file,{signal,from:startPage,to:endPage,onPage:t=>{out.push(t);}});
  return out.length?out.join('\n\n')+'\n\n':'';
}

// Multi-pattern question number detection
// v15.15: answer CHOICES are numbered too, and every one of them used to be read as a
// question start. On Davis-style text - stem "1.", then choices "1." "2." "3." "4." - the
// slice for question 1 ended at its OWN first choice. Item 1 was therefore the stem alone,
// items 2-4 were single choice lines masquerading as questions, and questions 2 and 3
// disappeared outright because their numbers had already been claimed by question 1's
// choices. That is the reported "extractions only capture the question stem" bug, and it was
// also silently deleting most of the section.
//
// The discriminator is SPACING, not the numbers themselves: a choice run ascends 1,2,3(,4,5)
// with a line between entries, while question starts sit a whole question block apart. Three
// guards keep a genuine question list from being eaten, and a run is dropped only when all
// three hold: it must be preceded by something (so a section whose questions genuinely begin
// at 1 keeps its first question), it may not exceed NCLEX_OPTION_RUN_MAX entries (a
// 20-question list is not a choice list), and the question sequence must RESUME afterwards -
// the number following a run continues from the number preceding it.
const NCLEX_OPTION_GAP=400;    // max chars between two entries of one choice run
const NCLEX_OPTION_RUN_MIN=3;  // shortest choice list worth trusting
const NCLEX_OPTION_RUN_MAX=6;  // longest realistic choice list (select-all tops out near 6)
function nclexDropOptionRuns(positions){
  if(positions.length<NCLEX_OPTION_RUN_MIN+1)return positions;
  const runs=[];
  for(let i=1;i<positions.length;i++){
    if(positions[i].num!==1)continue;
    let j=i;
    while(j+1<positions.length&&j-i+1<NCLEX_OPTION_RUN_MAX&&positions[j+1].num===positions[j].num+1&&positions[j+1].index-positions[j].index<=NCLEX_OPTION_GAP)j++;
    if(j-i+1>=NCLEX_OPTION_RUN_MIN){runs.push({i,j});i=j;}
  }
  if(!runs.length)return positions;
  const resumes=runs.some(r=>r.j+1<positions.length&&positions[r.j+1].num===positions[r.i-1].num+1);
  if(!resumes)return positions;
  const drop=new Set();for(const r of runs)for(let k=r.i;k<=r.j;k++)drop.add(k);
  const kept=positions.filter((_,i)=>!drop.has(i));
  return kept.length?kept:positions; // never filter a section down to nothing
}
// v15.15: the slice loop was duplicated between the pattern sweep and the loose fallback, so
// the fix above would otherwise have had to be written twice to hold in both.
function nclexSliceByQNum(text,positions){
  const items={};
  for(let i=0;i<positions.length;i++){const start=positions[i].index;const end=i+1<positions.length?positions[i+1].index:text.length;if(!items[positions[i].num])items[positions[i].num]=text.slice(start,end).trim();}
  return items;
}
function nclexSplitByQNum(text){
  const BARE=[/(?:^|\n)\s*(\d{1,4})\s*\.\s/g,/(?:^|\n)\s*(\d{1,4})\)\s/g];
  const EXPLICIT=[/(?:^|\n)\s*Q(?:uestion)?\s*#?\s*(\d{1,4})[.):;\s]/gi,/(?:^|\n)\s*#\s*(\d{1,4})[.):;\s]/g,/(?:^|\n)\s*\[(\d{1,4})\]/g];
  const scan=bp=>{const pattern=new RegExp(bp.source,bp.flags);const positions=[];let m;
    while((m=pattern.exec(text))!==null){const num=parseInt(m[1]);if(num>0&&num<5000)positions.push({num,index:m.index});}
    return positions;};
  let bestItems={},bestCount=0,explicitBest=null;
  for(const bp of [...BARE,...EXPLICIT]){
    const positions=scan(bp);
    const items=nclexSliceByQNum(text,nclexDropOptionRuns(positions));
    const count=Object.keys(items).length;if(count>bestCount){bestItems=items;bestCount=count;}
    if(EXPLICIT.includes(bp)&&count>(explicitBest?explicitBest.count:0))explicitBest={items,count,heads:positions.slice().sort((a,b)=>a.index-b.index)};
  }
  // v16.9: "Question 1:" blocks whose CHOICES are numbered 1-4 produced more bare matches than
  // headings, so the split returned the first question's choices as the questions and dropped
  // the rest - and three plausible matches then bypassed the AI pairing fallback. An explicit
  // marker wins only when every bare number sits inside one heading's block as a choice run,
  // so a book that numbers most questions bare and only labels a few still uses the bare count.
  if(explicitBest&&explicitBest.count>=2&&explicitBest.count<bestCount){
    const heads=explicitBest.heads;
    const containedChoices=BARE.every(bp=>{
      const positions=scan(bp);
      if(!positions.length)return true;
      if(positions.some(p=>p.index<heads[0].index))return false;
      return heads.every((h,i)=>{
        const end=i+1<heads.length?heads[i+1].index:text.length;
        return positions.filter(p=>p.index>h.index&&p.index<end).length<=NCLEX_OPTION_RUN_MAX;
      });
    });
    if(containedChoices){bestItems=explicitBest.items;bestCount=explicitBest.count;}
  }
  // Loose fallback
  if(bestCount<3){
    const loose=/(?:^|\n)\s{0,5}(\d{1,4})\s{0,3}[.):]/g;const positions=[];let m;
    while((m=loose.exec(text))!==null){const num=parseInt(m[1]);if(num>0&&num<5000)positions.push({num,index:m.index});}
    const items=nclexSliceByQNum(text,nclexDropOptionRuns(positions));
    if(Object.keys(items).length>bestCount){bestItems=items;bestCount=Object.keys(items).length;}
  }
  return bestItems;
}

// v15.15: deterministic stem/choice split. Both extraction modes ask the model for "full
// question text with all choices", and the choices come back as free text inside `question` -
// so nothing downstream could render them as a list, and nothing could NOTICE when they were
// missing. This reads them back out with no second API call.
//
// The run must ASCEND from 1 (or from a), which is what stops a numbered list inside the stem
// - "Vitals: 1. HR 110 2. BP 88/50" - from being taken for the choice list: the real choices
// further down form the longer run, and the longest run wins (latest wins on a tie).
// v16.7: a sixth lettered SATA option was folded into E because the marker stopped at E.
const NCLEX_OPTION_MARK=/(?:^|\n|\s)\(?([1-9]|[a-fA-F])[.)]\s+/g;
function nclexOptionRank(lab){return /[0-9]/.test(lab)?parseInt(lab,10):lab.toLowerCase().charCodeAt(0)-96;}
function nclexSplitStemOptions(text){
  const s=String(text||'');
  const marks=[];const re=new RegExp(NCLEX_OPTION_MARK.source,'g');let m;
  while((m=re.exec(s))!==null){
    // v16.9: line position is read from the text before the mark, not from m[0], so an
    // indented option ("\n  B. ") still counts as starting its line.
    const from=m.index+(/^[\n\s]/.test(m[0])?1:0),nl=s.lastIndexOf('\n',from-1);
    marks.push({label:m[1],rank:nclexOptionRank(m[1]),numeric:/[0-9]/.test(m[1]),at:m.index+m[0].length,from,lineStart:from===0||/^[ \t]*$/.test(s.slice(nl+1,from))});
    re.lastIndex=m.index+m[0].length; // adjacent marks must not swallow one another
  }
  // v16.9: widening the marker to A-F made "101.2 F." inside an option body a rank-6 mark,
  // which either broke the ascending run (losing every choice) or extended it (fabricating a
  // sixth choice and deleting the unit). A real choice list does not change layout midway, so
  // candidate runs are scanned inside each line-position class and the longest run still wins.
  let best=null,bestPool=null;
  for(const pool of [marks.filter(x=>x.lineStart),marks.filter(x=>!x.lineStart)]){
    for(let i=0;i<pool.length;i++){
      if(pool[i].rank!==1)continue;
      let j=i;
      while(j+1<pool.length&&pool[j+1].rank===pool[j].rank+1&&pool[j+1].numeric===pool[i].numeric)j++;
      const len=j-i+1;
      if(len>=NCLEX_OPTION_RUN_MIN&&(!best||len>best.len||(len===best.len&&pool[i].from>best.start))){best={i,j,len,start:pool[i].from};bestPool=pool;}
    }
  }
  if(!best)return{stem:s.trim(),options:[]};
  const options=[];
  for(let k=best.i;k<=best.j;k++){
    const end=k<best.j?bestPool[k+1].from:s.length;
    options.push({label:bestPool[k].label,text:s.slice(bestPool[k].at,end).trim().replace(/\s+/g,' ')});
  }
  return{stem:s.slice(0,best.start).trim(),options};
}
// v15.15: split-mode repair. `pairs` still holds the VERBATIM page text for each question,
// choices included, so when the model hands back a bare stem the choices can be put back from
// the page rather than cost another call - and nothing is invented, because the text is the
// book's own bytes. Inline mode has no equivalent source to repair from: there the model
// itself decides where a question begins, so the chunk overlap is what covers a split.
function nclexRepairOptions(item,sourceText){
  if(!item||!item.question)return item;
  if(nclexSplitStemOptions(item.question).options.length)return item;
  const src=nclexSplitStemOptions(String(sourceText||''));
  if(!src.options.length)return item;
  return{...item,question:item.question.trim()+'\n'+src.options.map(o=>o.label+'. '+o.text).join('\n'),options_repaired:true};
}

function nclexPairQA(qText,aText){
  const questions=nclexSplitByQNum(qText),answers=nclexSplitByQNum(aText);
  return Object.keys(questions).map(Number).sort((a,b)=>a-b).map(num=>({number:num,question:questions[num]||'',answer:answers[num]||'',matched:!!answers[num]}));
}

// v15.14: hard clamp on the stride, the same fix v15 made for nclexChunkText and missed
// here. A cleared "Questions per batch" field yields Number('')===0, and i+=0 is an INFINITE
// loop pushing empty arrays until the tab dies — taking all six tools' unsaved state with it,
// since they share one mount. A typed letter yields NaN, where i+=NaN exits immediately and
// silently produces ZERO batches, so the run reports success and extracts nothing. The input
// is clamped too; this is the half that does not depend on caller discipline.
function nclexBatchPairs(pairs,batchSize=8){
  const n=Math.max(1,Math.floor(Number(batchSize)||8));
  const batches=[];for(let i=0;i<pairs.length;i+=n)batches.push(pairs.slice(i,i+n));return batches;
}
function nclexPairsToText(pairs){return pairs.map(p=>{let s=`── Question #${p.number} ──\n${p.question}\n`;if(p.answer)s+=`\n── Answer #${p.number} ──\n${p.answer}\n`;return s;}).join('\n\n');}

      <span style={{fontSize:12,color:'var(--text-dim)'}}>to</span>
